in der Ich-Form erzählt. Wie schreibst du die Inhaltsangabe?", "optionen": ["In der 3. Person (er/sie), als außenstehende Erzählerin bzw. außenstehender Erzähler.", "In der Ich-Form, weil die Inhaltsangabe die Erzählperspektive der Vorlage übernimmt.", "In der 3. Person, aber die Gedanken des Ich-Erzählers übernimmst du wörtlich in Ich-Form.", "In der Du-Form (du/dein), damit sich die Leserin bzw. der Leser direkt angesprochen fühlt."], "richtig": 0, "erklaerung": "Die Inhaltsangabe berichtet von außen, auch wenn die Vorlage in der Ich-Form erzählt ist – „Der Ich-Erzähler …“ bzw. mit dem Namen der Figur. Gedanken gibst du in eigenen Worten wieder, nicht wörtlich."}, {"typ": "zuordnen", "frage": "Wohin gehört das?", "kategorien": ["Hauptteil", "Schluss", "gehört nicht hinein"], "elemente": [{"text": "die wichtigsten Handlungsschritte in zeitlicher Reihenfolge", "kat": 0}, {"text": "Gründe und Folgen des Handelns der Figuren", "kat": 0}, {"text": "die vermutliche Absicht der Autorin bzw. des Autors", "kat": 1}, {"text": "Merkmale, die zeigen, dass es eine Kurzgeschichte ist", "kat": 1}, {"text": "die eigene, begründete Meinung zum Text", "kat": 1}, {"text": "wörtliche Rede aus der Geschichte", "kat": 2}, {"text": "eigene Meinung mitten in der Handlungswiedergabe", "kat": 2}], "erklaerung": "Der Hauptteil bleibt sachlich. Im deutlich abgesetzten Schluss stehen Absicht, Textsortenmerkmale und deine begründete Meinung. Wörtliche Rede wird umformuliert."}, {"typ": "mehrfach", "frage": "Welche Merkmale sind typisch für eine Kurzgeschichte?", "optionen": ["unvermittelter Anfang", "Alltagssituation", "wenige Figuren", "kurze Handlungszeit", "Wendepunkt oder Pointe", "offenes bzw. nachdenklich machendes Ende", "viele Nebenhandlungen", "ausführliche Vorgeschichte"], "richtig": [0, 1, 2, 3, 4, 5], "erklaerung": "Diese Merkmale nennst du im Schluss – am besten mit Bezug auf die konkrete Geschichte."}, {"typ": "wahl", "frage": "Wie formulierst du die Absicht der Autorin?", "optionen": ["Vermutlich möchte die Autorin zeigen, dass man Menschen nicht vorschnell beurteilen sollte.", "Die Autorin beweist mit der Geschichte eindeutig, dass man Menschen nie vorschnell beurteilen darf.", "Vermutlich möchte die Autorin erzählen, was die Hauptfigur an einem Tag in der Schule erlebt.", "Ich finde, die Autorin hat eine sehr spannende und gut geschriebene Geschichte verfasst."], "richtig": 0, "erklaerung": "Die Absicht ist eine Botschaft – keine Handlungswiedergabe und keine Bewertung der Geschichte. Was die Autorin wirklich wollte, weiß man nicht sicher, daher vorsichtig formulieren: vermutlich, möglicherweise, es scheint, dass …"}, {"typ": "wahl", "frage": "Welche Meinung im Schluss ist gut begründet?", "optionen": ["Die Geschichte gefällt mir, weil die überraschende Wende zeigt, wie peinlich vorschnelle Urteile sein können.", "Die Geschichte gefällt mir sehr gut, weil sie mir einfach gefällt und ich sie richtig toll finde.", "Die Geschichte gefällt mir nicht, weil Kurzgeschichten grundsätzlich langweilig und unnötig sind.", "Die Geschichte gefällt mir, weil die Autorin sicher eine sehr nette und kluge Frau ist."], "richtig": 0, "erklaerung": "Gefallen oder Nicht-Gefallen musst du begründen – mit Bezug auf den Text. Eine Wiederholung („weil sie mir gefällt“), ein Pauschalurteil über alle Kurzgeschichten oder eine Vermutung über die Autorin ist keine Begründung."}, {"typ": "wahl", "frage": "Wie verbindest du die Handlungsschritte im Hauptteil?", "optionen": ["Mit zeitlichen Überleitungen: Zu Beginn …, Bald darauf …, Schließlich …", "Mit Reihungen: Zuerst … und dann … und dann … und am Ende …", "Mit Satzanfängen auf „Und“: Und er geht …, Und sie sagt …, Und …", "Mit wertenden Wörtern: Leider …, Zum Glück …, Dummerweise …"], "richtig": 0, "erklaerung": "Zeitliche Überleitungen verbinden die Handlungsschritte. Sätze nicht mit „und“ beginnen, nicht mit „und dann“ aneinanderreihen – und keine Wertungen wie „leider“ in den Hauptteil."}]}, {"id": "ia2", "titel": "Originaltext: Spaghetti für zwei", "originaltext": {"titel": "Spaghetti für zwei", "info": "Kurzgeschichte von Federica de Cesco", "situation": "Übe die Inhaltsangabe zu dieser Kurzgeschichte: Einleitung, Handlungsschritte, Wendepunkt und Schluss."}, "aufgaben": [{"typ": "wahl", "frage": "Worum geht es in der Geschichte vor allem?", "optionen": ["Wie Vorurteile zu einem peinlichen Missverständnis führen.", "Wie ein Jugendlicher in der Mittagspause bestohlen wird.", "Wie ein Flüchtling in der Schweiz eine neue Heimat findet.", "Wie zwei Schulfreunde um eine Portion Spaghetti streiten."], "richtig": 0, "erklaerung": "Heinz hält den Fremden wegen seiner Vorurteile für einen Dieb – dabei sitzt er selbst am falschen Tisch. Gestohlen wird nichts, und die beiden kennen sich vorher nicht."}, {"typ": "wahl", "frage": "Welche Einleitung ist gelungen?", "optionen": ["In der Kurzgeschichte „Spaghetti für zwei“ von Federica de Cesco teilt sich der fast vierzehnjährige Heinz in einem Selbstbedienungsrestaurant ein Essen mit einem jungen Afrikaner, den er zu Unrecht für einen Suppendieb hält.", "In der Kurzgeschichte „Spaghetti für zwei“ von Federica de Cesco teilte sich der fast vierzehnjährige Heinz in einem Selbstbedienungsrestaurant ein Essen mit einem jungen Afrikaner, den er für einen Dieb hielt.", "In der Kurzgeschichte „Spaghetti für zwei“ von Federica de Cesco stiehlt ein junger Afrikaner dem fast vierzehnjährigen Heinz in einem Selbstbedienungsrestaurant die Suppe und lädt ihn danach zum Essen ein.", "In der lustigen und sehr gelungenen Kurzgeschichte „Spaghetti für zwei“ von Federica de Cesco geht es um den fast vierzehnjährigen Heinz, der mittags in einem Selbstbedienungsrestaurant isst."], "richtig": 0, "erklaerung": "Textsorte, Titel, Autorin, Hauptfiguren, Ort und Kern der Handlung in einem Satz – im Präsens und ohne Wertung. Achte auch auf den Inhalt: Der Fremde stiehlt nichts, Heinz irrt sich. Und ohne den Irrtum fehlt die Kernaussage."}, {"typ": "reihenfolge", "frage": "Bring die Handlungsschritte in die richtige Reihenfolge.", "elemente": ["Heinz holt sich mittags eine Gemüsesuppe und merkt, dass er den Löffel vergessen hat.", "Als er zurückkommt, sitzt ein junger Afrikaner auf seinem Platz und isst aus dem Teller.", "Heinz setzt sich dazu, und beide essen schweigend die Suppe.", "Der junge Mann holt einen Teller Spaghetti mit zwei Gabeln und teilt ihn mit Heinz.", "Heinz entdeckt auf dem Nebentisch seine eigene, kalt gewordene Suppe.", "Beide lachen, der junge Mann stellt sich als Marcel vor, und sie verabreden sich für den nächsten Tag."], "erklaerung": "Der Hauptteil gibt die Handlung in zeitlicher Reihenfolge wieder – in eigenen Worten und im Präsens."}, {"typ": "zuordnen", "frage": "Wesentlich für die Inhaltsangabe oder nur ein Detail?", "kategorien": ["wesentlich", "Detail"], "elemente": [{"text": "Heinz hält den Fremden für einen Dieb.", "kat": 0}, {"text": "Heinz erkennt, dass er selbst am falschen Tisch gegessen hat.", "kat": 0}, {"text": "Die beiden verabreden sich für den nächsten Tag.", "kat": 0}, {"text": "Eine Angestellte schöpft die Suppe aus einem dampfenden Topf.", "kat": 1}, {"text": "Heinz kratzt nervös an seinem Pickel.", "kat": 1}, {"text": "Auf den Spaghetti liegen vier Fleischbällchen.", "kat": 1}], "erklaerung": "Wesentlich ist, was die Handlung voranbringt. Beschreibungen und Ausschmückungen lässt du weg."}, {"typ": "wahl", "frage": "Wo liegt der Wendepunkt der Geschichte?", "optionen": ["Als Heinz seine kalte Gemüsesuppe auf dem Nebentisch entdeckt.", "Als Heinz zurückkommt und den Fremden an seinem Platz sitzen sieht.", "Als der Fremde mit einem Teller Spaghetti und zwei Gabeln zurückkommt.", "Als Marcel sich vorstellt und die beiden sich für morgen verabreden."], "richtig": 0, "erklaerung": "Hier kippt die Situation: Heinz erkennt seinen Irrtum, schämt sich und entschuldigt sich schließlich. Der Fremde am vermeintlich eigenen Platz und die Spaghetti gehören noch zum Missverständnis, die Verabredung ist das Ende."}, {"typ": "wahl", "frage": "Heinz denkt, der Fremde habe vielleicht kein Geld. Wie gibst du das in der Inhaltsangabe wieder?", "optionen": ["Heinz überlegt, ob der Fremde vielleicht kein Geld habe.", "„Vielleicht hat der Mensch kein Geld“, denkt Heinz.", "Heinz überlegte, ob der Fremde vielleicht kein Geld hatte.", "Heinz überlegt sich: Vielleicht hat der Mensch kein Geld."], "richtig": 0, "erklaerung": "Keine wörtliche Rede und keine wörtlich zitierten Gedanken – auch nicht ohne Anführungszeichen. In eigenen Worten, im Präsens, bei Redewiedergabe im Konjunktiv."}, {"typ": "wahl", "frage": "Welcher Schluss erfüllt alle drei Aufgaben (Absicht, Merkmale der Kurzgeschichte, begründete Meinung)?", "optionen": ["Vermutlich möchte die Autorin zeigen, wie schnell Vorurteile in die Irre führen. Typisch für eine Kurzgeschichte sind die Alltagssituation, die wenigen Figuren, die kurze Handlungszeit und die überraschende Wende. Mir gefällt der Text, weil er auf humorvolle Weise zum Nachdenken über eigene Vorurteile anregt.", "Am Ende verabreden sich Heinz und Marcel für den nächsten Tag, und Heinz will dann die Spaghetti bezahlen. Typisch für eine Kurzgeschichte sind die Alltagssituation, die wenigen Figuren, die kurze Handlungszeit und die überraschende Wende. Mir gefällt der Text, weil er auf humorvolle Weise zum Nachdenken anregt.", "Vermutlich möchte die Autorin zeigen, wie schnell Vorurteile in die Irre führen. Heinz ist am Anfang wütend und überheblich, am Ende entschuldigt er sich und lacht gemeinsam mit Marcel. Mir gefällt der Text, weil er auf humorvolle Weise zum Nachdenken über eigene Vorurteile anregt.", "Vermutlich möchte die Autorin zeigen, wie schnell Vorurteile in die Irre führen. Typisch für eine Kurzgeschichte sind die Alltagssituation, die wenigen Figuren, die kurze Handlungszeit und die überraschende Wende. Mir gefällt der Text sehr gut, und ich würde ihn allen in meiner Klasse unbedingt weiterempfehlen."], "richtig": 0, "erklaerung": "Nur ein Schluss nennt alle drei Teile: die vermutliche Absicht, die Merkmale der Kurzgeschichte und eine begründete Meinung. Steht statt der Absicht Handlung, statt der Merkmale eine Figurenbeschreibung oder bleibt die Meinung ohne Begründung, ist der Schluss unvollständig."}]}, {"id": "iav", "titel": "✏️ Schwache Beispiele verbessern", "aufgaben": [{"typ": "verbessern", "frage": "So beginnt eine Inhaltsangabe zu „Spaghetti für zwei“ von Federica de Cesco.", "beispiel": "Es war einmal ein Junge namens Heinz, der in ein Restaurant ging, und dann passierte etwas total Lustiges.", "maengel": ["Titel, Autorin und Textsorte fehlen.", "märchenhafter Anfang und Präteritum statt Präsens", "Die Kernaussage fehlt – „etwas total Lustiges“ sagt nichts.", "Die Hauptfigur wird nicht genannt.", "Die Einleitung ist zu sachlich."], "richtig": [0, 1, 2], "erklaerung": "Die Hauptfigur Heinz ist genannt – aber Titel, Autorin, Textsorte und die Kernaussage fehlen. Und: Präsens, kein „Es war einmal“.", "tipps": ["Textsorte, Titel und Autorin genannt", "Hauptfigur und Ort genannt", "Kernaussage in einem Satz", "Präsens"], "muster": "In der Kurzgeschichte „Spaghetti für zwei“ von Federica de Cesco hält der fast vierzehnjährige Heinz in einem Selbstbedienungsrestaurant einen jungen Afrikaner für einen Suppendieb – bis er merkt, dass er selbst am falschen Tisch sitzt."}, {"typ": "verbessern", "frage": "Diese Sätze stammen aus dem Hauptteil einer Inhaltsangabe zu „Spaghetti für zwei“.", "beispiel": "Dann ging Heinz zurück und dann sah er, dass einer auf seinem Platz saß. „So eine Frechheit!“, dachte er. Und dann wurde Heinz voll wütend.", "maengel": ["„und dann“-Reihung und Satzanfang mit „Und“", "Präteritum statt Präsens", "wörtlich zitierter Gedanke", "Umgangssprache („voll“)", "Die Reihenfolge der Handlung ist falsch."], "richtig": [0, 1, 2, 3], "erklaerung": "Die Reihenfolge stimmt – aber Zeitform, Verknüpfung, Zitat und Wortwahl passen nicht zur Inhaltsangabe.", "tipps": ["Präsens", "zeitliche Überleitungen statt „und dann“", "Gedanken in eigenen Worten", "Standardsprache"], "muster": "Als Heinz mit dem Löffel zurückkehrt, sitzt ein junger Afrikaner an seinem Platz und isst die Suppe. Heinz ist empört und hält den Fremden für unverschämt."}, {"typ": "verbessern", "frage": "So endet eine Inhaltsangabe zu „Spaghetti für zwei“.", "beispiel": "Die Geschichte ist gut. Ende.", "maengel": ["Die vermutliche Absicht der Autorin fehlt.", "Merkmale der Kurzgeschichte fehlen.", "Die Meinung ist nicht begründet.", "Der Schluss ist zu ausführlich."], "richtig": [0, 1, 2], "erklaerung": "Der Schluss der Inhaltsangabe enthält die vermutliche Absicht, die Merkmale der Kurzgeschichte und eine begründete Meinung.", "tipps": ["Absicht vorsichtig formuliert (vermutlich …)", "zwei bis drei Merkmale der Kurzgeschichte", "eigene Meinung mit Begründung"], "muster": "Vermutlich möchte die Autorin zeigen, wie Vorurteile unser Urteil verzerren. Typisch für eine Kurzgeschichte sind die alltägliche Situation in der Mittagspause, die wenigen Figuren und die überraschende Wende. Mir gefällt der Text, weil er humorvoll zeigt, dass man eigene Fehler eingestehen kann."}]}]}, {"id": "exzerpt", "gruppe": "Informieren und Beschreiben", "titel": "Exzerpt", "symbol": "📝", "kurz": "Die wichtigsten Informationen stichwortartig, geordnet und mit Quelle.", "sets": [{"id": "ex1", "titel": "Merkmale und Arbeitsschritte", "aufgaben": [{"typ": "wahl", "frage": "Was ist ein Exzerpt?", "optionen": ["Ein stichwortartiger, übersichtlicher Auszug der wichtigsten Informationen eines Textes – für einen bestimmten Zweck.", "Eine ausformulierte Wiedergabe der wichtigsten Informationen eines Textes – mit Basissatz und im Präsens.", "Eine stichwortartige Sammlung eigener Meinungen und Bewertungen zu einem Text – für eine Diskussion.", "Eine vollständige, wörtliche Abschrift aller Sätze eines Textes – damit beim Lernen nichts verloren geht."], "richtig": 0, "erklaerung": "Das Exzerpt dient als Unterlage, z. B. für ein Referat, einen Aufsatz oder eine Prüfung. Ausformuliert mit Basissatz wäre es eine Zusammenfassung; eigene Wertungen und wörtliches Abschreiben gehören nicht hinein."}, {"typ": "wahl", "frage": "In welcher Form schreibst du ein Exzerpt?", "optionen": ["In Stichwörtern und knappen Wortgruppen.", "In ganzen, ausformulierten Sätzen im Präsens.", "In wörtlich abgeschriebenen Sätzen aus dem Text.", "In ausführlichen Absätzen mit eigenen Kommentaren."], "richtig": 0, "erklaerung": "Stichwörter – aber so ergänzt, dass du sie später ohne den Originaltext verstehst. Ganze Sätze, Abschriften und eigene Kommentare gehören nicht hinein."}, {"typ": "reihenfolge", "frage": "Bring die Arbeitsschritte in die richtige Reihenfolge.", "elemente": ["Text überfliegen, um einen Überblick zu bekommen", "Absatz für Absatz genau lesen", "Schlüsselwörter und Fachausdrücke markieren", "Stichwörter herausschreiben und ergänzen", "Exzerpt übersichtlich gliedern und die Quelle angeben"], "erklaerung": "Erst Überblick, dann genaues Lesen, markieren, herausschreiben – und alles übersichtlich ordnen."}, {"typ": "mehrfach", "frage": "Was gehört zur Quellenangabe?", "optionen": ["Autor/in", "Titel", "Medium bzw. Verlag oder Internetadresse", "Datum", "Seitenzahl (bei Büchern)", "deine Meinung zum Text"], "richtig": [0, 1, 2, 3, 4], "erklaerung": "Ohne Quelle ist ein Exzerpt unvollständig – du musst später wissen, woher die Informationen stammen."}, {"typ": "wahl", "frage": "Wovon hängt ab, wie ausführlich dein Exzerpt wird?", "optionen": ["Von deinem Vorwissen und vom Zweck (Referat, Prüfung …).", "Nur von der Länge des Ausgangstextes (z. B. Seitenzahl).", "Von der Zahl der Absätze – je Absatz genau eine Zeile.", "Von der Vorgabe, dass ein Exzerpt immer eine Seite lang ist."], "richtig": 0, "erklaerung": "Je mehr du schon weißt, desto weniger musst du herausschreiben. Und: Nur was für deinen Zweck wichtig ist, kommt hinein. Eine feste Länge oder Zeilenzahl gibt es nicht."}, {"typ": "wahl", "frage": "Darf deine eigene Bewertung („super Idee!“) ins Exzerpt?", "optionen": ["Nein, das Exzerpt gibt den Text ohne eigene Wertung wieder.", "Ja, eigene Wertungen machen das Exzerpt erst persönlich.", "Ja, aber nur am Schluss, als kurzes Fazit mit eigener Meinung.", "Ja, wenn du sie als Zitat in Anführungszeichen setzt."], "richtig": 0, "erklaerung": "Wörtliche Übernahmen aus dem Text kennzeichnest du als Zitat – eigene Wertungen lässt du ganz weg, auch am Schluss. Anführungszeichen machen aus deiner Meinung kein Zitat."}]}, {"id": "ex2", "titel": "Originaltext: Apple", "originaltext": {"titel": "Apple – Die Geschichte des Unternehmens", "info": "Sachtext von Thomas Flasch, kabeleinsdoku.at", "situation": "Du bereitest ein Referat über die Geschichte der Firma Apple vor und machst dazu ein Exzerpt."}, "aufgaben": [{"typ": "wahl", "frage": "Welche Zeile ist ein gutes Exzerpt-Stichwort?", "optionen": ["1976: Gründung von Apple durch Steve Jobs, Steve Wozniak und Ronald Wayne; Startkapital 1300 Dollar", "Im Jahr 1976 gründeten Steve Jobs und Steve Wozniak in einer Garage gemeinsam die Firma Apple.", "1984: Gründung von Apple durch Steve Jobs, Steve Wozniak und Ronald Wayne; Startkapital 1300 Dollar", "1976: geniale Gründung in der Garage – Jobs, Wozniak, Wayne; super Idee, toller Start!"], "richtig": 0, "erklaerung": "Knapp, mit Jahreszahl, Namen und Fakten – verständlich auch ohne Originaltext. Zahlen genau prüfen (1984 erscheint der Macintosh), keine ganzen Sätze und keine Wertungen."}, {"typ": "mehrfach", "frage": "Was gehört ins Exzerpt für ein Referat über die Firmengeschichte?", "optionen": ["1984: Macintosh mit grafischer Benutzeroberfläche und Maus", "1997: Steve Jobs kehrt als Chef zurück", "2001 iPod, 2007 iPhone", "2011: Tim Cook übernimmt die Leitung", "Jobs machte damals gerade eine Obstdiät", "Der Byte Shop bestellte 50 Rechner"], "richtig": [0, 1, 2, 3], "erklaerung": "Die Meilensteine der Firmengeschichte sind wichtig, kleine Anekdoten und Bestellzahlen nicht."}, {"typ": "reihenfolge", "frage": "Ordne die Stationen so, wie sie im Text (und in der Geschichte der Firma) vorkommen.", "elemente": ["Gründung in der Garage", "Apple I und Apple II", "Macintosh", "Steve Jobs muss die Firma verlassen", "Rückkehr von Jobs und Erfolg mit dem iMac", "iPod und später iPhone"], "erklaerung": "Die Reihenfolge des Ausgangstextes bleibt im Exzerpt erkennbar."}, {"typ": "wahl", "frage": "Welche Quellenangabe ist richtig?", "optionen": ["Flasch, Thomas: Apple – Die Geschichte des Unternehmens. Online unter: kabeleinsdoku.at (Datum des Abrufs)", "Unbekannt: Apple – Die Geschichte des Unternehmens. Online unter: kabeleinsdoku.at (Datum des Abrufs)", "Apple Inc.: Apple – Die Geschichte des Unternehmens. Online unter: apple.com (Datum des Abrufs)", "Flasch, Thomas: Apple – Die Geschichte des Unternehmens. Online unter: google.at (gefunden mit Google)"], "richtig": 0, "erklaerung": "Autor, Titel, Internetadresse der Seite und Datum des Abrufs. Der Autor ist bekannt, Apple selbst hat den Text nicht verfasst, und eine Suchmaschine ist keine Quelle."}, {"typ": "wahl", "frage": "Im Text steht „CEO“. Was machst du im Exzerpt?", "optionen": ["Ich kläre den Begriff kurz: CEO = Geschäftsführer bzw. Vorstandsvorsitzender.", "Ich lasse ihn weg, weil Fachausdrücke in einem Exzerpt nichts verloren haben.", "Ich übernehme ihn unverändert, auch wenn ich nicht weiß, was er bedeutet.", "Ich kläre den Begriff kurz: CEO = Pressesprecher bzw. Marketingleiter."], "richtig": 0, "erklaerung": "Fachausdrücke gehören ins Exzerpt – unbekannte schlägst du nach und erklärst sie kurz, sonst verstehst du dein Exzerpt später nicht. CEO bezeichnet die Unternehmensleitung, nicht das Marketing."}]}]}, {"id": "bericht", "gruppe": "Informieren und Beschreiben", "titel": "Bericht", "symbol": "📰", "kurz": "W-Fragen, Präteritum, sachlich – Unfallbericht und Zeitungsbericht.", "sets": [{"id": "be1", "titel": "Merkmale und Aufbau", "aufgaben": [{"typ": "mehrfach", "frage": "Welche Fragen beantwortet ein Bericht?", "optionen": ["Wer?", "Was?", "Wo?", "Wann?", "Wie?", "Warum?", "Welche Folgen?", "Wie habe ich mich gefühlt?", "Was hätte noch passieren können?"], "richtig": [0, 1, 2, 3, 4, 5, 6], "erklaerung": "Der Bericht beantwortet die W-Fragen genau. Gefühle und Spekulationen gehören nicht hinein."}, {"typ": "wahl", "frage": "In welcher Zeitform schreibst du einen Bericht?", "optionen": ["Präteritum – was davor geschah, im Plusquamperfekt.", "Präsens – was davor geschah, im Perfekt, damit es spannender wirkt.", "Perfekt – was davor geschah, im Plusquamperfekt.", "Präteritum – was davor geschah, ebenfalls im Präteritum."], "richtig": 0, "erklaerung": "Der Bericht erzählt ein abgeschlossenes Ereignis: Präteritum (kollidierte, erlitt, wurde gebracht). Was davor geschah, steht im Plusquamperfekt (hatte zu schneien begonnen). Präsens und Perfekt passen nicht, Spannung ist kein Ziel des Berichts."}, {"typ": "zuordnen", "frage": "Passt der Satz in einen Zeitungsbericht?", "kategorien": ["passt", "passt nicht"], "elemente": [{"text": "Am Montag gegen 7.45 Uhr kollidierte an der Kreuzung Hauptstraße/Bahngasse ein Pkw mit einem Radfahrer.", "kat": 0}, {"text": "Der 15-jährige Radfahrer erlitt Prellungen und wurde ins Krankenhaus gebracht.", "kat": 0}, {"text": "Laut Polizei dürfte der Lenker das Rotlicht übersehen haben.", "kat": 0}, {"text": "Plötzlich gab es einen fürchterlichen Knall – mir blieb das Herz stehen!", "kat": 1}, {"text": "Der Lenker war bestimmt betrunken.", "kat": 1}, {"text": "Leider wurde das neue Fahrrad völlig zerstört.", "kat": 1}], "erklaerung": "Sachlich und genau. Keine Gefühle und Ausrufe, keine Wertungen („leider“), keine Vermutungen als Tatsachen. Eine Vermutung der Polizei darf mit Quelle genannt werden (im Unfallbericht für die Versicherung gar keine Vermutungen)."}, {"typ": "reihenfolge", "frage": "Bring die Teile eines Zeitungsberichts in die richtige Reihenfolge.", "elemente": ["Schlagzeile", "Lead: Wer? Was? Wo? Wann?", "Hauptteil: Wie? Warum?", "Schluss: Welche Folgen?"], "erklaerung": "Das Wichtigste steht am Anfang – wer nur Schlagzeile und Lead liest, ist schon informiert."}, {"typ": "wahl", "frage": "Welche Schlagzeile ist am besten?", "optionen": ["Radfahrer bei Kreuzungsunfall verletzt", "Schrecklicher Unfall schockt die ganze Stadt", "Unfall an Kreuzung: Was ist da nur passiert?", "Armer Radfahrer hatte am Montag großes Pech"], "richtig": 0, "erklaerung": "Die Schlagzeile enthält die wichtigste Information und macht neugierig – sachlich, ohne Wertung („schrecklich“, „arm“, „Pech“) und nicht als Frage, die nichts verrät."}, {"typ": "wahl", "frage": "„Ich hab gesehen, wie der Typ einfach bei Rot drübergebrettert ist!“, sagt eine Passantin. Wie übernimmst du das in den Bericht?", "optionen": ["Eine Zeugin gab an, der Lenker sei bei Rot in die Kreuzung eingefahren.", "„Ich hab gesehen, wie der Typ einfach bei Rot drübergebrettert ist!“, sagte eine Passantin.", "Eine Zeugin gab an, der Typ sei einfach bei Rot drübergebrettert.", "Eine Passantin hat gesagt, dass der Lenker bei Rot in die Kreuzung eingefahren ist."], "richtig": 0, "erklaerung": "Zeugenaussagen sinngemäß und in indirekter Rede (Konjunktiv), eingeleitet im Präteritum – ohne wörtliche Rede und ohne Umgangssprache wie „Typ“ oder „drüberbrettern“."}]}, {"id": "be2", "titel": "Originaltext: Zeugenaussagen", "originaltext": {"titel": "Bericht – Zeugenaussagen", "info": "Arbeitsblatt mit zwei Zeugenaussagen zu einem Fahrradunfall in der Moltkestraße in Karlsruhe", "situation": "Schreib nach den Zeugenaussagen einen sachlichen Bericht über den Unfall."}, "aufgaben": [{"typ": "zuordnen", "frage": "Welche W-Frage beantwortet die Angabe?", "kategorien": ["Wann?", "Wo?", "Wer?", "Welche Folgen?"], "elemente": [{"text": "am 13. Dezember gegen 13.15 Uhr", "kat": 0}, {"text": "in der Moltkestraße in Karlsruhe", "kat": 1}, {"text": "ein Mädchen auf dem Fahrrad und der Lenker eines Porsche", "kat": 2}, {"text": "verstauchter Fuß, kaputter Scheinwerfer, beschädigtes Fahrrad", "kat": 3}], "erklaerung": "Sammle zuerst alle W-Fragen aus den Aussagen – dann weißt du, was in den Bericht gehört."}, {"typ": "mehrfach", "frage": "Was lässt du im Bericht weg?", "optionen": ["dass der Porsche sehr toll aussah", "dass der Zeuge einen Bekannten lange nicht gesehen hatte", "„zum Glück“ und „Gott sei Dank“", "dass das Fahrrad „schön“ war", "dass es gerade zu schneien begonnen hatte und die Straße glatt war", "dass das Mädchen einen Helm trug"], "richtig": [0, 1, 2, 3], "erklaerung": "Weg mit Nebensächlichem, Gefühlen und Wertungen. Wetter, Straßenzustand und Helm sind wichtig für Ursache und Folgen."}, {"typ": "wahl", "frage": "Was gibst du als Ursache an?", "optionen": ["Laut einem Zeugen kam das Mädchen auf der durch beginnenden Schneefall glatten Straße ins Schleudern.", "Laut einem Zeugen fuhr der Porsche viel zu schnell und konnte deshalb nicht mehr rechtzeitig bremsen.", "Das Mädchen kam ins Schleudern, weil es unvorsichtig fuhr und die glatte Straße nicht beachtete.", "Laut einem Zeugen wollte das Mädchen gerade die Straße überqueren und übersah dabei den Porsche."], "richtig": 0, "erklaerung": "Nur was belegt ist – und gekennzeichnet, von wem es stammt. Der Zeuge glaubt ausdrücklich nicht, dass der Porsche zu schnell war. Von Unvorsicht oder vom Überqueren der Straße sagt niemand etwas – das wäre eine Wertung bzw. erfunden."}, {"typ": "wahl", "frage": "Ein Zeuge nennt das Auto „heißer Ofen“. Wie schreibst du im Bericht?", "optionen": ["der Porsche bzw. der Pkw", "der „heiße Ofen“ (Porsche)", "der Porsche bzw. die Karre", "der tolle Porsche bzw. Pkw"], "richtig": 0, "erklaerung": "Umgangssprache und Wertungen aus Zeugenaussagen übernimmst du nicht – auch nicht in Anführungszeichen oder mit Erklärung."}, {"typ": "luecke", "frage": "Setze die richtigen Formen ein (Präteritum und Plusquamperfekt).", "satz": "Das Mädchen {{}} (kommen) ins Schleudern, weil es kurz zuvor zu schneien {{}} {{}} (beginnen).", "loesungen": [["kam"], ["begonnen"], ["hatte"]], "erklaerung": "Der Unfall steht im Präteritum (kam). Was davor geschah, im Plusquamperfekt (hatte … begonnen)."}, {"typ": "wahl", "frage": "Welcher Satz gibt die Folgen sachlich wieder?", "optionen": ["Das Mädchen, das einen Helm trug, zog sich eine Verstauchung am Fuß zu; am Pkw ging der rechte Scheinwerfer zu Bruch, auch das Fahrrad wurde beschädigt.", "Das arme Mädchen, das zum Glück einen Helm trug, zog sich nur eine Verstauchung am Fuß zu; am Pkw ging der rechte Scheinwerfer zu Bruch.", "Das Mädchen, das einen Helm trägt, verstaucht sich den Fuß; am Pkw geht der rechte Scheinwerfer zu Bruch, auch das Fahrrad wird beschädigt.", "Das Mädchen, das keinen Helm trug, erlitt schwere Kopfverletzungen; am Pkw ging der linke Scheinwerfer zu Bruch, das Fahrrad blieb heil."], "richtig": 0, "erklaerung": "Sachlich, vollständig, im Präteritum – ohne Mitleid, Wertung oder Spekulation. Und genau nach den Aussagen: Helm, verstauchter Fuß, rechter Scheinwerfer, beschädigtes Fahrrad."}]}, {"id": "bev", "titel": "✏️ Schwache Beispiele verbessern", "aufgaben": [{"typ": "verbessern", "frage": "So beginnt ein Bericht über den Fahrradunfall in der Moltkestraße (Zeugenaussagen aus der Übung „Originaltext: Zeugenaussagen“).", "beispiel": "Gestern war ein echt schrecklicher Tag, weil plötzlich ein voll schlimmer Unfall passiert ist.", "maengel": ["Genaue Zeit, genauer Ort und Beteiligte fehlen.", "Gefühle und Wertungen („schrecklich“, „schlimm“)", "Umgangssprache („echt“, „voll“)", "Perfekt („ist passiert“) statt Präteritum", "Es stehen zu viele Zahlen darin."], "richtig": [0, 1, 2, 3], "erklaerung": "Die Einleitung beantwortet knapp Wer? Was? Wo? Wann? – sachlich und im Präteritum.", "tipps": ["Wer, was, wo, wann beantwortet", "Präteritum", "sachlich, ohne Gefühle"], "muster": "Am 13. Dezember gegen 13.15 Uhr wurde in der Moltkestraße in Karlsruhe ein Mädchen auf seinem Fahrrad von einem Pkw erfasst."}, {"typ": "verbessern", "frage": "So erklärt ein Bericht die Unfallursache.", "beispiel": "Der Porschefahrer raste bestimmt viel zu schnell, weil solche Typen immer angeben wollen.", "maengel": ["Eine Vermutung wird als Tatsache dargestellt.", "Vorurteil und Wertung („solche Typen“)", "Es widerspricht der Zeugenaussage.", "Die Zeitform ist falsch."], "richtig": [0, 1, 2], "erklaerung": "Der Zeuge glaubt ausdrücklich nicht, dass der Lenker zu schnell fuhr. Im Bericht steht nur Belegtes – mit Quelle.", "tipps": ["nur Belegtes, mit Quelle („laut einem Zeugen“)", "keine Wertung", "Präteritum"], "muster": "Laut einem Zeugen war die Straße wegen des beginnenden Schneefalls glatt, sodass das Mädchen ins Schleudern geriet. Der Lenker versuchte noch auszuweichen."}, {"typ": "verbessern", "frage": "So beschreibt ein Bericht die Folgen des Unfalls.", "beispiel": "Zum Glück hatte das arme Mädchen einen Helm auf, sonst wäre sie vielleicht tot. Das schöne neue Fahrrad ist natürlich auch kaputt.", "maengel": ["Gefühle und Wertungen („zum Glück“, „arm“, „schön“)", "Spekulation („sonst wäre sie vielleicht tot“)", "Zeitformwechsel („ist kaputt“)", "Die wichtigste Folge – die Verletzung – fehlt.", "Der Text ist zu förmlich."], "richtig": [0, 1, 2, 3], "erklaerung": "Folgen werden sachlich und vollständig genannt: Verletzung, Sachschaden – ohne Mitleid und ohne „was wäre wenn“.", "tipps": ["Verletzung und Sachschaden genannt", "keine Spekulation, keine Wertung", "Präteritum"], "muster": "Das Mädchen, das einen Helm trug, zog sich eine Verstauchung am Fuß zu. Am Pkw ging der rechte Scheinwerfer zu Bruch, auch das Fahrrad wurde beschädigt."}]}]}, {"id": "reportage", "gruppe": "Informieren und Beschreiben", "titel": "Reportage", "symbol": "📸", "kurz": "Fakten plus „Kino im Kopf“: Szenen, Stimmen, Eindrücke.", "sets": [{"id": "rp1", "titel": "Merkmale und Aufbau", "aufgaben": [{"typ": "wahl", "frage": "Was unterscheidet die Reportage vom Bericht?", "optionen": ["Sie informiert ebenfalls, holt die Leserinnen und Leser aber mit Szenen, Eindrücken und Stimmen Beteiligter mitten ins Geschehen.", "Sie darf Szenen und Aussagen Beteiligter frei erfinden, wenn die Geschichte dadurch spannender wird und fesselt.", "Sie verzichtet auf Fakten und W-Fragen und schildert nur die persönlichen Gefühle der Reporterin bzw. des Reporters.", "Sie informiert ebenfalls, ist aber noch sachlicher und kürzer als ein Bericht und verzichtet ganz auf Zitate Beteiligter."], "richtig": 0, "erklaerung": "Die Reportage ist die persönlichste Form des Zeitungsberichts: anschaulicher als der Bericht und mit Stimmen Beteiligter. Erfunden wird nichts, und die Fakten (W-Fragen) müssen trotzdem stimmen."}, {"typ": "wahl", "frage": "Welcher Einstieg passt zu einer Reportage über die Eröffnung eines Adventmarkts?", "optionen": ["Es duftet nach gebrannten Mandeln. Um Punkt 18 Uhr gehen am Hauptplatz die Lichter an – und hunderte Kinder halten den Atem an.", "Am Freitag, dem 1. Dezember, wurde um 18 Uhr am Hauptplatz der diesjährige Adventmarkt mit rund 40 Ständen eröffnet.", "Ich war am Freitag am Adventmarkt, und es war wirklich super schön, weil es dort so viele tolle Stände gibt.", "Zusammenfassend lässt sich sagen, dass der Adventmarkt am Hauptplatz auch heuer wieder viele Besucher anlockte."], "richtig": 0, "erklaerung": "Szenischer Einstieg mit Sinneseindrücken. Ein nüchterner Einstieg mit Datum und Zahl der Stände passt zum Bericht; ein allgemeines Urteil wie „super schön“ oder eine Zusammenfassung gleich am Anfang holt niemanden ins Geschehen."}, {"typ": "mehrfach", "frage": "Was gehört zu einer Reportage?", "optionen": ["direkte Zitate von Beteiligten (O-Töne)", "Eindrücke für alle Sinne", "eingestreute Hintergrundinformationen", "ein gestalteter Schluss", "nur Zahlen und Fakten", "erfundene Ereignisse"], "richtig": [0, 1, 2, 3], "erklaerung": "Anschaulich, aber wahr: Nichts erfinden – genau beobachten und Menschen zu Wort kommen lassen."}, {"typ": "zuordnen", "frage": "Nähe oder Distanz? Ordne die Sätze zu.", "kategorien": ["Szene (Nähe)", "Hintergrund (Distanz)"], "elemente": [{"text": "Mit klammen Fingern reicht Anna einen Becher Punsch über die Theke.", "kat": 0}, {"text": "„Für mich ist das jedes Jahr der schönste Abend“, sagt ein Standler und lacht.", "kat": 0}, {"text": "Der Markt besteht seit 1998 und zählt pro Saison rund 200.000 Besucher.", "kat": 1}, {"text": "Der Erlös geht laut Veranstalter an ein Sozialprojekt.", "kat": 1}], "erklaerung": "Die Reportage wechselt zwischen Szene und Hintergrund – so bleibt sie anschaulich und informativ. (Beispielsätze erfunden.)"}, {"typ": "wahl", "frage": "Warum steht die Reportage häufig im Präsens?", "optionen": ["Damit die Leserinnen und Leser das Gefühl haben, dabei zu sein.", "Weil das Ereignis meistens erst nach dem Erscheinen der Zeitung stattfindet.", "Weil Vergangenheitsformen in einer Reportage grundsätzlich nicht erlaubt sind.", "Damit die Reportage sachlicher und neutraler wirkt als ein Bericht."], "richtig": 0, "erklaerung": "Das Präsens holt die Leserinnen und Leser ins Geschehen – sachlicher wird der Text dadurch nicht. Hintergrund darf in der Vergangenheit stehen; der Wechsel wird bewusst eingesetzt."}, {"typ": "wahl", "frage": "Welcher Schluss passt?", "optionen": ["Als um 22 Uhr die Lichter ausgehen, steht Anna noch immer hinter der Theke – und freut sich schon auf morgen.", "Das war meine Reportage über den Adventmarkt am Hauptplatz – danke, dass ihr sie gelesen habt.", "Zusammenfassend ist zu sagen, dass der Adventmarkt am Hauptplatz pünktlich um 18 Uhr eröffnet wurde.", "Ich persönlich finde Adventmärkte ehrlich gesagt ziemlich überlaufen und gehe lieber woanders hin."], "richtig": 0, "erklaerung": "Ein gestalteter Schluss greift den Einstieg auf, setzt eine Pointe oder gibt einen Ausblick. Ein Abschiedsgruß, eine nüchterne Zusammenfassung oder eine angehängte Privatmeinung rundet die Reportage nicht ab."}]}]}, {"id": "beschreibung", "gruppe": "Informieren und Beschreiben", "titel": "Beschreibung", "symbol": "🖼️", "kurz": "Person oder Gegenstand genau, geordnet und im Präsens beschreiben.", "sets": [{"id": "bs1", "titel": "Merkmale und Aufbau", "aufgaben": [{"typ": "reihenfolge", "frage": "Bring die Teile einer Personenbeschreibung in eine sinnvolle Reihenfolge.", "elemente": ["Einleitung: Wer ist die Person, woher kenne ich sie?", "Gesamteindruck: Alter, Größe, Figur", "Gesicht und Frisur", "Kleidung", "besondere Kennzeichen", "Schluss: Wesen und Besonderheit"], "erklaerung": "Vom Gesamteindruck zu den Einzelheiten, von oben nach unten – und zum Schluss das Wesen der Person."}, {"typ": "wahl", "frage": "In welcher Zeitform schreibst du eine Beschreibung?", "optionen": ["Präsens.", "Präteritum.", "Perfekt.", "Futur."], "richtig": 0, "erklaerung": "Beschreiben heißt: So ist es (jetzt). Erzählen in der Vergangenheit ist ein typischer Fehler."}, {"typ": "mehrfach", "frage": "Welche Verben machen deine Beschreibung abwechslungsreicher als „hat“ und „ist“?", "optionen": ["trägt", "wirkt", "fällt auf", "reicht bis", "hat", "ist"], "richtig": [0, 1, 2, 3], "erklaerung": "Statt „Sie hat einen Mantel“: „Sie trägt einen knielangen Mantel“."}, {"typ": "wahl", "frage": "Welche Angabe ist am genauesten?", "optionen": ["kinnlanges, kastanienbraunes Haar", "wunderschönes, sehr gepflegtes Haar", "normal langes, irgendwie braunes Haar", "ganz normales, ziemlich dunkles Haar"], "richtig": 0, "erklaerung": "Treffende Eigenschaftswörter für Länge und Farbe statt „schön“, „normal“, „ziemlich“ oder „irgendwie“."}, {"typ": "zuordnen", "frage": "Gegenstandsbeschreibung: Passt der Satz?", "kategorien": ["passt", "passt nicht"], "elemente": [{"text": "Der Rucksack ist etwa 45 Zentimeter hoch und aus dunkelblauem, wasserabweisendem Stoff.", "kat": 0}, {"text": "Vorne befindet sich eine Reißverschlusstasche mit einem roten Anhänger.", "kat": 0}, {"text": "Gestern habe ich ihn im Bus vergessen und bin zurückgelaufen.", "kat": 1}, {"text": "Er ist halt voll praktisch.", "kat": 1}], "erklaerung": "Beschreiben, nicht erzählen – mit Größe, Form, Farbe, Material und Teilen. Keine Umgangssprache."}, {"typ": "wahl", "frage": "Welche Satzanfänge sind am besten?", "optionen": ["Auffällig sind … Über der Stirn … An den Füßen …", "Sie ist … Sie hat … Sie ist auch … Sie hat auch …", "Und dann … Und dann sieht man … Und dann …", "Ich sehe … Ich sehe auch … Dann sehe ich …"], "richtig": 0, "erklaerung": "Sätze mit unterschiedlichen Satzgliedern beginnen – das macht die Beschreibung lebendig und geordnet. Immer wieder „Sie hat“, „Ich sehe“ oder „Und dann“ wirkt eintönig."}]}]}, {"id": "charakteristik", "gruppe": "Informieren und Beschreiben", "titel": "Charakteristik", "symbol": "🧑", "kurz": "Vom Äußeren zum Wesen: Eigenschaften benennen und belegen.", "sets": [{"id": "ch1", "titel": "Merkmale und Aufbau", "aufgaben": [{"typ": "wahl", "frage": "Was unterscheidet die Charakteristik von der Personenbeschreibung?", "optionen": ["Sie erschließt aus Aussehen und Verhalten die Charaktereigenschaften – das Wesen der Person.", "Sie beschreibt das Aussehen noch genauer, von der Frisur bis zur Kleidung – ohne auf das Wesen einzugehen.", "Sie erzählt die wichtigsten Erlebnisse der Person in zeitlicher Reihenfolge nach – wie eine Inhaltsangabe.", "Sie zählt möglichst viele Eigenschaften der Person auf – Belege aus dem Text sind dabei nicht nötig."], "richtig": 0, "erklaerung": "Die Charakteristik geht über das Äußere hinaus: Wie ist die Person, und woran erkennt man das? Sie erzählt nicht nach und behauptet Eigenschaften nicht nur, sondern belegt sie."}, {"typ": "zuordnen", "frage": "Ordne zu: Äußeres, Verhalten oder Inneres?", "kategorien": ["Äußeres", "Verhalten", "Inneres"], "elemente": [{"text": "Körperbau, Kleidung, Frisur", "kat": 0}, {"text": "Haltung und Gesichtsausdruck", "kat": 0}, {"text": "Gewohnheiten und Art zu sprechen", "kat": 1}, {"text": "Beziehungen zu anderen Figuren", "kat": 1}, {"text": "Werte, Wünsche und Ängste", "kat": 2}, {"text": "Umgang mit Konflikten", "kat": 2}], "erklaerung": "Der Hauptteil geht vom Äußeren zum Inneren – oft steht der ergiebigste Bereich zuletzt."}, {"typ": "wahl", "frage": "Welcher Abschnitt ist vollständig (Eigenschaft – Beleg – Erläuterung)?", "optionen": ["Lena ist hilfsbereit: Als ihre Sitznachbarin krank war, brachte sie ihr jeden Tag die Mitschriften. Man kann sich also auf sie verlassen.", "Lena ist hilfsbereit: Als ihre Sitznachbarin zwei Wochen lang krank war, brachte sie ihr jeden Tag die Mitschriften vorbei.", "Lena ist hilfsbereit, nett, freundlich und sehr lieb zu allen. Deshalb mögen sie alle in der Klasse, und man kann sich auf sie verlassen.", "Als ihre Sitznachbarin krank war, ging Lena jeden Tag zu ihr, brachte ihr die Mitschriften und fuhr danach mit dem Bus wieder heim."], "richtig": 0, "erklaerung": "Eigenschaften nicht nur behaupten, sondern an einer Situation zeigen und erläutern, was das über die Person aussagt. Fehlt die Erläuterung, fehlt der Beleg oder wird nur nacherzählt, ist der Abschnitt unvollständig."}, {"typ": "mehrfach", "frage": "Welche Eigenschaftswörter sind treffend und genau?", "optionen": ["zuverlässig", "ehrgeizig", "verschlossen", "hilfsbereit", "nett", "cool", "lieb", "normal"], "richtig": [0, 1, 2, 3], "erklaerung": "„nett“, „cool“, „lieb“ und „normal“ sagen wenig aus."}, {"typ": "wahl", "frage": "Was ist eine indirekte Charakterisierung?", "optionen": ["Eigenschaften zeigen sich im Verhalten, Handeln oder Sprechen der Figur, ohne dass sie ausdrücklich genannt werden.", "Die Erzählerin nennt die Eigenschaft der Figur ausdrücklich, zum Beispiel mit dem Satz „Er war geizig“.", "Man beschreibt nur das Äußere der Figur, also Kleidung, Frisur und Körpergröße, ohne etwas zu folgern.", "Man ergänzt Eigenschaften, die im Text gar nicht vorkommen, und erfindet passende Szenen dazu."], "richtig": 0, "erklaerung": "Direkt: Die Eigenschaft wird ausdrücklich genannt. Indirekt: Du erschließt sie aus Verhalten, Handeln oder Sprechen. Das Äußere allein reicht dafür nicht, und erfunden wird nichts."}, {"typ": "wahl", "frage": "Was gehört in den Schluss einer Charakteristik?", "optionen": ["Ein zusammenfassendes Gesamturteil, das positive und negative Seiten abwägt.", "Eine neue, besonders wichtige Eigenschaft, die im Hauptteil noch nicht vorkam.", "Eine kurze Nacherzählung, wie die Handlung für die Figur am Ende ausgeht.", "Nichts – die Charakteristik endet mit dem letzten Beleg im Hauptteil."], "richtig": 0, "erklaerung": "Im Schluss steht dein Gesamturteil – ggf. mit Blick auf die Entwicklung der Figur. Neue Eigenschaften und Handlungsnacherzählung gehören nicht hinein, und ohne Schluss fehlt das Urteil."}]}, {"id": "ch2", "titel": "Originaltext: Heinz in „Spaghetti für zwei“", "originaltext": {"titel": "Spaghetti für zwei", "info": "Kurzgeschichte von Federica de Cesco", "situation": "Charakterisiere Heinz, die Hauptfigur der Kurzgeschichte."}, "aufgaben": [{"typ": "zuordnen", "frage": "Wie zeigt sich Heinz – zu Beginn oder am Ende der Geschichte?", "kategorien": ["zu Beginn", "am Ende"], "elemente": [{"text": "will vor anderen cool und überlegen wirken", "kat": 0}, {"text": "hält den Fremden vorschnell für einen Dieb", "kat": 0}, {"text": "entschuldigt sich und geht auf Marcel zu", "kat": 1}, {"text": "kann über sich selbst lachen", "kat": 1}], "erklaerung": "Heinz entwickelt sich – das gehört in eine gute Charakteristik."}, {"typ": "zuordnen", "frage": "Auf wen trifft das zu?", "kategorien": ["Heinz", "Marcel"], "elemente": [{"text": "ist sparsam und will nicht viel Geld ausgeben", "kat": 0}, {"text": "schwitzt und wird rot vor Verlegenheit", "kat": 0}, {"text": "kann mittags nicht nach Hause, weil der Bus ungünstig fährt", "kat": 0}, {"text": "bleibt ruhig und hat die Situation im Griff", "kat": 1}, {"text": "teilt sein Essen, ohne ein Wort zu sagen", "kat": 1}, {"text": "spricht bestes Deutsch", "kat": 1}], "erklaerung": "Der Vergleich mit Marcel macht Heinz’ Eigenschaften deutlicher."}, {"typ": "wahl", "frage": "Welche Textstelle belegt, dass Heinz Angst um sein Ansehen hat?", "optionen": ["Er will den Fremden lautstark zurechtweisen, merkt aber, dass die Leute ihn komisch ansehen, wird rot und will nicht als Rassist gelten.", "Er setzt sich an einen freien Tisch, merkt dann, dass er den Löffel vergessen hat, steht auf und holt sich schnell einen.", "Er greift nach der Gabel, rollt die Spaghetti auf und teilt sie sich schweigend mit dem Fremden, bis beide satt sind.", "Er verabredet sich am Ende mit Marcel für den nächsten Tag zur gleichen Zeit und will dann selbst die Spaghetti spendieren."], "richtig": 0, "erklaerung": "Ein Beleg muss die Eigenschaft wirklich zeigen. Löffel holen, Spaghetti teilen und die Verabredung kommen zwar in der Geschichte vor, sagen aber nichts über seine Angst um sein Ansehen."}, {"typ": "wahl", "frage": "Heinz presst die Zähne zusammen, bis seine Kinnbacken schmerzen. Was zeigt diese Stelle?", "optionen": ["Seine unterdrückte Wut und Anspannung – eine indirekte Charakterisierung.", "Seine unterdrückte Wut und Anspannung – eine direkte Charakterisierung.", "Seine starken Zahnschmerzen – eine indirekte Charakterisierung.", "Seine Vorfreude auf das Essen – eine indirekte Charakterisierung."], "richtig": 0, "erklaerung": "Die Wut wird an dieser Stelle nicht ausdrücklich genannt, sondern zeigt sich im Verhalten – deshalb ist es eine indirekte Charakterisierung. Direkt wäre sie, wenn dort ausdrücklich stünde, dass Heinz wütend ist."}, {"typ": "wahl", "frage": "Wie belegst du eine Aussage richtig?", "optionen": ["Heinz will vor anderen überlegen wirken: Er „fühlte sich sehr cool“ (Z. 1–2).", "Heinz will vor anderen überlegen wirken: Er fühlte sich sehr cool, das steht irgendwo am Anfang.", "Heinz will vor anderen überlegen wirken: Er „ist der Coolste von allen“ (Z. 1–2).", "Heinz will vor anderen überlegen wirken, weil ich das selbst so empfinde (Z. 1–2)."], "richtig": 0, "erklaerung": "Kurzes, wörtlich genaues Zitat in Anführungszeichen mit Zeilenangabe – oder sinngemäß mit Stellenangabe. Ein Zitat darf nichts verändern, „irgendwo am Anfang“ ist keine Stellenangabe, und deine eigene Meinung ist kein Beleg."}, {"typ": "wahl", "frage": "Welche Aussage beschreibt Heinz’ Entwicklung am besten?", "optionen": ["Aus einem vorurteilsvollen, schnell wütenden Jugendlichen wird jemand, der seinen Irrtum einsieht und Freundschaft anbietet.", "Aus einem schüchternen, ängstlichen Jugendlichen wird jemand, der sich endlich traut, einem Dieb die Meinung zu sagen.", "Heinz bleibt die ganze Geschichte über vorurteilsvoll und wütend und verlässt am Ende beleidigt das Restaurant.", "Aus einem hilfsbereiten Jugendlichen, der sein Essen gern teilt, wird jemand, der dem Fremden am Ende misstraut."], "richtig": 0, "erklaerung": "Am Ende entschuldigt sich Heinz, lacht mit Marcel und will beim nächsten Mal die Spaghetti spendieren. Zu Beginn ist er nicht schüchtern oder hilfsbereit, sondern überheblich und voller Vorurteile – und Marcel ist kein Dieb."}]}]}, {"id": "ki_fakten", "gruppe": "Mit KI arbeiten", "titel": "Faktencheck", "symbol": "🔎", "kurz": "Stimmt das wirklich? KI-Texte Satz für Satz am Original prüfen.", "sets": [{"id": "fk1", "titel": "Faktencheck: Lehrlinge", "info": "Eine KI hat den Bericht unten zusammengefasst. Prüf jeden Satz am Originaltext: Stimmt er, ist er falsch wiedergegeben oder hat die KI etwas dazuerfunden?", "beilage": {"titel": "Betriebe suchen händeringend Lehrlinge", "info": "Bericht von Martin Gruber, erschienen am 14. September 2026 in der „Steirischen Rundschau“ (erfundener Übungstext)", "absaetze": ["In vielen Regionen Österreichs bleiben Lehrstellen unbesetzt. Besonders betroffen sind die Gastronomie, das Handwerk und der Handel. Ein Bäckermeister aus Leoben sucht seit zwei Jahren vergeblich einen Lehrling. Seine Backstube ist übrigens über hundert Jahre alt.", "Als wichtigsten Grund nennen Fachleute, dass immer mehr Jugendliche nach der Pflichtschule eine höhere Schule besuchen. Außerdem gibt es heute weniger Jugendliche als noch vor zwanzig Jahren.", "Viele junge Menschen halten eine Lehre zudem für weniger angesehen als die Matura. Eine Berufsberaterin hält dieses Bild für veraltet: Gut ausgebildete Fachkräfte hätten sehr gute Aufstiegschancen und würden dringend gebraucht.", "Die Betriebe reagieren unterschiedlich. Manche zahlen Prämien, finanzieren den Führerschein oder ermöglichen eine Lehre mit Matura. Ein Installateur in Graz lädt Schulklassen zu Schnuppertagen ein, bei denen es immer Pizza gibt.", "Die Wirtschaftskammer fordert, dass die Schulen früher und genauer über Lehrberufe informieren. Nur so könne der Fachkräftemangel langfristig gebremst werden."]}, "aufgaben": [{"typ": "zuordnen", "frage": "Prüf die Sätze aus der KI-Zusammenfassung am Originaltext.", "kategorien": ["stimmt", "falsch wiedergegeben", "dazuerfunden"], "elemente": [{"text": "In vielen Regionen Österreichs bleiben Lehrstellen unbesetzt, besonders in Gastronomie, Handwerk und Handel.", "kat": 0}, {"text": "Laut Fachleuten besuchen immer mehr Jugendliche nach der Pflichtschule eine höhere Schule.", "kat": 0}, {"text": "Die Zahl der Jugendlichen hat sich in den letzten zwanzig Jahren halbiert.", "kat": 2}, {"text": "Eine Berufsberaterin meint, die Matura sei heute nichts mehr wert.", "kat": 1}, {"text": "Manche Betriebe finanzieren ihren Lehrlingen den Führerschein.", "kat": 0}, {"text": "Ein Installateur in Graz zahlt jedem Lehrling eine Prämie von 1000 Euro.", "kat": 2}, {"text": "Die Wirtschaftskammer erklärt, der Fachkräftemangel sei bereits gelöst.", "kat": 1}, {"text": "Die Wirtschaftskammer fordert, dass Schulen früher über Lehrberufe informieren.", "kat": 0}], "erklaerung": "Im Text steht nur, dass es weniger Jugendliche gibt – nicht „halbiert“. Die Berufsberaterin sagt, das schlechte Bild der Lehre sei veraltet – nicht, die Matura sei wertlos. Der Installateur lädt zu Schnuppertagen ein; Prämien zahlen „manche Betriebe“, ein Betrag steht nirgends. Und die Wirtschaftskammer will den Mangel erst bremsen."}, {"typ": "wahl", "frage": "Warum erfinden KIs manchmal Fakten?", "optionen": ["Sie erzeugen Sätze, die wahrscheinlich und glaubwürdig klingen – ob etwas stimmt, prüfen sie nicht zuverlässig.", "Sie wollen die Nutzerinnen und Nutzer absichtlich täuschen, damit diese öfter fragen und länger bleiben.", "Sie greifen auf veraltete Internetseiten zu – mit aktuellen Daten wären ihre Antworten immer richtig.", "Das passiert nur bei kostenlosen KIs – bezahlte Versionen prüfen jede Aussage zuverlässig nach."], "richtig": 0, "erklaerung": "Eine KI kann sehr überzeugend formulieren und trotzdem falsch liegen – auch mit aktuellen Daten und auch in bezahlten Versionen. Sie täuscht nicht absichtlich, sie prüft nur nicht zuverlässig. Deshalb prüfst du jede Angabe am Original."}, {"typ": "mehrfach", "frage": "Was machst du mit einem KI-Text, bevor du etwas daraus verwendest?", "optionen": ["jede Aussage am Originaltext prüfen", "Zahlen, Namen und Daten besonders genau kontrollieren", "erfundene oder falsche Stellen streichen bzw. korrigieren", "ihm vertrauen, weil er gut klingt", "ihn unverändert abgeben"], "richtig": [0, 1, 2], "erklaerung": "Gut klingen heißt nicht richtig sein. Und: Wer einen Text abgibt, ist für den Inhalt verantwortlich."}, {"typ": "zuordnen", "frage": "Eine zweite KI hat den Bericht ebenfalls zusammengefasst. Prüf auch diese Sätze.", "kategorien": ["stimmt", "falsch wiedergegeben", "dazuerfunden"], "elemente": [{"text": "Fachleute nennen als wichtigsten Grund, dass mehr Jugendliche eine höhere Schule besuchen.", "kat": 0}, {"text": "Viele Jugendliche halten die Lehre für weniger angesehen als die Matura.", "kat": 0}, {"text": "Manche Betriebe ermöglichen eine Lehre mit Matura.", "kat": 0}, {"text": "Laut einer Berufsberaterin haben Fachkräfte kaum Aufstiegschancen.", "kat": 1}, {"text": "Die Wirtschaftskammer will, dass Schulen erst später über Lehrberufe informieren.", "kat": 1}, {"text": "Der Staat zahlt jedem Betrieb eine Förderung für jeden neuen Lehrling.", "kat": 2}], "erklaerung": "Die Berufsberaterin sagt das Gegenteil: Fachkräfte haben sehr gute Aufstiegschancen. Die Wirtschaftskammer will frühere Information, nicht spätere. Eine staatliche Förderung kommt im Bericht nicht vor."}, {"typ": "wahl", "frage": "Die KI schreibt: „Ein Bäckermeister aus Leoben sucht seit zwei Jahren vergeblich einen Lehrling, weil die Löhne in der Branche zu niedrig sind.“ Was stimmt?", "optionen": ["Der erste Teil stimmt – die Begründung mit den niedrigen Löhnen hat die KI dazuerfunden.", "Der ganze Satz stimmt, denn der Bericht nennt die niedrigen Löhne als wichtigsten Grund.", "Der ganze Satz ist falsch, denn im Bericht kommt gar kein Bäckermeister aus Leoben vor.", "Nur die Begründung stimmt – der Bäckermeister stammt laut Bericht aber aus Graz."], "richtig": 0, "erklaerung": "Besonders tückisch: Ein richtiger Satz wird mit einer erfundenen Begründung verlängert. Prüf deshalb nicht nur, ob etwas vorkommt, sondern auch jedes „weil“ und „deshalb“."}, {"typ": "wahl", "frage": "Die KI hat weggelassen, dass die Backstube über hundert Jahre alt ist und es bei den Schnuppertagen Pizza gibt. Ist das ein Fehler?", "optionen": ["Nein – das sind Nebensächlichkeiten, die eine Zusammenfassung weglassen darf.", "Ja – eine Zusammenfassung muss jedes Detail aus dem Original wiedergeben.", "Ja – gerade solche Details beweisen, dass die KI den Text genau gelesen hat.", "Nein – eine KI lässt nie etwas Wichtiges weg, prüfen ist hier daher unnötig."], "richtig": 0, "erklaerung": "Weglassen ist kein Fehler, solange nichts Wesentliches fehlt. Ob das stimmt, prüfst du trotzdem selbst – eine KI kann auch Wichtiges übersehen."}]}, {"id": "fk2", "titel": "Faktencheck: Hausübungen", "originaltext": {"titel": "Der Zweifel am Sinn von Hausübungen", "info": "Bericht von Julia Neuhauser, diepresse.com, 11. März 2012", "situation": "Eine KI hat Aussagen aus diesem Bericht wiedergegeben. Prüf sie am Originaltext."}, "aufgaben": [{"typ": "zuordnen", "frage": "Stimmt die Aussage der KI mit dem Bericht überein?", "kategorien": ["stimmt", "falsch wiedergegeben", "dazuerfunden"], "elemente": [{"text": "Eine Studie der TU Dresden stellt den Nutzen von Hausübungen infrage.", "kat": 0}, {"text": "Laut Tina Hascher sollten Hausübungen besser in den Unterricht eingebunden werden.", "kat": 0}, {"text": "Tina Hascher fordert, Hausübungen ganz abzuschaffen.", "kat": 1}, {"text": "Laut einer Umfrage helfen fast die Hälfte der Eltern regelmäßig oder häufig bei den Hausübungen.", "kat": 0}, {"text": "Christiane Spiel meint, Eltern sollten nie bei Hausübungen helfen.", "kat": 1}, {"text": "Laut dem Bericht gibt es in Finnland keine Hausübungen.", "kat": 2}], "erklaerung": "Hascher will Hausübungen nicht abschaffen, sondern verbessern. Spiel hält Hilfe für berechtigt, wenn Kinder darum bitten – problematisch ist nur ständiges Kontrollieren. Finnland kommt im Bericht gar nicht vor."}, {"typ": "wahl", "frage": "Eine KI schreibt: „Laut einer Studie der Universität Wien aus dem Jahr 2021 machen 80 Prozent der Schüler ihre Hausübungen nicht selbst.“ Im Bericht steht davon nichts. Was tust du?", "optionen": ["Ich streiche die Angabe – oder ich suche eine echte, überprüfbare Quelle dafür.", "Ich übernehme die Angabe, weil eine genaue Zahl mit Jahr und Universität glaubwürdig klingt.", "Ich ändere die Zahl auf 70 Prozent und schreibe „ungefähr“ dazu, dann passt es sicher.", "Ich übernehme die Angabe und schreibe „laut KI“ dazu – damit ist die Quelle angegeben."], "richtig": 0, "erklaerung": "Genaue Zahlen und Studien ohne prüfbare Quelle sind ein Warnsignal. Eine Zahl abzuschwächen macht sie nicht wahrer, und „laut KI“ ist keine Quelle."}, {"typ": "zuordnen", "frage": "Eine andere KI hat weitere Aussagen aus dem Bericht wiedergegeben. Stimmen sie?", "kategorien": ["stimmt", "falsch wiedergegeben", "dazuerfunden"], "elemente": [{"text": "Der Bericht stellt den Sinn von Hausübungen infrage.", "kat": 0}, {"text": "Laut Christiane Spiel ist Hilfe in Ordnung, wenn das Kind selbst darum bittet.", "kat": 0}, {"text": "Laut Christiane Spiel sollten Eltern jede Hausübung täglich genau kontrollieren.", "kat": 1}, {"text": "Laut Tina Hascher sind Hausübungen grundsätzlich schädlich.", "kat": 1}, {"text": "Der Bericht empfiehlt, Hausübungen nur noch am Wochenende zu geben.", "kat": 2}, {"text": "Laut dem Bericht sitzen Schüler täglich drei Stunden an Hausübungen.", "kat": 2}], "erklaerung": "Spiel hält ständiges Kontrollieren gerade für problematisch, und Hascher will Hausübungen verbessern, nicht abschaffen. Wochenend-Hausübungen und drei Stunden täglich stehen nirgends im Bericht."}, {"typ": "wahl", "frage": "Die KI schreibt: „Fast die Hälfte der Eltern hilft regelmäßig oder häufig bei den Hausübungen.“ Im Bericht stehen 46 Prozent. Passt das?", "optionen": ["Ja – „fast die Hälfte“ gibt 46 Prozent sinngemäß richtig wieder.", "Nein – Zahlen muss man immer ganz genau aus dem Original abschreiben.", "Nein – 46 Prozent sind weniger als ein Drittel, das ist falsch wiedergegeben.", "Ja – die KI darf Zahlen frei runden, auch auf „die meisten Eltern“."], "richtig": 0, "erklaerung": "Sinngemäß wiedergeben ist erlaubt, solange die Aussage gleich bleibt. „Die meisten Eltern“ würde aus 46 Prozent aber eine Mehrheit machen – das wäre falsch."}, {"typ": "wahl", "frage": "Die KI ordnet eine Aussage von Tina Hascher Christiane Spiel zu. Die Aussage selbst steht im Bericht. Ist das ein Fehler?", "optionen": ["Ja – wer etwas gesagt hat, gehört zur Information; die Aussage ist falsch wiedergegeben.", "Nein – solange die Aussage selbst irgendwo im Bericht steht, ist alles in Ordnung.", "Nur dann, wenn beide Expertinnen an derselben Universität arbeiten und forschen.", "Nein – in einer Zusammenfassung nennt man ohnehin nie die Namen von Fachleuten."], "richtig": 0, "erklaerung": "Eine falsche Zuordnung verändert die Information: Die Leser glauben, die falsche Person habe das gesagt. Prüf deshalb auch, WER etwas gesagt hat."}, {"typ": "mehrfach", "frage": "Welche Angaben in einem KI-Text über einen Zeitungsbericht prüfst du besonders genau?", "optionen": ["Zahlen und Prozentangaben", "Namen von Personen und ihre Funktion", "wer welche Aussage gemacht hat", "Datum und Medium des Berichts", "wie lang die Sätze der KI sind", "ob die KI höflich formuliert"], "richtig": [0, 1, 2, 3], "erklaerung": "Bei Zahlen, Namen, Zuordnungen und Quellenangaben passieren KIs die meisten Fehler – und gerade diese Fehler fallen beim schnellen Lesen nicht auf."}]}, {"id": "fk3", "titel": "Faktencheck: KI-Interpretation", "info": "Eine KI hat Kafkas „Kleine Fabel“ interpretiert. Der Text ist kurz – prüf jede Aussage genau daran.", "beilage": {"titel": "Kleine Fabel", "info": "Franz Kafka, entstanden 1920, erst nach seinem Tod veröffentlicht (gemeinfrei, alte Rechtschreibung)", "absaetze": ["„Ach“, sagte die Maus, „die Welt wird enger mit jedem Tag. Zuerst war sie so breit, daß ich Angst hatte, ich lief weiter und war glücklich, daß ich endlich rechts und links in der Ferne Mauern sah, aber diese langen Mauern eilen so schnell aufeinander zu, daß ich schon im letzten Zimmer bin, und dort im Winkel steht die Falle, in die ich laufe.“ – „Du mußt nur die Laufrichtung ändern“, sagte die Katze und fraß sie."]}, "aufgaben": [{"typ": "zuordnen", "frage": "Prüf die Aussagen der KI am Text.", "kategorien": ["stimmt", "falsch wiedergegeben", "dazuerfunden"], "elemente": [{"text": "Die Maus hat zuerst Angst, weil die Welt so breit ist.", "kat": 0}, {"text": "Die Maus ist froh, als sie in der Ferne Mauern sieht.", "kat": 0}, {"text": "Am Ende frisst die Katze die Maus.", "kat": 0}, {"text": "Die Katze warnt die Maus ausdrücklich vor der Falle.", "kat": 1}, {"text": "Die Maus entkommt der Falle im letzten Moment.", "kat": 1}, {"text": "Die Geschichte spielt in einem alten Bauernhaus in Prag.", "kat": 2}, {"text": "Am Schluss steht die Moral: „Wer nicht hören will, muss fühlen.“", "kat": 2}], "erklaerung": "Die Katze rät nur, die Laufrichtung zu ändern – von der Falle spricht die Maus. Entkommen kann die Maus nicht. Ein Ort wird nicht genannt, und eine Moral fehlt ganz: Genau das ist das Besondere an diesem Text."}, {"typ": "wahl", "frage": "Die KI zitiert: Die Maus sagt „Die Welt ist ein Gefängnis“. Was tust du?", "optionen": ["Ich vergleiche mit dem Text: Das Zitat steht so nicht darin, also verwende ich es nicht.", "Ich übernehme das Zitat, weil es gut zur Deutung passt und die Aussage schön zuspitzt.", "Ich übernehme das Zitat ohne Anführungszeichen, dann ist es meine eigene Formulierung.", "Ich übernehme das Zitat und schreibe eine Zeilenangabe dazu, damit es belegt wirkt."], "richtig": 0, "erklaerung": "KIs erfinden manchmal Zitate, die gut klingen. Ein Zitat muss wörtlich im Text stehen – sonst ist es kein Beleg, sondern eine Fälschung. Eine erfundene Zeilenangabe macht es nur schlimmer."}, {"typ": "mehrfach", "frage": "Woran erkennst du, dass eine KI-Interpretation nicht zuverlässig ist?", "optionen": ["Zitate, die so nicht im Text stehen", "Zeilen- oder Versangaben, die nicht stimmen", "sichere Behauptungen über die Absicht des Autors ohne Beleg", "Angaben zur Entstehung ohne überprüfbare Quelle", "Sie verwendet Fachbegriffe wie „Pointe“ oder „Antithese“.", "Sie ist in ganzen, fehlerfreien Sätzen geschrieben."], "richtig": [0, 1, 2, 3], "erklaerung": "Fachbegriffe und fehlerfreie Sätze sagen nichts darüber, ob etwas stimmt. Prüf Zitate und Stellenangaben immer am Text."}, {"typ": "wahl", "frage": "Die KI schreibt: „Kafka hat in einem Brief erklärt, dass die Fabel eine Kritik an seinem Vater ist.“ Wie gehst du damit um?", "optionen": ["Das ist eine unbelegte Behauptung – ich übernehme sie nur mit verlässlicher Quelle und stütze meine Deutung auf den Text.", "Ich übernehme die Aussage, weil eine KI Kafkas Briefe kennt und sie daher sicher richtig wiedergibt.", "Ich übernehme die Aussage und schreibe „laut KI“ dazu – dann ist sie als Quelle ordentlich angegeben.", "Ich baue die Aussage als Hauptargument ein, weil Belege aus dem Text dann nicht mehr nötig sind."], "richtig": 0, "erklaerung": "Angaben über Briefe, Entstehung oder Absichten musst du in einer verlässlichen Quelle nachprüfen. Auch eine echte Quelle ersetzt nicht die Belege aus dem Text."}, {"typ": "wahl", "frage": "Die KI behauptet: „Am Ende läuft die Maus in die Falle.“ Stimmt das?", "optionen": ["Nicht genau: Die Maus sagt, dass sie auf die Falle zuläuft – gefressen wird sie von der Katze.", "Ja: Die Falle schnappt am Ende zu, die Katze kommt im Text erst danach dazu.", "Nein: Im Text kommt gar keine Falle vor, die hat die KI vollständig erfunden.", "Ja: Die Maus läuft in die Falle, und eine Katze kommt im ganzen Text nicht vor."], "richtig": 0, "erklaerung": "Die Falle steht im Text, aber die Maus erreicht sie nicht: Die Katze frisst sie vorher. Kleine Ungenauigkeiten können eine Deutung völlig verändern – hier geht es gerade um den Rat der Katze."}, {"typ": "mehrfach", "frage": "Die KI liefert dir eine fertige Interpretation. Was machst du, bevor du etwas daraus verwendest?", "optionen": ["jedes Zitat wörtlich am Text prüfen", "jede Deutung an einer Textstelle belegen", "Angaben zu Kafkas Leben in einer verlässlichen Quelle nachschlagen", "eigene Deutungen entwickeln, statt nur die der KI zu übernehmen", "sie unverändert abgeben, weil sie fehlerfrei formuliert ist", "Zitate behalten, auch wenn ich sie im Text nicht finde"], "richtig": [0, 1, 2, 3], "erklaerung": "Eine KI-Interpretation ist höchstens eine Anregung. Was du verwendest, musst du am Text belegen können – und deine eigene Deutung zählt."}]}]}, {"id": "ki_prompt", "gruppe": "Mit KI arbeiten", "titel": "Gute Aufträge an die KI", "symbol": "🧭", "kurz": "Prompt-Werkstatt: Wer genau fragt, bekommt brauchbare Antworten.", "sets": [{"id": "pr1", "titel": "Prompt-Werkstatt", "info": "Ein „Prompt“ ist der Auftrag, den du einer KI gibst. Je genauer er ist, desto brauchbarer wird die Antwort.", "aufgaben": [{"typ": "wahl", "frage": "Welcher Auftrag bringt am ehesten einen brauchbaren Leserbrief?", "optionen": ["Du bist Schülerin einer österreichischen HAK. Schreib einen Leserbrief (270–330 Wörter) an die Redaktion zum Bericht „Der Zweifel am Sinn von Hausübungen“. Nimm Stellung für Hausübungen, mit zwei Argumenten nach dem 3-B-Schema und einem Appell. Verwende nur Inhalte aus dem Bericht, den ich unten einfüge.", "Du bist Schülerin einer österreichischen HAK. Schreib einen Leserbrief (270–330 Wörter) an die Redaktion zum Thema Hausübungen. Nimm Stellung für Hausübungen, mit zwei Argumenten und einem Appell. Erfinde ruhig passende Studien und genaue Prozentzahlen, damit der Brief überzeugender und seriöser klingt.", "Ich heiße Lisa Gruber, wohne in Graz in der Hauptstraße 12 und gehe in die 2. Klasse. Schreib mir zum Bericht „Der Zweifel am Sinn von Hausübungen“ einen Leserbrief mit 270–330 Wörtern, der für Hausübungen eintritt und mit einem Appell endet. Ich gebe ihn dann unverändert als meine eigene Hausübung ab.", "Schreib bitte einen richtig guten, überzeugenden und interessanten Leserbrief über Hausübungen, der meiner Deutschlehrerin gefällt und für den ich eine gute Note bekomme. Er soll nicht zu kurz und nicht zu lang sein, schön formuliert, so wie Erwachsene schreiben, und ruhig ein paar Fremdwörter enthalten."], "richtig": 0, "erklaerung": "Der brauchbare Auftrag nennt Rolle, Textsorte, Umfang, Adressat, Bezugstext, Position, Aufbau und eine Einschränkung („nur Inhalte aus dem Bericht“). Die anderen fordern zum Erfinden auf, geben persönliche Daten preis und planen, den KI-Text als eigenen abzugeben, oder bleiben trotz vieler Wörter vage."}, {"typ": "mehrfach", "frage": "Was gehört in einen guten Auftrag an die KI?", "optionen": ["die Textsorte", "das Thema bzw. der Bezugstext", "Situation und Adressat", "der Umfang (Wortanzahl)", "die Anforderungen, z. B. Arbeitsaufträge und Aufbau", "dein voller Name und deine Adresse", "dein Passwort für die Lernplattform"], "richtig": [0, 1, 2, 3, 4], "erklaerung": "Persönliche Daten und Passwörter haben in einem Auftrag nichts verloren."}, {"typ": "zuordnen", "frage": "Welche Aufgabe hat der Teil im Auftrag?", "kategorien": ["Rolle", "Textsorte und Umfang", "Inhalt", "Einschränkung"], "elemente": [{"text": "Du bist Schulsprecherin einer HAK.", "kat": 0}, {"text": "Schreib eine Meinungsrede mit 400–450 Wörtern.", "kat": 1}, {"text": "Appelliere an den Schulgemeinschaftsausschuss, fair einzukaufen.", "kat": 2}, {"text": "Erfinde keine Zahlen und keine Zitate.", "kat": 3}, {"text": "Verwende österreichisches Deutsch.", "kat": 3}], "erklaerung": "Rolle, Textsorte, Umfang, Inhalt und Einschränkungen – mit diesen Bausteinen wird ein Auftrag klar."}, {"typ": "verbessern", "frage": "Mit diesem Auftrag soll eine KI einen Kommentar zum Bericht „Jetzt kommt die Obergrenze für Touristen“ schreiben.", "beispiel": "Schreib was über Tourismus.", "maengel": ["Die Textsorte fehlt.", "Es fehlt der Bezug zum Bericht und zur Aufgabe.", "Umfang und Anforderungen fehlen.", "Der Auftrag ist zu höflich."], "richtig": [0, 1, 2], "erklaerung": "Ohne Textsorte, Bezugstext und Anforderungen rät die KI – und schreibt irgendetwas Allgemeines.", "tipps": ["Textsorte und Umfang genannt", "Bezug zum Bericht und zu den Arbeitsaufträgen", "mindestens eine Einschränkung (z. B. nichts erfinden)"], "muster": "Schreib einen Kommentar (270–330 Wörter) mit dem Titel „Grenzen des Tourismus“ für eine Jugendzeitschrift. Beziehe dich auf den Bericht unten: Beschreib die Problematik, nenne Gründe und nimm zu den Maßnahmen Stellung. Kein Ich, keine erfundenen Fakten, österreichisches Deutsch."}, {"typ": "wahl", "frage": "Die Antwort der KI passt noch nicht: Der Text ist zu lang und hat keinen Appell. Was machst du?", "optionen": ["Ich gebe der KI eine genaue Nachbesserung: „Kürze auf 300 Wörter und ergänze am Schluss einen Appell an die Leserinnen und Leser.“", "Ich schicke genau denselben Auftrag noch einmal ab und hoffe, dass die nächste Antwort zufällig kürzer ausfällt und einen Appell enthält.", "Ich schreibe der KI „Das passt so nicht, mach es bitte besser“ und übernehme dann die nächste Antwort, ohne sie noch einmal zu prüfen.", "Ich lösche einfach die letzten zwei Absätze des KI-Textes – dann ist er kurz genug, und einen Appell braucht ein Leserbrief nicht unbedingt."], "richtig": 0, "erklaerung": "Mit einer KI arbeitet man in Schritten: prüfen – genau nachbessern lassen – wieder prüfen. Derselbe Auftrag oder ein vages „mach es besser“ bringt selten das Gewünschte, und Kürzen durch Löschen nimmt dem Text den Schluss – der Appell gehört in den Leserbrief."}, {"typ": "wahl", "frage": "Warum fügst du den Originaltext in den Auftrag ein?", "optionen": ["Damit sich die KI auf die richtigen Inhalte stützt – sonst erfindet sie leichter etwas.", "Damit die KI ganze Sätze aus dem Text übernehmen kann – so wird der Leserbrief schneller fertig.", "Das ist eigentlich unnötig – eine KI kennt jeden Zeitungsartikel ohnehin genau auswendig.", "Damit der Auftrag länger wird – längere Aufträge bringen automatisch bessere Antworten."], "richtig": 0, "erklaerung": "Eine KI „kennt“ einen bestimmten Zeitungsartikel meistens nicht genau. Ohne den Text rät sie. Der Text ist Grundlage, keine Vorlage zum Abschreiben – und Länge allein macht einen Auftrag nicht besser."}]}, {"id": "pr2", "titel": "Schritt für Schritt mit der KI", "info": "Mit einer KI arbeitet man im Gespräch: fragen, prüfen, nachfragen. Die Denkarbeit bleibt bei dir.", "aufgaben": [{"typ": "reihenfolge", "frage": "Bring die Arbeitsschritte in eine sinnvolle Reihenfolge.", "elemente": ["die Aufgabe selbst genau lesen", "eigene Ideen notieren, bevor ich die KI frage", "einen genauen Auftrag an die KI schreiben", "die Antwort am Text und mit der Checkliste prüfen", "gezielt nachfragen oder nachbessern lassen", "den eigenen Text selbst schreiben und überarbeiten"], "erklaerung": "Erst selbst denken, dann fragen. So erkennst du, ob die KI etwas Brauchbares liefert – und der Text bleibt deiner."}, {"typ": "zuordnen", "frage": "Ist die Nachfrage an die KI hilfreich?", "kategorien": ["hilfreiche Nachfrage", "wenig hilfreich"], "elemente": [{"text": "Erklär mir an einem Beispiel, was eine Zäsur ist.", "kat": 0}, {"text": "Welche Textstelle belegt deine Aussage? Nenne den Vers.", "kat": 0}, {"text": "Nenne zwei Gegenargumente zu meiner These, aber formuliere sie nicht aus.", "kat": 0}, {"text": "Mach weiter.", "kat": 1}, {"text": "Schreib alles nochmal, aber besser.", "kat": 1}, {"text": "Stimmt das? Antworte nur mit Ja oder Nein.", "kat": 1}], "erklaerung": "Hilfreiche Nachfragen sind genau und verlangen Erklärungen oder Belege. „Ja oder Nein“ verhindert, dass du die Begründung prüfen kannst."}, {"typ": "wahl", "frage": "Die KI erklärt den Begriff „Interpretationshypothese“ viel zu kompliziert. Welche Nachfrage hilft dir am meisten?", "optionen": ["Erklär mir „Interpretationshypothese“ in zwei einfachen Sätzen und gib ein Beispiel zur „Kleinen Fabel“.", "Das war mir jetzt zu kompliziert und viel zu lang. Kannst du mir vielleicht noch etwas anderes erklären?", "Schreib mir einfach gleich die ganze Einleitung mit einer passenden Interpretationshypothese für meinen Text.", "Erklär es mir bitte noch einmal ganz genau, aber diesmal mit noch mehr Fachbegriffen und Fremdwörtern."], "richtig": 0, "erklaerung": "Sag der KI genau, was du brauchst: einfacher, kürzer, mit Beispiel. Die Einleitung schreibst du danach selbst."}, {"typ": "verbessern", "frage": "Mit diesem Auftrag willst du dich auf eine Gedichtinterpretation vorbereiten.", "beispiel": "Interpretier das Gedicht.", "maengel": ["Die KI würde die ganze Interpretation schreiben – du lernst dabei nichts.", "Titel, Autor und Text fehlen – die KI weiß nicht, welches Gedicht gemeint ist.", "Es fehlt eine Einschränkung, z. B. keine erfundenen Zitate.", "Der Auftrag ist zu kurz, weil gute Aufträge mindestens 100 Wörter haben."], "richtig": [0, 1, 2], "erklaerung": "Ein guter Auftrag ist genau – nicht unbedingt lang. Lass dir Fragen stellen statt Antworten geben, dann denkst du selbst.", "tipps": ["Titel, Autor, Text", "„Schreib keine Interpretation für mich“", "Fragen statt fertiger Antworten", "keine erfundenen Zitate"], "muster": "Ich schreibe eine Gedichtinterpretation zu „Es ist alles eitel“ von Andreas Gryphius (Text unten). Schreib keine Interpretation für mich. Stell mir stattdessen fünf Fragen, die mir helfen, Form, Stilmittel und Aussage selbst zu untersuchen. Erfinde keine Zitate."}, {"typ": "wahl", "frage": "Du willst für eine Erörterung üben. Welcher Auftrag macht die KI zur Trainingspartnerin?", "optionen": ["Stell mir nacheinander drei kritische Fragen zu meinem Argument und warte jeweils auf meine Antwort.", "Schreib mir drei fertige Argumente mit Begründung und Beispiel, die ich dann übernehmen kann.", "Lies mein Argument und sag mir nur, ob es gut ist – eine Begründung brauche ich dafür nicht.", "Erfinde zu meinem Argument eine passende Studie mit Zahlen, damit es überzeugender wirkt."], "richtig": 0, "erklaerung": "Wenn die KI fragt und du antwortest, trainierst du dein eigenes Argumentieren – so wie im Gegenargumente-Sparring der KI-Werkstatt."}, {"typ": "wahl", "frage": "Die KI gibt dir eine Liste mit zehn Argumenten für deine Erörterung. Was ist der beste nächste Schritt?", "optionen": ["Ich wähle die zwei stärksten aus, prüfe sie und formuliere sie selbst mit eigenem Beispiel aus.", "Ich übernehme alle zehn Argumente, denn mehr Argumente machen jede Erörterung besser.", "Ich lasse die KI die zehn Argumente gleich zu einem fertigen, langen Text ausformulieren.", "Ich nehme die ersten zwei Argumente, weil die KI das Wichtigste immer zuerst nennt."], "richtig": 0, "erklaerung": "Auswählen, prüfen, selbst ausformulieren – das ist deine Arbeit. Die Reihenfolge einer KI-Liste sagt nichts darüber, welches Argument am stärksten ist."}]}]}, {"id": "ki_feedback", "gruppe": "Mit KI arbeiten", "titel": "KI als Feedback-Hilfe", "symbol": "💡", "kurz": "Rückmeldung holen und selbst überarbeiten – statt schreiben lassen.", "sets": [{"id": "fb1", "titel": "Feedback statt Ghostwriting", "aufgaben": [{"typ": "wahl", "frage": "Welcher Auftrag holt Feedback, ohne dass die KI deinen Text umschreibt?", "optionen": ["Hier ist meine Einleitung für einen Leserbrief. Schreib sie NICHT um. Nenne mir drei konkrete Schwächen und gib mir zu jeder einen Tipp.", "Hier ist meine Einleitung für einen Leserbrief. Verbessere bitte alle Schwächen und gib mir die fertige, überarbeitete Fassung zum Abgeben.", "Hier ist meine Einleitung für einen Leserbrief. Nenne mir drei konkrete Schwächen und schreib die Einleitung dann gleich verbessert neu.", "Hier ist meine Einleitung für einen Leserbrief. Formulier sie bitte so um, wie eine erfahrene Deutschlehrerin sie schreiben würde."], "richtig": 0, "erklaerung": "So lernst du selbst: Du bekommst konkrete Hinweise und überarbeitest eigenständig. Sobald die KI die Einleitung neu schreibt – auch nach einer Liste von Schwächen –, überarbeitest nicht mehr du."}, {"typ": "zuordnen", "frage": "Hilft das beim Lernen – oder ersetzt es das eigene Lernen?", "kategorien": ["hilft beim Lernen", "ersetzt das eigene Lernen"], "elemente": [{"text": "Die KI erklärt mir, warum vor „dass“ ein Beistrich steht.", "kat": 0}, {"text": "Die KI nennt mir drei Ideen für Argumente, ich formuliere sie selbst aus.", "kat": 0}, {"text": "Ich lasse mir Feedback geben und überarbeite meinen Text selbst.", "kat": 0}, {"text": "Die KI schreibt meinen ganzen Text, ich gebe ihn als meinen ab.", "kat": 1}, {"text": "Ich kopiere die korrigierte Version, ohne mir die Fehler anzusehen.", "kat": 1}], "erklaerung": "Die KI als Trainerin nutzen, nicht als Ghostwriterin – nur so wirst du selbst besser."}, {"typ": "wahl", "frage": "Die KI meldet bei deinem Satz „Er meint das er kommt.“ nur: „Vor ‚das‘ fehlt ein Beistrich.“ Was machst du?", "optionen": ["Ich prüfe selbst nach: Es fehlt der Beistrich – und „das“ muss „dass“ heißen. Richtig: „Er meint, dass er kommt.“", "Ich setze den Beistrich, wie die KI es vorschlägt: „Er meint, das er kommt.“ Damit ist der Satz richtig.", "Ich prüfe selbst nach: „das“ muss „dass“ heißen, ein Beistrich ist aber nicht nötig: „Er meint dass er kommt.“", "Ich ändere nichts, weil sich KIs bei Beistrichen oft irren: „Er meint das er kommt.“ bleibt so stehen."], "richtig": 0, "erklaerung": "KI-Feedback kann unvollständig sein. Hier hat sie die das/dass-Verwechslung übersehen: Vor dem dass-Satz steht ein Beistrich, und die Konjunktion schreibt man mit ss. Deshalb: Hinweise prüfen und Regeln selbst anwenden."}, {"typ": "verbessern", "frage": "Mit diesem Auftrag willst du Feedback zu deiner Erörterung.", "beispiel": "Mach meinen Text besser.", "maengel": ["Die KI würde alles umschreiben – du lernst nichts dabei.", "Es ist unklar, worauf die KI achten soll.", "Textsorte und Aufgabe fehlen.", "Es stehen zu viele Fachbegriffe darin."], "richtig": [0, 1, 2], "erklaerung": "Ein guter Feedback-Auftrag sagt: nicht umschreiben, Textsorte und Aufgabe, und genau, worauf geachtet werden soll.", "tipps": ["„nicht umschreiben“", "Textsorte und Aufgabe genannt", "konkrete Fragen (z. B. zu Argumenten, Überleitungen, Beistrichen)"], "muster": "Hier ist meine Erörterung zum Thema Hausübungen (Aufgabe unten). Schreib nichts um. Sag mir: 1) Haben alle Argumente Begründung und Beispiel? 2) Wo fehlen Überleitungen? 3) Welche Rechtschreib- oder Beistrichfehler kommen öfter vor? Erklär jeweils kurz die Regel."}, {"typ": "wahl", "frage": "Die KI lobt deinen Text: „Sehr gut, keine Fehler!“ Du hast aber Zweifel. Was machst du?", "optionen": ["Ich verlasse mich nicht blind darauf und prüfe selbst, z. B. mit der Checkliste – auch KIs übersehen Fehler.", "Ich gebe den Text sofort ab, weil eine KI Rechtschreibung und Beistriche fehlerlos prüfen kann.", "Ich frage die KI so lange immer wieder, bis sie doch noch irgendeinen Fehler in meinem Text findet.", "Ich lasse die KI den Text zur Sicherheit ganz neu schreiben und gebe dann einfach diese Fassung ab."], "richtig": 0, "erklaerung": "Lob von der KI ist keine Garantie. Die letzte Kontrolle machst du selbst – mit Regeln und Checkliste, nicht durch Nachbohren oder Neuschreibenlassen."}, {"typ": "zuordnen", "frage": "Holst du damit Feedback – oder lässt du die KI für dich schreiben?", "kategorien": ["Feedback – ich überarbeite selbst", "die KI schreibt für mich"], "elemente": [{"text": "Markiere Sätze, die zu lang sind, aber kürze sie nicht.", "kat": 0}, {"text": "Sag mir, ob jedes meiner Argumente ein Beispiel hat.", "kat": 0}, {"text": "Welche Beistrichfehler mache ich öfter? Erklär die Regel.", "kat": 0}, {"text": "Schreib meinen Schluss neu, damit er besser klingt.", "kat": 1}, {"text": "Formulier meine Einleitung professioneller.", "kat": 1}, {"text": "Ersetz alle Wiederholungen durch bessere Wörter.", "kat": 1}], "erklaerung": "Bei einem Feedback-Auftrag zeigt dir die KI, WO und WARUM etwas nicht passt. Ändern tust du selbst – sonst lernst du nichts dabei."}]}]}, {"id": "ki_typisch", "gruppe": "Mit KI arbeiten", "titel": "Typisch KI erkennen", "symbol": "🕵️", "kurz": "Floskeln, vage Belege – und deutsches statt österreichisches Deutsch.", "sets": [{"id": "ty1", "titel": "Floskeln und vage Belege", "aufgaben": [{"typ": "zuordnen", "frage": "Ordne die Sätze ein.", "kategorien": ["Floskel", "Beleg ohne prüfbare Quelle", "konkret und überprüfbar"], "elemente": [{"text": "In der heutigen schnelllebigen Zeit ist das wichtiger denn je.", "kat": 0}, {"text": "Es handelt sich um ein Thema, das uns alle betrifft.", "kat": 0}, {"text": "Laut einer aktuellen Studie sind 87 Prozent aller Jugendlichen gestresst.", "kat": 1}, {"text": "Experten sind sich einig, dass Hausübungen wichtig sind.", "kat": 1}, {"text": "Laut dem Bericht von Julia Neuhauser helfen 46 Prozent der Eltern regelmäßig oder häufig bei Hausübungen.", "kat": 2}, {"text": "In meiner Klasse schreiben bei Rechnungswesen-Hausübungen viele ab, weil sie nicht weiterkommen.", "kat": 2}], "erklaerung": "Floskeln klingen gut, sagen aber nichts. „Eine Studie“ oder „Experten“ ohne Namen lassen sich nicht prüfen. Konkret sind genaue Quellen und eigene Beobachtungen."}, {"typ": "mehrfach", "frage": "Woran erkennst du oft einen KI-Text?", "optionen": ["glatte, allgemeine Formulierungen ohne eigene Erfahrungen", "Floskeln wie „Zusammenfassend lässt sich sagen …“", "Zahlen oder Studien ohne genaue Quelle", "deutsches statt österreichisches Deutsch (Januar, Abitur …)", "viele Rechtschreibfehler", "persönliche, sehr konkrete Erlebnisse"], "richtig": [0, 1, 2, 3], "erklaerung": "KI-Texte sind meist fehlerfrei – aber oft allgemein, floskelhaft und manchmal falsch. Dein Vorteil: eigene Erfahrungen und genaue Belege."}, {"typ": "verbessern", "frage": "Diesen Satz hat eine KI für eine Erörterung geschrieben.", "beispiel": "In der heutigen Zeit ist Bildung wichtiger denn je, und Experten sind sich einig, dass Hausübungen eine zentrale Rolle spielen.", "maengel": ["Floskel („in der heutigen Zeit … wichtiger denn je“)", "vage Autorität ohne Quelle („Experten sind sich einig“)", "keine konkrete Begründung und kein Beispiel", "Präteritum statt Präsens"], "richtig": [0, 1, 2], "erklaerung": "Ersetz Floskeln durch eine echte Begründung und ein konkretes Beispiel.", "tipps": ["keine Floskel", "echte Begründung", "konkretes Beispiel oder prüfbarer Beleg"], "muster": "Hausübungen sind sinnvoll, weil man beim selbstständigen Üben merkt, was man noch nicht verstanden hat – etwa bei einer Buchungsaufgabe in Rechnungswesen, die im Unterricht noch einfach wirkte."}, {"typ": "wahl", "frage": "Die KI beginnt deine Erörterung so: „In der heutigen schnelllebigen Zeit spielt Bildung eine immer größere Rolle.“ Welcher Einstieg ist besser?", "optionen": ["„Zwei Stunden Hausübung an einem Abend – ist das sinnvolles Üben oder nur Beschäftigung?“", "„Bildung ist in der heutigen Zeit wichtiger denn je und geht uns daher alle etwas an.“",

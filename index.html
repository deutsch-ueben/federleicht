 Katzen eben Mäuse fressen und das jeder schon vorher weiß."], "richtig": 0, "erklaerung": "Der Kontrast zwischen der langen Klage der Maus und dem kurzen, nüchternen Schluss ist die Pointe. Er lässt die Leser verstört zurück – und zwingt sie, selbst nach der Bedeutung zu fragen."}, {"typ": "mehrfach", "frage": "Welche Deutungen lassen sich am Text belegen?", "optionen": ["Das Leben wirkt am Anfang weit und wird mit der Zeit immer enger.", "Wer sich nur nach Sicherheit sehnt, kann gerade dadurch in eine Falle geraten.", "Ratschläge von Mächtigen können scheinheilig sein und eigenen Zwecken dienen.", "Der Text will vor allem zeigen, dass Katzen gefährliche Haustiere sind.", "Hätte die Maus besser aufgepasst, wäre alles gut ausgegangen."], "richtig": [0, 1, 2], "erklaerung": "Ein offener Text erlaubt mehrere Deutungen – aber jede muss sich auf den Text stützen: „enger mit jedem Tag“, die Freude über die Mauern, der Rat der Katze. Wörtlich genommen („Katzen sind gefährlich“) verfehlt man den Sinn, und einen Ausweg bietet der Text gerade nicht."}, {"typ": "verbessern", "frage": "So endet eine Interpretation der „Kleinen Fabel“.", "beispiel": "Meiner Meinung nach ist die Geschichte zu unrealistisch, weil Mäuse nicht sprechen können. Kafka wollte damit sicher zeigen, dass er Angst vor Katzen hatte.", "maengel": ["Geschmacksurteil statt begründeter Wertung", "Spekulation über den Autor ohne Beleg", "Die Gattung wird verkannt: In Fabeln sprechen Tiere.", "Die Wirkung auf die Leserinnen und Leser fehlt.", "Der Schluss steht im Präsens."], "richtig": [0, 1, 2, 3], "erklaerung": "Im Schluss stehen eine kurze Bündelung, die Wirkung des Textes und eine begründete Meinung. Das Präsens ist richtig.", "tipps": ["Wirkung auf die Leser", "begründete Meinung statt „zu unrealistisch“", "keine Vermutung über Kafkas Gefühle", "Bezug zur Gegenwart"], "muster": "Die „Kleine Fabel“ wirkt auf den ersten Blick wie eine einfache Tiergeschichte, hinterlässt aber ein beklemmendes Gefühl: Weil keine Moral folgt, müssen die Leserinnen und Leser selbst nach einem Ausweg suchen – und finden im Text keinen. Gerade deshalb halte ich den Text für aktuell, denn die Frage, ob uns scheinbare Sicherheit in eine Falle führt, stellt sich auch heute, etwa wenn man sich aus Angst vor Neuem nur noch im Gewohnten bewegt."}]}, {"id": "ti3", "titel": "Gedicht: Es ist alles eitel", "info": "Andreas Gryphius ist 1664 gestorben, sein Gedicht ist frei verwendbar und hier vollständig abgedruckt. Worterklärungen: eitel = vergänglich, nichtig · itzund, itzt = jetzt · Bein = Knochen · Erz = Metall · schlecht = schlicht · kein einig Mensch = kein einziger Mensch.", "beilage": {"titel": "Es ist alles eitel", "info": "Sonett von Andreas Gryphius (1616–1664), erste Fassung 1637, während des Dreißigjährigen Krieges; Schreibung behutsam angepasst", "verse": true, "absaetze": ["Du siehst, wohin du siehst, nur Eitelkeit auf Erden.\nWas dieser heute baut, reißt jener morgen ein;\nWo itzund Städte stehn, wird eine Wiese sein,\nAuf der ein Schäferskind wird spielen mit den Herden.", "Was itzund prächtig blüht, soll bald zertreten werden;\nWas itzt so pocht und trotzt, ist morgen Asch und Bein;\nNichts ist, das ewig sei, kein Erz, kein Marmorstein.\nItzt lacht das Glück uns an, bald donnern die Beschwerden.", "Der hohen Taten Ruhm muss wie ein Traum vergehn.\nSoll denn das Spiel der Zeit, der leichte Mensch, bestehn?\nAch, was ist alles dies, was wir für köstlich achten,", "Als schlechte Nichtigkeit, als Schatten, Staub und Wind,\nAls eine Wiesenblum, die man nicht wiederfind't!\nNoch will, was ewig ist, kein einig Mensch betrachten!"]}, "aufgaben": [{"typ": "wahl", "frage": "Was bedeutet „eitel“ im Titel des Gedichts?", "optionen": ["vergänglich, nichtig, ohne bleibenden Wert", "eingebildet und selbstverliebt, aufs Aussehen bedacht", "fröhlich, ausgelassen und voller Lebenslust", "streng und ernst, voller Pflichtbewusstsein"], "richtig": 0, "erklaerung": "Die heutige Bedeutung („eingebildet“) führt in die Irre. Im Barock heißt „eitel“ leer, nichtig, vergänglich – passend zum Vanitas-Motiv: Alles Irdische vergeht."}, {"typ": "luecke", "frage": "Bestimme das Reimschema der vier Strophen (Kleinbuchstaben, z. B. abab).", "satz": "1. Quartett: {{}} · 2. Quartett: {{}} · 1. Terzett: {{}} · 2. Terzett: {{}}", "loesungen": [["abba"], ["abba"], ["ccd"], ["eed"]], "erklaerung": "Erden – ein – sein – Herden: umarmender Reim (abba), ebenso im zweiten Quartett mit denselben Reimklängen. In den Terzetten reimen sich vergehn/bestehn (cc) und Wind/wiederfind't (ee); achten und betrachten (d) verbinden die beiden Terzette."}, {"typ": "wahl", "frage": "Wie erklärst du das Versmaß Alexandriner richtig?", "optionen": ["ein sechshebiger Jambus mit einer deutlichen Pause (Zäsur) in der Mitte des Verses", "ein fünfhebiger Trochäus ohne Pause, wie er vor allem in Balladen vorkommt", "ein Vers mit vier Hebungen, bei dem sich zwei Zeilen hintereinander reimen", "ein freier Vers ohne festes Metrum, wie er im Barock fast immer üblich war"], "richtig": 0, "erklaerung": "Ein häufiger Fehler: „zuerst eine Senkung, dann eine Betonung“ – das beschreibt nur den Jambus. Zum Alexandriner gehören sechs Hebungen und die Zäsur: „Was dieser heute baut, | reißt jener morgen ein“."}, {"typ": "zuordnen", "frage": "Welches Stilmittel steckt in der Stelle?", "kategorien": ["Antithese", "Vergleich", "rhetorische Frage", "Personifikation"], "elemente": [{"text": "„Was dieser heute baut, reißt jener morgen ein“", "kat": 0}, {"text": "„Wo itzund Städte stehn, wird eine Wiese sein“", "kat": 0}, {"text": "„Der hohen Taten Ruhm muss wie ein Traum vergehn.“", "kat": 1}, {"text": "„Als eine Wiesenblum, die man nicht wiederfind't“", "kat": 1}, {"text": "„Soll denn das Spiel der Zeit, der leichte Mensch, bestehn?“", "kat": 2}, {"text": "„Itzt lacht das Glück uns an“", "kat": 3}], "erklaerung": "Die Antithesen (heute – morgen, Städte – Wiese) tragen das ganze Gedicht: Auf jedes Aufbauen folgt Zerstörung. Die Vergleiche zeigen, wie flüchtig Ruhm und Leben sind, und die rhetorische Frage erwartet die Antwort „Nein“."}, {"typ": "wahl", "frage": "Welche Deutung des Gedichts ist am besten am Text belegt?", "optionen": ["Alles Irdische – Bauwerke, Ruhm, Glück – vergeht; am Ende lenkt das Gedicht den Blick auf das, was ewig ist.", "Das Gedicht lobt vor allem die Schönheit der Natur und lädt dazu ein, das Leben auf dem Land zu genießen.", "Das Gedicht warnt vor Umweltzerstörung und fordert, dass die Menschen Wiesen und Wälder besser schützen.", "Es ist ein Liebesgedicht, in dem das lyrische Ich um eine verlorene Liebe trauert, die nicht mehr zurückkehrt."], "richtig": 0, "erklaerung": "Vanitas – „alles ist eitel“: Der Titel, die Antithesen und die Aufzählung „Schatten, Staub und Wind“ zeigen die Vergänglichkeit. Die Wiese ist kein Naturlob, sondern das Bild für zerstörte Städte. Heutige Themen wie Umweltschutz in das Barockgedicht hineinzulesen, ist eine Fehldeutung."}, {"typ": "wahl", "frage": "Welcher Satz setzt Hintergrundwissen sinnvoll ein?", "optionen": ["Im Dreißigjährigen Krieg wurden ganze Städte zerstört – das Bild der Wiese anstelle der Städte (V. 3) ist daher keine Übertreibung.", "Andreas Gryphius wurde 1616 in Glogau geboren, studierte später in Leiden und reiste als junger Mann durch mehrere Länder Europas.", "Weil im Barock alle Menschen sehr religiös waren, muss man das Gedicht eigentlich gar nicht mehr genauer am Text untersuchen.", "Das Gedicht ist typisch für die Romantik, weil es die Natur beschreibt und die Sehnsucht nach etwas Ewigem ausdrückt."], "richtig": 0, "erklaerung": "Kontextwissen gehört in die Interpretation, wenn es eine Textstelle erklärt. Ein Lebenslauf ohne Bezug zum Gedicht bringt nichts, Hintergrundwissen ersetzt nicht die Arbeit am Text – und das Gedicht stammt aus dem Barock, nicht aus der Romantik."}, {"typ": "verbessern", "frage": "Dieser Absatz stammt aus einer Gedichtinterpretation.", "beispiel": "Das Gedicht hat vier Strophen. Es ist im Alexandriner geschrieben, das heißt, zuerst kommt eine Senkung und dann eine Betonung. Die ersten zwei Strophen reimen sich umarmend. Es gibt auch Antithesen und eine rhetorische Frage.", "maengel": ["Das Versmaß ist unvollständig erklärt (sechs Hebungen und Zäsur fehlen).", "Die Fachbegriffe Sonett, Quartett und Terzett fehlen.", "Die Stilmittel werden nur aufgezählt – ohne Beleg und ohne Deutung.", "Der Absatz steht im Präsens statt im Präteritum."], "richtig": [0, 1, 2], "erklaerung": "Eine Aufzählung von Befunden ist noch keine Interpretation. Jeder Befund braucht einen Beleg und eine Deutung. Das Präsens ist richtig.", "tipps": ["Sonett, Quartette, Terzette", "Alexandriner richtig erklärt", "mindestens ein Zitat mit Versangabe", "Deutung: Was bewirkt die Form?"], "muster": "Das Gedicht ist ein Sonett aus zwei Quartetten und zwei Terzetten. Es ist im Alexandriner verfasst, einem sechshebigen Jambus mit einer Zäsur in der Mitte. Diese Pause teilt viele Verse in zwei Hälften, die einander gegenüberstehen: „Was dieser heute baut, reißt jener morgen ein“ (V. 2). So unterstreicht schon die Form die zentrale Aussage, dass auf jedes Aufbauen ein Zerstören folgt."}]}, {"id": "ti4", "titel": "Typische Fehler vermeiden", "info": "Hier geht es um die Kurzgeschichte „Spaghetti für zwei“ von Federica de Cesco. Du kennst sie aus dem Unterricht.", "aufgaben": [{"typ": "zuordnen", "frage": "Wohin gehört der Satz – Einleitung, Hauptteil oder Schluss?", "kategorien": ["Einleitung", "Hauptteil", "Schluss"], "elemente": [{"text": "Die Kurzgeschichte „Spaghetti für zwei“ von Federica de Cesco beschäftigt sich mit dem Thema Vorurteile.", "kat": 0}, {"text": "Auf den ersten Blick geht es um ein Missverständnis, bei genauerem Lesen aber um mehr.", "kat": 0}, {"text": "Die Geschichte wird aus der Sicht von Heinz erzählt, wodurch man seine Vorurteile unmittelbar miterlebt.", "kat": 1}, {"text": "Die vielen Gedanken von Heinz verzögern den Höhepunkt und steigern die Spannung.", "kat": 1}, {"text": "Die Gesamtaussage, dass man Menschen nicht nach dem Äußeren beurteilen soll, ist auch heute aktuell.", "kat": 2}, {"text": "Mich überzeugt die Geschichte, weil sie zeigt, wie man ein Vorurteil mit Humor überwinden kann.", "kat": 2}], "erklaerung": "Die Einleitung nennt Eckdaten und Thema, der Hauptteil analysiert und deutet mit Belegen, der Schluss bündelt, beschreibt die Wirkung und enthält die begründete Meinung."}, {"typ": "wahl", "frage": "Was ist eine Interpretationshypothese?", "optionen": ["eine erste, begründete Vermutung über die Bedeutung des Textes, die im Hauptteil am Text überprüft wird", "eine endgültige Behauptung über den Text, die man im Hauptteil auf keinen Fall mehr ändern darf", "eine Vermutung darüber, was der Autor beim Schreiben gefühlt hat, die man nicht belegen muss", "eine kurze Zusammenfassung der Handlung, die am Anfang der Einleitung stehen soll"], "richtig": 0, "erklaerung": "Die Hypothese ist ein Arbeitsziel: Du stellst sie am Anfang auf und prüfst sie im Hauptteil. Sie darf sich dabei bestätigen, verändern oder als falsch erweisen."}, {"typ": "verbessern", "frage": "So beginnt eine Interpretation der Kurzgeschichte.", "beispiel": "In der Geschichte „Spaghetti für zwei“ geht es um Heinz, der sich in einem Selbstbedienungsrestaurant eine Suppe holt. Als er zurückkommt, sitzt ein Mann an seinem Platz und isst die Suppe. Heinz ärgert sich sehr.", "maengel": ["Statt des Themas wird schon die Handlung nacherzählt.", "Die Textsorte (Kurzgeschichte) fehlt.", "Die Autorin fehlt.", "Die Einleitung ist im Präsens geschrieben."], "richtig": [0, 1, 2], "erklaerung": "Die Einleitung nennt Textsorte, Titel, Autorin und das Thema – die Handlung kommt erst im Hauptteil. Das Präsens ist richtig.", "tipps": ["Textsorte, Titel, Autorin", "Thema statt Handlung", "eventuell: Oberfläche und tiefere Bedeutung"], "muster": "Die Kurzgeschichte „Spaghetti für zwei“ von Federica de Cesco scheint auf den ersten Blick von einem peinlichen Missverständnis in einem Restaurant zu handeln. Bei genauerem Lesen zeigt sich aber, dass es um Vorurteile geht – und darum, wie man sie überwinden kann."}, {"typ": "verbessern", "frage": "Dieser Absatz steht im Hauptteil einer Interpretation.", "beispiel": "Die Geschichte ist personal erzählt. Es gibt viele Gedanken von Heinz. Die Sätze sind kurz.", "maengel": ["Es bleibt bei Befunden – was sie bewirken, wird nicht gedeutet.", "Belege aus dem Text fehlen.", "Die Befunde stehen unverbunden nebeneinander.", "Fachbegriffe haben in einer Interpretation nichts verloren."], "richtig": [0, 1, 2], "erklaerung": "Fachbegriffe sind erwünscht – aber jeder Befund wird erst durch Beleg und Deutung zur Interpretation.", "tipps": ["Befund mit Fachbegriff", "Beleg aus dem Text", "Deutung: Was bewirkt das bei den Lesern?"], "muster": "Die Geschichte ist personal erzählt: Die Leserinnen und Leser sehen alles aus der Sicht von Heinz und erfahren seine Gedanken. Dadurch erleben sie seine Vorurteile und seine Wut unmittelbar mit – und sind am Ende genauso überrascht wie er, als sich der Irrtum aufklärt. So wird den Lesern bewusst, wie schnell sie selbst seinem Urteil gefolgt sind."}]}]}, {"id": "grafikanalyse", "gruppe": "Analysieren und Interpretieren", "titel": "Grafikanalyse", "symbol": "📊", "kurz": "Diagramme beschreiben, vergleichen und deuten – nicht alle Zahlen aufzählen.", "sets": [{"id": "gr1", "titel": "Übungsgrafik: Nachrichten", "beilage": {"titel": "Wo informieren sich Jugendliche über aktuelle Nachrichten?", "info": "Balkendiagramm · Quelle: Schulumfrage der HAK Musterstadt, März 2026 (erfundene Übungsdaten) · befragt: 1.000 Jugendliche zwischen 14 und 19 Jahren", "diagramm": {"einheit": " %", "werte": [["Social Media", 68], ["Fernsehen", 41], ["Online-Ausgaben von Zeitungen", 35], ["Radio", 22], ["Podcasts", 15], ["gedruckte Zeitung", 12]], "hinweis": "Angaben in Prozent, Mehrfachnennungen möglich"}, "absaetze": []}, "aufgaben": [{"typ": "wahl", "frage": "Welcher Einleitungssatz beschreibt die Grafik vollständig?", "optionen": ["Das Balkendiagramm „Wo informieren sich Jugendliche über aktuelle Nachrichten?“ beruht auf einer Schulumfrage der HAK Musterstadt vom März 2026, bei der 1.000 Jugendliche zwischen 14 und 19 Jahren befragt wurden; die Werte sind in Prozent angegeben, Mehrfachnennungen waren möglich.", "Das Balkendiagramm „Wo informieren sich Jugendliche über aktuelle Nachrichten?“ beruht auf einer Schulumfrage der HAK Musterstadt unter 1.000 Jugendlichen und zeigt erschreckend deutlich, dass Jugendliche viel zu viel Zeit am Handy verbringen und kaum noch Zeitung lesen.", "Das Kreisdiagramm „Wo informieren sich Jugendliche über aktuelle Nachrichten?“ beruht auf einer Schulumfrage der HAK Musterstadt vom März 2026, bei der 1.000 Jugendliche zwischen 14 und 19 Jahren befragt wurden; die Prozentwerte ergeben zusammen genau 100 Prozent.", "Das Balkendiagramm „Wo informieren sich Jugendliche über aktuelle Nachrichten?“ zeigt, dass 68 Prozent Social Media nennen, 41 Prozent das Fernsehen, 35 Prozent Online-Ausgaben von Zeitungen, 22 Prozent das Radio, 15 Prozent Podcasts und 12 Prozent die gedruckte Zeitung."], "richtig": 0, "erklaerung": "Titel/Thema, Quelle, Zeitpunkt, Befragte, Diagrammart und Maßeinheit – ohne Wertung. Einzelwerte gehören noch nicht in die Einleitung. Achtung: Es ist ein Balkendiagramm, und wegen der Mehrfachnennungen ergeben die Werte zusammen mehr als 100 Prozent."}, {"typ": "zuordnen", "frage": "Stimmt die Aussage laut Grafik?", "kategorien": ["stimmt", "stimmt nicht"], "elemente": [{"text": "Social Media liegt mit 68 Prozent an erster Stelle.", "kat": 0}, {"text": "Mehr als zwei Drittel nennen Social Media.", "kat": 0}, {"text": "Das Schlusslicht bildet die gedruckte Zeitung mit 12 Prozent.", "kat": 0}, {"text": "Social Media wird mehr als fünfmal so oft genannt wie die gedruckte Zeitung.", "kat": 0}, {"text": "Das Fernsehen wird häufiger genannt als Social Media.", "kat": 1}, {"text": "Podcasts werden häufiger genannt als das Radio.", "kat": 1}, {"text": "Die Hälfte der Jugendlichen nennt Online-Ausgaben von Zeitungen.", "kat": 1}], "erklaerung": "Werte genau ablesen und richtig vergleichen: 68 Prozent sind etwas mehr als zwei Drittel; 68 : 12 ist mehr als das Fünffache; 35 Prozent sind rund ein Drittel."}, {"typ": "wahl", "frage": "Wie formulierst du 35 Prozent am treffendsten?", "optionen": ["rund ein Drittel", "knapp die Hälfte", "fast zwei Drittel", "nur jeder Achte"], "richtig": 0, "erklaerung": "35 Prozent sind rund ein Drittel. Abwechslung bringen Formulierungen wie „rund ein Drittel“, „mehr als zwei Drittel“ (68 Prozent) oder „nur jeder Achte“ (12 Prozent) – sie müssen aber zum Wert passen."}, {"typ": "zuordnen", "frage": "Beschreibung oder Deutung?", "kategorien": ["Beschreibung", "Deutung"], "elemente": [{"text": "An erster Stelle steht Social Media mit 68 Prozent.", "kat": 0}, {"text": "Auffällig ist der große Abstand zur gedruckten Zeitung.", "kat": 0}, {"text": "Erklären lässt sich das möglicherweise damit, dass Jugendliche ihr Handy ständig dabeihaben.", "kat": 1}, {"text": "Daraus könnte folgen, dass Falschmeldungen Jugendliche leichter erreichen.", "kat": 1}], "erklaerung": "Erst beschreiben, was die Grafik zeigt – dann vorsichtig deuten („möglicherweise“, „könnte“)."}, {"typ": "mehrfach", "frage": "Was geht aus der Grafik NICHT hervor?", "optionen": ["wie lange die Jugendlichen die Medien täglich nutzen", "welche Social-Media-Plattformen genau gemeint sind", "ob es Unterschiede zwischen Burschen und Mädchen gibt", "dass Mehrfachnennungen möglich waren", "wie viele Jugendliche befragt wurden"], "richtig": [0, 1, 2], "erklaerung": "Ein kritischer Blick gehört dazu: Was zeigt die Grafik – und was nicht?"}, {"typ": "verbessern", "frage": "So beginnt der Hauptteil einer Grafikbeschreibung.", "beispiel": "Social Media hat 68, Fernsehen hat 41, Online-Zeitungen haben 35, Radio hat 22, Podcasts haben 15 und die Zeitung hat 12.", "maengel": ["bloße Aufzählung aller Zahlen", "Maßeinheit fehlt", "keine Gewichtung und kein Vergleich", "immer nur „hat“ und „haben“", "Präteritum"], "richtig": [0, 1, 2, 3], "erklaerung": "Auswählen, vergleichen, gewichten – und abwechslungsreich formulieren.", "tipps": ["Haupttendenz zuerst", "Vergleich bzw. Abstand genannt", "Maßeinheit", "abwechslungsreiche Formulierungen"], "muster": "Aus dem Diagramm geht hervor, dass sich Jugendliche vor allem über Social Media informieren (68 Prozent). Mit deutlichem Abstand folgen das Fernsehen (41 Prozent) und Online-Ausgaben von Zeitungen (35 Prozent). Das Schlusslicht bildet die gedruckte Zeitung, die nur 12 Prozent nennen."}]}]}, {"id": "filmanalyse", "gruppe": "Analysieren und Interpretieren", "titel": "Filmanalyse", "symbol": "🎥", "kurz": "Einstellungsgrößen, Perspektiven, Ton – und ihre Wirkung.", "sets": [{"id": "fi1", "titel": "Gestaltungsmittel und Wirkung", "aufgaben": [{"typ": "zuordnen", "frage": "Welche Einstellungsgröße ist das?", "kategorien": ["Totale", "Halbnah", "Großaufnahme", "Detail"], "elemente": [{"text": "Man sieht eine ganze Landschaft mit kleinen Figuren.", "kat": 0}, {"text": "Eine Person ist etwa von der Hüfte aufwärts zu sehen.", "kat": 1}, {"text": "Das Gesicht füllt fast das ganze Bild.", "kat": 2}, {"text": "Nur ein Auge oder eine zitternde Hand ist zu sehen.", "kat": 3}], "erklaerung": "Je näher die Kamera, desto stärker Gefühl und Nähe; je weiter, desto mehr Überblick und Distanz."}, {"typ": "zuordnen", "frage": "Welche Kameraperspektive wird beschrieben?", "kategorien": ["Vogelperspektive", "Froschperspektive", "Normalsicht"], "elemente": [{"text": "Die Kamera blickt von oben herab – die Figur wirkt klein und verloren.", "kat": 0}, {"text": "Die Kamera blickt von unten hinauf – die Figur wirkt mächtig oder bedrohlich.", "kat": 1}, {"text": "Die Kamera ist auf Augenhöhe – der Eindruck ist neutral.", "kat": 2}], "erklaerung": "Die Perspektive verändert, wie wir eine Figur wahrnehmen."}, {"typ": "wahl", "frage": "Was ist der Unterschied zwischen Einstellungsgröße und Perspektive?", "optionen": ["Einstellungsgröße: wie viel man sieht (Nähe/Distanz). Perspektive: aus welchem Blickwinkel.", "Einstellungsgröße: aus welchem Blickwinkel. Perspektive: wie viel man sieht (Nähe/Distanz).", "Einstellungsgröße: wie lange eine Einstellung dauert. Perspektive: wohin sich die Kamera bewegt.", "Einstellungsgröße: wie hell das Bild ist (High-Key/Low-Key). Perspektive: wie laut der Ton ist."], "richtig": 0, "erklaerung": "Ein häufiger Fehler ist, beides zu verwechseln: Die Einstellungsgröße reicht von der Totale bis zum Detail, die Perspektive von der Vogel- bis zur Froschperspektive. Dauer, Kamerabewegung, Licht und Ton sind eigene Gestaltungsmittel."}, {"typ": "wahl", "frage": "Tiefe, bedrohliche Musik setzt ein, obwohl noch nichts passiert. Welche Wirkung hat das?", "optionen": ["Sie baut Spannung auf und lässt Gefahr erwarten.", "Sie beruhigt die Zuseher, bevor die eigentliche Handlung beginnt.", "Sie zeigt an, dass der Film gleich zu Ende ist.", "Sie füllt nur die Stille, bis wieder gesprochen wird."], "richtig": 0, "erklaerung": "Ton und Musik lenken Gefühle und Erwartungen – hier entsteht Spannung, obwohl im Bild noch nichts geschieht."}, {"typ": "mehrfach", "frage": "Welche Grunddaten gehören in die Einleitung einer Filmanalyse?", "optionen": ["Titel", "Regie", "Produktionsland", "Entstehungsjahr", "Genre", "der Preis der Kinokarte", "deine Lieblingsschauspielerin"], "richtig": [0, 1, 2, 3, 4], "erklaerung": "Dazu ggf. die genaue Angabe der untersuchten Sequenz."}, {"typ": "wahl", "frage": "Was gehört zu jedem Gestaltungsmittel in deiner Analyse?", "optionen": ["Wie es eingesetzt wird und welche Wirkung es hat – mit genauer Szenen- oder Zeitangabe.", "Der Fachbegriff und eine möglichst vollständige Liste aller Stellen, an denen es vorkommt.", "Eine genaue Nacherzählung der Szene, damit die Leser wissen, was im Film passiert.", "Dein persönliches Urteil, ob dir das Gestaltungsmittel gefällt oder eher nicht."], "richtig": 0, "erklaerung": "Gestaltungsmittel nicht bloß aufzählen oder die Szene nacherzählen: Beschreibung – Wirkung – Deutung. Ein Geschmacksurteil gehört nicht dazu."}]}]}, {"id": "textvergleich", "gruppe": "Analysieren und Interpretieren", "titel": "Textvergleich", "symbol": "🔀", "kurz": "Zwei Texte Aspekt für Aspekt vergleichen – Gemeinsamkeiten und Unterschiede.", "sets": [{"id": "tv1", "titel": "Richtig vergleichen", "aufgaben": [{"typ": "wahl", "frage": "Wie baust du den Hauptteil eines Textvergleichs am besten auf?", "optionen": ["Aspektorientiert: Absatz für Absatz ein Vergleichsaspekt für beide Texte.", "Textorientiert: zuerst eine ganze Analyse von Text 1, dann eine von Text 2, ohne Verbindung.", "Schwerpunktorientiert: Text 1 ausführlich analysieren, Text 2 nur kurz am Ende erwähnen.", "Stichwortorientiert: Gemeinsamkeiten und Unterschiede als Liste ohne ganze Sätze."], "richtig": 0, "erklaerung": "Zwei getrennte Einzelanalysen sind noch kein Vergleich. Beide Texte werden etwa gleich gewichtet und in ganzen Sätzen miteinander verglichen."}, {"typ": "mehrfach", "frage": "Welche Formulierungen helfen beim Vergleichen?", "optionen": ["während", "im Gegensatz zu", "ähnlich wie", "wohingegen", "und dann", "zum Schluss"], "richtig": [0, 1, 2, 3], "erklaerung": "Vergleichsformulierungen machen Gemeinsamkeiten und Unterschiede sichtbar."}, {"typ": "wahl", "frage": "Was muss ein guter Textvergleich enthalten?", "optionen": ["Gemeinsamkeiten UND Unterschiede, beide Texte etwa gleich gewichtet, mit Belegen aus beiden Texten.", "Vor allem Gemeinsamkeiten, denn sie zeigen, worüber beide Texte berichten – Unterschiede sind Nebensache.", "Vor allem Unterschiede, mit ausführlichen Belegen aus dem ersten Text – der zweite dient nur zum Vergleich.", "Gemeinsamkeiten und Unterschiede, dazu im Schluss immer die eigene Meinung, welcher Text besser ist."], "richtig": 0, "erklaerung": "Jede Vergleichsaussage braucht Belege aus beiden Texten; Gemeinsamkeiten und Unterschiede gehören beide dazu. Eine Beurteilung, welcher Text besser ist, nur, wenn ein Operator sie verlangt."}, {"typ": "wahl", "frage": "Womit lassen sich Unterschiede zwischen zwei Texten erklären?", "optionen": ["Zum Beispiel mit unterschiedlichen Adressaten, Medien, Entstehungszeiten oder Absichten.", "Zum Beispiel damit, dass eine Autorin besser schreibt oder sich mehr Mühe gegeben hat.", "Zum Beispiel mit der unterschiedlichen Länge der Texte und der Zahl ihrer Absätze.", "Gar nicht – im Vergleich werden Unterschiede nur festgestellt, aber nicht erklärt."], "richtig": 0, "erklaerung": "Unterschiede nicht nur feststellen, sondern auch erklären – mit dem Umfeld der Texte (Adressaten, Medium, Zeit, Absicht), nicht mit Urteilen über die Schreibenden. Die Länge ist ein Befund, keine Erklärung."}, {"typ": "verbessern", "frage": "So vergleicht jemand die Berichte „Der Zweifel am Sinn von Hausübungen“ (Die Presse, 2012) und „Hausübung: Nicht Zeit, sondern Motivation entscheidend“ (Der Standard, 2015).", "beispiel": "Text 1 handelt von Hausübungen. Text 2 handelt auch von Hausübungen. Text 1 ist länger.", "maengel": ["kein echter Vergleich – die Texte stehen nur nebeneinander", "keine Eckdaten (Titel, Medium)", "keine inhaltlichen Unterschiede und keine Belege", "Präteritum"], "richtig": [0, 1, 2], "erklaerung": "Ein Vergleich verbindet beide Texte in einem Satz und zeigt, worin sie sich gleichen und unterscheiden.", "tipps": ["beide Texte mit Eckdaten", "Gemeinsamkeit benannt", "Unterschied mit Vergleichsformulierung"], "muster": "Beide Berichte befassen sich mit dem Sinn von Hausübungen. Während der Bericht in der „Presse“ vor allem Studien und Fachleute zitiert, die Hausübungen in ihrer jetzigen Form kritisch sehen, betont der Bericht im „Standard“, dass nicht die Dauer, sondern Motivation und Sorgfalt entscheidend seien."}]}]}, {"id": "eroerterung", "gruppe": "Argumentieren und Stellung nehmen", "titel": "Erörterung", "symbol": "⚖️", "kurz": "Einleitung, Argumente, Pro und Kontra, begründete Meinung im Schluss.", "sets": [{"id": "er1", "titel": "Merkmale und Aufbau", "aufgaben": [{"typ": "zuordnen", "frage": "In welchen Teil der Erörterung gehört das?", "kategorien": ["Einleitung", "Hauptteil", "Schluss"], "elemente": [{"text": "Aufhänger, z. B. ein aktueller Anlass oder ein Zitat", "kat": 0}, {"text": "klare Formulierung der Fragestellung", "kat": 0}, {"text": "Argumente nach dem 3-B-Schema", "kat": 1}, {"text": "Gegenargumente (in der dialektischen Erörterung)", "kat": 1}, {"text": "begründete eigene Meinung mit Bezug auf die Argumente", "kat": 2}, {"text": "Lösungsvorschlag, Ausblick oder Appell", "kat": 2}], "erklaerung": "Die Einleitung führt zum Thema hin, ohne Argumente vorwegzunehmen. Der Hauptteil ist der längste Teil. Im Schluss beziehst du begründet Stellung."}, {"typ": "wahl", "frage": "Was unterscheidet die dialektische von der linearen Erörterung?", "optionen": ["Sie wägt Pro- und Kontra-Argumente ab; die lineare argumentiert nur in eine Richtung.", "Sie argumentiert nur in eine Richtung; die lineare wägt Pro- und Kontra-Argumente ab.", "Sie ist immer kürzer, weil sie jedes Argument nur behauptet und nicht begründet.", "Sie kommt ohne Beispiele aus, weil sich Pro- und Kontra-Argumente gegenseitig belegen."], "richtig": 0, "erklaerung": "Dialektisch = Pro und Kontra, ausgewogen. Linear (steigernd) = nur eine Seite, vom schwächsten zum stärksten Argument. In beiden Formen braucht jedes Argument Behauptung, Begründung und Beispiel."}, {"typ": "wahl", "frage": "Thema: Sollen Hausübungen abgeschafft werden? – Welche Einleitung ist gelungen?", "optionen": ["„Schon wieder Hausübung!“ – diesen Seufzer hört man in vielen Familien täglich. Immer öfter wird deshalb gefordert, Hausübungen ganz abzuschaffen. Ist das sinnvoll?", "„Schon wieder Hausübung!“ – diesen Seufzer hört man in vielen Familien täglich. Ich finde Hausübungen deshalb sinnlos, weil sie nur Stress machen.", "In dieser Erörterung geht es um Hausübungen. Zuerst bringe ich die Pro-Argumente, danach die Kontra-Argumente und am Ende meine eigene Meinung.", "Hausübungen sind wichtig, denn ohne Übung lernt man nichts – das zeigt jede Schularbeit. Trotzdem wird immer öfter gefordert, sie abzuschaffen."], "richtig": 0, "erklaerung": "Die gelungene Einleitung beginnt mit einem Aufhänger (dem Seufzer) und endet mit der Fragestellung. Die Einleitung mit „Ich finde …“ nimmt die Meinung vorweg, die mit „ohne Übung lernt man nichts“ ein Argument des Hauptteils, und die Ankündigung „In dieser Erörterung geht es um …“ hat weder Aufhänger noch klare Frage."}, {"typ": "reihenfolge", "frage": "Bring das Argument in die richtige Reihenfolge: These – Begründung – Beleg – Folgerung.", "elemente": ["Ein späterer Schulbeginn würde die Leistungen verbessern.", "Jugendliche werden abends später müde und sind am frühen Morgen oft noch nicht richtig aufnahmefähig.", "Schlafforscher weisen darauf hin, dass sich der Schlafrhythmus in der Pubertät nach hinten verschiebt.", "Daher sollten Schulen prüfen, ob der Unterricht später beginnen kann."], "erklaerung": "These (Behauptung) – Begründung (warum?) – Beleg/Beispiel (woran sieht man das?) – Folgerung (was folgt daraus?)."}, {"typ": "wahl", "frage": "Textgebundene Erörterung: Welcher Teil ist der umfangreichste?", "optionen": ["Die Textkritik – deine eigene Auseinandersetzung mit den Aussagen und Argumenten des Textes.", "Die Textwiedergabe – die genaue Darstellung aller Aussagen und Argumente des Textes.", "Die Einleitung – der Aufhänger und die Vorstellung des Textes mit allen Eckdaten.", "Der Schluss – deine begründete Meinung mit einem Ausblick und einem Lösungsvorschlag."], "richtig": 0, "erklaerung": "Den Text gibst du nur so weit wieder, wie es nötig ist. Den meisten Platz bekommt die Textkritik: zustimmen, widersprechen, ergänzen – mit eigenen Argumenten und Beispielen."}, {"typ": "wahl", "frage": "Wo darfst du in der Erörterung „ich“ verwenden?", "optionen": ["In Einleitung und Schluss sowie in einem persönlichen Beispiel.", "Überall, weil es ja in jedem Teil um deine eigene Meinung geht.", "Nirgends – auch nicht im Schluss oder in einem persönlichen Beispiel.", "Nur im Hauptteil, wo du deine eigenen Argumente vorbringst."], "richtig": 0, "erklaerung": "Der Hauptteil bleibt sachlich. Die eigene Meinung zeigst du im Schluss; ein persönliches Erlebnis darf als Beispiel vorkommen."}, {"typ": "wahl", "frage": "Was gehört NICHT in den Schluss einer Erörterung?", "optionen": ["Ein neues, bisher nicht genanntes Argument.", "Die begründete eigene Meinung zum Thema.", "Ein Ausblick auf die weitere Entwicklung.", "Ein Lösungsvorschlag oder ein Kompromiss."], "richtig": 0, "erklaerung": "Neue Argumente gehören in den Hauptteil. Der Schluss fasst zusammen und bezieht Stellung."}]}, {"id": "er2", "titel": "Originaltext: Zivilcourage", "originaltext": {"titel": "Warum wir Angst haben, Zivilcourage zu zeigen", "info": "Kommentar von Petra Sansone, erschienen am 28. November 2016 auf derStandard.at", "situation": "Übungsaufgabe: Du erörterst diesen Kommentar für ein Schulprojekt zum Thema Zivilcourage – Sachverhalt wiedergeben, das „Sowohl-als-auch“ erläutern, Für und Wider der mangelnden Bereitschaft, sich für andere einzusetzen, diskutieren."}, "aufgaben": [{"typ": "wahl", "frage": "Welcher Satz nennt die Eckdaten des Textes richtig?", "optionen": ["In ihrem Kommentar „Warum wir Angst haben, Zivilcourage zu zeigen“, erschienen am 28. November 2016 auf derStandard.at, befasst sich die Psychologin Petra Sansone mit der Frage, warum viele Menschen schweigen, statt sich für andere einzusetzen.", "In ihrem Bericht „Warum wir Angst haben, Zivilcourage zu zeigen“, erschienen am 28. November 2016 auf derStandard.at, befasst sich die Psychologin Petra Sansone mit der Frage, wen man bei der Bundespräsidentenwahl wählen soll.", "In ihrem Kommentar „Warum wir Angst haben, Zivilcourage zu zeigen“, erschienen am 28. November 2019 auf derStandard.at, befasste sich die Psychologin Petra Sansone mit der Frage, warum viele Menschen schweigen, statt sich für andere einzusetzen.", "In ihrem sehr lesenswerten Kommentar „Warum wir Angst haben, Zivilcourage zu zeigen“, erschienen am 28. November 2016 auf derStandard.at, beweist die Psychologin Petra Sansone eindrucksvoll, dass viele Menschen aus Feigheit schweigen."], "richtig": 0, "erklaerung": "Richtig sind Textsorte (Kommentar), genauer Titel, Autorin mit Funktion, Medium, Datum und Thema – sachlich formuliert. Ein Bericht ist der Text nicht, und die Bundespräsidentenwahl ist nur der Anlass, nicht das Thema. Erschienen ist er 2016, nicht 2019, und „befasste“ steht im Präteritum. „sehr lesenswert“ und „beweist eindrucksvoll“ sind Wertungen."}, {"typ": "mehrfach", "frage": "Welche Aussagen stehen so (sinngemäß) im Text?", "optionen": ["Laut einer OECD-Studie aus dem Jahr 2015 liegt Österreich bei Mobbing unter 27 Staaten an der Spitze.", "Wer glaubt, mit seiner Meinung in der Minderheit zu sein, äußert sie eher nicht.", "Die Autorin ruft dazu auf, die Lähmung durch die Angst zu überwinden.", "Die Autorin fordert, soziale Netzwerke zu verbieten.", "Laut Text gibt es in Österreich weniger Mobbing als im OECD-Schnitt.", "Die Autorin empfiehlt, eine bestimmte Partei zu wählen."], "richtig": [0, 1, 2], "erklaerung": "Die Autorin beschreibt die „Schweigespirale“: Wer sich in der Minderheit glaubt, schweigt eher. Österreich liegt beim Mobbing laut OECD an der Spitze, also über dem Schnitt. Ein Verbot sozialer Netzwerke oder eine Wahlempfehlung kommen nicht vor – sie betont, dass alle Parteien Anliegen von Menschen vertreten."}, {"typ": "wahl", "frage": "Was meint die Autorin mit dem „Sowohl-als-auch“?", "optionen": ["Kritik, Unzufriedenheit und Ängste beider Seiten ernst nehmen und miteinander statt gegeneinander nach Lösungen suchen.", "Bei der Wahl sowohl der einen als auch der anderen Seite eine Stimme geben, damit keine Partei allein die Richtung bestimmt.", "Sich sowohl aus Konflikten in der Schule als auch aus Streit in sozialen Netzwerken heraushalten, um sich selbst zu schützen.", "Die Kritik und den Ärger nur einer Seite ernst nehmen, die Ängste der anderen Seite aber als unberechtigt zurückweisen."], "richtig": 0, "erklaerung": "Am Ende stellt die Autorin die Wahl „gegeneinander oder miteinander“ – das „Sowohl-als-auch“ steht für einen Weg, der die berechtigten Sorgen beider Seiten einbezieht. Sich herauszuhalten widerspricht ihrem Aufruf, die Lähmung zu überwinden, und dass man beiden Seiten die Stimme geben soll, steht nicht im Text."}, {"typ": "zuordnen", "frage": "Textwiedergabe oder Textkritik (eigene Erörterung)?", "kategorien": ["Textwiedergabe", "Textkritik"], "elemente": [{"text": "Die Autorin erklärt, viele schwiegen aus Angst, sich gegen die Gruppe zu stellen.", "kat": 0}, {"text": "Dieser Erklärung ist zuzustimmen, denn auch in Schulklassen trauen sich viele nicht, einem Mitschüler beizustehen.", "kat": 1}, {"text": "Sansone zufolge habe man Zivilcourage in der Schule nicht gelernt.", "kat": 0}, {"text": "Allerdings greift diese Sicht zu kurz: Auch Elternhaus und Vorbilder prägen, ob jemand eingreift.", "kat": 1}, {"text": "Laut Text führt Österreich die Mobbingrangliste der OECD an.", "kat": 0}], "erklaerung": "Wiedergabe: Was sagt der Text? (oft mit Redeeinleitung und Konjunktiv). Textkritik: Was hältst du davon und warum? (zustimmen, widersprechen, ergänzen – mit Begründung)."}, {"typ": "zuordnen", "frage": "Für und Wider: Erklärt der Satz das Wegschauen – oder spricht er dafür, einzugreifen?", "kategorien": ["erklärt das Wegschauen", "spricht für Eingreifen"], "elemente": [{"text": "Wer eingreift, riskiert, selbst angegriffen zu werden.", "kat": 0}, {"text": "Viele wissen nicht, wie sie richtig helfen können.", "kat": 0}, {"text": "In einer Gruppe verlässt sich jeder darauf, dass ein anderer hilft.", "kat": 0}, {"text": "Mobbingopfer können sich allein oft nicht befreien.", "kat": 1}, {"text": "Schweigen verstehen Täter leicht als Zustimmung.", "kat": 1}, {"text": "Schon kleine Schritte, etwa Hilfe holen, können viel bewirken.", "kat": 1}], "erklaerung": "In der dialektischen Erörterung stellst du beide Seiten dar – und gewichtest sie im Schluss. Das Opfer-Argument stammt aus dem Text, die anderen sind eigene Argumente."}, {"typ": "wahl", "frage": "Wie gibst du die Forderung der Autorin richtig wieder?", "optionen": ["Die Autorin betont, die Gesellschaft müsse wieder handlungsfähig werden.", "Die Autorin betont, die Gesellschaft muss wieder handlungsfähig werden.", "Die Autorin betonte, die Gesellschaft müsse wieder handlungsfähig werden.", "Die Autorin betont, die Gesellschaft müsste wieder handlungsfähig werden."], "richtig": 0, "erklaerung": "Redewiedergabe im Konjunktiv I („müsse“ ist eindeutig) und im Präsens. „müsste“ brauchst du nur als Ersatzform."}]}, {"id": "erv", "titel": "✏️ Schwache Beispiele verbessern", "aufgaben": [{"typ": "verbessern", "frage": "So beginnt eine Erörterung zum Thema „Sollen Hausübungen abgeschafft werden?“.", "beispiel": "Ich schreibe jetzt eine Erörterung über Hausübungen. Meiner Meinung nach sind sie unnötig, weil sie Stress machen.", "maengel": ["kein Aufhänger, der Interesse weckt", "Ankündigung statt Hinführung zum Thema", "Meinung und Argument werden vorweggenommen.", "Es stehen zu viele Zahlen darin."], "richtig": [0, 1, 2], "erklaerung": "Die Einleitung weckt Interesse, führt zum Thema hin und nennt die Fragestellung – ohne Meinung und ohne Argumente.", "tipps": ["Aufhänger (Anlass, Zitat, Frage …)", "Überleitung zum Thema", "klare Fragestellung", "keine Meinung, keine Argumente"], "muster": "„Schon wieder Hausübung!“ – Diesen Seufzer hört man täglich in vielen Familien. Seit einiger Zeit wird deshalb diskutiert, ob Hausübungen überhaupt sinnvoll sind oder abgeschafft werden sollten."}, {"typ": "verbessern", "frage": "Dieses Argument steht im Hauptteil einer Erörterung.", "beispiel": "Hausübungen sind sinnlos. Das ist einfach so.", "maengel": ["keine echte Begründung", "kein Beispiel und kein Beleg", "Scheinbegründung („Das ist einfach so.“)", "Das Argument ist zu lang."], "richtig": [0, 1, 2], "erklaerung": "Ein vollständiges Argument hat Behauptung, Begründung und Beispiel bzw. Beleg – am besten mit Folgerung.", "tipps": ["Behauptung", "Begründung (weil, denn …)", "Beispiel oder Beleg", "Folgerung"], "muster": "Hausübungen bringen in ihrer derzeitigen Form oft wenig, weil viele sie nur abschreiben, statt sich mit dem Stoff auseinanderzusetzen. So glaubt laut einer Studie der TU Dresden nur jeder dritte befragte Schüler, durch Hausübungen besser zu werden. Daher sollten Hausübungen gezielter eingesetzt werden."}, {"typ": "verbessern", "frage": "So endet eine dialektische Erörterung zum Thema Hausübungen.", "beispiel": "Es gibt also Vor- und Nachteile. Jeder muss selbst entscheiden.", "maengel": ["keine begründete eigene Meinung", "kein Bezug zu den Argumenten des Hauptteils", "kein Lösungsvorschlag und kein Ausblick", "Es werden neue Argumente gebracht."], "richtig": [0, 1, 2], "erklaerung": "Im Schluss beziehst du begründet Stellung – mit Bezug auf deine Argumente – und bietest eine Lösung oder einen Ausblick.", "tipps": ["kurz zusammengefasst", "begründete eigene Meinung", "Lösungsvorschlag oder Ausblick"], "muster": "Insgesamt überwiegen für mich die Argumente für Hausübungen – allerdings nur, wenn sie im Unterricht besprochen werden. Statt sie abzuschaffen, sollten Schulen weniger, dafür gezieltere Aufgaben geben, bei denen man ohne Angst nachfragen kann."}]}]}, {"id": "kommentar", "gruppe": "Argumentieren und Stellung nehmen", "titel": "Kommentar", "symbol": "🗞️", "kurz": "Meinung zu einem aktuellen Anlass – pointiert, ohne Ich, mit klarer Schlussfolgerung.", "sets": [{"id": "ko1", "titel": "Merkmale und Aufbau", "aufgaben": [{"typ": "wahl", "frage": "Was will ein Kommentar erreichen?", "optionen": ["Die Leserinnen und Leser von einer Meinung zu einem aktuellen Ereignis überzeugen oder ihre Einstellung bestärken.", "Die Leserinnen und Leser neutral und ohne Wertung über ein aktuelles Ereignis und seine Hintergründe informieren.", "Die Leserinnen und Leser mit einer kurzen Zusammenfassung über den Inhalt eines Zeitungsartikels informieren.", "Die Leserinnen und Leser mit einer spannenden, frei erfundenen Geschichte zu einem Ereignis unterhalten."], "richtig": 0, "erklaerung": "Der Kommentar ist meinungsbetont. Neutral informiert der Bericht, einen Artikel kurz wiedergeben ist die Aufgabe der Zusammenfassung, und erfundene Geschichten gehören zum Erzählen."}, {"typ": "zuordnen", "frage": "Passt der Satz in einen Kommentar?", "kategorien": ["passt", "passt nicht"], "elemente": [{"text": "Ich finde, dass Billigflüge verboten gehören.", "kat": 1}, {"text": "Es ist bedenklich, dass ganze Altstädte im Besucherstrom versinken.", "kat": 0}, {"text": "Wünschenswert wäre ein Umdenken bei allen, die verreisen.", "kat": 0}, {"text": "Wir sollten alle weniger fliegen.", "kat": 1}, {"text": "Muss wirklich jede Sehenswürdigkeit auf tausend Handyfotos landen?", "kat": 0}, {"text": "Der Unfall ereignete sich am Montag gegen 8 Uhr.", "kat": 1}], "erklaerung": "Im Kommentar gibt es kein Ich und kein Wir – du formulierst unpersönlich („Es ist bedenklich …“, „Wünschenswert wäre …“). Rhetorische Fragen sind erwünscht. Sachliche Meldungen im Präteritum gehören in den Bericht."}, {"typ": "mehrfach", "frage": "Welche Einstiege eignen sich für einen Kommentar?", "optionen": ["eine provokante These", "eine rhetorische Frage", "ein Zitat oder Sprichwort", "ein aktueller Anlass", "„Ich möchte jetzt über … schreiben.“", "eine Aufzählung aller Absätze"], "richtig": [0, 1, 2, 3], "erklaerung": "Der Einstieg soll neugierig machen. Ankündigungen („Ich möchte …“) sind langweilig und verwenden das Ich."}, {"typ": "wahl", "frage": "Wie gehst du im Kommentar mit Gegenargumenten um?", "optionen": ["Ich greife sie auf und entkräfte sie.", "Ich lasse sie weg.", "Ich bringe nur Gegenargumente.", "Ich stelle sie ans Ende als Fazit."], "richtig": 0, "erklaerung": "Wer Gegenargumente aufgreift und widerlegt, überzeugt mehr. Das stärkste eigene Argument kommt zuletzt."}, {"typ": "wahl", "frage": "Welcher Schluss passt zu einem Kommentar?", "optionen": ["Statt Besucherrekorde zu feiern, sollten Reiseziele endlich auf Qualität statt Masse setzen – sonst bleibt bald nur noch Kulisse.", "Das war mein Kommentar zum Thema Tourismus – ich hoffe, er hat Ihnen beim Lesen gefallen und Sie zum Nachdenken gebracht.", "Zusammenfassend ist zu sagen, dass Obergrenzen für Reiseziele sowohl Vorteile als auch Nachteile haben und man beide Seiten sehen muss.", "Ein neues Problem ist übrigens, dass immer mehr Kreuzfahrtschiffe in kleinen Häfen anlegen und dort die Luft verschmutzen."], "richtig": 0, "erklaerung": "Der Schluss zieht eine klare Schlussfolgerung und regt zum Nachdenken an (Appell, Ausblick, Pointe). Eine Ich-Floskel passt nicht in den Kommentar, „Vor- und Nachteile“ ohne Urteil ist zu unentschieden, und ein neues Argument gehört in den Hauptteil."}, {"typ": "wahl", "frage": "Welcher Teil ist im Kommentar am längsten?", "optionen": ["Die Argumentation.", "Die Wiedergabe des Sachverhalts.", "Die Einleitung.", "Der Titel."], "richtig": 0, "erklaerung": "Den Sachverhalt stellst du kurz dar – nur so viel wie nötig. Der meiste Platz gehört deinen Argumenten."}]}, {"id": "ko2", "titel": "Originaltext: Tourismus", "originaltext": {"titel": "Jetzt kommt die Obergrenze für Touristen", "info": "Bericht von Ute Müller, Die Welt (Online-Ausgabe), 28. Dezember 2017", "situation": "Übungsaufgabe: Für einen Schreibwettbewerb einer Jugendzeitschrift verfasst du einen Kommentar mit dem Titel „Grenzen des Tourismus“ – Problematik beschreiben, Gründe angeben, zu den Maßnahmen Stellung nehmen."}, "aufgaben": [{"typ": "wahl", "frage": "Welche Problematik beschreibt der Text?", "optionen": ["Beliebte Reiseziele werden von immer mehr Touristen überlaufen, was Bewohner, Sehenswürdigkeiten und Natur belastet.", "Die Zahl der Touristen in beliebten Reisezielen sinkt, was Hotels, Restaurants und Geschäfte vor große Probleme stellt.", "Hotels in Spanien sind so teuer geworden, dass sich viele Familien einen Urlaub in Barcelona nicht mehr leisten können.", "Immer mehr Reiseziele werben um Touristen aus China, doch diese bleiben wegen der hohen Flugpreise lieber zu Hause."], "richtig": 0, "erklaerung": "Es geht um „Overtourism“: zu viele Besucher an denselben Orten – mit Protesten der Bewohner, z. B. in Barcelona. Die Gästezahlen steigen, gerade aus China reisen immer mehr Menschen, und Hotelpreise sind kein Thema des Textes."}, {"typ": "mehrfach", "frage": "Welche Gründe für den Ansturm lassen sich dem Text entnehmen?", "optionen": ["Der weltweite Tourismus wächst jedes Jahr.", "Das Wachstum konzentriert sich auf wenige Länder.", "Vor allem aus China reisen immer mehr Menschen.", "Die Zahl der Reisenden steigt, die Zahl der Reiseziele aber nicht.", "Reisen ist in den letzten Jahren viel teurer geworden.", "Touristen bleiben aus Angst vor Protesten zu Hause."], "richtig": [0, 1, 2, 3], "erklaerung": "Laut Text wächst der Tourismus stetig, zwanzig Länder tragen den Großteil des Wachstums, die chinesische Mittelschicht reist immer mehr – und die Zahl der Reiseziele wächst nicht mit."}, {"typ": "zuordnen", "frage": "Welche Maßnahme gehört zu welchem Ort?", "kategorien": ["Maya Beach (Thailand)", "Dubrovnik", "Barcelona"], "elemente": [{"text": "Badegäste und Boote werden für einige Monate begrenzt.", "kat": 0}, {"text": "Höchstens 8000 Besucher pro Tag in der Altstadt.", "kat": 1}, {"text": "Keine neuen Hotels und strengere Kontrolle von Airbnb.", "kat": 2}], "erklaerung": "Wenn du zu den Maßnahmen Stellung nimmst, nenn sie genau – mit Ort und Inhalt."}, {"typ": "wahl", "frage": "Die Präsidentin des World Travel & Tourism Council, Gloria Guevara, warnt im Text vor einer „Touristenphobie“. Wie gibst du ihre Aussage richtig wieder?", "optionen": ["Laut Gloria Guevara müsse man Lösungen finden, bevor sich eine Abneigung gegen Touristen entwickle.", "Laut Gloria Guevara muss man Lösungen finden, bevor sich eine Abneigung gegen Touristen entwickelt.", "Ich finde, Gloria Guevara hat recht, dass man Lösungen finden muss, bevor eine Abneigung gegen Touristen entsteht.", "Laut Gloria Guevara habe man bereits Lösungen gefunden, sodass es keine Abneigung gegen Touristen mehr gebe."], "richtig": 0, "erklaerung": "Aussagen aus der Textbeilage gibst du in indirekter Rede (Konjunktiv I) wieder und stellst die Person beim ersten Nennen kurz vor. Die Fassung mit „muss“ und „entwickelt“ steht im Indikativ, dass schon Lösungen gefunden seien, sagt Guevara nicht, und im Kommentar gibt es kein Ich."}, {"typ": "wahl", "frage": "Welcher Satz nimmt im Sinne eines Kommentars Stellung zu den Maßnahmen?", "optionen": ["Eine Obergrenze wie in Dubrovnik schützt die Altstadt zwar, verlagert die Massen aber oft nur in den nächsten Ort – wirksamer wären Reservierungen, die Besuche über das ganze Jahr verteilen.", "Dubrovnik will die Zahl der Besucher in der Altstadt auf höchstens 8000 pro Tag beschränken, Thailand begrenzt am Maya Beach für einige Monate Badegäste und Boote.", "Ich finde die Obergrenze in Dubrovnik ziemlich gut und hoffe, dass bald noch viele andere beliebte Städte in Europa diesem Beispiel folgen und ebenfalls Grenzen einführen.", "Eine Obergrenze wie in Dubrovnik ist echt voll daneben, weil man als Tourist dann blöd vor der Altstadt steht und nicht reinkommt – das nervt doch total und bringt gar nichts."], "richtig": 0, "erklaerung": "Stellung nehmen heißt bewerten UND begründen – pointiert, aber ohne Ich und ohne Umgangssprache. Die Aufzählung der Maßnahmen gibt nur wieder, der Satz mit „Ich finde …“ verwendet das Ich und begründet nicht, und „voll daneben“ oder „nervt total“ ist Umgangssprache."}, {"typ": "wahl", "frage": "Ohne Vorgabe: Welcher Titel passt am besten zu einem Kommentar über dieses Thema?", "optionen": ["Wenn die Sehenswürdigkeit zur Kulisse wird", "Bericht über den Tourismus in Spanien", "Mein Urlaub in Barcelona", "Zahlen und Fakten zum Tourismus 2017"], "richtig": 0, "erklaerung": "Ein Kommentartitel ist pointiert und lässt die Meinung ahnen. Gibt die Aufgabe einen Titel vor (hier „Grenzen des Tourismus“), übernimmst du ihn."}]}, {"id": "kov", "titel": "✏️ Schwache Beispiele verbessern", "aufgaben": [{"typ": "verbessern", "frage": "So beginnt ein Kommentar zum Bericht „Jetzt kommt die Obergrenze für Touristen“ (Die Welt, 28. Dezember 2017).", "beispiel": "In diesem Kommentar möchte ich über den Tourismus schreiben, weil ich das Thema interessant finde.", "maengel": ["Ich-Form", "Ankündigung statt eines Einstiegs, der neugierig macht", "kein Bezug zur Textbeilage", "keine erkennbare Meinung", "zu viele rhetorische Fragen"], "richtig": [0, 1, 2, 3], "erklaerung": "Der Kommentar steigt originell ein, nennt den Anlass und lässt die Meinung schon erkennen – ohne Ich.", "tipps": ["origineller Einstieg", "Bezug zur Textbeilage", "Meinung erkennbar", "ohne ich und wir"], "muster": "Höchstens 8000 Besucher pro Tag – so will Dubrovnik seine Altstadt retten. Wie „Die Welt“ berichtet, ächzen beliebte Reiseziele weltweit unter dem Ansturm. Höchste Zeit, dass der Tourismus Grenzen bekommt."}, {"typ": "verbessern", "frage": "Dieser Satz steht im Hauptteil eines Kommentars.", "beispiel": "Ich finde, wir sollten alle viel weniger reisen, weil das halt besser ist.", "maengel": ["Ich- und Wir-Form", "Umgangssprache („halt“)", "Scheinbegründung („weil das besser ist“)", "Präteritum statt Präsens"], "richtig": [0, 1, 2], "erklaerung": "Im Kommentar formulierst du unpersönlich und begründest konkret.", "tipps": ["unpersönlich formuliert (man, es, wünschenswert wäre …)", "echte Begründung", "Standardsprache"], "muster": "Wünschenswert wäre, dass Reisende überfüllte Orte außerhalb der Hauptsaison besuchen – das entlastet die Bewohner und macht den Aufenthalt für alle angenehmer."}, {"typ": "verbessern", "frage": "So endet ein Kommentar zum Thema Tourismus.", "beispiel": "Das war mein Kommentar zum Thema Tourismus. Danke fürs Lesen.", "maengel": ["keine Schlussfolgerung", "kein Appell, Ausblick oder Pointe", "Ich-Bezug („mein“)", "Der Schluss ist zu emotional."], "richtig": [0, 1, 2], "erklaerung": "Der Schluss zieht eine klare Schlussfolgerung und regt zum Nachdenken an.", "tipps": ["klare Schlussfolgerung", "Appell, Ausblick oder Pointe", "ohne Ich"], "muster": "Statt Besucherrekorde zu feiern, sollten Städte und Reisende auf Qualität statt Masse setzen. Sonst bleibt von Barcelona und Dubrovnik bald nur noch eine Kulisse für Selfies."}]}]}, {"id": "leserbrief", "gruppe": "Argumentieren und Stellung nehmen", "titel": "Leserbrief", "symbol": "✉️", "kurz": "Bezug auf einen Artikel, eigene Meinung mit Argumenten, Appell und Briefform.", "sets": [{"id": "lb1", "titel": "Merkmale und Aufbau", "aufgaben": [{"typ": "reihenfolge", "frage": "Bring die Teile des Leserbriefs in die richtige Reihenfolge.", "elemente": ["Anrede (z. B. Sehr geehrte Redaktion …)", "Einleitung: Bezug auf den Artikel und Schreibanlass", "Hauptteil: Argumente für die eigene Meinung", "Schluss: Appell an Leserinnen und Leser, Redaktion oder Verantwortliche", "Grußformel", "Vor- und Nachname, Wohnort"], "erklaerung": "Der Leserbrief hat die Form eines Briefes: Anrede – Einleitung – Hauptteil – Schluss mit Appell – Grußformel – Name und Wohnort."}, {"typ": "wahl", "frage": "Welche Einleitung ist gelungen?", "optionen": ["In Ihrem Artikel „Bald Handyverbot an allen Schulen?“ vom 4. Oktober 2026 berichten Sie über ein mögliches Verbot. Als Schüler einer Handelsakademie möchte ich dazu Stellung nehmen, denn ich halte ein generelles Verbot für falsch.", "Hallo liebe Redaktion! Ich hab da neulich in Ihrer Zeitung was über ein Handyverbot an allen Schulen gelesen, und ich wollte jetzt einfach mal sagen, dass ich das echt überhaupt nicht cool finde.", "Mein Leserbrief handelt von Handys in der Schule. Als Schüler einer Handelsakademie möchte ich dazu Stellung nehmen, denn ich halte ein generelles Handyverbot an allen Schulen für falsch.", "In Ihrem Artikel „Bald Handyverbot an allen Schulen?“ vom 4. Oktober 2026 schreiben Sie zuerst über das Verbot, dann über die Meinung der Eltern, danach über die Lehrkräfte und am Ende über die Schüler."], "richtig": 0, "erklaerung": "Die gelungene Einleitung nennt den Artikel genau (Titel, Datum, ggf. Medium), den Anlass und schon die eigene Position. Ohne Titel und Datum fehlt der Bezug, Umgangssprache passt nicht, und eine Nacherzählung des Artikels ist nicht nötig – die Leser kennen ihn."}, {"typ": "wahl", "frage": "Wie ausführlich gibst du den Artikel wieder?", "optionen": ["Nur kurz (wenige Sätze) – die eigene Meinung steht im Vordergrund.", "Möglichst vollständig, Absatz für Absatz – die Leser sollen alles erfahren.", "Gar nicht – die Leserinnen und Leser kennen den Artikel ja schon.", "Wörtlich, mit vielen Zitaten – so kann man dir nichts Falsches vorwerfen."], "richtig": 0, "erklaerung": "Ein typischer Fehler: zu viel Artikel, zu wenig eigene Meinung. Ganz weglassen geht aber auch nicht, sonst fehlt der Bezug. Greif einzelne Aussagen in eigenen Worten auf und nimm sofort Stellung dazu."}, {"typ": "mehrfach", "frage": "Welche Sätze sind ein klarer Appell?", "optionen": ["Liebe Eltern, lassen Sie Ihre Kinder die Hausübungen selbst machen!", "Ich fordere die Schulbehörde auf, endlich klare Regeln für Handys festzulegen.", "Setzen wir uns gemeinsam dafür ein, dass jede Schule einen Ruheraum bekommt!", "Ich freue mich auf weitere interessante Artikel.", "Das war meine Meinung."], "richtig": [0, 1, 2], "erklaerung": "Ein Appell spricht jemanden direkt an und fordert etwas Konkretes. „Ich freue mich auf weitere Artikel“ ist nur eine Floskel."}, {"typ": "wahl", "frage": "Welche Grußformel ist richtig?", "optionen": ["Mit freundlichen Grüßen", "MfG und danke fürs Lesen", "Liebe Grüße an die Redaktion", "Servus und schöne Grüße"], "richtig": 0, "erklaerung": "Die Grußformel wird ausgeschrieben und bleibt höflich-formell. Abkürzungen wie „MfG“ und Saloppes wie „Liebe Grüße“ oder „Servus“ passen nicht in einen Leserbrief."}, {"typ": "wahl", "frage": "Darfst du im Leserbrief „ich“ verwenden?", "optionen": ["Ja, das ist sogar erwünscht – es geht um deine persönliche Meinung.", "Nein, nie – ein Leserbrief muss so sachlich bleiben wie ein Bericht.", "Nur in der Grußformel und bei deinem Namen am Ende des Briefes.", "Nur wenn du ein persönliches Erlebnis als Beispiel erzählst, sonst nie."], "richtig": 0, "erklaerung": "Der Leserbrief ist persönlich. Anders als im Kommentar schreibst du in der Ich-Form – nicht nur in Beispielen."}, {"typ": "wahl", "frage": "Was macht ein appellativer Leserbrief?", "optionen": ["Er prangert einen Missstand an, zeigt, wie es sein sollte, und fordert zur Mithilfe auf.", "Er fasst den Artikel neutral zusammen und verzichtet dabei auf jede eigene Meinung.", "Er bedankt sich bei der Redaktion für den Artikel und lobt die gute Recherche.", "Er stimmt dem Artikel zu oder widerspricht ihm, verzichtet aber auf jede Aufforderung."], "richtig": 0, "erklaerung": "Ist-Stand → Soll-Stand → Aufforderung. Wer nur zustimmt, ergänzt oder widerspricht, ohne etwas zu fordern, schreibt die zweite Art, die Stellungnahme. Eine neutrale Zusammenfassung oder ein bloßer Dank an die Redaktion fordert nichts."}]}, {"id": "lb2", "titel": "Originaltext: Hausübungen", "originaltext": {"titel": "Der Zweifel am Sinn von Hausübungen", "info": "Bericht von Julia Neuhauser, erschienen am 11. März 2012 auf diepresse.com", "situation": "Übungsaufgabe: Du schreibst einen Leserbrief zu diesem Bericht und hebst dabei die Notwendigkeit von Hausübungen hervor."}, "aufgaben": [{"typ": "wahl", "frage": "Welche Position vertritt der Bericht vor allem?", "optionen": ["Hausübungen bringen in ihrer jetzigen Form wenig und müssten anders eingesetzt werden.", "Hausübungen sind völlig sinnlos und sollten an allen Schulen sofort abgeschafft werden.", "Hausübungen wirken gut, es sollte aber noch mehr davon geben, vor allem in den Hauptfächern.", "Hausübungen sind sinnvoll, weil Eltern dabei sehen, was ihre Kinder in der Schule lernen."], "richtig": 0, "erklaerung": "Der Bericht stützt sich auf Studien und Expertinnen: Hausübungen bringen derzeit wenig, sollten aber besser in den Unterricht eingebunden werden. Eine Abschaffung fordert er nicht, und dass Hausübungen gut wirken oder die Eltern informieren, steht nicht im Text."}, {"typ": "zuordnen", "frage": "Wer sagt was? Ordne die Aussagen zu.", "kategorien": ["Tina Hascher", "Christiane Spiel", "Studie der TU Dresden"], "elemente": [{"text": "Hausübungen sind zu wenig in den Unterricht eingebunden.", "kat": 0}, {"text": "Hausübungen sollten öfter vorbereitend sein.", "kat": 0}, {"text": "Es fehlt eine Kultur, in der man ohne Angst vor Bewertung nachfragen kann.", "kat": 1}, {"text": "Eltern helfen am besten mit gezielten Fragen.", "kat": 1}, {"text": "Nur jeder dritte befragte Schüler glaubt, dass Hausübungen seine Leistungen verbessern.", "kat": 2}, {"text": "Ein Drittel der befragten Lehrkräfte kann nicht sagen, ob Hausübungen etwas bringen.", "kat": 2}], "erklaerung": "Tina Hascher ist Erziehungswissenschaftlerin (Uni Salzburg), Christiane Spiel Bildungspsychologin (Uni Wien). Stell Personen beim ersten Nennen immer kurz vor."}, {"typ": "wahl", "frage": "Deine Aufgabe: die Notwendigkeit von Hausübungen hervorheben. Welches Argument passt?", "optionen": ["Hausübungen sind notwendig, weil man erst beim selbstständigen Üben merkt, was man noch nicht verstanden hat – zum Beispiel, wenn man bei einer Rechnungswesen-Aufgabe hängen bleibt und dann gezielt nachfragen kann.", "Hausübungen sind nicht notwendig, weil man laut der Studie der TU Dresden durch sie kaum etwas lernt – zum Beispiel glaubt nur jeder dritte befragte Schüler, dass seine Leistungen dadurch besser werden.", "Hausübungen sind notwendig, weil es sie schon immer gegeben hat – zum Beispiel mussten auch meine Eltern und Großeltern früher jeden Tag nach der Schule Hausübungen machen.", "Hausübungen sind halt einfach total wichtig und notwendig, das weiß doch eigentlich jeder, der schon einmal eine Schularbeit geschrieben hat, also braucht man darüber gar nicht lange zu reden."], "richtig": 0, "erklaerung": "Nur das Argument mit dem Beispiel aus Rechnungswesen ist vollständig (Behauptung, Begründung, Beispiel) und passt zur Aufgabe. Das Argument mit der Dresdner Studie vertritt die Gegenposition. „Weil es sie schon immer gegeben hat“ ist keine echte Begründung – genau diese Gewohnheit kritisiert der Bericht. „Das weiß doch jeder“ bleibt eine bloße Behauptung in Umgangssprache."}, {"typ": "wahl", "frage": "Du verteidigst Hausübungen. Wie gehst du mit der Studie aus Dresden um?", "optionen": ["Ich greife sie auf und entkräfte sie: Dass viele keinen Erfolg sehen, liegt laut Hascher eher an der Art der Hausübungen als an Hausübungen an sich.", "Ich verschweige die Studie lieber, denn wenn ich sie erwähne, schwäche ich nur meine eigene Position und verwirre die Leserinnen und Leser.", "Ich behaupte, die Studie aus Dresden sei sicher erfunden, denn eine Universität würde so etwas über Hausübungen nie herausfinden.", "Ich gebe der Studie recht und ändere meine Meinung: Wenn nur jeder dritte Schüler einen Erfolg sieht, sind Hausübungen sinnlos."], "richtig": 0, "erklaerung": "Gegenargumente ernst nehmen und entkräften überzeugt. Verschweigen wirkt unehrlich, eine Studie ohne Beleg als erfunden abzutun ist unseriös, und wer die Meinung ändert, verfehlt die Aufgabe. Der Text selbst liefert Material: Hascher hält Hausübungen nicht für wertlos, sondern fordert eine bessere Einbindung."}, {"typ": "luecke", "frage": "Gib die Aussagen im Konjunktiv wieder.", "satz": "Laut Christiane Spiel {{}} (fehlen) eine Kultur des Nachfragens. Tina Hascher meint, Hausübungen {{}} (sollen) gezielter eingesetzt werden.", "loesungen": [["fehle"], ["sollten"]], "erklaerung": "„fehle“ ist eindeutig Konjunktiv I. „sie sollen“ klingt wie der Indikativ – daher die Ersatzform „sollten“."}, {"typ": "wahl", "frage": "Welcher Appell passt zu deinem Leserbrief?", "optionen": ["Liebe Lehrerinnen und Lehrer, nehmen Sie sich Zeit, Hausübungen im Unterricht zu besprechen – dann werden sie zur echten Lernhilfe!", "Ich freue mich schon auf weitere interessante Artikel in Ihrer Zeitung und bedanke mich herzlich für Ihre Aufmerksamkeit.", "Liebe Lehrerinnen und Lehrer, hören Sie endlich auf, uns Hausübungen zu geben – dann haben alle Schülerinnen und Schüler mehr Freizeit!", "Hausübungen sind wichtig, und darüber sollte sich jeder, der mit Schule zu tun hat, vielleicht irgendwann einmal in Ruhe Gedanken machen."], "richtig": 0, "erklaerung": "Der Appell spricht direkt an, ist konkret und passt zu deiner Position. Die Freude auf weitere Artikel ist nur eine Floskel, der Aufruf, keine Hausübungen mehr zu geben, widerspricht der Aufgabe, und „sollte sich jeder … Gedanken machen“ spricht niemanden direkt an und bleibt vage."}]}, {"id": "lbv", "titel": "✏️ Schwache Beispiele verbessern", "aufgaben": [{"typ": "verbessern", "frage": "So beginnt ein Leserbrief zum Bericht „Der Zweifel am Sinn von Hausübungen“ (Julia Neuhauser, diepresse.com, 11. März 2012).", "beispiel": "Hallo, ich hab da euren Artikel über Hausübungen gelesen und der ist komplett falsch.", "maengel": ["unpassende Anrede", "kein genauer Bezug (Titel, Datum, Medium)", "Umgangssprache („hab da“)", "pauschale Wertung ohne Begründung", "Die Einleitung ist zu lang."], "richtig": [0, 1, 2, 3], "erklaerung": "Höfliche Anrede, genauer Bezug auf den Artikel, Schreibanlass und Position – in Standardsprache.", "tipps": ["höfliche Anrede", "Titel, Datum, Medium genannt", "Anlass und eigene Position", "Standardsprache"], "muster": "Sehr geehrte Redaktion,\nin Ihrem Bericht „Der Zweifel am Sinn von Hausübungen“ vom 11. März 2012 auf diepresse.com stellt Julia Neuhauser Hausübungen grundsätzlich in Frage. Als Schülerin einer Handelsakademie sehe ich das anders und möchte dazu Stellung nehmen."}, {"typ": "verbessern", "frage": "Dieses Argument steht im Hauptteil eines Leserbriefs.", "beispiel": "Hausübungen sind wichtig, weil sie wichtig sind.", "maengel": ["Zirkelschluss – die Begründung wiederholt nur die Behauptung", "kein Beispiel aus der eigenen Erfahrung", "Die Ich-Form fehlt."], "richtig": [0, 1], "erklaerung": "Die Ich-Form ist im Leserbrief erlaubt, aber nicht in jedem Satz nötig. Das Problem ist die fehlende Begründung und das fehlende Beispiel.", "tipps": ["Behauptung", "echte Begründung", "Beispiel aus der eigenen Erfahrung"], "muster": "Hausübungen sind wichtig, weil man erst beim selbstständigen Üben merkt, was man noch nicht verstanden hat. Als ich etwa bei einer Rechnungswesen-Hausübung nicht weiterkam, konnte ich am nächsten Tag gezielt nachfragen und habe die Buchung endlich verstanden."}, {"typ": "verbessern", "frage": "So endet ein Leserbrief.", "beispiel": "Ich freue mich auf weitere interessante Artikel. MfG", "maengel": ["kein Appell", "leere Floskel statt Schlussgedanke", "Grußformel abgekürzt", "Name und Wohnort fehlen", "Der Schluss ist zu förmlich."], "richtig": [0, 1, 2, 3], "erklaerung": "Ein Leserbrief endet mit einem klaren Appell, der ausgeschriebenen Grußformel sowie Name und Wohnort.", "tipps": ["direkter, konkreter Appell", "Grußformel ausgeschrieben", "Name und Wohnort"], "muster": "Liebe Lehrerinnen und Lehrer, schaffen Sie Hausübungen nicht ab, sondern besprechen Sie sie im Unterricht – dann werden sie zur echten Lernhilfe!\n\nMit freundlichen Grüßen\nMaria Muster, Graz"}]}]}, {"id": "meinungsrede", "gruppe": "Argumentieren und Stellung nehmen", "titel": "Meinungsrede", "symbol": "🎤", "kurz": "Publikum ansprechen, überzeugen, Rhetorik, Appell und Dank.", "sets": [{"id": "mr1", "titel": "Merkmale und Aufbau", "aufgaben": [{"typ": "wahl", "frage": "Du sprichst in einer Sitzung des Schulgemeinschaftsausschusses. Welche Anrede passt?", "optionen": ["Sehr geehrte Frau Direktorin, sehr geehrte Lehrerinnen und Lehrer, liebe Eltern und Mitschüler!", "Hallo Frau Direktorin, hallo Leute aus den Klassen und liebe Eltern von uns allen!", "Sehr geehrte Redaktion, liebe Leserinnen und Leser der Schülerzeitung „Pausenhof“!", "Sehr geehrte Damen und Herren, liebe Grüße an alle Anwesenden im Ausschuss!"], "richtig": 0, "erklaerung": "Die Rede beginnt mit einer korrekten Anrede des Publikums laut Aufgabe – und das Publikum wird auch später immer wieder angesprochen. „Hallo Leute“ ist zu salopp, „liebe Grüße“ ist eine Grußformel, und Redaktion und Leserschaft sprichst du in einem Leserbrief an, nicht in einer Rede."}, {"typ": "mehrfach", "frage": "Welche Mittel machen eine Rede wirkungsvoll?", "optionen": ["rhetorische Fragen („Wollen wir das wirklich?“)", "Anaphern („Wir wollen …, wir wollen …, wir wollen …“)", "direkte Ansprache („Sie alle kennen das:“)", "Dreierfiguren („schneller, billiger, schlechter“)", "lange Schachtelsätze mit vielen Nebensätzen", "Fachbegriffe ohne Erklärung"], "richtig": [0, 1, 2, 3], "erklaerung": "Eine Rede wird gehört, nicht gelesen: kurze Sätze, Wiederholungen und direkte Ansprache helfen dem Publikum."}, {"typ": "reihenfolge", "frage": "Der „Fünfsatz“ ist ein bewährter Aufbau für den Hauptteil. Bring die Fragen in die richtige Reihenfolge.", "elemente": ["Warum spreche ich?", "Was ist der Fall?", "Was sollte sein?", "Wie erreichen wir das?", "Was können wir tun?"], "erklaerung": "Vom Anlass über den Ist-Zustand und den Soll-Zustand zum Weg dorthin – und zum Schluss die konkrete Aufforderung."}, {"typ": "wahl", "frage": "Wie ist der Schluss einer Meinungsrede aufgebaut?", "optionen": ["Fazit – Appell – Dank für die Aufmerksamkeit.", "Neue Argumente – Fragen an das Publikum – Dank.", "Fazit – neue Argumente – Liste der Quellen.", "Appell – Grußformel – Name und Wohnort."], "richtig": 0, "erklaerung": "Das Wichtigste kurz zusammenfassen, konkret appellieren und für die Aufmerksamkeit danken. Neue Argumente gehören in den Hauptteil, Quellenlisten werden nicht vorgetragen, und Grußformel, Name und Wohnort stehen unter einem Leserbrief, nicht am Ende einer Rede."}, {"typ": "wahl", "frage": "Darfst du in der Meinungsrede „ich“ und „wir“ verwenden?", "optionen": ["Ja, das ist erwünscht.", "Nein, nie.", "Nur „wir“, nie „ich“.", "Nur im Titel."], "richtig": 0, "erklaerung": "Die Meinungsrede ist persönlich und subjektiv. „Ich“ und „wir“ schaffen Nähe zum Publikum."}, {"typ": "wahl", "frage": "Welcher Satz passt am besten in eine Rede?", "optionen": ["Stellen Sie sich vor: Ein T-Shirt kostet weniger als ein Kaffee. Wer bezahlt den Rest?", "Aufgrund der im Zuge der Globalisierung erfolgten Verlagerung von Produktionsstätten, welche in Ländern mit niedrigen Lohnkosten angesiedelt wurden, ist festzustellen, dass die Preise sinken.", "Das ist mega billig und voll cool.", "Wie in Abbildung 3b ersichtlich ist, sinken die Preise."], "richtig": 0, "erklaerung": "Kurze Sätze, direkte Ansprache, rhetorische Frage – so hört man gern zu. Schachtelsätze, Umgangssprache und Verweise auf Abbildungen passen nicht."}]}, {"id": "mr2", "titel": "Originaltext: Billig-T-Shirts", "originaltext": {"titel": "Der Trick mit den Billig-T-Shirts aus Irland", "info": "Bericht von Christin Bohmann, Carsten Dierig und H. Seidel, Die Welt, 4. August 2012", "situation": "Übungsaufgabe: Die Schule will T-Shirts für alle bei einem Textil-Diskonter bestellen. Als Schulsprecherin bzw. Schulsprecher hältst du im Schulgemeinschaftsausschuss eine Rede und appellierst, „fair“ einzukaufen."}, "aufgaben": [{"typ": "mehrfach", "frage": "Welche Gründe für die niedrigen Preise nennt der Text?", "optionen": ["sehr niedrige Produktionskosten in Asien", "wenig Personal und keine Beratung in den Geschäften", "kaum Werbung – Neueröffnungen werden über soziale Medien und Mundpropaganda bekannt", "laut Primark: große Stückzahlen und ein geringer Gewinnaufschlag", "Primark produziert alles selbst in Irland.", "Der Staat bezahlt einen Teil der Kleidung."], "richtig": [0, 1, 2, 3], "erklaerung": "Der Text nennt Einsparungen bei Produktion, Personal und Werbung. Primark selbst erklärt die Preise mit Masse und kleinem Aufschlag. Hergestellt wird in Asien, nicht in Irland."}, {"typ": "zuordnen", "frage": "Wer vertritt welche Aussage?", "kategorien": ["Björn Weber (Handelsforscher)", "Hubertus Thiermeyer (Gewerkschaft)", "Primark"], "elemente": [{"text": "Die Arbeitsbedingungen in der Produktion sind katastrophal.", "kat": 0}, {"text": "Bei manchen Produkten liegt die Gewinnspanne bei 100 Prozent.", "kat": 0}, {"text": "Für ein T-Shirt um zwei Euro bezahlt jemand anderer den Preis.", "kat": 1}, {"text": "Informierte Kundinnen und Kunden ändern ihr Kaufverhalten sofort.", "kat": 1}, {"text": "Man arbeitet mit großen Stückzahlen und einem geringen Gewinnaufschlag.", "kat": 2}, {"text": "Bei den Zulieferern werden jedes Jahr rund 2000 Kontrollen durchgeführt.", "kat": 2}], "erklaerung": "In der Rede kannst du Expertenaussagen als Belege nutzen – mit Namen und Funktion. Die Aussagen von Primark sind die Gegenposition, die du entkräften kannst."}, {"typ": "wahl", "frage": "Welcher Einstieg weckt bei der Sitzung Interesse?", "optionen": ["Zwei Euro fünfzig – so viel kostet bei manchen Diskontern ein T-Shirt. Weniger als eine Wurstsemmel! Haben Sie sich schon einmal gefragt, wer den Rest bezahlt?", "Ich halte heute eine Rede über T-Shirts, weil unsere Schule für alle Schülerinnen und Schüler neue T-Shirts bei einem Textil-Diskonter bestellen möchte.", "Laut einem Artikel vom 4. August 2012 eröffnete Primark seine achte Filiale in Deutschland, und am ersten Tag kamen 40.000 Kunden in den neuen Laden.", "Vielen Dank, dass Sie heute alle gekommen sind. Bevor ich zu meinem eigentlichen Thema komme, möchte ich Ihnen kurz erklären, wer ich bin."], "richtig": 0, "erklaerung": "Ein überraschender Vergleich und eine rhetorische Frage ziehen das Publikum hinein. Eine Ankündigung, eine nüchterne Meldung im Präteritum oder eine umständliche Vorstellung wecken kein Interesse."}, {"typ": "wahl", "frage": "Welcher Beleg aus dem Text stützt am besten die Behauptung „Billigmode geht auf Kosten der Arbeiterinnen“?", "optionen": ["Laut einem Handelsforscher arbeiten Näherinnen in Bangladesch sieben Tage pro Woche je zwölf Stunden, ohne Urlaub.", "Laut dem Text kamen am ersten Tag rund 40.000 Kundinnen und Kunden in die neue Berliner Filiale von Primark.", "Laut dem Text ist Primark in Großbritannien mit gut drei Milliarden Pfund Jahresumsatz bereits Marktführer.", "Laut dem Text kostet bei Primark kein einziges Kleidungsstück mehr als 35 Euro, egal ob Jeans oder Jacke."], "richtig": 0, "erklaerung": "Ein Beleg muss genau zur Behauptung passen. Die anderen Fakten stimmen zwar, beweisen aber etwas anderes."}, {"typ": "wahl", "frage": "In welchem Bereich besteht laut Text der dringendste Handlungsbedarf?", "optionen": ["Bei den Arbeits- und Umweltbedingungen in der Produktion, etwa in Bangladesch.", "Bei den Öffnungszeiten der Geschäfte, die für Berufstätige zu kurz sind.", "Bei der Zahl der Kassen, weil die Schlangen in den Filialen zu lang sind.", "Bei der Werbung in sozialen Medien, die Jugendliche zu Spontankäufen verleitet."], "richtig": 0, "erklaerung": "Der Text nennt lange Arbeitszeiten, fehlenden Urlaub und Mutterschutz sowie fehlende Umweltauflagen. Lange Schlangen an den Kassen kommen zwar vor, werden aber nicht als Problem dargestellt; Öffnungszeiten und Werbung, die zu Spontankäufen verleitet, sind kein Thema."}, {"typ": "wahl", "frage": "Welcher Appell passt zum Schluss deiner Rede?", "optionen": ["Liebe Mitglieder des Schulgemeinschaftsausschusses, bestellen Sie unsere Schul-T-Shirts bei einem Anbieter mit Fairtrade-Siegel – auch wenn sie ein paar Euro mehr kosten!", "Ich hoffe, meine Rede hat Ihnen gefallen und Sie denken beim nächsten Einkauf vielleicht ein bisschen darüber nach, woher Ihre Kleidung eigentlich kommt.", "Liebe Mitschülerinnen und Mitschüler, kauft halt einfach, was ihr wollt – ob fair oder billig, am Ende muss ja eh jeder selbst wissen, was ihm wichtig ist.", "Liebe Mitglieder des Schulgemeinschaftsausschusses, Primark ist übrigens ein irisches Unternehmen, dessen Zentrale in Dublin sitzt und das in Deutschland schon acht Filialen hat."], "richtig": 0, "erklaerung": "Der Appell richtet sich an das konkrete Publikum und fordert etwas Umsetzbares. Eine vage Hoffnung, ein saloppes „Kauft halt, was ihr wollt“ oder eine bloße Information über das Unternehmen sind kein Appell. Danach folgt der Dank für die Aufmerksamkeit."}]}, {"id": "mrv", "titel": "✏️ Schwache Beispiele verbessern", "aufgaben": [{"typ": "verbessern", "frage": "So beginnt eine Rede im Schulgemeinschaftsausschuss zum Thema Billig-T-Shirts.", "beispiel": "Hallo Leute! Ich halte jetzt eine Rede über T-Shirts.", "maengel": ["Die Anrede passt nicht zum Publikum.", "Ankündigung statt eines Einstiegs, der Interesse weckt", "kein Bezug zum Anlass und zur eigenen Rolle", "zu viele Zahlen"], "richtig": [0, 1, 2], "erklaerung": "Korrekte Anrede laut Situation, ein Einstieg, der neugierig macht, und der Anlass.", "tipps": ["Anrede passend zum Publikum", "Einstieg weckt Interesse", "Anlass und eigene Rolle genannt"], "muster": "Sehr geehrte Frau Direktorin, liebe Mitglieder des Schulgemeinschaftsausschusses! Zwei Euro fünfzig – so viel kostet bei manchen Diskontern ein T-Shirt. Als Schulsprecherin frage ich Sie: Wer bezahlt eigentlich den Rest?"}, {"typ": "verbessern", "frage": "Dieser Satz steht im Hauptteil der Rede.", "beispiel": "Aufgrund der Tatsache, dass die Produktion, welche überwiegend in Ländern stattfindet, in denen die Löhne, die die Arbeiterinnen erhalten, niedrig sind, ist festzustellen, dass Billigkleidung problematisch ist.", "maengel": ["Schachtelsatz – beim Zuhören kaum zu verstehen", "kein konkretes Beispiel und kein Beleg", "Das Publikum wird nicht angesprochen.", "viele Rechtschreibfehler"], "richtig": [0, 1, 2], "erklaerung": "Eine Rede wird gehört: kurze Sätze, konkrete Belege, direkte Ansprache, rhetorische Mittel.", "tipps": ["kurze Sätze", "konkreter Beleg", "Publikum direkt angesprochen", "ein rhetorisches Mittel"], "muster": "Billigmode hat einen hohen Preis. Nur zahlen ihn andere. Laut einem Handelsforscher arbeiten Näherinnen in Bangladesch sieben Tage pro Woche, zwölf Stunden am Tag. Stellen Sie sich das einmal vor: ohne Urlaub, ohne Pause."}, {"typ": "verbessern", "frage": "So endet die Rede.", "beispiel": "Ok, das wars. Kauft halt, was ihr wollt.", "maengel": ["kein konkreter Appell", "Umgangssprache", "Der Dank für die Aufmerksamkeit fehlt.", "keine Zusammenfassung des Wichtigsten", "Der Schluss ist zu lang."], "richtig": [0, 1, 2, 3], "erklaerung": "Schluss der Rede: Fazit – Appell – Dank.", "tipps": ["das Wichtigste zusammengefasst", "konkreter Appell", "Dank für die Aufmerksamkeit"], "muster": "Wir tragen unsere Schul-T-Shirts mit Stolz – sorgen wir dafür, dass sie niemandem schaden. Liebe Mitglieder des Ausschusses, bestellen Sie bei einem fairen Anbieter, auch wenn es ein paar Euro mehr kostet! Vielen Dank für Ihre Aufmerksamkeit."}]}]}, {"id": "stellungnahme", "gruppe": "Argumentieren und Stellung nehmen", "titel": "Stellungnahme", "symbol": "🙋", "kurz": "Eigene Meinung begründen – Vorstufe zu Erörterung und Kommentar.", "sets": [{"id": "st1", "titel": "Merkmale und Aufbau", "aufgaben": [{"typ": "reihenfolge", "frage": "Bring die Teile der Stellungnahme in die richtige Reihenfolge.", "elemente": ["Einleitung: Thema und Frage nennen", "Argument 1 mit Behauptung, Begründung und Beispiel", "Überleitung und stärkeres Argument 2", "Schluss: Meinung kurz zusammenfassen"], "erklaerung": "Ein Argument pro Absatz, vom schwächeren zum stärkeren, mit Überleitungen. Die Überschrift suchst du am besten zum Schluss."}, {"typ": "zuordnen", "frage": "Wofür verwendest du diese Formulierung?", "kategorien": ["Meinung", "Begründung", "Beispiel"], "elemente": [{"text": "Ich vertrete die Auffassung, dass …", "kat": 0}, {"text": "Meiner Meinung nach …", "kat": 0}, {"text": "Ein Grund dafür ist, dass …", "kat": 1}, {"text": "Dies liegt vor allem daran, dass …", "kat": 1}, {"text": "Aus eigener Erfahrung weiß ich, dass …", "kat": 2}, {"text": "Das zeigt sich zum Beispiel daran, dass …", "kat": 2}], "erklaerung": "Mit solchen Formulierungen machst du sichtbar, welcher Teil des Arguments gerade kommt."}, {"typ": "zuordnen", "frage": "Ist das Argument vollständig (Behauptung, Begründung, Beispiel)?", "kategorien": ["vollständig", "unvollständig"], "elemente": [{"text": "Sport in der Schule ist wichtig.", "kat": 1}, {"text": "Sport in der Schule ist wichtig, weil Bewegung die Konzentration fördert. In meiner Klasse sind nach dem Turnen alle deutlich wacher.", "kat": 0}, {"text": "Schuluniformen sind unfair, weil sie die Persönlichkeit einschränken.", "kat": 1}, {"text": "Ein gesundes Schulbuffet ist sinnvoll, weil viele Jugendliche sonst nur Süßes essen. An unserer Schule gibt es zum Beispiel fast nur Schokoriegel und Limonaden.", "kat": 0}], "erklaerung": "„Sport in der Schule ist wichtig.“ allein ist nur eine Behauptung. Der Satz über Schuluniformen hat eine Begründung, aber kein Beispiel."}, {"typ": "wahl", "frage": "Welche Überleitung kündigt ein noch wichtigeres Argument an?", "optionen": ["Besonders schwerwiegend ist jedoch, dass …", "Ein gutes Beispiel dafür ist etwa, dass …", "Zusammenfassend lässt sich sagen, dass …", "Zu Beginn sei zunächst erwähnt, dass …"], "richtig": 0, "erklaerung": "„Besonders schwerwiegend ist jedoch …“ zeigt die Steigerung zum stärksten Argument. Die anderen Formulierungen leiten ein Beispiel, den Schluss oder den Anfang ein."}, {"typ": "wahl", "frage": "Frage: „Sollen Handys im Unterricht erlaubt sein?“ – Welche Überschrift passt?", "optionen": ["Handy im Unterricht – Lernhilfe statt Ablenkung?", "Stellungnahme – meine Hausübung für Deutsch", "Handys sind voll super und gehören erlaubt!", "Meine Meinung zu einer interessanten Frage"], "richtig": 0, "erklaerung": "Die Überschrift nennt das Thema und macht neugierig. „Stellungnahme – meine Hausübung …“ und „Meine Meinung …“ sagen nichts über das Thema, und „voll super“ ist Umgangssprache."}, {"typ": "wahl", "frage": "Was gehört NICHT in den Schluss?", "optionen": ["ein neues Argument", "die zusammengefasste Meinung", "ein Ausblick", "eine Aufforderung"], "richtig": 0, "erklaerung": "Der Schluss ist kurz und bringt keine neuen Argumente."}, {"typ": "wahl", "frage": "Darfst du in der Stellungnahme „ich“ schreiben?", "optionen": ["Ja.", "Nein, nie.", "Nur in der Überschrift.", "Nur im Beispiel."], "richtig": 0, "erklaerung": "Es geht um deinen eigenen Standpunkt – die Ich-Form ist erlaubt."}]}]}, {"id": "inhaltsangabe", "gruppe": "Informieren und Beschreiben", "titel": "Inhaltsangabe", "symbol": "📚", "kurz": "Handlung knapp im Präsens – und im Schluss Absicht, Merkmale und Meinung.", "sets": [{"id": "ia1", "titel": "Merkmale und Aufbau", "aufgaben": [{"typ": "mehrfach", "frage": "Was gehört in die Einleitung einer Inhaltsangabe?", "optionen": ["Titel", "Autor/in", "Textsorte", "Hauptfigur(en)", "Ort und Zeit der Handlung (wenn erkennbar)", "Kernaussage in einem Satz", "ein wörtliches Zitat", "eine genaue Beschreibung des Aussehens der Figuren"], "richtig": [0, 1, 2, 3, 4, 5], "erklaerung": "Die Einleitung beantwortet die W-Fragen und fasst das Thema in einem Satz zusammen. Zitate und Beschreibungen gehören nicht hinein."}, {"typ": "wahl", "frage": "In welcher Zeitform schreibst du die Inhaltsangabe?", "optionen": ["Präsens – Vorzeitiges im Perfekt.", "Präteritum – Vorzeitiges im Plusquamperfekt.", "Präsens – Vorzeitiges im Präteritum.", "Perfekt – Vorzeitiges im Plusquamperfekt."], "richtig": 0, "erklaerung": "Auch wenn die Vorlage im Präteritum erzählt ist: Die Inhaltsangabe steht im Präsens, was davor geschah, im Perfekt. Präteritum und Plusquamperfekt übernimmst du nicht aus der Vorlage."}, {"typ": "wahl", "frage": "Die Geschichte ist

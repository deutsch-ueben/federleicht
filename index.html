"„Seit jeher beschäftigt die Menschheit die Frage nach dem Sinn von Hausübungen.“", "„Hausübungen sind ein Thema, über das man sehr viel diskutieren kann und auch soll.“"], "richtig": 0, "erklaerung": "Ein guter Einstieg ist konkret und macht neugierig. „Heutzutage“, „seit jeher“ und „ein Thema, über das man diskutieren kann“ sind Floskeln, die in jeden Text passen würden."}, {"typ": "mehrfach", "frage": "Welche Formulierungen sind typische KI-Floskeln?", "optionen": ["Es ist wichtig zu beachten, dass …", "Zusammenfassend lässt sich sagen, dass …", "… spielt eine entscheidende Rolle.", "In einer zunehmend vernetzten Welt …", "Laut dem Bericht von Julia Neuhauser …", "In meiner Klasse habe ich beobachtet, dass …"], "richtig": [0, 1, 2, 3], "erklaerung": "Diese Wendungen klingen gebildet, sagen aber wenig. Eine genaue Quellenangabe und eigene Beobachtungen sind dagegen konkret."}, {"typ": "verbessern", "frage": "So endet eine Erörterung, die eine KI geschrieben hat.", "beispiel": "Zusammenfassend lässt sich sagen, dass Hausübungen sowohl Vor- als auch Nachteile haben und es letztlich auf die individuelle Situation ankommt.", "maengel": ["Floskel („Zusammenfassend lässt sich sagen“)", "keine eigene Position – der Schluss bleibt unentschieden", "nichtssagend („kommt auf die individuelle Situation an“)", "zu viele Fachbegriffe"], "richtig": [0, 1, 2], "erklaerung": "Der Schluss einer Erörterung braucht eine klare, begründete Position – „kommt darauf an“ ist keine.", "tipps": ["keine Floskel", "klare eigene Position", "kurze Begründung oder Vorschlag"], "muster": "Hausübungen sollten bleiben – aber weniger und gezielter: Eine kurze Übung, die in der nächsten Stunde besprochen wird, hilft mehr als eine lange, die niemand kontrolliert. Deshalb sollten sich die Lehrkräfte einer Klasse bei der Menge absprechen."}]}, {"id": "at1", "titel": "Österreichisch statt deutsch", "info": "KIs lernen vor allem mit Texten aus Deutschland. Beides ist Standarddeutsch – in einem österreichischen Schultext nimmst du aber die österreichischen Wörter.", "aufgaben": [{"typ": "luecke", "frage": "Die KI schreibt: „Im Januar schreiben wir eine Klassenarbeit.“ – Mach den Satz österreichisch.", "satz": "Im {{}} schreiben wir eine {{}}.", "loesungen": [["Jänner"], ["Schularbeit"]], "erklaerung": "Januar → Jänner, Klassenarbeit → Schularbeit."}, {"typ": "luecke", "frage": "Die KI schreibt: „Nach dem Abitur möchte sie studieren.“ – Mach den Satz österreichisch.", "satz": "Nach der {{}} möchte sie studieren.", "loesungen": [["Matura"]], "erklaerung": "In Österreich heißt der Abschluss Matura (bzw. Reife- und Diplomprüfung an der HAK)."}, {"typ": "luecke", "frage": "Die KI schreibt: „Sie bekommt eine Eins in Deutsch.“ – Mach den Satz österreichisch.", "satz": "Sie bekommt ein {{}} in Deutsch.", "loesungen": [["Sehr gut"]], "erklaerung": "In Österreich heißen die Noten Sehr gut, Gut, Befriedigend, Genügend, Nicht genügend."}, {"typ": "zuordnen", "frage": "In Österreich üblich oder typisch für Deutschland?", "kategorien": ["in Österreich üblich", "typisch für Deutschland"], "elemente": [{"text": "Jänner", "kat": 0}, {"text": "Sackerl", "kat": 0}, {"text": "Schlagobers", "kat": 0}, {"text": "Marille", "kat": 0}, {"text": "Volksschule", "kat": 0}, {"text": "Gehsteig", "kat": 0}, {"text": "Tüte", "kat": 1}, {"text": "Sahne", "kat": 1}, {"text": "Aprikose", "kat": 1}, {"text": "Grundschule", "kat": 1}, {"text": "Bürgersteig", "kat": 1}], "erklaerung": "Wenn ein KI-Text „Tüte“, „Sahne“ oder „Grundschule“ schreibt, merkst du: Die KI denkt deutsch. Für deinen Schultext nimmst du das österreichische Wort."}, {"typ": "mehrfach", "frage": "Welche Sätze passen zu einer österreichischen Schule?", "optionen": ["Die Schularbeit ist am Montag.", "Nach der Volksschule wechselt sie in die Mittelschule.", "Im Mai beginnt die schriftliche Matura.", "Morgen schreiben wir eine Klausur in der 11. Klasse.", "Nach der Grundschule kommt sie auf die Realschule."], "richtig": [0, 1, 2], "erklaerung": "Klausur, „11. Klasse“, Grundschule und Realschule sind typisch für Deutschland."}, {"typ": "luecke", "frage": "Die KI schreibt: „Die Tüte mit den Tomaten liegt im Kühlschrank.“ – Mach den Satz österreichisch.", "satz": "Das {{}} mit den {{}} liegt im Kühlschrank.", "loesungen": [["Sackerl"], ["Paradeisern", "Paradeiser"]], "erklaerung": "Tüte → Sackerl, Tomaten → Paradeiser (mit den Paradeisern). Auch „Tomaten“ ist in Österreich verbreitet – „Sackerl“ und „Paradeiser“ zeigen aber sofort, dass der Text aus Österreich stammt."}]}]}, {"id": "ki_regeln", "gruppe": "Mit KI arbeiten", "titel": "Fair und sicher mit KI", "symbol": "🛡️", "kurz": "Datenschutz, Verantwortung und ehrlicher Umgang mit KI.", "sets": [{"id": "rg1", "titel": "Regeln und Verantwortung", "info": "Ob und wie du KI für eine Aufgabe verwenden darfst, sagt dir deine Lehrkraft. Diese Übung zeigt, worauf du dabei achten solltest.", "aufgaben": [{"typ": "mehrfach", "frage": "Was gibst du einer KI nicht?", "optionen": ["deinen vollen Namen und deine Adresse", "Fotos von dir oder anderen", "Passwörter", "Namen, Noten oder Texte von Mitschülerinnen und Mitschülern", "eine allgemeine Frage zur Beistrichsetzung", "die Aufgabenstellung einer Übung"], "richtig": [0, 1, 2, 3], "erklaerung": "Was du in eine KI eingibst, kann gespeichert werden. Persönliche Daten – deine und die von anderen – gehören nicht hinein."}, {"typ": "wahl", "frage": "In deinem Text steht ein falscher Fakt, den du von der KI übernommen hast. Wer ist verantwortlich?", "optionen": ["Ich – wer einen Text abgibt, ist für den Inhalt verantwortlich.", "Die KI – sie hat den falschen Fakt ja schließlich erfunden.", "Die Firma, die die KI entwickelt hat und für Fehler haftet.", "Niemand – Fehler einer KI kann man keinem Menschen vorwerfen."], "richtig": 0, "erklaerung": "Die KI ist ein Werkzeug. Prüfen und entscheiden musst du – wer abgibt, trägt die Verantwortung, nicht die KI oder ihr Hersteller."}, {"typ": "wahl", "frage": "Du hast für eine Hausübung Ideen von einer KI verwendet. Was ist fair?", "optionen": ["Ich halte mich an die Regeln meiner Lehrkraft und gebe an, wofür ich die KI benutzt habe.", "Ich verschweige es, weil ich die Ideen ja selbst ausformuliert und in eigene Worte gebracht habe.", "Ich sage es nur, wenn meine Lehrkraft direkt nachfragt – von mir aus muss ich nichts angeben.", "Ich behaupte, alles allein gemacht zu haben, weil Ideen sammeln ohnehin nicht zählt."], "richtig": 0, "erklaerung": "Ob und wie KI erlaubt ist, entscheidet deine Lehrkraft. Ehrlich und von dir aus angeben, wobei die KI geholfen hat – so wie man auch eine Quelle angibt. Auch eigene Formulierungen ändern nichts daran, dass die Ideen nicht von dir stammen."}, {"typ": "zuordnen", "frage": "Sinnvolle oder nicht sinnvolle Nutzung beim Schreiben?", "kategorien": ["sinnvoll", "nicht sinnvoll"], "elemente": [{"text": "Ideen sammeln, bevor ich selbst schreibe", "kat": 0}, {"text": "mir eine Grammatikregel erklären lassen", "kat": 0}, {"text": "Feedback holen und selbst überarbeiten", "kat": 0}, {"text": "bei einer Schularbeit heimlich den Text schreiben lassen", "kat": 1}, {"text": "Fakten aus der KI ungeprüft übernehmen", "kat": 1}, {"text": "persönliche Daten anderer eingeben", "kat": 1}], "erklaerung": "Die KI kann beim Denken und Üben helfen – das Denken und Prüfen nimmt sie dir nicht ab."}, {"typ": "wahl", "frage": "Warum lohnt es sich trotzdem, selbst gut schreiben zu können?", "optionen": ["Bei Schularbeit und Matura schreibst du ohne KI – und nur wer selbst schreiben kann, erkennt, ob ein KI-Text gut ist.", "Es lohnt sich kaum, weil die KI bald ohnehin alle Texte für uns schreiben wird, auch bei Schularbeit und Matura.", "Nur wegen der Handschrift – inhaltlich kann die KI ohnehin alles besser formulieren als du.", "Damit die KI weniger zu tun hat und ihre Antworten auf deine Aufträge schneller fertig werden."], "richtig": 0, "erklaerung": "Bei Schularbeit und Matura schreibst du ohne KI. Wer selbst schreiben kann, kann KI-Texte beurteilen, verbessern und sinnvoll nutzen – das nimmt dir die KI nicht ab."}, {"typ": "wahl", "frage": "Eine Mitschülerin bittet dich, ihren Aufsatz für Feedback in eine KI einzugeben. Was ist richtig?", "optionen": ["Sie entscheidet selbst und gibt ihn selbst ein – ohne Namen und persönliche Angaben im Text.", "Ich gebe den Aufsatz samt ihrem Namen ein, damit die KI weiß, wem sie Feedback geben soll.", "Ich gebe gleich die Aufsätze der ganzen Klasse ein, dann bekommen alle auf einmal Feedback.", "Ich gebe ihn ein und poste die Antwort der KI in den Klassenchat, damit alle davon lernen."], "richtig": 0, "erklaerung": "Texte anderer gibst du nicht ohne deren Zustimmung in eine KI ein – und Namen und persönliche Angaben gehören nie hinein."}]}, {"id": "rg2", "titel": "KI-Nutzung angeben", "info": "Ob und wie du eine KI verwenden darfst, sagt dir deine Lehrkraft. Wenn du sie verwendest, gibst du an, wofür – ehrlich und genau.", "aufgaben": [{"typ": "wahl", "frage": "Warum gibt man an, wofür man eine KI verwendet hat?", "optionen": ["Damit die Lehrkraft sieht, was deine eigene Leistung ist – genau wie bei einer Quellenangabe.", "Damit die KI-Firma dafür bezahlt wird, dass ihr Programm in der Schule verwendet wurde.", "Damit die Lehrkraft weiß, dass alle Fakten im Text bereits von der KI geprüft wurden.", "Das ist nur eine Formsache, die mit der Bewertung des Textes nichts zu tun hat."], "richtig": 0, "erklaerung": "Eine KI-Angabe ist wie eine Quellenangabe: Sie macht sichtbar, was von dir stammt. Für die Richtigkeit der Fakten bist trotzdem du verantwortlich."}, {"typ": "wahl", "frage": "Welcher Vermerk am Ende deiner Hausübung ist gelungen?", "optionen": ["KI-Nutzung: Copilot, 14. 11. 2026, Ideensammlung zu Gegenargumenten. Formulierung und Überarbeitung: selbst.", "Quelle: Copilot – der ganze Text wurde von der KI geprüft, also stimmt alles, was darin steht.", "Hilfsmittel: Internet, Bücher, KI und meine Freunde – genauer kann ich es leider nicht sagen.", "KI-Nutzung: keine, denn die Ideen von Copilot habe ich in meine eigenen Worte umgeschrieben."], "richtig": 0, "erklaerung": "Ein guter Vermerk nennt das Werkzeug, das Datum, wofür du die KI verwendet hast und was du selbst gemacht hast. Ideen in eigene Worte zu bringen, macht sie nicht zu deinen."}, {"typ": "mehrfach", "frage": "Was gehört in einen KI-Vermerk?", "optionen": ["welches KI-Werkzeug du verwendet hast", "wofür du es verwendet hast", "wann du es verwendet hast", "was du selbst gemacht hast", "dein Passwort für das KI-Werkzeug", "deine Adresse und deine Telefonnummer"], "richtig": [0, 1, 2, 3], "erklaerung": "Werkzeug, Zweck, Datum, eigene Leistung. Wenn deine Lehrkraft es verlangt, legst du auch deine Aufträge an die KI bei. Passwörter und persönliche Daten gehören nie hinein."}, {"typ": "wahl", "frage": "Für eine Hausübung war KI nicht erlaubt. Du hast sie trotzdem kurz zum Prüfen der Beistriche verwendet. Was ist fair?", "optionen": ["Ich sage es offen – die Regel meiner Lehrkraft gilt auch dann, wenn ich die KI nur kurz verwendet habe.", "Ich sage nichts, weil die KI nur ein paar Beistriche geprüft hat und das sowieso niemand merken würde.", "Ich sage nichts, weil die Rechtschreibprüfung im Schreibprogramm im Grunde dasselbe macht wie eine KI.", "Ich lösche alle Beistriche, die die KI vorgeschlagen hat – dann gilt die Hausübung als ohne KI gemacht."], "richtig": 0, "erklaerung": "Ehrlichkeit ist hier wichtiger als die Größe der Hilfe. Und das Gespräch mit der Lehrkraft lohnt sich: Vielleicht ist so eine Hilfe beim nächsten Mal ausdrücklich erlaubt."}, {"typ": "wahl", "frage": "Wo gibst du die KI-Nutzung am besten an?", "optionen": ["am Ende des Textes in einem kurzen Vermerk – oder so, wie es die Lehrkraft verlangt", "gar nicht, solange niemand ausdrücklich fragt, ob ich eine KI verwendet habe", "nur mündlich, nachdem die Lehrkraft den Text schon fertig bewertet hat", "im Dateinamen, zum Beispiel „Leserbrief_mit_KI_final.docx“, das genügt"], "richtig": 0, "erklaerung": "Der Vermerk gehört sichtbar zum Text, damit die Lehrkraft ihn beim Lesen kennt. Gibt deine Lehrkraft eine Form vor, gilt diese."}, {"typ": "verbessern", "frage": "Dieser Vermerk steht unter einer Hausübung.", "beispiel": "KI wurde verwendet.", "maengel": ["Das Werkzeug fehlt.", "Es fehlt, wofür die KI verwendet wurde.", "Es fehlt, was du selbst gemacht hast.", "Der Vermerk ist zu höflich formuliert."], "richtig": [0, 1, 2], "erklaerung": "Ein Vermerk ohne Angaben hilft niemandem: Die Lehrkraft kann nicht erkennen, was deine eigene Leistung ist.", "tipps": ["Werkzeug und Datum", "wofür die KI verwendet wurde", "was du selbst gemacht hast"], "muster": "KI-Nutzung: Copilot, 14. 11. 2026 – Erklärung der Beistrichregel vor „dass“ und Rückmeldung zu meinen Argumenten. Text, Argumente und Überarbeitung: selbst."}]}]}, {"id": "erlebniserzaehlung", "gruppe": "Erzählen", "titel": "Erlebniserzählung", "symbol": "🎢", "kurz": "Spannungsbogen, Höhepunkt und lebendig erzählen – zeigen statt sagen.", "sets": [{"id": "ee1", "titel": "Spannungsbogen und Aufbau", "aufgaben": [{"typ": "reihenfolge", "frage": "Bring die Teile der Erzählung in die richtige Reihenfolge.", "elemente": ["Es war der erste warme Samstag im Mai, und ich wollte mit meiner Schwester Lea an den See radeln.", "Als ich das Rad aus dem Keller holen wollte, war der Schlüssel für das Fahrradschloss verschwunden.", "Wir durchsuchten die Jackentaschen, den Schreibtisch und sogar den Mistkübel – nichts.", "Da hörte ich ein leises Klimpern: Unser Hund Bello trug den Schlüssel stolz im Maul durch den Garten.", "Lachend fuhren wir eine Stunde später los – und seitdem hängt der Schlüssel an einem Haken neben der Tür."], "erklaerung": "Einleitung (wer, wann, wo, erstes Spannungsmoment) – Steigerung – Höhepunkt – kurzer Schluss."}, {"typ": "wahl", "frage": "Wie viele Erlebnisse erzählst du in einer Erlebniserzählung?", "optionen": ["Eines – mit einem klaren Höhepunkt.", "Zwei – damit die Spannung länger anhält.", "Mehrere – jedes mit einem eigenen Höhepunkt.", "Drei – für jeden Absatz ein eigenes."], "richtig": 0, "erklaerung": "Nur EIN Erlebnis, logisch erzählt – keine Kette von Katastrophen mit mehreren Höhepunkten."}, {"typ": "wahl", "frage": "In welcher Zeitform erzählst du?", "optionen": ["Im Präteritum – am Höhepunkt ist ein bewusster Wechsel ins Präsens möglich, danach zurück.", "Im Präsens – nur Einleitung und Schluss stehen im Präteritum, damit es spannend bleibt.", "Im Perfekt („Wir sind gegangen …“) – so klingt die Erzählung natürlich und lebendig.", "Im Präteritum – an spannenden Stellen wechselst du beliebig oft ins Perfekt oder Präsens."], "richtig": 0, "erklaerung": "Erzählzeit ist das Präteritum. Ein Wechsel ins Präsens nur bewusst am Höhepunkt – nie ohne Grund und nicht beliebig oft. Das Perfekt gehört in die gesprochene Sprache, nicht in die Erzählung."}, {"typ": "wahl", "frage": "Welche Überschrift passt am besten?", "optionen": ["Bello, der Schlüsseldieb", "Mein Samstag im Mai", "Ein aufregendes Erlebnis", "Wie Bello den Schlüssel stahl und wir ihn nach einer Stunde wiederfanden"], "richtig": 0, "erklaerung": "Kurz, treffend, macht neugierig – verrät aber nicht alles. Allgemeine Überschriften sagen nichts über das Geschehen, eine lange verrät schon das Ende."}, {"typ": "wahl", "frage": "Was macht einen guten Schluss aus?", "optionen": ["Er rundet knapp ab: Ergebnis, Stimmung danach oder kurzer Rückblick – ohne neue Personen oder Orte.", "Er erzählt knapp, wie es am nächsten Tag weiterging, und führt dafür eine neue Figur ein.", "Er ist der ausführlichste Teil: Alle Gefühle und Gedanken werden noch einmal genau geschildert.", "Er lässt bewusst offen, wie die Handlung ausgeht, damit die Leser selbst weiterdenken können."], "richtig": 0, "erklaerung": "Der Schluss ist kurz, bringt keine neuen Personen oder Orte und lässt keine Fragen zur Handlung offen – ein offenes Ende passt zur Kurzgeschichte, nicht zur Erlebniserzählung. Ausführlich gestaltet wird der Höhepunkt."}]}, {"id": "ee2", "titel": "Lebendig erzählen", "info": "Zeigen statt sagen: Statt „Ich hatte Angst“ erzählst du, was man sieht, hört und spürt – dann erleben die Leser mit.", "aufgaben": [{"typ": "zuordnen", "frage": "Wird das Gefühl nur behauptet – oder kann man es miterleben?", "kategorien": ["nur behauptet", "miterlebbar"], "elemente": [{"text": "Ich war nervös.", "kat": 0}, {"text": "Meine Hände zitterten, und mein Herz klopfte bis zum Hals.", "kat": 1}, {"text": "Es war kalt.", "kat": 0}, {"text": "Der Wind biss mir in die Wangen, und mein Atem stand als weiße Wolke vor mir.", "kat": 1}, {"text": "Er war wütend.", "kat": 0}, {"text": "Er knallte die Tür so fest zu, dass die Gläser im Kasten klirrten.", "kat": 1}], "erklaerung": "Körperreaktionen, Handlungen und Sinneseindrücke zeigen Gefühle – die Leser schließen selbst darauf."}, {"typ": "zuordnen", "frage": "Welcher Sinn wird angesprochen?", "kategorien": ["Sehen", "Hören", "Riechen", "Schmecken", "Fühlen"], "elemente": [{"text": "Am Horizont türmten sich schwarze Wolken.", "kat": 0}, {"text": "Irgendwo klirrte Glas.", "kat": 1}, {"text": "Es roch nach verbranntem Toast.", "kat": 2}, {"text": "Die Limonade schmeckte süß und klebrig.", "kat": 3}, {"text": "Der Sand war glühend heiß unter meinen Füßen.", "kat": 4}], "erklaerung": "Sinneseindrücke machen eine Erzählung anschaulich – passend zum Thema und nicht übertrieben."}, {"typ": "mehrfach", "frage": "Welche Verben sind treffender als „gehen“?", "optionen": ["schlendern", "hasten", "schleichen", "stolpern", "machen", "tun"], "richtig": [0, 1, 2, 3], "erklaerung": "Ein treffendes Verb zeigt gleich, WIE sich jemand bewegt – und wie es ihm dabei geht."}, {"typ": "mehrfach", "frage": "Welche Redebegleitverben sind lebendiger als „sagte“?", "optionen": ["flüsterte", "brüllte", "murmelte", "stammelte", "tat", "machte"], "richtig": [0, 1, 2, 3], "erklaerung": "Abwechslungsreiche Redebegleitverben zeigen, wie etwas gesagt wird."}, {"typ": "wahl", "frage": "Welche Stelle baut am meisten Spannung auf?", "optionen": ["Ich drückte die Klinke. Die Tür knarrte. Dunkel. Totenstill.", "Ich drückte die Klinke, und die Tür ging auf, und es war dunkel, und es war auch still.", "Ich öffnete die Tür, und es war dunkel und still, aber sonst nichts Besonderes.", "Die Tür war offen, und im Zimmer war es dunkel und ruhig."], "richtig": 0, "erklaerung": "Kurze Sätze, Ellipsen und Pausen erhöhen das Tempo und die Spannung. Lange, mit „und“ verbundene Sätze und nüchterne Feststellungen bremsen sie."}, {"typ": "wahl", "frage": "Welche Satzanfänge sind am besten?", "optionen": ["Plötzlich … Mit einem Ruck … Hinter mir …", "Dann sah ich … Dann hörte ich … Und dann …", "Ich ging … Ich sah … Ich hörte … Ich lief …", "Und plötzlich … Und dann … Und danach …"], "richtig": 0, "erklaerung": "Jeder Satz beginnt mit dem wichtigsten Satzglied – und die Anfänge wechseln ab. Immer gleiche Anfänge mit „Dann“, „Ich“ oder „Und“ wirken eintönig."}]}, {"id": "eev", "titel": "✏️ Schwache Beispiele verbessern", "aufgaben": [{"typ": "verbessern", "frage": "Diese Stelle stammt aus einer Erlebniserzählung über einen Abend im Wald.", "beispiel": "Dann gingen wir in den Wald. Dann sahen wir etwas. Dann hatten wir Angst. Dann liefen wir weg.", "maengel": ["immer gleiche Satzanfänge („Dann“)", "Gefühl nur behauptet („hatten Angst“) statt gezeigt", "keine Sinneseindrücke", "ungenau („etwas“)", "falsche Zeitform"], "richtig": [0, 1, 2, 3], "erklaerung": "Präteritum ist richtig. Aber: Abwechslung, Genauigkeit und Sinneseindrücke fehlen.", "tipps": ["abwechslungsreiche Satzanfänge", "Gefühl gezeigt statt behauptet", "mindestens ein Sinneseindruck", "genau, was zu sehen oder hören ist"], "muster": "Kaum hatten wir den Waldrand erreicht, knackte hinter uns ein Ast. Zwischen den Stämmen bewegte sich ein dunkler Schatten. Mein Herz hämmerte, und ohne ein Wort rannten Lena und ich los, bis die Lichter des Dorfes vor uns auftauchten."}, {"typ": "verbessern", "frage": "So sieht der Höhepunkt einer Erzählung über ein Fußballspiel aus.", "beispiel": "Dann kam der spannendste Moment meines Lebens, und es war sehr aufregend. Danach war alles wieder gut.", "maengel": ["Der Höhepunkt wird nur behauptet, nicht erzählt.", "keine Gefühle, Gedanken oder Sinneseindrücke", "viel zu knapp für einen Höhepunkt", "zu viele Adjektive"], "richtig": [0, 1, 2], "erklaerung": "Der Höhepunkt ist der ausführlichste, anschaulichste Teil der Erzählung.", "tipps": ["Was genau passiert?", "Gefühle und Gedanken", "kurze Sätze für Tempo"], "muster": "Der Schiedsrichter legte sich den Ball zurecht. Elfmeter, letzte Minute – und ich stand im Tor. Ich hörte nur noch mein eigenes Atmen. Der Schütze lief an, ich warf mich nach links und spürte, wie der Ball gegen meine Finger prallte. Einen Augenblick lang war es still, dann brach unsere Tribüne in Jubel aus."}, {"typ": "verbessern", "frage": "Diese Sätze stammen aus einer Erzählung über einen Kinobesuch.", "beispiel": "Wir kamen beim Kino an. Die Schlange ist riesig und ich habe keine Lust mehr. Dann haben wir unseren Lehrer gesehen.", "maengel": ["unbegründeter Wechsel zwischen Präteritum, Präsens und Perfekt", "Satzanfang „Dann“", "zu viel wörtliche Rede"], "richtig": [0, 1], "erklaerung": "Die Erzählzeit bleibt das Präteritum – ein Wechsel nur bewusst am Höhepunkt.", "tipps": ["durchgehend Präteritum", "abwechslungsreiche Satzanfänge", "anschaulich statt nur aufgezählt"], "muster": "Als wir beim Kino ankamen, reichte die Schlange bis auf den Gehsteig. Ich hatte schon fast keine Lust mehr, da entdeckten wir plötzlich unseren Deutschlehrer ganz vorne in der Reihe."}]}]}, {"id": "innerer_monolog", "gruppe": "Erzählen", "titel": "Innerer Monolog & Perspektive", "symbol": "💭", "kurz": "Gedanken in der Ich-Form – und dieselbe Szene aus einer anderen Sicht.", "sets": [{"id": "im1", "titel": "Merkmale", "aufgaben": [{"typ": "wahl", "frage": "In welcher Form schreibst du einen inneren Monolog?", "optionen": ["Ich-Form, Präsens – Erinnerungen in der Vergangenheit.", "Er-Form, Präteritum – die Gedanken stehen in Anführungszeichen.", "Ich-Form, Präteritum – wie in einer Erlebniserzählung.", "Dialogform, Präsens – mit viel wörtlicher Rede der anderen."], "richtig": 0, "erklaerung": "Der innere Monolog gibt die Gedanken einer Figur in dem Moment wieder, in dem sie sie denkt – darum Ich-Form und Präsens. Er ist weder eine Erzählung im Präteritum noch eine Dialogszene."}, {"typ": "mehrfach", "frage": "Was gehört zur „Gedankensprache“?", "optionen": ["Fragen an sich selbst", "Ausrufe", "unvollständige Sätze", "Gedankenstriche und Auslassungspunkte", "Erzählerkommentare („Er dachte nach.“)", "lange, sachliche Erklärungen"], "richtig": [0, 1, 2, 3], "erklaerung": "Gedanken sind sprunghaft, emotional und oft unvollständig – so klingt ein innerer Monolog echt."}, {"typ": "zuordnen", "frage": "Innerer Monolog oder Erzählung?", "kategorien": ["innerer Monolog", "Erzählung"], "elemente": [{"text": "Warum schaut die mich so an? Hab ich was im Gesicht?", "kat": 0}, {"text": "Mist. Mist. Mist! Das Handy – zu Hause.", "kat": 0}, {"text": "Sie fragte sich, warum die anderen sie ansahen.", "kat": 1}, {"text": "Er hatte sein Handy zu Hause vergessen.", "kat": 1}], "erklaerung": "Der innere Monolog steht in der Ich-Form und im Präsens, mitten in den Gedanken – ohne Erzähler."}, {"typ": "wahl", "frage": "Wie entwickeln sich die Gedanken in einem inneren Monolog?", "optionen": ["Auslöser – Zuspitzung – Entscheidung, Erkenntnis oder offene Frage", "Einleitung – Hauptteil mit drei Argumenten – Schluss mit Fazit", "Basissatz – Kernaussagen in zeitlicher Reihenfolge – kein Schluss", "Schlagzeile – Lead mit den W-Fragen – Hauptteil mit Hintergründen"], "richtig": 0, "erklaerung": "Gedankensprünge sind erlaubt, aber ein roter Faden bleibt erkennbar: Ein Auslöser setzt die Gedanken in Gang, sie spitzen sich zu und enden in einer Entscheidung, einer Erkenntnis oder einer offenen Frage. Die anderen Abläufe gehören zu Erörterung, Zusammenfassung und Bericht."}, {"typ": "wahl", "frage": "Die Figur weiß nicht, dass ihr Freund hinter ihr steht. Darf sie im inneren Monolog darüber nachdenken?", "optionen": ["Nein – sie weiß nur, was sie selbst wahrnimmt oder weiß.", "Ja – der Leser soll ja erfahren, was hinter ihr passiert.", "Ja – im inneren Monolog weiß die Figur alles, was auch der Autor weiß.", "Nur am Ende – dort darf sie die Auflösung schon vorwegnehmen."], "richtig": 0, "erklaerung": "Die Figur bleibt in ihrem Wissensstand – auch wenn die Leser etwas erfahren sollen oder es spannender wäre. Sonst bricht die Perspektive."}]}, {"id": "im2", "titel": "Originaltext: Spaghetti für zwei", "originaltext": {"titel": "Spaghetti für zwei", "info": "Kurzgeschichte von Federica de Cesco", "situation": "Schreib den inneren Monolog von Heinz in dem Moment, in dem er seine kalte Suppe auf dem Nebentisch entdeckt – oder erzähl die Szene aus Marcels Sicht."}, "aufgaben": [{"typ": "wahl", "frage": "Welcher Anfang passt zu einem inneren Monolog von Heinz?", "optionen": ["Moment mal … da drüben … eine Gemüsesuppe? Ganz allein auf dem Tablett. Kalt. Oh nein. Das ist … meine Suppe! Dann hab ich die ganze Zeit …", "Heinz sah auf dem Nebentisch einen Teller kalter Gemüsesuppe. Er erschrak, wurde rot und begriff, dass er sich geirrt hatte.", "Ich sah auf dem Nebentisch einen Teller kalter Suppe stehen. Mir wurde heiß, und ich merkte, dass das meine Suppe war.", "Ich drehte mich zu ihm und sagte: „Schauen Sie, da drüben steht meine Suppe! Dann habe ich ja die ganze Zeit Ihre gegessen.“"], "richtig": 0, "erklaerung": "Ich-Form, Präsens, Gedankensprache mit Auslassungen und Ausrufen. Die anderen Anfänge erzählen im Präteritum – in der Er- oder Ich-Form – oder machen aus den Gedanken wörtliche Rede."}, {"typ": "mehrfach", "frage": "Was kann Heinz in diesem Moment denken, ohne seinen Wissensstand zu verlassen?", "optionen": ["dass er sich an den falschen Tisch gesetzt hat", "dass er die Suppe des Fremden gegessen hat", "dass ihm die Situation furchtbar peinlich ist", "dass der Fremde Marcel heißt", "dass Marcel ihn morgen wiedersehen will"], "richtig": [0, 1, 2], "erklaerung": "Den Namen Marcel und die Einladung erfährt Heinz erst später – das kann er jetzt noch nicht wissen."}, {"typ": "wahl", "frage": "Du erzählst die Szene aus Marcels Sicht. Welcher Gedanke passt zu ihm?", "optionen": ["Der Junge isst einfach aus meinem Teller … Na gut, ich sag nichts. Mal sehen, was er als Nächstes macht.", "Der Junge isst aus meinem Teller … Das ist mir zu unheimlich. Ich lasse alles stehen und gehe sofort.", "Aha, das ist also Heinz aus der Schule gegenüber, bald vierzehn … Was will der bloß mit meiner Suppe?", "Der Junge isst aus meinem Teller! Jetzt reicht’s – ich sag ihm laut die Meinung, alle sollen es hören."], "richtig": 0, "erklaerung": "Der Gedanke passt zu Marcels ruhigem, schweigsamem Verhalten im Text. Weggehen oder lautes Schimpfen widerspricht der Geschichte, und Heinz’ Namen kann Marcel nicht kennen."}, {"typ": "wahl", "frage": "Was weiß Marcel, das Heinz lange nicht weiß?", "optionen": ["Dass Heinz an seinem Tisch sitzt und von seiner Suppe isst.", "Dass Heinz nur wenig Geld für das Mittagessen ausgeben will.", "Dass Heinz mittags nicht nach Hause kann, weil die Busse ungünstig fahren.", "Dass Heinz ihn für einen Asylbewerber hält, der kein Deutsch kann."], "richtig": 0, "erklaerung": "Darin liegt der Reiz des Perspektivenwechsels: Marcel weiß von Anfang an, wessen Suppe es ist – Heinz erst beim Blick auf den Nebentisch. Was Heinz ausgeben will, wie seine Busse fahren und was er über Marcel denkt, weiß Heinz selbst."}, {"typ": "verbessern", "frage": "Das soll ein innerer Monolog von Heinz sein – in dem Moment, in dem er den Fremden an seinem Platz sitzen sieht.", "beispiel": "Heinz dachte nach. Er war verwirrt. Er fragte sich, was er jetzt tun sollte.", "maengel": ["3. Person statt Ich-Form", "Präteritum statt Präsens", "keine Gedankensprache (Fragen, Ausrufe, Brüche)", "Gefühle werden nur benannt", "zu viel Umgangssprache"], "richtig": [0, 1, 2, 3], "erklaerung": "Im inneren Monolog sind wir mitten in Heinz’ Kopf – in der Ich-Form und im Präsens.", "tipps": ["Ich-Form und Präsens", "Fragen, Ausrufe, unvollständige Sätze", "Abwägen: Was soll ich tun?"], "muster": "Was? Der sitzt auf meinem Platz – und isst meine Suppe! Soll ich ihn anschreien? Alle schauen schon … Nein, dann glauben die, ich bin ein Rassist. Aber einfach gehen? Sicher nicht. Okay. Ruhig bleiben. Ich setz mich einfach dazu und ess mit."}]}]}, {"id": "fabel", "gruppe": "Erzählen", "titel": "Fabel", "symbol": "🦊", "kurz": "Sprechende Tiere, ein Konflikt – und eine Lehre, die genau passt.", "sets": [{"id": "fa1", "titel": "Merkmale und Lehre", "beilage": {"titel": "Die Schnecke und der Hase", "info": "Übungsfabel (erfunden)", "absaetze": ["Ein Hase sah eine Schnecke, die mühsam einen Stein hinaufkroch. „Du kommst ja nie an“, spottete er. „Ich laufe dreimal um die Wiese, bevor du oben bist.“ Die Schnecke antwortete nicht und kroch weiter.", "Der Hase raste los, sprang hierhin und dorthin und prahlte vor allen Tieren mit seiner Schnelligkeit. Als die Sonne unterging, war er so erschöpft, dass er sich unter einen Busch legte und einschlief.", "Am nächsten Morgen sah er die Schnecke oben auf dem Stein sitzen. „Ich bin langsam“, sagte sie, „aber ich weiß, wohin ich will.“", "Wer nur prahlt und kein Ziel hat, kommt nirgendwo an."]}, "aufgaben": [{"typ": "mehrfach", "frage": "Was ist typisch für eine Fabel?", "optionen": ["Tiere handeln und sprechen", "Tiere haben menschliche Eigenschaften", "ein Konflikt mit einer Wendung", "eine Lehre (Moral)", "lange Naturbeschreibungen", "Menschen als Hauptfiguren"], "richtig": [0, 1, 2, 3], "erklaerung": "Die Fabel ist kurz und zielt auf die Lehre – Beschreibungen bleiben knapp."}, {"typ": "zuordnen", "frage": "Welche Eigenschaft haben diese Tiere in Fabeln meistens?", "kategorien": ["listig", "mächtig", "fleißig", "schwach und unschuldig"], "elemente": [{"text": "Fuchs", "kat": 0}, {"text": "Löwe", "kat": 1}, {"text": "Ameise", "kat": 2}, {"text": "Biene", "kat": 2}, {"text": "Lamm", "kat": 3}], "erklaerung": "Fabeltiere stehen für menschliche Eigenschaften – so erkennt man sofort ihre Rolle."}, {"typ": "reihenfolge", "frage": "Ordne den Aufbau der Übungsfabel.", "elemente": ["Ausgangssituation: Der Hase sieht die Schnecke am Stein.", "Konflikt: Der Hase verspottet die Schnecke.", "Handlung: Der Hase rennt und prahlt, bis er erschöpft einschläft.", "Wendung: Am Morgen sitzt die Schnecke oben auf dem Stein.", "Lehre: Wer nur prahlt und kein Ziel hat, kommt nirgendwo an."], "erklaerung": "Ausgangssituation – Konflikt (Rede und Gegenrede) – Handlung – Wendung – Lehre."}, {"typ": "wahl", "frage": "Welche Lehre passt ebenfalls zu dieser Fabel?", "optionen": ["Ausdauer bringt weiter als Angeberei.", "Wer schnell ist, kommt immer zuerst ans Ziel.", "Wer müde ist, soll sich rechtzeitig ausruhen.", "Langsame werden von anderen immer verspottet."], "richtig": 0, "erklaerung": "Die Lehre muss genau zur Handlung passen und verallgemeinern, was die Geschichte zeigt: Der prahlende Hase kommt nicht an, die ausdauernde Schnecke schon. Eine Lehre, die nur ein Detail aufgreift oder der Handlung widerspricht, passt nicht."}, {"typ": "verbessern", "frage": "Das soll eine Fabel sein.", "beispiel": "Ein Mann ging in den Wald und traf einen Bären. Der Bär war groß. Die Moral ist: Man soll vorsichtig sein.", "maengel": ["Ein Mensch ist Hauptfigur statt zweier Tiere.", "kein Konflikt, keine Rede und Gegenrede", "Die Lehre ergibt sich nicht aus der Handlung.", "falsche Zeitform"], "richtig": [0, 1, 2], "erklaerung": "Das Präteritum stimmt. Es fehlen aber Tierfiguren mit Eigenschaften, ein Konflikt und eine Lehre, die aus der Handlung folgt.", "tipps": ["zwei Tiere mit typischen Eigenschaften", "Konflikt mit wörtlicher Rede", "Wendung", "Lehre, die genau passt"], "muster": "Ein Bär plünderte jeden Tag den Bienenstock. „Ihr seid klein, ich bin stark“, brummte er. Die Bienen schwiegen, sammelten sich – und flogen eines Tages alle zugleich auf ihn los. Seither macht der Bär einen großen Bogen um ihren Baum.\nGemeinsam sind auch die Kleinen stark."}]}]}, {"id": "krimi", "gruppe": "Erzählen", "titel": "Krimi", "symbol": "🧩", "kurz": "Tat, Spuren, falsche Fährten, Motiv, Alibi – und eine logische Auflösung.", "sets": [{"id": "kr1", "titel": "Der verschwundene Pokal", "beilage": {"titel": "Der verschwundene Pokal", "info": "Mini-Krimi (erfunden)", "absaetze": ["Am Montagmorgen war die Vitrine in der Aula leer: Der Fußballpokal der Schule war verschwunden. Das Glas war nicht zerbrochen.", "Verdächtig waren drei Personen: Schulwart Huber, der einen Schlüssel zur Vitrine besaß; Tom aus der 2B, der am Freitag lange vor der Vitrine gestanden war; und Kai aus der 4A, der sich lautstark geärgert hatte, weil er nicht in die Schulmannschaft aufgenommen worden war.", "Klassensprecherin Mia begann zu ermitteln. Herr Huber zeigte ihr seinen Schlüsselbund – der Vitrinenschlüssel fehlte, er hatte ihn am Freitag verloren. Tom hatte ein Alibi: Er war am Freitagnachmittag beim Zahnarzt, das bestätigte die Praxis. Vor der Vitrine fand Mia getrocknete Erdbrocken mit dem Muster von Stollenschuhen.", "Am Nachmittag trainierte Kai allein auf dem Fußballplatz. Aus seiner Sporttasche fiel ein kleiner Schlüssel – der Vitrinenschlüssel. Kai gab zu, ihn gefunden und den Pokal aus Wut versteckt zu haben. Der Pokal stand unversehrt in seinem Spind."]}, "aufgaben": [{"typ": "zuordnen", "frage": "Was ist das im Krimi?", "kategorien": ["Hinweis", "falsche Spur", "Motiv", "Alibi"], "elemente": [{"text": "Das Glas war nicht zerbrochen – die Vitrine wurde aufgesperrt.", "kat": 0}, {"text": "Erdbrocken mit dem Muster von Stollenschuhen", "kat": 0}, {"text": "Tom stand am Freitag lange vor der Vitrine.", "kat": 1}, {"text": "Kai ärgerte sich, weil er nicht in die Mannschaft kam.", "kat": 2}, {"text": "Tom war beim Zahnarzt, die Praxis bestätigt es.", "kat": 3}], "erklaerung": "Hinweise führen zum Täter, falsche Spuren lenken ab, das Motiv erklärt das Warum, ein Alibi entlastet."}, {"typ": "zuordnen", "frage": "Was bedeutet der Krimi-Begriff?", "kategorien": ["Alibi", "Motiv", "Indiz", "Phantombild"], "elemente": [{"text": "Nachweis, dass jemand zur Tatzeit woanders war", "kat": 0}, {"text": "Grund für eine Tat", "kat": 1}, {"text": "Hinweis, der auf eine Täterin oder einen Täter deutet", "kat": 2}, {"text": "nach Zeugenaussagen gezeichnetes Gesicht", "kat": 3}], "erklaerung": "Krimi-Fachwörter richtig verwenden – Gaunersprache nur in der wörtlichen Rede der Figuren."}, {"typ": "reihenfolge", "frage": "Bring den Aufbau eines Krimis in die richtige Reihenfolge.", "elemente": ["Tat bzw. Ausgangssituation", "Ermittlung mit Hinweisen und falschen Spuren", "Höhepunkt", "Auflösung"], "erklaerung": "Die Spannung wird bis zur Auflösung gehalten."}, {"typ": "wahl", "frage": "Warum ist die Auflösung logisch?", "optionen": ["Alle Hinweise passen zusammen: der fehlende Schlüssel, die aufgesperrte Vitrine, die Stollenschuh-Spuren und Kais Motiv.", "Weil Kai als letzter Verdächtiger übrig bleibt, nachdem Herr Huber und Tom beide ein Alibi vorweisen konnten.", "Weil Kai sich lautstark über die Mannschaft geärgert hat – wer ein Motiv hat, ist im Krimi automatisch der Täter.", "Weil die Leserinnen und Leser Kai von Anfang an verdächtigen und ein Krimi diese Erwartung erfüllen muss."], "richtig": 0, "erklaerung": "Eine gute Auflösung ergibt sich aus den Hinweisen, die die Leser schon kennen: fehlender Schlüssel, unbeschädigtes Glas, Stollenschuh-Spuren und Motiv passen zusammen. Ein Motiv allein beweist nichts, und Herr Huber hatte kein Alibi – er hatte nur seinen Schlüssel verloren."}, {"typ": "wahl", "frage": "Wann verrätst du, wer es war?", "optionen": ["Erst bei der Auflösung am Ende.", "Gleich in der Einleitung, damit alle Bescheid wissen.", "Schon in der Überschrift, die macht neugierig.", "In der Mitte, sobald die Ermittlung beginnt."], "richtig": 0, "erklaerung": "Wer den Täter zu früh verrät – in der Überschrift, in der Einleitung oder mitten in der Ermittlung –, nimmt die Spannung."}]}]}, {"id": "texttransformation", "gruppe": "Kreatives Schreiben", "titel": "Texttransformation", "symbol": "🔄", "kurz": "Umschreiben: Nachricht → E-Mail, Bericht ↔ Erzählung.", "sets": [{"id": "tt1", "titel": "Umschreiben in eine andere Textsorte", "aufgaben": [{"typ": "zuordnen", "frage": "Klingt der Satz nach Bericht oder nach Erzählung?", "kategorien": ["Bericht", "Erzählung"], "elemente": [{"text": "Am Montag gegen 7.45 Uhr kollidierte ein Pkw mit einem Radfahrer.", "kat": 0}, {"text": "Der Radfahrer erlitt Prellungen.", "kat": 0}, {"text": "Plötzlich quietschten Reifen – und ich sah nur noch Blech auf mich zukommen!", "kat": 1}, {"text": "Mein Herz raste, als ich mich aufrappelte.", "kat": 1}], "erklaerung": "Bericht: sachlich, genau, ohne Gefühle. Erzählung: Spannung, Gefühle, Sinneseindrücke."}, {"typ": "wahl", "frage": "Du verwandelst einen Bericht in eine Erzählung. Was änderst du?", "optionen": ["Ich ergänze Gefühle, Gedanken, Sinneseindrücke und wörtliche Rede und baue Spannung auf – die Fakten bleiben gleich.", "Ich ergänze Gefühle und wörtliche Rede und erfinde ein spannenderes Ende, damit die Geschichte besser ankommt.", "Ich übernehme die sachlichen Sätze des Berichts und füge nur eine Überschrift und eine kurze Einleitung hinzu.", "Ich lasse Zeit- und Ortsangaben weg und erzähle nur die Gefühle der Beteiligten, damit es lebendiger wirkt."], "richtig": 0, "erklaerung": "Bei der Transformation bleiben die Inhalte – Form, Stil und Register ändern sich. Fakten weglassen oder ein neues Ende erfinden verfälscht die Vorlage; nur eine Überschrift dazuzuschreiben macht noch keine Erzählung."}, {"typ": "mehrfach", "frage": "Du schreibst eine Handynachricht in eine E-Mail in Standardsprache um. Was musst du auflösen?", "optionen": ["Abkürzungen (lg, thx, sry)", "Emojis", "Jugendsprache", "Dialektwörter", "Satzzeichen", "Absätze"], "richtig": [0, 1, 2, 3], "erklaerung": "Im Standardtext dürfen keine Reste des informellen Registers bleiben."}, {"typ": "verbessern", "frage": "Aus der Nachricht „hey, kann morgen nicht zum training, hab arzt um 4 🙈 sorry!!“ soll eine E-Mail an den Trainer, Herrn Berger, werden.", "beispiel": "Hallo Trainer, ich kann morgen nicht kommen, hab Arzt um 4, sry 🙈 LG", "maengel": ["Register vermischt: Abkürzungen („sry“, „LG“) und Emoji", "informelle Anrede und Grußformel", "Jugendsprache nicht aufgelöst („hab Arzt um 4“)", "Die Uhrzeit fehlt."], "richtig": [0, 1, 2], "erklaerung": "Der Inhalt ist vollständig – aber Anrede, Grußformel und Sprache passen nicht zur E-Mail an einen Erwachsenen.", "tipps": ["förmliche Anrede und Grußformel", "keine Abkürzungen, keine Emojis", "vollständige Sätze in Standardsprache"], "muster": "Sehr geehrter Herr Berger,\nleider kann ich morgen nicht am Training teilnehmen, da ich um 16 Uhr einen Arzttermin habe. Ich bitte Sie, mein Fehlen zu entschuldigen.\n\nMit freundlichen Grüßen\nAlex Muster"}]}]}, {"id": "rhetorik", "gruppe": "Grundlagen", "titel": "Rhetorische Figuren", "symbol": "🎯", "kurz": "Stilmittel sicher erkennen – und selbst wirkungsvoll einsetzen.", "sets": [{"id": "rhd1", "titel": "📖 Definitionen 1: Wiederholung, Satzbau, Steigerung", "info": "Hier lernst du, was die Fachbegriffe bedeuten – nach der Liste aus dem Unterricht. Die Beispiele üben die anderen Übungen.", "aufgaben": [{"typ": "wahl", "frage": "Was ist eine Anapher?", "optionen": ["Wiederholung eines oder mehrerer Wörter an Satz- oder Versanfängen", "Wiederholung gleicher Wörter am Satz- oder Versende", "Wiederholung des Anfangslauts von aufeinanderfolgenden Wörtern", "Wiederholung gleicher syntaktischer Fügungen, also des Satzbaus"], "richtig": 0, "erklaerung": "Anapher: „Er schaut nicht die Felsenriffe, / er schaut nur hinauf …“ Am Ende wäre es eine Epipher, beim Anfangslaut eine Alliteration, beim Satzbau ein Parallelismus."}, {"typ": "wahl", "frage": "Was ist eine Epipher?", "optionen": ["Wiederholung gleicher Wörter am Satz- oder Versende", "Wiederholung eines oder mehrerer Wörter an Satz- oder Versanfängen", "Umkehrung der geläufigen Wortstellung im Satz", "Unvollständiger Satz, Auslassung eines Satzteils oder Wortes"], "richtig": 0, "erklaerung": "Epipher: „Doch alle Lust will Ewigkeit, / will tiefe, tiefe Ewigkeit!“ Merkhilfe: Anapher – Anfang, Epipher – Ende."}, {"typ": "luecke", "frage": "Ergänze den Fachbegriff.", "satz": "Die {{}} ist die Wiederholung des Anfangslauts von Wörtern.", "loesungen": [["Alliteration"]], "erklaerung": "Alliteration: „Milch macht müde Männer munter.“"}, {"typ": "wahl", "frage": "Was ist eine Inversion?", "optionen": ["Umkehrung der geläufigen Wortstellung im Satz", "Wiederholung gleicher syntaktischer Fügungen", "Unvollständiger Satz, Auslassung eines Satzteils", "Mehrgliedrige Steigerung vom Schwachen zum Starken"], "richtig": 0, "erklaerung": "Inversion: „Der Schultern warmer Schnee wird werden kalter Sand.“ Üblich wäre „Der warme Schnee der Schultern wird kalter Sand werden.“ Die ungewohnte Stellung hebt Wörter hervor."}, {"typ": "zuordnen", "frage": "Welcher Fachbegriff passt zur Definition?", "kategorien": ["Klimax", "Ellipse", "Parallelismus", "Inversion"], "elemente": [{"text": "Mehrgliedrige Steigerung", "kat": 0}, {"text": "Die Glieder werden immer stärker oder eindringlicher.", "kat": 0}, {"text": "Unvollständiger Satz, Auslassung eines Satzteils oder Wortes", "kat": 1}, {"text": "Wiederholung gleicher syntaktischer Fügungen", "kat": 2}, {"text": "Aufeinanderfolgende Sätze sind gleich gebaut.", "kat": 2}, {"text": "Umkehrung der geläufigen Wortstellung im Satz", "kat": 3}], "erklaerung": "Klimax: „Ich kam, sah und siegte!“ Ellipse: „Je früher der Abschied, desto kürzer die Qual.“ Parallelismus: „Das Schiffchen fliegt, der Webstuhl kracht.“ Inversion: „Der Schultern warmer Schnee …“"}, {"typ": "mehrfach", "frage": "Welche Figuren beruhen auf einer Wiederholung – von Wörtern, Lauten oder Satzbau?", "optionen": ["Anapher", "Epipher", "Alliteration", "Parallelismus", "Metapher", "Hyperbel", "Euphemismus"], "richtig": [0, 1, 2, 3], "erklaerung": "Anapher und Epipher wiederholen Wörter, die Alliteration den Anfangslaut, der Parallelismus den Satzbau. Metapher, Hyperbel und Euphemismus arbeiten mit Bild, Übertreibung und Beschönigung."}, {"typ": "luecke", "frage": "Ergänze den Fachbegriff.", "satz": "Eine {{}} ist eine mehrgliedrige Steigerung.", "loesungen": [["Klimax"]], "erklaerung": "Klimax: „Ich kam, sah und siegte!“ – jedes Glied geht einen Schritt weiter."}]}, {"id": "rhd2", "titel": "📖 Definitionen 2: Bilder und Umschreibungen", "info": "Metapher, Vergleich, Symbol und Co.: Figuren, die etwas anders sagen, als man es direkt sagen würde.", "aufgaben": [{"typ": "wahl", "frage": "Was ist eine Metapher?", "optionen": ["Bedeutungsübertragung: Zwei Bereiche, die gewöhnlich nicht zusammengehören, werden verknüpft.", "Zwei Bereiche werden durch „wie“ verknüpft, indem man das Gemeinsame ausdrücklich hervorhebt.", "Ein konkreter Gegenstand verweist als Sinnbild über sich hinaus auf etwas Allgemeines.", "Ein Wort wird durch ein anderes ersetzt, das in unmittelbarer Beziehung zu ihm steht."], "richtig": 0, "erklaerung": "Metapher: „Der Verstand ist ein Messer in uns.“ Mit „wie“ wäre es ein Vergleich, das Sinnbild ist ein Symbol, die Ersetzung eine Metonymie."}, {"typ": "wahl", "frage": "Worin unterscheiden sich Metapher und Vergleich?", "optionen": ["Der Vergleich nennt das Gemeinsame mit „wie“, die Metapher überträgt das Bild direkt.", "Die Metapher nennt das Gemeinsame mit „wie“, der Vergleich überträgt das Bild direkt.", "Der Vergleich ist immer übertrieben, die Metapher dagegen immer wörtlich gemeint.", "Die Metapher gibt es nur in Gedichten, den Vergleich nur in Sachtexten und Reden."], "richtig": 0, "erklaerung": "„Achill ist stark wie ein Löwe“ ist ein Vergleich. „Achill ist ein Löwe“ wäre eine Metapher."}, {"typ": "wahl", "frage": "Was ist eine Metonymie?", "optionen": ["Ersetzung eines gebräuchlichen Wortes durch ein anderes, das in unmittelbarer Beziehung zu ihm steht", "Umschreibung eines Begriffs durch mehrere andere Wörter, ohne ihn direkt zu nennen", "Sinnbild, das als konkreter Gegenstand über sich hinaus auf etwas Allgemeines verweist", "Vermenschlichung von Dingen, Tieren oder Begriffen, die wie Menschen handeln"], "richtig": 0, "erklaerung": "Metonymie: „Das Weiße Haus macht wieder einmal Schlagzeilen.“ Gemeint ist die US-Regierung, die dort arbeitet – Gebäude und Regierung hängen unmittelbar zusammen."}, {"typ": "wahl", "frage": "Was ist ein Symbol?", "optionen": ["Ein Sinnbild: meist ein konkreter Gegenstand, der über sich hinaus auf etwas Allgemeines verweist", "Eine Bedeutungsübertragung, bei der zwei gewöhnlich getrennte Bereiche verknüpft werden", "Eine Verknüpfung zweier Bereiche mit „wie“, bei der das Gemeinsame hervorgehoben wird", "Eine Umschreibung, bei der etwas Unangenehmes freundlicher und harmloser klingt"], "richtig": 0, "erklaerung": "Symbol: die Taube für den Frieden, der Ring für Treue und Ewigkeit. Der Gegenstand ist wirklich da – und steht zugleich für etwas Allgemeines."}, {"typ": "zuordnen", "frage": "Welcher Fachbegriff passt zur Definition?", "kategorien": ["Personifikation", "Periphrase", "Euphemismus", "Neologismus"], "elemente": [{"text": "Vermenschlichung", "kat": 0}, {"text": "Dinge oder Begriffe handeln oder fühlen wie Menschen.", "kat": 0}, {"text": "Umschreibung", "kat": 1}, {"text": "Beschönigung", "kat": 2}, {"text": "Wortneuschöpfung", "kat": 3}, {"text": "Ein neues Wort wird erfunden oder zusammengesetzt.", "kat": 3}], "erklaerung": "Personifikation: „Vater Staat“. Periphrase: „Der den Tod auf Hiroshima warf“ statt des Namens. Euphemismus: „verscheiden“ statt „sterben“. Neologismus: „Nebelspinne“, „Berufsjugendliche“."}, {"typ": "wahl", "frage": "Worin unterscheiden sich Periphrase und Euphemismus?", "optionen": ["Jede Beschönigung umschreibt – aber nicht jede Umschreibung beschönigt.", "Die Periphrase beschönigt immer, der Euphemismus umschreibt nur neutral.", "Die Periphrase ist ein neues Wort, der Euphemismus ein altes, bekanntes.", "Es gibt keinen Unterschied, beide Begriffe meinen genau dasselbe."], "richtig": 0, "erklaerung": "Die Periphrase umschreibt etwas, ohne es direkt zu nennen. Der Euphemismus ist eine besondere Umschreibung: Er lässt Unangenehmes harmloser klingen, z. B. „verscheiden“ statt „sterben“."}, {"typ": "mehrfach", "frage": "Welche Figuren arbeiten mit einem Bild bzw. einer übertragenen Bedeutung?", "optionen": ["Metapher", "Vergleich", "Personifikation", "Symbol", "Alliteration", "Anapher", "Ellipse"], "richtig": [0, 1, 2, 3], "erklaerung": "Metapher, Vergleich, Personifikation und Symbol machen etwas durch ein Bild anschaulich. Alliteration, Anapher und Ellipse betreffen Klang, Wiederholung und Satzbau."}]}, {"id": "rhd3", "titel": "📖 Definitionen 3: Widersprüche, Übertreibung, Fragen", "info": "Oxymoron, Paradoxon, Ironie, Hyperbel und die rhetorische Frage.", "aufgaben": [{"typ": "wahl", "frage": "Was ist ein Oxymoron?", "optionen": ["Verbindung zweier widersprechender Begriffe", "Scheinwiderspruch in einer ganzen Aussage", "Unwahre Behauptung, die das Gegenteil meint", "Umschreibung, die Unangenehmes beschönigt"], "richtig": 0, "erklaerung": "Oxymoron: „lautloser Schrei“ – zwei Begriffe, die sich eigentlich ausschließen, in einem Ausdruck."}, {"typ": "wahl", "frage": "Worin unterscheiden sich Oxymoron und Paradoxon?", "optionen": ["Das Oxymoron verbindet zwei Begriffe, das Paradoxon ist eine ganze Aussage, die nur scheinbar widersprüchlich ist.", "Das Paradoxon verbindet zwei Begriffe, das Oxymoron ist eine ganze Aussage, die nur scheinbar widersprüchlich ist.", "Das Oxymoron meint immer das Gegenteil des Gesagten, das Paradoxon ist dagegen immer wörtlich gemeint.", "Es gibt keinen Unterschied: Beide Begriffe bezeichnen eine starke Übertreibung in einem kurzen Satz."], "richtig": 0, "erklaerung": "Oxymoron: „lautloser Schrei“. Paradoxon: „Vor lauter Individualismus tragen sie Uniform.“ – Das klingt widersprüchlich, hat aber einen wahren Kern: Wer unbedingt anders sein will, sieht am Ende aus wie alle anderen."}, {"typ": "luecke", "frage": "Ergänze den Fachbegriff.", "satz": "Die {{}} ist eine unwahre Behauptung, die durchblicken lässt, dass das Gegenteil gemeint ist.", "loesungen": [["Ironie"]], "erklaerung": "Ironie: „Das hast du wieder einmal super hinbekommen!“ – wenn etwas gründlich schiefgegangen ist."}, {"typ": "luecke", "frage": "Ergänze den Fachbegriff.", "satz": "Eine {{}} ist eine scheinbare Frage, bei der jeder die Antwort kennt.", "loesungen": [["rhetorische Frage"]], "erklaerung": "Rhetorische Frage: „Wer ist schon perfekt?“ – Die Antwort „niemand“ steht schon fest."}, {"typ": "wahl", "frage": "Was ist eine Hyperbel?", "optionen": ["Starke Übertreibung", "Mehrgliedrige Steigerung", "Scheinbare Frage", "Verbindung von Gegensätzen"], "richtig": 0, "erklaerung": "Hyperbel: „ein Meer von Tränen“. Eine Klimax steigert in mehreren Gliedern, die Hyperbel übertreibt an einer Stelle."}, {"typ": "zuordnen", "frage": "Welcher Fachbegriff passt zur Definition?", "kategorien": ["Oxymoron", "Paradoxon", "Ironie", "rhetorische Frage"], "elemente": [{"text": "Verbindung zweier widersprechender Begriffe", "kat": 0}, {"text": "Scheinwiderspruch", "kat": 1}, {"text": "Eine Aussage klingt unsinnig, hat aber einen wahren Kern.", "kat": 1}, {"text": "Unwahre Behauptung, die das Gegenteil durchblicken lässt", "kat": 2}, {"text": "Scheinbare Frage, bei der jeder die Antwort kennt", "kat": 3}], "erklaerung": "Oxymoron: „lautloser Schrei“. Paradoxon: „Vor lauter Individualismus tragen sie Uniform.“ Ironie: „Das hast du wieder einmal super hinbekommen!“ Rhetorische Frage: „Wer ist schon perfekt?“"}]}, {"id": "rhd4", "titel": "📖 Definitionen-Quiz: Welche Figur ist gemeint?", "info": "Umgekehrt: Du liest die Definition und wählst den passenden Fachbegriff. Alle 20 Figuren aus der Liste kommen vor.", "aufgaben": [{"typ": "wahl", "frage": "Wiederholung des Anfangslauts von Wörtern", "optionen": ["Alliteration", "Anapher", "Epipher", "Parallelismus"], "richtig": 0, "erklaerung": "Alliteration: „Milch macht müde Männer munter.“"}, {"typ": "wahl", "frage": "Wiederholung eines oder mehrerer Wörter an Satz- oder Versanfängen", "optionen": ["Anapher", "Epipher", "Alliteration", "Klimax"], "richtig": 0, "erklaerung": "Anapher – Anfang."}, {"typ": "wahl", "frage": "Wiederholung gleicher Wörter am Satz- oder Versende", "optionen": ["Epipher", "Anapher", "Ellipse", "Inversion"], "richtig": 0, "erklaerung": "Epipher – Ende."}, {"typ": "wahl", "frage": "Unvollständiger Satz, Auslassung eines Satzteils oder Wortes", "optionen": ["Ellipse", "Inversion", "Periphrase", "Paradoxon"], "richtig": 0, "erklaerung": "Ellipse: „Je früher der Abschied, desto kürzer die Qual.“"}, {"typ": "wahl", "frage": "Beschönigung", "optionen": ["Euphemismus", "Periphrase", "Ironie", "Metonymie"], "richtig": 0, "erklaerung": "Euphemismus: „verscheiden“ statt „sterben“. Eine Periphrase umschreibt, beschönigt aber nicht unbedingt."}, {"typ": "wahl", "frage": "Starke Übertreibung", "optionen": ["Hyperbel", "Klimax", "Ironie", "Oxymoron"], "richtig": 0, "erklaerung": "Hyperbel: „ein Meer von Tränen“."}, {"typ": "wahl", "frage": "Umkehrung der geläufigen Wortstellung im Satz", "optionen": ["Inversion", "Parallelismus", "Ellipse", "Epipher"], "richtig": 0, "erklaerung": "Inversion: „Der Schultern warmer Schnee …“"}, {"typ": "wahl", "frage": "Unwahre Behauptung, die durchblicken lässt, dass das Gegenteil gemeint ist", "optionen": ["Ironie", "Paradoxon", "Euphemismus", "Hyperbel"], "richtig": 0, "erklaerung": "Ironie: „Das hast du wieder einmal super hinbekommen!“"}, {"typ": "wahl", "frage": "Mehrgliedrige Steigerung", "optionen": ["Klimax", "Hyperbel", "Parallelismus", "Anapher"], "richtig": 0, "erklaerung": "Klimax: „Ich kam, sah und siegte!“"}, {"typ": "wahl", "frage": "Verbindung zweier widersprechender Begriffe", "optionen": ["Oxymoron", "Paradoxon", "Ironie", "Metapher"], "richtig": 0, "erklaerung": "Oxymoron: „lautloser Schrei“."}, {"typ": "wahl", "frage": "Bedeutungsübertragung: Zwei Bereiche, die gewöhnlich unverbunden sind, werden verknüpft.", "optionen": ["Metapher", "Vergleich", "Symbol", "Metonymie"], "richtig": 0, "erklaerung": "Metapher: „Der Verstand ist ein Messer in uns.“"}, {"typ": "wahl", "frage": "Ersetzung eines gebräuchlichen Wortes durch ein anderes, das in unmittelbarer Beziehung zu ihm steht", "optionen": ["Metonymie", "Metapher", "Periphrase", "Neologismus"], "richtig": 0, "erklaerung": "Metonymie: „Das Weiße Haus macht wieder einmal Schlagzeilen.“"}, {"typ": "wahl", "frage": "Umschreibung", "optionen": ["Periphrase", "Euphemismus", "Metonymie", "Ellipse"], "richtig": 0, "erklaerung": "Periphrase: „Der den Tod auf Hiroshima warf …“ statt des Namens."}, {"typ": "wahl", "frage": "Wortneuschöpfung", "optionen": ["Neologismus", "Euphemismus", "Metapher", "Symbol"], "richtig": 0, "erklaerung": "Neologismus: „Nebelspinne“, „Berufsjugendliche“."}, {"typ": "wahl", "frage": "Scheinwiderspruch", "optionen": ["Paradoxon", "Oxymoron", "Ironie", "rhetorische Frage"], "richtig": 0, "erklaerung": "Paradoxon: „Vor lauter Individualismus tragen sie Uniform.“ Beim Oxymoron stecken die widersprechenden Begriffe in einem einzigen Ausdruck."}, {"typ": "wahl", "frage": "Wiederholung gleicher syntaktischer Fügungen (gleicher Satzbau)", "optionen": ["Parallelismus", "Anapher", "Inversion", "Alliteration"], "richtig": 0, "erklaerung": "Parallelismus: „Das Schiffchen fliegt, der Webstuhl kracht.“"}, {"typ": "wahl", "frage": "Vermenschlichung", "optionen": ["Personifikation", "Metapher", "Symbol", "Parallelismus"], "richtig": 0, "erklaerung": "Personifikation: „Vater Staat“."}, {"typ": "wahl", "frage": "Scheinbare Frage, bei der jeder die Antwort kennt", "optionen": ["rhetorische Frage", "Ironie", "Paradoxon", "Personifikation"], "richtig": 0, "erklaerung": "Rhetorische Frage: „Wer ist schon perfekt?“"}, {"typ": "wahl", "frage": "Sinnbild, das über sich hinaus auf etwas Allgemeines verweist – meist ein konkreter Gegenstand", "optionen": ["Symbol", "Metapher", "Vergleich", "Metonymie"], "richtig": 0, "erklaerung": "Symbol: die Taube für den Frieden, der Ring für Treue und Ewigkeit."}, {"typ": "wahl", "frage": "Verknüpfung zweier Bereiche durch Hervorhebung des Gemeinsamen, meist mit „wie“", "optionen": ["Vergleich", "Metapher", "Personifikation", "Symbol"], "richtig": 0, "erklaerung": "Vergleich: „Achill ist stark wie ein Löwe.“"}]}, {"id": "rh1", "titel": "Wiederholung und Klang", "info": "Viele Figuren arbeiten mit Wiederholung: am Satzanfang, am Satzende, im Klang oder im Satzbau.", "aufgaben": [{"typ": "zuordnen", "frage": "Welche Figur ist das?", "kategorien": ["Anapher", "Epipher", "Alliteration", "Klimax"], "elemente": [{"text": "Wir wollen faire Preise. Wir wollen faire Löhne. Wir wollen faire Chancen.", "kat": 0}, {"text": "Ich bin müde vom Lernen, du bist müde vom Lernen, alle sind müde vom Lernen.", "kat": 1}, {"text": "Frisch, fröhlich, frei in die Ferien!", "kat": 2}, {"text": "Erst lachte er, dann jubelte er, schließlich tanzte er auf dem Tisch.", "kat": 3}, {"text": "Ein Tropfen, ein Bach, ein reißender Strom.", "kat": 3}], "erklaerung": "Anapher: Wiederholung am Anfang. Epipher: Wiederholung am Ende. Alliteration: gleicher Anfangslaut. Klimax: Steigerung in Stufen."}, {"typ": "zuordnen", "frage": "Und diese?", "kategorien": ["Parallelismus", "Chiasmus", "Dreierfigur", "Ellipse"], "elemente": [{"text": "Die Tage sind lang, die Nächte sind kurz.", "kat": 0}, {"text": "Ich lerne, um zu leben – ich lebe, um zu lernen.", "kat": 1}, {"text": "Ich kam, ich sah, ich siegte.", "kat": 2}, {"text": "Zeit, Geld und Nerven – das kostet uns der Stau.", "kat": 2}, {"text": "Je früher, desto besser.", "kat": 3}, {"text": "Wohin jetzt? Keine Ahnung.", "kat": 3}], "erklaerung": "Parallelismus: gleicher Satzbau. Chiasmus: Überkreuzstellung (lernen – leben / leben – lernen). Dreierfigur: drei Glieder. Ellipse: unvollständiger Satz."}, {"typ": "wahl", "frage": "Welche Klimax ist richtig aufgebaut?", "optionen": ["Erst wurde es still, dann unheimlich, schließlich bedrohlich.", "Erst wurde es bedrohlich, dann unheimlich, schließlich still.", "Erst wurde es still, dann wieder laut, schließlich ganz still.", "Es wurde still, unheimlich und bedrohlich, aber nicht lange."], "richtig": 0, "erklaerung": "Eine Klimax steigert vom Schwächeren zum Stärksten. Die umgekehrte Reihenfolge schwächt ab, ein Hin und Her ist keine Steigerung, und der angehängte Nachsatz nimmt der Steigerung die Wirkung."}]}, {"id": "rh2", "titel": "Bilder und Übertreibung", "info": "Bildhafte Figuren machen Abstraktes anschaulich – Metapher ohne „wie“, Vergleich mit „wie“ oder „als“.", "aufgaben": [{"typ": "zuordnen", "frage": "Welche Figur ist das?", "kategorien": ["Metapher", "Vergleich", "Personifikation", "Hyperbel"], "elemente": [{"text": "Mein Zimmer ist ein Schlachtfeld.", "kat": 0}, {"text": "Sie ist schnell wie der Blitz.", "kat": 1}, {"text": "Er kämpfte wie ein Löwe um den Ball.", "kat": 1}, {"text": "Der Wind heult ums Haus.", "kat": 2}, {"text": "Das Handy schreit nach Aufmerksamkeit.", "kat": 2}, {"text": "Ich warte schon seit Jahrhunderten auf den Bus.", "kat": 3}], "erklaerung": "Metapher: Bild ohne Vergleichswort. Vergleich: mit „wie“ oder „als“. Personifikation: Dinge handeln wie Menschen. Hyperbel: starke Übertreibung."}, {"typ": "zuordnen", "frage": "Und diese?", "kategorien": ["Euphemismus", "Oxymoron", "Neologismus"], "elemente": [{"text": "„Er ist von uns gegangen.“ (statt: Er ist gestorben.)", "kat": 0}, {"text": "„Freisetzung von Mitarbeitern“ (statt: Kündigungen)", "kat": 0}, {"text": "bittersüß", "kat": 1}, {"text": "beredtes Schweigen", "kat": 1}, {"text": "Handyzombie", "kat": 2}], "erklaerung": "Euphemismus: beschönigende Umschreibung. Oxymoron: zwei Begriffe, die sich widersprechen, in einem Ausdruck. Neologismus: neu gebildetes Wort."}, {"typ": "wahl", "frage": "Welcher Satz enthält einen Bildbruch (eine schiefe Metapher)?", "optionen": ["Wir dürfen das Feuer der Begeisterung nicht unter den Teppich kehren.", "Wir dürfen das Feuer der Begeisterung nicht einfach erlöschen lassen.", "Wir dürfen dieses unangenehme Problem nicht unter den Teppich kehren.", "Wir müssen das Feuer der Begeisterung wieder neu in allen entfachen."], "richtig": 0, "erklaerung": "Feuer kehrt man nicht unter den Teppich – zwei Bilder passen nicht zusammen. Solche Stilblüten wirken unfreiwillig komisch. Bleib innerhalb eines Bildes: Feuer erlischt oder wird entfacht."}]}, {"id": "rh3", "titel": "Fragen, Gegensätze, Ironie", "aufgaben": [{"typ": "zuordnen", "frage": "Welche Figur ist das?", "kategorien": ["rhetorische Frage", "Antithese", "Ironie"], "elemente": [{"text": "Wer will schon in einer Welt voller Müll leben?", "kat": 0}, {"text": "Ist das wirklich die Zukunft, die wir wollen?", "kat": 0}, {"text": "Die einen feiern, die anderen räumen auf.", "kat": 1}, {"text": "Arm und Reich, Jung und Alt – alle sind betroffen.", "kat": 1}, {"text": "Super, wieder Regen am Wandertag – genau das, was wir wollten.", "kat": 2}, {"text": "Na bravo, der Drucker streikt schon wieder.", "kat": 2}], "erklaerung": "Rhetorische Frage: Frage, deren Antwort schon feststeht. Antithese: Gegenüberstellung von Gegensätzen. Ironie: Man sagt das Gegenteil von dem, was man meint."}, {"typ": "wahl", "frage": "Woran erkennst du Ironie?", "optionen": ["Das Gesagte passt erkennbar nicht zur Situation – gemeint ist das Gegenteil.", "Der Satz endet mit einem Fragezeichen, auf das keine Antwort folgt.", "Zwei Begriffe, die sich widersprechen, stehen direkt nebeneinander.", "Etwas Unangenehmes wird absichtlich schöner umschrieben, als es ist."], "richtig": 0, "erklaerung": "Ironie lebt vom Widerspruch zwischen Gesagtem und Situation. Die Frage ohne Antwort ist die rhetorische Frage, die widersprüchlichen Begriffe sind ein Oxymoron, die Beschönigung ist ein Euphemismus."}, {"typ": "wahl", "frage": "Ein Kommentar beginnt: „Schon wieder eine Studie, die beweist, dass Jugendliche zu viel am Handy hängen – wie überraschend.“ Was ist „wie überraschend“?", "optionen": ["Ironie – der Autor meint, dass das Ergebnis überhaupt nicht überrascht.", "Eine Hyperbel – der Autor übertreibt, wie überrascht er wirklich ist.", "Eine Personifikation – die Studie wird wie ein Mensch dargestellt.", "Eine Ellipse – dem Satzteil fehlt ein Verb, er ist unvollständig."], "richtig": 0, "erklaerung": "„Wie überraschend“ meint hier das Gegenteil: Das Ergebnis war längst bekannt. Zwar fehlt dem Satzteil auch ein Verb – die eigentliche Wirkung kommt aber von der Ironie."}]}, {"id": "rh4", "titel": "Welche Wirkung hat das?", "aufgaben": [{"typ": "zuordnen", "frage": "Welche Hauptwirkung hat die Figur meistens?", "kategorien": ["prägt sich ein", "veranschaulicht", "betont einen Gegensatz", "bezieht Leser ein"], "elemente": [{"text": "Anapher", "kat": 0}, {"text": "Alliteration", "kat": 0}, {"text": "Metapher", "kat": 1}, {"text": "Vergleich", "kat": 1}, {"text": "Antithese", "kat": 2}, {"text": "rhetorische Frage", "kat": 3}], "erklaerung": "In der Analyse nennst du immer die Wirkung – und belegst sie an der Stelle im Text."}, {"typ": "wahl", "frage": "Warum verwenden Politik und Wirtschaft gern Euphemismen?", "optionen": ["Sie lassen Unangenehmes harmloser klingen und lenken von der eigentlichen Härte ab.", "Sie machen schwierige Sachverhalte für alle Leserinnen und Leser genauer und klarer.", "Sie übertreiben bewusst, damit eine Nachricht mehr Aufmerksamkeit bekommt.", "Sie stellen zwei gegensätzliche Positionen fair und ausgewogen nebeneinander."], "richtig": 0, "erklaerung": "„Freisetzung“ statt „Kündigung“ klingt weniger hart. Wer Texte analysiert, deckt solche Beschönigungen auf. Genauer werden Texte dadurch nicht, und Übertreiben wäre eine Hyperbel."}, {"typ": "wahl", "frage": "Welcher Analysesatz beschreibt eine Anapher vollständig (Figur – Beleg – Wirkung)?", "optionen": ["Die dreifache Anapher „Wir wollen …“ (Z. 4–6) prägt sich ein und lässt die Forderungen entschlossen wirken.", "Die dreifache Anapher „Wir wollen …“ (Z. 4–6) zeigt, dass dem Autor keine anderen Satzanfänge eingefallen sind.", "Im Text gibt es eine Anapher, und zwar eine ziemlich lange, die der Autor wohl absichtlich gemacht hat.", "Die dreifache Anapher „Wir wollen …“ (Z. 4–6) ist mir sofort aufgefallen und hat mir besonders gefallen."], "richtig": 0, "erklaerung": "Figur benennen, mit Zeile belegen, Wirkung erklären. Eine Anapher ist kein Zeichen von Wortarmut, ohne Beleg fehlt die Stelle, und „hat mir gefallen“ ist keine Analyse."}]}, {"id": "rhq1", "titel": "🧩 Figuren-Quiz: Werbung, Reden, Schlagzeilen", "info": "Bunt gemischt: Welche Figur steckt im Beispiel? Achte genau auf das Merkmal.", "aufgaben": [{"typ": "wahl", "frage": "Werbung: „Bei Bauer Berger bekommen Sie beste Beeren.“", "optionen": ["Alliteration", "Hyperbel", "Metapher", "Personifikation"], "richtig": 0, "erklaerung": "Viele Wörter beginnen mit „B“ – das ist eine Alliteration. Sie macht den Werbespruch einprägsam."}, {"typ": "wahl", "frage": "Rede nach dem Finale: „Wir haben gekämpft. Wir haben gezittert. Wir haben gewonnen.“", "optionen": ["Anapher", "Epipher", "Chiasmus", "Ellipse"], "richtig": 0, "erklaerung": "„Wir haben …“ steht am Anfang jedes Satzes – eine Anapher. Sie wirkt eindringlich und feierlich."}, {"typ": "wahl", "frage": "Schlagzeile: „Regen, Wind und Kälte – der Herbst ist da.“", "optionen": ["Dreierfigur", "Antithese", "Oxymoron", "Euphemismus"], "richtig": 0, "erklaerung": "Drei Glieder hintereinander – eine Dreierfigur. Sie wirkt rund und vollständig."}, {"typ": "wahl", "frage": "Wirtschaftsnachricht: „Die Börse zittert.“", "optionen": ["Personifikation", "Hyperbel", "Vergleich", "Alliteration"], "richtig": 0, "erklaerung": "Eine Börse kann nicht zittern – sie wird wie ein Mensch dargestellt: Personifikation."}, {"typ": "wahl", "frage": "Nach der Prüfung: „Ich habe danach tausend Jahre geschlafen.“", "optionen": ["Hyperbel", "Euphemismus", "Metapher", "Neologismus"], "richtig": 0, "erklaerung": "Niemand schläft tausend Jahre – eine starke Übertreibung, also eine Hyperbel."}, {"typ": "wahl", "frage": "Ein Unternehmen kündigt an: „Wir werden die Preise leicht anpassen.“ (Gemeint ist: Es wird teurer.)", "optionen": ["Euphemismus", "Ironie", "Ellipse", "Personifikation"], "richtig": 0, "erklaerung": "„Anpassen“ klingt harmloser als „erhöhen“ – eine beschönigende Umschreibung, ein Euphemismus."}, {"typ": "wahl", "frage": "Leserbrief: „Wer möchte schon jeden Tag zwei Stunden im Stau stehen?“", "optionen": ["rhetorische Frage", "Personifikation", "Parallelismus", "Alliteration"], "richtig": 0, "erklaerung": "Die Antwort („niemand“) steht schon fest – eine rhetorische Frage, die die Leser auf die eigene Seite zieht."}, {"typ": "wahl", "frage": "„Unser Geschichtelehrer ist ein wandelndes Lexikon.“", "optionen": ["Metapher", "Vergleich", "Chiasmus", "Epipher"], "richtig": 0, "erklaerung": "Kein „wie“ – der Lehrer wird direkt als Lexikon bezeichnet. Das ist eine Metapher."}, {"typ": "wahl", "frage": "„Am Wochenende schläft er wie ein Murmeltier.“", "optionen": ["Vergleich", "Metapher", "Ellipse", "Anapher"], "richtig": 0, "erklaerung": "Mit „wie“ wird verglichen – ein Vergleich. Ohne „wie“ wäre es eine Metapher."}, {"typ": "wahl", "frage": "„Na wunderbar, jetzt ist auch noch der Akku leer.“", "optionen": ["Ironie", "Klimax", "Antithese", "Euphemismus"], "richtig": 0, "erklaerung": "„Wunderbar“ ist hier das Gegenteil von dem, was gemeint ist – Ironie."}, {"typ": "wahl", "frage": "„Im Sommer schwitzen wir, im Winter frieren wir.“", "optionen": ["Antithese", "Chiasmus", "Oxymoron", "Neologismus"], "richtig": 0, "erklaerung": "Sommer und Winter, schwitzen und frieren – Gegensätze werden gegenübergestellt: Antithese. Ein Chiasmus wäre über Kreuz gebaut."}, {"typ": "wahl", "frage": "Jugendsprache: „Pass auf, du Smombie!“ (Smartphone + Zombie)", "optionen": ["Neologismus", "Euphemismus", "Oxymoron", "Alliteration"], "richtig": 0, "erklaerung": "Ein neu gebildetes Wort aus zwei bekannten – ein Neologismus."}]}, {"id": "rhq2", "titel": "🧩 Figuren-Quiz: Literatur und Alltag", "aufgaben": [{"typ": "wahl", "frage": "Gedicht: „Der Mond lächelt über den Dächern.“", "optionen": ["Personifikation", "Vergleich", "Alliteration", "Parallelismus"], "richtig": 0, "erklaerung": "Der Mond lächelt wie ein Mensch – eine Personifikation."}, {"typ": "wahl", "frage": "„Es war ein bittersüßer Abschied.“", "optionen": ["Oxymoron", "Euphemismus", "Hyperbel", "Antithese"], "richtig": 0, "erklaerung": "„Bitter“ und „süß“ widersprechen sich und stehen in einem Wort – ein Oxymoron. Bei der Antithese stehen Gegensätze in zwei getrennten Teilen gegenüber."}, {"typ": "wahl", "frage": "„Heiß ist der Sommer, der Winter ist kalt.“", "optionen": ["Chiasmus", "Anapher", "Ellipse", "Klimax"], "richtig": 0, "erklaerung": "Eigenschaft – Jahreszeit, Jahreszeit – Eigenschaft: Die Glieder stehen über Kreuz. Das ist ein Chiasmus."}, {"typ": "wahl", "frage": "„Ich kam nach Hause, ich aß, ich schlief.“", "optionen": ["Dreierfigur", "Epipher", "Oxymoron", "Personifikation"], "richtig": 0, "erklaerung": "Drei kurze Glieder hintereinander – eine Dreierfigur. Sie wirkt knapp und abgeschlossen."}, {"typ": "wahl", "frage": "„Sie lachte laut. Er lachte laut. Alle lachten laut.“", "optionen": ["Epipher", "Anapher", "Neologismus", "Vergleich"], "richtig": 0, "erklaerung": "Das Wort „laut“ wiederholt sich am Satzende – eine Epipher. Bei der Anapher stünde die Wiederholung am Anfang."}, {"typ": "wahl", "frage": "Auf einem Plakat: „Nie wieder Krieg!“", "optionen": ["Ellipse", "Hyperbel", "Ironie", "Chiasmus"], "richtig": 0, "erklaerung": "Dem Satz fehlt das Verb – eine Ellipse. Sie wirkt knapp und eindringlich."}, {"typ": "wahl", "frage": "„Sie hat ein Herz aus Stein.“", "optionen": ["Metapher", "Vergleich", "Oxymoron", "Ellipse"], "richtig": 0, "erklaerung": "Das „Herz aus Stein“ ist ein Bild für Gefühllosigkeit – ohne „wie“, also eine Metapher."}, {"typ": "wahl", "frage": "„Erst ein Funke, dann eine Flamme, schließlich ein Flächenbrand.“", "optionen": ["Klimax", "Antithese", "Euphemismus", "Personifikation"], "richtig": 0, "erklaerung": "Von Stufe zu Stufe wird es größer – eine Klimax. (Die gleichen Anfangslaute sind zusätzlich eine Alliteration.)"}, {"typ": "wahl", "frage": "„Mein Onkel ist etwas vollschlank.“", "optionen": ["Euphemismus", "Oxymoron", "Ironie", "Neologismus"], "richtig": 0, "erklaerung": "„Vollschlank“ beschönigt – ein Euphemismus."}, {"typ": "wahl", "frage": "„Mein Schulrucksack wiegt eine Tonne.“", "optionen": ["Hyperbel", "Vergleich", "Personifikation", "Anapher"], "richtig": 0, "erklaerung": "Kein Rucksack wiegt eine Tonne – eine Hyperbel."}, {"typ": "wahl", "frage": "„Jung und Alt feierten gemeinsam auf dem Hauptplatz.“", "optionen": ["Antithese", "Alliteration", "Ellipse", "Vergleich"], "richtig": 0, "erklaerung": "„Jung und Alt“ ist ein Gegensatzpaar – eine Antithese. Gemeint ist: alle."}, {"typ": "wahl", "frage": "„Die Wahrheit ist ein scheues Reh.“", "optionen": ["Metapher", "Vergleich", "Klimax", "Epipher"], "richtig": 0, "erklaerung": "Die Wahrheit wird direkt als scheues Reh bezeichnet – ohne „wie“: eine Metapher (schwer zu fassen, schnell verschwunden)."}]}, {"id": "rhq3", "titel": "🧩 Mehrere Figuren in einem Satz", "info": "Oft stecken in einem Satz mehrere Figuren. Wähle alle, die du findest.", "aufgaben": [{"typ": "mehrfach", "frage": "„Die einen verdienen Millionen, die anderen kaum genug zum Leben. Ist das gerecht?“", "optionen": ["Antithese", "rhetorische Frage", "Alliteration", "Personifikation", "Euphemismus"], "richtig": [0, 1], "erklaerung": "Reich und arm werden gegenübergestellt (Antithese), und die Frage beantwortet sich selbst (rhetorische Frage)."}, {"typ": "mehrfach", "frage": "„Wir wollen lernen, wir wollen lachen, wir wollen leben!“", "optionen": ["Anapher", "Dreierfigur", "Alliteration", "Oxymoron", "Ironie"], "richtig": [0, 1, 2], "erklaerung": "„Wir wollen“ am Anfang (Anapher), drei Glieder (Dreierfigur) und lernen – lachen – leben (Alliteration)."}, {"typ": "mehrfach", "frage": "„Die Stadt schläft, die Straßen schweigen, die Sterne schauen zu.“", "optionen": ["Personifikation", "Alliteration", "Dreierfigur", "Parallelismus", "Euphemismus", "Chiasmus"], "richtig": [0, 1, 2, 3], "erklaerung": "Stadt, Straßen und Sterne handeln wie Menschen (Personifikation), viele S-Laute (Alliteration), drei gleich gebaute Glieder (Dreierfigur, Parallelismus)."}, {"typ": "mehrfach", "frage": "„Ein Meer aus Tränen – so groß war der Abschiedsschmerz.“", "optionen": ["Metapher", "Hyperbel", "Vergleich", "Antithese", "Anapher"], "richtig": [0, 1], "erklaerung": "Das „Meer aus Tränen“ ist ein Bild ohne „wie“ (Metapher) und zugleich eine starke Übertreibung (Hyperbel)."}, {"typ": "mehrfach", "frage": "„Kein Handy, kein Netz, keine Ahnung.“", "optionen": ["Anapher", "Dreierfigur", "Ellipse", "Metapher", "Chiasmus"], "richtig": [0, 1, 2], "erklaerung": "„Kein …“ am Anfang (Anapher), drei Glieder (Dreierfigur) und kein Verb (Ellipse)."}]}, {"id": "rhq4", "titel": "🧩 Figuren-Quiz: Inversion, Metonymie, Periphrase, Paradoxon, Symbol", "info": "Diese fünf Figuren aus der Liste kamen in den Beispiel-Übungen noch nicht vor.", "aufgaben": [{"typ": "wahl", "frage": "„Groß war die Freude, als das Ergebnis feststand.“", "optionen": ["Inversion", "Ellipse", "Hyperbel", "Parallelismus"], "richtig": 0, "erklaerung": "Üblich wäre „Die Freude war groß …“ – die umgestellte Wortstellung ist eine Inversion. Sie rückt „groß“ nach vorne und betont es."}, {"typ": "wahl", "frage": "„Still ruht der See.“", "optionen": ["Inversion", "Personifikation", "Alliteration", "Oxymoron"], "richtig": 0, "erklaerung": "Üblich wäre „Der See ruht still.“ Die Inversion hebt „still“ hervor."}, {"typ": "wahl", "frage": "„Das ganze Stadion jubelte.“", "optionen": ["Metonymie", "Hyperbel", "Personifikation", "Symbol"], "richtig": 0, "erklaerung": "Gemeint sind die Menschen im Stadion. Das Stadion steht in unmittelbarer Beziehung zu ihnen – eine Metonymie."}, {"typ": "wahl", "frage": "„In den Ferien lese ich endlich Kafka.“", "optionen": ["Metonymie", "Metapher", "Periphrase", "Ellipse"], "richtig": 0, "erklaerung": "Gemeint sind Kafkas Bücher: Der Autor steht für sein Werk – eine Metonymie."}, {"typ": "wahl", "frage": "„Der König der Tiere schlief im Schatten.“ (gemeint: der Löwe)", "optionen": ["Periphrase", "Euphemismus", "Personifikation", "Metonymie"], "richtig": 0, "erklaerung": "Der Löwe wird nicht genannt, sondern umschrieben – eine Periphrase. Beschönigt wird dabei nichts, also ist es kein Euphemismus."}, {"typ": "wahl", "frage": "„Wir reisen ins Land der aufgehenden Sonne.“ (gemeint: Japan)", "optionen": ["Periphrase", "Metapher", "Hyperbel", "Neologismus"], "richtig": 0, "erklaerung": "Japan wird umschrieben statt genannt – eine Periphrase."}, {"typ": "wahl", "frage": "„Weniger ist mehr.“", "optionen": ["Paradoxon", "Oxymoron", "Ironie", "Euphemismus"], "richtig": 0, "erklaerung": "Die Aussage klingt widersprüchlich, hat aber einen wahren Kern: Wer sich beschränkt, erreicht oft mehr. Ein Scheinwiderspruch – ein Paradoxon."}, {"typ": "wahl", "frage": "„Ich weiß, dass ich nichts weiß.“", "optionen": ["Paradoxon", "Oxymoron", "Ellipse", "rhetorische Frage"], "richtig": 0, "erklaerung": "Wer nichts weiß, kann das eigentlich nicht wissen – ein Scheinwiderspruch. Gemeint ist: Wer klug ist, kennt die Grenzen seines Wissens."}, {"typ": "wahl", "frage": "In einer Erzählung zerbricht am Ende der Ehering – kurz darauf trennt sich das Paar.", "optionen": ["Symbol", "Metapher", "Hyperbel", "Euphemismus"], "richtig": 0, "erklaerung": "Der Ring ist wirklich da und zerbricht wirklich – zugleich steht er als Sinnbild für Treue, die zerbricht. Das ist ein Symbol."}, {"typ": "wahl", "frage": "Auf dem Plakat einer Friedensdemonstration ist eine weiße Taube zu sehen.", "optionen": ["Symbol", "Personifikation", "Vergleich", "Metonymie"], "richtig": 0, "erklaerung": "Die Taube steht als Sinnbild für den Frieden – ein Symbol."}]}, {"id": "rh5", "titel": "✍️ Richtig einsetzen", "info": "Jetzt bist du dran: Schreib die Sätze so um, dass die verlangte Figur drinsteckt. Bei manchen Figuren prüft die App automatisch, ob sie erkennbar ist.", "aufgaben": [{"typ": "einsetzen", "frage": "Formuliere die drei Forderungen als Anapher – jeder Satz beginnt gleich.", "beispiel": "Wir müssen mehr Radwege bauen. Außerdem sollten Busse öfter fahren. Und Parken sollte teurer werden.", "figur": "Anapher", "pruefung": "anapher", "tipps": ["Alle Sätze beginnen mit denselben Wörtern", "Die drei Forderungen sind noch vollständig drin"], "muster": "Wir brauchen mehr Radwege. Wir brauchen öfter Busse. Wir brauchen höhere Parkgebühren.", "erklaerung": "Die Wiederholung am Satzanfang macht die Forderungen eindringlich und einprägsam – typisch für Reden und Appelle."}, {"typ": "einsetzen", "frage": "Mach aus der Feststellung den Einstieg einer Rede gegen Lebensmittelverschwendung – als rhetorische Frage.", "beispiel": "Jedes Jahr werden in Österreich viele Lebensmittel weggeworfen.", "figur": "rhetorische Frage", "pruefung": "frage", "tipps": ["Es ist eine Frage", "Die Antwort steht eigentlich schon fest", "Das Publikum fühlt sich angesprochen"], "muster": "Können wir es uns wirklich leisten, jedes Jahr Tonnen an genießbaren Lebensmitteln in den Mistkübel zu werfen?", "erklaerung": "Die rhetorische Frage zieht das Publikum hinein – die Antwort („Nein!“) gibt es sich selbst."}, {"typ": "einsetzen", "frage": "Mach aus dem Satz einen anschaulichen Vergleich.", "beispiel": "Am Freitagnachmittag war die Schule leer.", "figur": "Vergleich", "pruefung": "vergleich", "tipps": ["Mit „wie“ oder „als“", "Das Bild passt zur Situation"], "muster": "Am Freitagnachmittag war die Schule so leer wie ein Stadion nach dem Abpfiff.", "erklaerung": "Ein treffender Vergleich macht die Leere sichtbar. Achte darauf, dass das Bild zur Situation passt."}, {"typ": "einsetzen", "frage": "Schreib einen kurzen Slogan für den Wandertag mit einer Alliteration (mindestens drei Wörter mit gleichem Anfangslaut).", "beispiel": "Am Freitag gehen wir wandern.", "figur": "Alliteration", "pruefung": "alliteration", "tipps": ["Mindestens drei Wörter mit gleichem Anfangslaut", "Kurz und einprägsam"], "muster": "Wandern, Wiese, Wurstsemmel – wir wollen weg!", "erklaerung": "Gleiche Anfangslaute klingen rhythmisch und bleiben im Ohr – darum lieben Werbung und Plakate die Alliteration."}, {"typ": "einsetzen", "frage": "Steigere die Aussage mit einer Klimax – drei Stufen, die immer stärker werden.", "beispiel": "Der Lärm in der Klasse wurde stärker.", "figur": "Klimax", "pruefung": "dreier", "tipps": ["Drei Stufen", "Jede Stufe ist stärker als die vorige"], "muster": "Erst wurde geflüstert, dann geredet, schließlich geschrien.", "erklaerung": "Die Klimax baut Spannung auf. Die App kann nur prüfen, ob drei Glieder da sind – ob sie sich wirklich steigern, prüfst du selbst."}, {"typ": "einsetzen", "frage": "Stell zum Thema „Handy in der Pause“ zwei Seiten in einer Antithese gegenüber.", "beispiel": "Das Handy hat Vorteile und Nachteile.", "figur": "Antithese", "pruefung": "keine", "tipps": ["Zwei Gegensätze stehen sich gegenüber", "Beide Teile sind ähnlich gebaut"], "muster": "Das Handy verbindet uns mit der ganzen Welt – und trennt uns von dem Menschen neben uns.", "erklaerung": "Die Antithese macht den Widerspruch scharf sichtbar. Ein ähnlicher Satzbau in beiden Teilen verstärkt die Wirkung."}, {"typ": "einsetzen", "frage": "Schreib einen ironischen Satz über einen verregneten Montagmorgen.", "beispiel": "Montag früh regnet es, und wir haben eine Doppelstunde Mathematik.", "figur": "Ironie", "pruefung": "keine", "tipps": ["Du sagst das Gegenteil von dem, was du meinst", "Man erkennt die Ironie an der Situation"], "muster": "Herrlich, Regen am Montag um sieben – und dann gleich eine Doppelstunde Mathematik. Besser kann eine Woche gar nicht beginnen.", "erklaerung": "Ironie funktioniert nur, wenn die Leser die Situation kennen. In sachlichen Texten wie Bericht oder Zusammenfassung hat sie nichts verloren."}, {"typ": "einsetzen", "frage": "Mach aus dem schlichten Appell einen wirkungsvollen: Verwende mindestens zwei Stilmittel deiner Wahl und schreib in Klammern dazu, welche.", "beispiel": "Bitte trennt euren Müll.", "figur": "zwei Stilmittel", "pruefung": "keine", "tipps": ["Mindestens zwei Stilmittel", "Die Stilmittel sind in Klammern benannt", "Es bleibt ein klarer Appell"], "muster": "Wollen wir wirklich in einer Schule voller Müll lernen? (rhetorische Frage) Trennen wir den Müll – heute, morgen, jeden Tag! (Klimax, Dreierfigur)", "erklaerung": "Stilmittel sind Werkzeuge: Sie sollen die Aussage verstärken, nicht verzieren. Zwei gut gewählte wirken mehr als fünf zufällige."}]}]}]};

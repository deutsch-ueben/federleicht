const KRITERIEN = {"gruppen": {"Informieren und Beschreiben": ["zusammenfassung", "inhaltsangabe", "exzerpt", "bericht", "reportage", "beschreibung", "charakteristik"], "Argumentieren und Stellung nehmen": ["eroerterung", "kommentar", "leserbrief", "meinungsrede", "empfehlung", "offener_brief", "stellungnahme"], "Analysieren und Interpretieren": ["textanalyse", "textinterpretation", "grafikanalyse", "textanalyse_literarisch", "textvergleich", "filmanalyse"], "Erzählen": ["erlebniserzaehlung", "fantasieerzaehlung", "nacherzaehlung", "bildgeschichte", "fortsetzungsgeschichte", "fabel", "sage_schreiben", "krimi", "perspektivenwechsel", "innerer_monolog"], "Kreatives Schreiben": ["kreatives_schreiben", "texttransformation", "autobiografisches_schreiben", "medienbiografie"]}, "textsorten": {"bericht": {"name": "Bericht (Zeitungsbericht, Unfallbericht, Meldung)", "gruppe": "Informieren und Beschreiben", "umfang": "laut Aufgabenstellung (Zeitungsbericht meist ca. 100–300 Wörter, Unfallbericht z. B. 220 Wörter ± 10 %)", "inhalt": ["Alle W-Fragen vollständig und genau beantwortet: Wer? Was? Wo? Wann? Wie? Warum? Welche Folgen? (bei Zeitungsberichten ggf. auch: Welche Quelle?).", "Angaben präzise: genaues Datum und Uhrzeit, genauer Ort, Beteiligte mit Alter bzw. Funktion; beim Unfallbericht auch Fahrzeuge/Kennzeichen, Verletzungen, Sachschaden, Einsatzkräfte.", "Nur Wesentliches, das der Adressat zum Verständnis braucht; Nebensächliches aus Vorlagen/Zeugenaussagen (Gefühle, Ausrufe, private Bemerkungen, Klatsch) ist weggelassen – aber nichts Wichtiges fehlt.", "Nur Tatsachen; Vermutungen höchstens deutlich als solche gekennzeichnet (vermutlich, laut Polizei, soll … haben) – im Unfall-/Versicherungsbericht gar keine Vermutungen oder persönlichen Empfindungen.", "Zeugenaussagen sinngemäß eingearbeitet (nicht wörtlich übernommen); widersprüchliche Aussagen sachlich nebeneinandergestellt, ohne selbst zu entscheiden.", "Zeitlicher und ursächlicher Zusammenhang des Geschehens folgerichtig und lückenlos dargestellt.", "Schluss nennt die Folgen bzw. den Ausgang (Verletzte, Schaden, Ermittlungen) – ohne Wertung oder Kommentar.", "Zeitungsbericht: treffende Schlagzeile/Headline, die zum Lesen reizt und die wichtigste Information enthält."], "struktur": ["Einleitung (beim Zeitungsbericht: Lead/Vorspann): beantwortet knapp, oft in einem Satz, Wer? Was? Wo? Wann?", "Hauptteil (Body): genauer Hergang – Wie? Warum? – in der richtigen zeitlichen Reihenfolge, ggf. Aussagen Beteiligter und Hintergründe.", "Schluss: Welche Folgen? Ergebnis bzw. Stand der Dinge.", "Zeitungsbericht: (Dachzeile) – Schlagzeile – (Untertitel) – Lead – Body; das Wichtigste steht am Anfang.", "Absätze zwischen Einleitung, Hauptteil und Schluss; zeitliche Verknüpfungen (zunächst, nachdem, daraufhin, anschließend, schließlich)."], "sprache": ["Präteritum; was davor geschah, im Plusquamperfekt (Ausnahme: Tätigkeits-/Praktikumsbericht kann Präsens verwenden).", "Sachlich, nüchtern, klar und präzise; knapp, aber genau; Fachausdrücke (kollidierte, erlitt, Sachschaden, wurde eingeliefert).", "Keine Ausschmückungen, keine Gefühle, Gedanken, Spannung, Vergleiche, Ausrufe; keine persönlichen Wertungen (z. B. leider, zum Glück, rücksichtslos).", "Keine wörtliche Rede – Aussagen in indirekter Rede mit Konjunktiv (gab an, sie sei bei Grün losgefahren); im Zeitungsbericht höchstens einzelne kurze, gekennzeichnete Zitate.", "Gliedsätze und abwechslungsreiche Satzanfänge statt gleichförmiger Hauptsatzreihen; keine Umgangssprache aus den Zeugenaussagen übernehmen.", "Ich- oder Er-Form je nach Aufgabenstellung (Bericht an die Versicherung in Ich-Form möglich)."], "typische_fehler": ["Präsens statt Präteritum oder Wechsel der Zeitform.", "Wörtliche Rede, Ausrufe oder Umgangssprache aus Zeugenaussagen übernommen.", "Erzählerischer Stil: Spannung, Gefühle, Gedanken, Ausschmückungen.", "Vermutungen oder Wertungen als Tatsachen dargestellt.", "W-Fragen unvollständig (v. a. genaue Zeit, Ort oder Folgen fehlen) oder unwichtige Details aufgenommen.", "Reihenfolge des Geschehens durcheinander, Zusammenhang sprunghaft.", "Schlagzeile fehlt oder verrät nichts Wesentliches."]}, "reportage": {"name": "Reportage", "gruppe": "Informieren und Beschreiben", "umfang": "laut Aufgabenstellung (in ihren Aufgaben ca. 250 Wörter)", "inhalt": ["Fakten des Ereignisses (W-Fragen) sind vollständig enthalten, aber mit Eindrücken und Atmosphäre verwoben.", "Szenischer Einstieg (Momentaufnahme aus dem Geschehen) oder Einstieg mit einem Zitat.", "Augenzeugen oder Beteiligte kommen mit direkten Zitaten zu Wort (O-Töne).", "Ein bis zwei Hauptpersonen, an denen das Geschehen festgemacht wird.", "Hintergrundinformationen an passenden Stellen eingestreut (Wechsel zwischen Nähe/Szene und Distanz/Fakten).", "Genaue Beobachtung mit allen Sinnen.", "Gestalteter Schluss (Pointe, Ausblick, Rückkehr zur Eingangsszene)."], "struktur": ["Treffende Schlagzeile – szenischer Einstieg – Hauptteil mit Szenen und Hintergrund – gestalteter Schluss.", "Roter Faden und Spannungsbogen; Absätze."], "sprache": ["Anschaulich und bildhaft: beschreibende Adjektive, treffende Verben, Vergleiche, sprachliche Bilder, Sinneseindrücke.", "Häufig Präsens (Leser soll den Eindruck haben, dabei zu sein); Hintergrund kann in Vergangenheitsformen stehen – Wechsel bewusst eingesetzt.", "Direkte Zitate korrekt mit Anführungszeichen gekennzeichnet."], "typische_fehler": ["Nur ein sachlicher Bericht ohne Anschaulichkeit.", "Keine Zitate/O-Töne von Beteiligten.", "Fakten (W-Fragen) gehen in der Schilderung unter.", "Kein gestalteter Einstieg oder Schluss."]}, "beschreibung": {"name": "Beschreibung (Personen-, Tier-, Gegenstandsbeschreibung)", "gruppe": "Informieren und Beschreiben", "umfang": "laut Aufgabenstellung", "inhalt": ["Der Reihe nach beschrieben (z. B. vom Gesamteindruck zu den Einzelheiten, bei Personen von oben nach unten) – nicht sprunghaft.", "Eindeutig erkennbar: alle wichtigen Merkmale genannt.", "Personen: persönliche Daten (Geschlecht, Name, Alter), Größe und Figur, Gesicht (Form, Haare/Frisur, Augen, Nase, Mund …), Kleidung, besondere Kennzeichen.", "Bei Personen und Tieren nicht nur das Äußere, sondern auch das Wesen: Interessen, typisches Verhalten, Wünsche, wie die Person in verschiedenen Situationen reagiert.", "Gegenstände: Art, Form, Größe, Farbe, Material, Teile und Funktion.", "Einleitung sagt, wer/was beschrieben wird (bei Personen: woher man sie kennt, warum man sie beschreibt); Schluss mit Besonderheit oder eigener Einschätzung."], "struktur": ["Einleitung (wer/was, Gesamteindruck) – Hauptteil (Merkmale geordnet) – Schluss (Besonderheit, Wesen, Einschätzung).", "Absätze zwischen den Teilen bzw. Merkmalsgruppen."], "sprache": ["Durchgehend Gegenwart (Präsens).", "Treffende, genaue Eigenschafts-, Zeit- und Namenwörter (statt schön, normal, irgendwie).", "Abwechslungsreiche Zeitwörter statt immer ist, hat, sind, habe, bin.", "Sätze beginnen mit unterschiedlichen Satzgliedern.", "Sätze vollständig, mit Satzzeichen, richtige Wortstellung; richtige Artikel, Fälle und Mehrzahlformen."], "typische_fehler": ["Erzählt (Handlung, Vergangenheit) statt beschrieben.", "Ungeordnet, springt zwischen Merkmalen hin und her.", "Nur ist und hat als Verben.", "Ungenaue, nichtssagende Adjektive.", "Bei Personen nur das Äußere, kein Wesen."]}, "bildgeschichte": {"name": "Bildgeschichte (Bildergeschichte)", "gruppe": "Erzählen", "umfang": "laut Aufgabenstellung", "inhalt": ["Überschrift macht neugierig, verrät aber nicht zu viel.", "Figuren (Menschen, Tiere) haben Namen.", "Einleitung: Wer? Wann? Wo? – Hauptteil: Was geschieht? – Schluss: kurze Zusammenfassung, Schlussfolgerung oder Pointe.", "Höhepunkt der Geschichte besonders ausführlich dargestellt.", "Erzählt auch, was vor, zwischen und nach den Bildern passiert; wer die Geschichte ohne Bilder liest, kennt sich aus.", "Nicht nur, was zu sehen ist: auch was die Figuren denken, reden und fühlen.", "Reihenfolge der Bilder eingehalten, wichtige Details der Bilder berücksichtigt, Sinn/Pointe der Bildfolge erkannt."], "struktur": ["Einleitung – Hauptteil (mit Höhepunkt) – Schluss, durch Absätze getrennt.", "Die einzelnen Bilder sind zu einer zusammenhängenden Handlung verbunden (Übergänge statt Bild-für-Bild-Aufzählung)."], "sprache": ["Eine Zeitform durchgehalten: laut ihrer Checkliste Gegenwart; manche Aufgaben verlangen Präteritum – die Aufgabenstellung entscheidet.", "Wörtliche Rede (mindestens zweimal), korrekt gekennzeichnet.", "Jeder Satz beginnt mit einem anderen Satzglied; für einen Begriff unterschiedliche Wörter.", "Passende, treffende Verben und Adjektive.", "Sätze vollständig, jeder endet mit Satzzeichen; Personalformen der Zeitwörter stimmen."], "typische_fehler": ["Nur beschrieben, was auf den Bildern zu sehen ist (Bildbeschreibung statt Geschichte).", "Lücken zwischen den Bildern, ohne Bilder unverständlich.", "Wechsel der Zeitform.", "Keine wörtliche Rede, keine Gedanken und Gefühle.", "Figuren ohne Namen, Überschrift fehlt oder verrät alles."]}, "erlebniserzaehlung": {"name": "Erlebniserzählung", "gruppe": "Erzählen", "umfang": "laut Aufgabenstellung", "inhalt": ["Das selbst gesetzte Ziel (spannend, lustig, traurig, interessant …) wird erreicht.", "Nur EIN Erlebnis; Handlung logisch und realistisch, Handlungsschritte zusammenhängend und nicht sprunghaft; keine aneinandergereihten Katastrophen oder mehreren Höhepunkte.", "Genau erzählt: beteiligte Personen, Gefühle und Gedanken (innere Handlung) mit der äußeren Handlung verknüpft.", "Sinneseindrücke (was zu hören, sehen, riechen, schmecken, fühlen ist) als schildernde Elemente – passend zum Thema, nicht übertrieben.", "Höhepunkt klar erkennbar, ausführlich und anschaulich gestaltet.", "Themenstellung genau beachtet; am Ende bleiben keine Fragen zur Handlung offen.", "Bei Fortsetzung eines Erzählanfangs: knüpft schlüssig an den Anfang an, Figuren und Erzählperspektive (z. B. Ich-Form) bleiben erhalten."], "struktur": ["Überschrift treffend und kurz, deutet das Geschehen nur an, weckt Interesse.", "Einleitung führt zum Hauptteil hin: wer erzählt, wer beteiligt ist, wann und wo (keine genauen Angaben nötig), erstes Spannungsmoment; lebendig, z. B. mit wörtlicher Rede. Ein Einstieg mitten im Geschehen ist möglich, dann folgt ein kurzer Rückblick.", "Hauptteil: Handlungsschritte der Reihe nach, Spannung steigt zum Höhepunkt; Spannung durch Schilderungen verzögert; nicht unnötig in die Länge gezogen.", "Schluss rundet knapp ab (Ergebnis, Folgen, Stimmung danach, kurzer Rückblick oder Lehre) – keine neuen Personen, kein Ortswechsel.", "Einleitung, Hauptteil und Schluss deutlich unterscheidbar, durch Absätze getrennt und in sinnvollem Längenverhältnis."], "sprache": ["Erzählzeit Präteritum (Mitvergangenheit); am Höhepunkt ist ein bewusster Wechsel ins szenische Präsens möglich, danach zurück ins Präteritum; Rückblicke im Plusquamperfekt.", "Wörtliche Rede an passenden Stellen und in sinnvollem Maß; treffende Redebegleitverben statt immer sagte; Gedanken (innerer Monolog) wie wörtliche Rede.", "Spannung durch kurze Sätze, Ausrufe- und Fragesätze, Vergleiche, anschauliche Verben und Adjektive.", "Jeder Satz beginnt mit dem wichtigsten Satzglied; abwechslungsreiche Satzanfänge; keine Wortwiederholungen, für einen Begriff unterschiedliche Wörter; angemessene Wortwahl.", "Sätze vollständig, richtige Wortstellung, Satzzeichen; Personalformen stimmen."], "typische_fehler": ["Zeitformwechsel ohne erzählerischen Grund.", "Immer gleiche Satzanfänge (Dann … Dann … Und dann …) oder Beginn mit „Ich …“.", "Mehrere Erlebnisse statt eines, Katastrophenhäufung.", "Kein erkennbarer oder zu knapper Höhepunkt; Höhepunkt nur behauptet statt gestaltet.", "Nur äußere Handlung, keine Gefühle, Gedanken, Sinneseindrücke.", "Schluss fehlt, ist zu lang oder führt neue Personen/Orte ein."]}, "fantasieerzaehlung": {"name": "Fantasieerzählung (Phantasieerzählung)", "gruppe": "Erzählen", "umfang": "laut Aufgabenstellung", "inhalt": ["Das selbst gesetzte Ziel (geheimnisvoll, spannend, witzig, gruselig …) wird erreicht.", "Überschrift macht neugierig, verrät aber nicht alles.", "Nur EIN Ereignis, logisch aufgebaut; die fantastische Welt folgt in sich stimmigen Regeln.", "Genau erzählt (Personen, Gefühle, Ort), sodass sich die Leserin/der Leser auskennt.", "Häufig mit Rahmen: realistische Ausgangssituation, bruchloser Übergang in die Fantasie, Spannungslösung und Rückkehr zur Ausgangssituation.", "Einleitung nennt Ort, Personen und das Ereignis, das die Handlung auslöst; Höhepunkt ausgestaltet.", "Vorgaben der Aufgabe (z. B. vorgegebener Anfang oder Stichworte) eingehalten."], "struktur": ["(Rahmensituation) – Einleitung – Hauptteil mit Steigerung bis zum Höhepunkt – Lösung/Rückkehr – Schluss.", "Absätze zwischen den Abschnitten; Übergänge flüssig, keine Brüche."], "sprache": ["Erzählzeit Präteritum (Mitvergangenheit), durchgehalten.", "Jeder Satz beginnt mit dem wichtigsten Satzglied; abwechslungsreiche Satzanfänge.", "Treffende Wörter; für einen Begriff/eine Figur unterschiedliche Bezeichnungen.", "Wörtliche Rede, Sinneseindrücke, Gefühle; anschauliche Verben und Adjektive.", "Sätze vollständig, jeder endet mit Satzzeichen; richtige Wortstellung."], "typische_fehler": ["Übergang in die Fantasiewelt abrupt oder unlogisch.", "Mehrere Abenteuer aneinandergereiht statt eines Ereignisses.", "Leser kennt sich nicht aus (Figuren/Ort nicht eingeführt).", "Keine Auflösung bzw. Schluss bricht ab.", "Zeitformwechsel."]}, "nacherzaehlung": {"name": "Nacherzählung", "gruppe": "Erzählen", "umfang": "laut Aufgabenstellung", "inhalt": ["Alle wichtigen Informationen (Ort, Zeit, Personen, Tiere …) berücksichtigt.", "Der Reihe nach erzählt, Reihenfolge der Vorlage eingehalten.", "Nur Wesentliches; nichts Neues dazugedichtet.", "Inhalt sachlich richtig wiedergegeben; Pointe/Ausgang der Vorlage erhalten.", "Klar aufgebaut und gegliedert."], "struktur": ["Einleitung – Hauptteil – Schluss wie in der Vorlage; Absätze."], "sprache": ["Auch eigene Worte, nicht abgeschrieben; Wortwahl passt genau zum Inhalt.", "Jeder Satz beginnt mit dem wichtigsten Satzglied.", "Wörtliche Rede als wichtiges Stilmittel eingesetzt.", "Mitvergangenheit (Präteritum) durchgehalten; Personalformen stimmen.", "Sätze vollständig, enden mit Satzzeichen, richtige Wortstellung."], "typische_fehler": ["Neues erfunden oder Inhalt verändert.", "Wichtige Informationen fehlen oder Reihenfolge vertauscht.", "Vorlage wörtlich abgeschrieben.", "Zeitform nicht durchgehalten.", "Unwichtige Details."]}, "charakteristik": {"name": "Charakteristik / Charakterisierung", "gruppe": "Informieren und Beschreiben", "umfang": "laut Aufgabenstellung", "inhalt": ["Einleitung bei literarischer Figur: Titel, Autor/in, Textsorte; wann, wo und wie die Figur im Text auftaucht, ihre Rolle/Funktion in der Handlung, ggf. Zeithintergrund. Bei realer Person: wer sie ist, Beziehung zur/zum Schreibenden, Anlass.", "Äußeres Erscheinungsbild knapp und aussagekräftig (Geschlecht, Alter, Körperbau, Haltung, Gesicht, Kleidung, Besonderheiten).", "Äußeres Verhalten: Gewohnheiten, Eigenarten, Sprech- und Kommunikationsweise; soziale Lage (Beruf, Stellung, Familie, Freundschaften, Beziehungen zu anderen Figuren).", "Innere Merkmale: Interessen, Fähigkeiten, Zu- und Abneigungen, Gefühle, Einstellungen, Werte, Umgang mit Konflikten, Wünsche und Träume; ggf. Entwicklung der Figur.", "Charaktereigenschaften mit treffenden Adjektiven benannt UND an konkreten Situationen bzw. Verhaltensweisen gezeigt und erläutert (Eigenschaft – Beleg – Erläuterung), nicht bloß behauptet.", "Literarische Figur: Aussagen durch direkte oder indirekte Zitate mit Seiten-/Zeilenangabe in Klammern belegt; im Text nicht Genanntes nur als Vermutung gekennzeichnet.", "Schluss: zusammenfassendes Gesamturteil (Sach- und Werturteil), positive und negative Seiten abgewogen, eigene Einschätzung, ggf. Ausblick."], "struktur": ["Einleitung – Hauptteil (vom Äußeren zum Inneren, nach Aspekten geordnet; oft steht der ergiebigste Bereich zuletzt) – Schluss.", "Ein Absatz pro Aspekt; nicht entlang der Handlung nacherzählt.", "Vergleichende Charakterisierung: dieselben Kriterien für beide Figuren, Gemeinsamkeiten und Unterschiede gegenübergestellt."], "sprache": ["Präsens.", "Sachlich; bei der Charakteristik einer realen, bekannten Person persönlicher Ton und Ich-Form erlaubt.", "Treffende, differenzierte Eigenschaftswörter (z. B. zuverlässig, ehrgeizig, verschlossen statt nett, lieb, cool).", "Abwechslungsreiche Verben statt ist/hat; Formulierungen wie zeigt sich, wirkt, lässt erkennen.", "Zitate korrekt gekennzeichnet (Anführungszeichen, Stellenangabe); Fachbegriffe direkte/indirekte Charakterisierung richtig verwendet."], "typische_fehler": ["Behauptungen ohne Beleg oder Beispielsituation.", "Nacherzählung der Handlung statt Charakteristik.", "Nur Äußeres, kein Wesen; oder nur Aufzählung von Adjektiven.", "Vergangenheitsform statt Präsens.", "Schluss ohne Gesamturteil."]}, "empfehlung": {"name": "Empfehlung", "gruppe": "Argumentieren und Stellung nehmen", "umfang": "405–495 Wörter (laut Aufgabenstellung auch 270–330 oder 540–660)", "inhalt": ["Situation, eigene Rolle und Adressaten laut Aufgabenstellung erkennbar; Text ist auf die Betroffenen und ihre Lebenswelt zugeschnitten.", "Einleitung: Anlass kurz dargestellt und die zur Auswahl stehenden Möglichkeiten (Texte, Produkte, Projekte, Vorgehensweisen) genannt bzw. vorgestellt.", "Bezug zur Textbeilage: relevante Einzelaspekte in eigenen Worten wiedergegeben; Personen/Organisationen aus der Beilage beim ersten Nennen kurz vorgestellt.", "Vorgegebene Kriterien (z. B. Förderkriterien) offengelegt und die Möglichkeiten daran überprüft; Vergleich und Abwägung.", "Klares, begründetes Urteil mit mindestens zwei überzeugenden Argumenten nach dem 3-B-Schema (Behauptung – Begründung – Beispiel/Beleg).", "Die andere Möglichkeit wird kurz behandelt und ihr Hauptnachteil benannt; Nachteile bzw. Gegenargumente berücksichtigt.", "Schluss: eindeutige Empfehlung (oder begründet offene Empfehlung mit Bedingungen: wenn … am wichtigsten ist, dann …); Urteil zusammengefasst, ggf. Kompromiss/Alternativvorschlag, Dank für das Vertrauen.", "Die eigentliche Empfehlung nimmt genügend Raum ein (nicht nur ein Schlusssatz)."], "struktur": ["Einleitung (Situation, Optionen) – Hauptteil (Vorstellung/Zusammenschau der Möglichkeiten → Kriterien und Bewertung → eigene Position mit Argumenten → Nachteile der anderen Option) – Schluss/Conclusio.", "Absätze (bei SRDP durch Leerzeilen); Sätze logisch verbunden, erkennbare Gewichtung der Argumente."], "sprache": ["Präsens; Vorzeitigkeit im Perfekt; kein Präteritum.", "Begründete, wertende Formulierungen statt neutralem Ton; Mittel der Abschwächung und Verstärkung zur Gewichtung.", "Konjunktionen und flüssige Satzverbindungen, die Zusammenhänge deutlich machen; keine bloße Aneinanderreihung von Fakten.", "Standardsprache, adressatengerecht; Ich-Form aus der vorgegebenen Rolle; je nach Rolle auch werbend.", "Eigene Formulierungen, nicht zu nahe an der Textvorlage."], "typische_fehler": ["Keine eindeutige Empfehlung am Ende oder Empfehlung viel zu kurz.", "Rolle/Adressat ignoriert, nicht aus der vorgegebenen Situation geschrieben.", "Nur Nacherzählung der Textbeilage ohne Bewertung.", "Thema wird erörtert (Pro und Kontra gleich gewichtet) statt eine Seite zu empfehlen.", "Vorgegebene Kriterien nicht überprüft.", "Personen aus der Textbeilage ohne Einführung genannt; Gedankensprünge, unklare Aussagen.", "Präteritum, Umgangssprache."]}, "eroerterung": {"name": "Erörterung", "gruppe": "Argumentieren und Stellung nehmen", "umfang": "405–495 oder 540–660 Wörter (Unterstufe/5. Klasse laut Aufgabenstellung, z. B. 270 ± 10 %)", "inhalt": ["Einleitung: Aufhänger (aktueller Anlass, persönliches Erlebnis, geschichtlicher Überblick, Begriffsdefinition, Zitat/Redensart, Frage, Provokation), Überleitung zum Thema und klare Formulierung der Fragestellung – ohne Wertung und ohne Argumente des Hauptteils vorwegzunehmen.", "Textbezug: Eckdaten der Textbeilage (Verfasser/in, Titel, Textsorte, Medium, Datum) und deren Thema bzw. zentrale These genannt.", "Textgebundene Erörterung: Kernaussage und Argumentationsgang der Vorlage in eigenen Worten wiedergegeben; anschließend kritisch geprüft (Zustimmung, Widerspruch, teilweise Übereinstimmung, Weiterführung) – die Textkritik ist der umfangreichste Teil; erkennbar, wo Text wiedergegeben und wo erörtert wird.", "Jedes Argument vollständig nach dem 3-B-Schema: Behauptung (These) – Begründung – Beispiel/Beleg (Fakten, Zahlen, Expertenaussagen, Erfahrung), ggf. Folgerung; zu Argumenten der Vorlage auch eigene Beispiele oder Gegenbeispiele, dazu eigene Argumente.", "Argumente relevant, sachlich richtig, haltbar und logisch; Zusammenhänge folgerichtig.", "Dialektisch: Pro- und Kontra-Argumente ausgewogen, nicht einseitig; im Hauptteil sachlich-objektiv, die eigene Meinung erst im Schluss. Linear: nur eine Richtung, steigernd vom schwächsten zum stärksten Argument.", "Schluss: Wesentliches knapp zusammengefasst, eigene Meinung begründet mit Bezug auf die Argumente des Hauptteils, Lösungsvorschlag/Kompromiss, Ausblick oder Appell."], "struktur": ["Einleitung – Hauptteil (längster Teil) – Schluss, durch Absätze (bei SRDP Leerzeilen) getrennt; jedes Argument ein Absatz.", "Anordnung der Argumente: steigernd (schwächstes zuerst, stärkstes zuletzt); dialektisch entweder Blocksystem (alle Pro, dann alle Kontra), Wechselsystem (Pro/Kontra abwechselnd) oder Sanduhr (Gegenposition vom stärksten zum schwächsten, dann eigene Position vom schwächsten zum stärksten).", "Textgebunden: Blocksystem (erst Textwiedergabe, dann Textkritik) oder Wechselsystem (Textelement – Stellungnahme – Textelement – Stellungnahme).", "Argumente als einzelne erkennbar, aber durch Überleitungen verbunden (Gegensatz, Ergänzung, Steigerung); ohne Überleitungen wirkt der Text wie eine Gliederung – das ist ein Strukturfehler."], "sprache": ["Sachlich-objektiv; Präsens, Vorzeitigkeit im Perfekt.", "Überleitungen und Verknüpfungsmittel: Darüber hinaus, Hinzu kommt, Ein weiterer Gesichtspunkt ist, Im Gegensatz dazu, Allerdings muss man auch sehen, Daraus ergibt sich …", "Konjunktionen sinnrichtig: kausal (weil, da, denn), konsekutiv (sodass, daher, folglich), final (damit, um zu), adversativ (aber, jedoch), konzessiv (obwohl, zwar … aber).", "Verben der Meinungsäußerung und Formulierungen für den Standpunkt im Schluss (Ich vertrete den Standpunkt, dass …).", "Positionen der Autorin/des Autors in indirekter Rede mit Konjunktiv; Zitate gekennzeichnet; Fachwortschatz zum Thema.", "Standardsprache, keine Umgangssprache; Schluss lebendig abrunden statt nur mit Floskeln."], "typische_fehler": ["Argumente nur behauptet – ohne Begründung oder Beispiel.", "Bei dialektischer Erörterung einseitig oder eigene Meinung schon in Einleitung/Hauptteil.", "Keine Überleitungen, Text wirkt wie eine Liste.", "Textbezug fehlt oder Vorlage nur nacherzählt; Textkritik zu kurz.", "Einleitung nimmt Argumente vorweg oder nennt das Thema nicht klar.", "Schluss ohne begründete Stellungnahme oder ohne Bezug zum Hauptteil.", "Falsche Konjunktionen, unlogische Zusammenhänge; Umgangssprache."]}, "stellungnahme": {"name": "Stellungnahme", "gruppe": "Argumentieren und Stellung nehmen", "umfang": "laut Aufgabenstellung (Einleitung ca. eine Viertelseite)", "inhalt": ["Einleitung: Anlass und Thema/Frage genannt, mit der man sich auseinandersetzt; Einstieg z. B. mit Zitat, Beispiel, Frage oder aktuellem Bezug.", "Hauptteil: eigene Meinung, begründet durch mehrere Argumente, jedes bestehend aus Behauptung + Begründung + Beispiel (Beispiele auch aus Text oder eigener Erfahrung).", "Argumente nach Wichtigkeit geordnet (vom schwächsten zum stärksten).", "Je nach Auftrag einseitig (nur eigene Argumente) oder mit Gegenargumenten, die abgewogen bzw. widerlegt werden.", "Schluss (kurz): Meinung zusammengefasst, ggf. Gegenseite entkräftet, Ausblick, Aufforderung/Appell oder Empfehlung; keine neuen Argumente.", "Passende Überschrift vorhanden."], "struktur": ["Einleitung – Hauptteil (ein Argument pro Absatz, mit Überleitung zum nächsten) – Schluss – Überschrift.", "Bei Pro und Kontra: Argument und Gegenargument abwechselnd oder blockweise, erkennbar geordnet."], "sprache": ["Meinungsformeln (Ich bin der Ansicht, Meiner Meinung nach, Ich vertrete die Auffassung …), Begründungsformeln (Ein Grund dafür ist, Das zeigt sich daran …), Beispielformeln (Aus meiner Erfahrung weiß ich …).", "Überleitungen und Konjunktionen (Ein weiteres Argument ist, Außerdem darf man nicht unberücksichtigt lassen, Andererseits muss man bedenken, Besonders schwerwiegend ist …).", "Sachlich, klar, Präsens; Ich-Form erlaubt; Standardsprache."], "typische_fehler": ["Behauptungen ohne Begründung oder Beispiel.", "Keine klare Position.", "Argumente unverbunden aneinandergereiht, keine Überleitungen.", "Überschrift fehlt.", "Schluss zu lang oder mit neuen Argumenten."]}, "offener_brief": {"name": "Offener Brief", "gruppe": "Argumentieren und Stellung nehmen", "umfang": "270–330, 405–495 oder 540–660 Wörter (Schularbeit auch 400–450) – Umfang einhalten", "inhalt": ["Klare Adressierung der Empfängerin/des Empfängers laut Aufgabenstellung; Schreibanlass, Quelle und eigene Rolle/Funktion (z. B. als Schulsprecher/in) genannt.", "Explizite Schreibabsicht: Was motiviert den Brief, was soll erreicht werden, was wird vom Adressaten erwartet (Petition, Appell, Richtigstellung)?", "Knappe, korrekte Darlegung des Sachverhalts (Ist-Zustand) mit Bezug zur Textbeilage; allgemeine Behauptungen mit konkreten Belegen (Zahlen, Studien) gestützt.", "Eigene Position klar erkennbar; nur Argumente, die den eigenen Standpunkt stützen (keine ausgewogene Pro-Kontra-Darstellung), am besten zwei bis drei Kernargumente nach dem 3-B-Schema.", "Konkrete Bezugnahme auf Aussagen oder Handlungen der Adressatin/des Adressaten; Verantwortungsbereich des Adressaten berücksichtigt.", "Soll-Zustand bzw. Lösungsvorschläge formuliert.", "Konkreter Appell/Handlungsaufforderung, der im Sachzusammenhang sinnvoll und für die Adressaten realisierbar ist; ggf. Aufforderung zur Stellungnahme."], "struktur": ["Briefform: Ort und Datum, ggf. Betreff, höfliche Anrede (‚Sehr geehrte Frau Ministerin …!‘), Brieftext, Grußformel und Unterschrift/Namensliste (ggf. ‚im Namen von …‘, ‚Kopie ergeht an …‘); Briefkopf/Anschrift laut SRDP nicht nötig.", "Einleitung: Anlass, eigener Hintergrund, Anliegen und Ziel → Hauptteil: Sachverhalt und argumentative Darlegung der Position, Lösungsvorschläge → Schluss: knappe Zusammenfassung der Forderungen und finaler Appell → Schlussformel.", "Erkennbarer roter Faden, Absätze mit Leerzeilen; Konzentration auf das Kernanliegen, keine Grundsatzdiskussionen und Weitschweifigkeit.", "Starkes Argument je nach Haltung des Adressaten an den Anfang (These liegt ihm nahe) oder an den Schluss (These liegt ihm fern)."], "sprache": ["Höflich und sachlich, dennoch fordernd und pointiert; subjektiv-wertend, aber nie beleidigend oder diskriminierend.", "Direkte Ansprache der Adressaten mit Anredepronomen (Sie, Ihr – großgeschrieben); durchgehend aus der Ich- bzw. Wir-Perspektive.", "Rhetorische und dialogische Mittel zur Veranschaulichung und Verstärkung (rhetorische Fragen, Anaphern/Wiederholungen im Schlussappell, Parallelismus, Vergleiche, Ellipsen).", "Standardsprache; sprachliche Genauigkeit vor sprachlicher Schönheit; keine informellen Floskeln.", "Präsens, Vorzeitigkeit im Perfekt; Konjunktionen und flüssige Satzverbindungen."], "typische_fehler": ["Zu informelle Anrede oder Grußformel (‚Liebe Frau …‘, ‚Liebe Grüße‘) oder Briefelemente fehlen.", "Schreibabsicht fehlt – unklar, warum der Brief geschrieben wird.", "Behauptungen ohne Beleg (Studie, Zahlen, Beispiel).", "Kein oder nur schwacher, unkonkreter Appell; nicht klar, was vom Adressaten erwartet wird; Appell nicht umsetzbar.", "Mit Leserbrief verwechselt (Reaktion auf Berichterstattung statt Hinwendung an Verantwortliche).", "Adressat wird ignoriert, nicht direkt angesprochen.", "Pro und Kontra gleich gewichtet wie in einer Erörterung; zu nah an der Textvorlage formuliert."]}, "filmanalyse": {"name": "Filmanalyse / Sequenzanalyse", "gruppe": "Analysieren und Interpretieren", "umfang": "laut Aufgabenstellung", "inhalt": ["Einleitung mit Grunddaten: Titel, Regie, Produktionsland, Entstehungsjahr, Genre; ggf. untersuchte Sequenz genau benennen (wo im Film, wie lang).", "Knappe Inhaltsangabe des Films bzw. der Sequenz (nur Handlungskern, keine Nacherzählung aller Szenen).", "Thema/Problem des Films: Welches Problem wird gezeigt, welche Ursachen werden erkennbar, welcher Standpunkt wird vertreten, welche Lösungsansätze angeboten?", "Analyse der Gestaltungsmittel mit Beispielen aus dem Film: Einstellungsgrößen, Kameraperspektive, Kamerabewegung, Licht und Farbe (auch Farbe/Schwarz-Weiß), Ton (Sprache, Musik, Geräusche; On/Off), Schnitt/Montage, Schauspiel/Figuren, Setting/Ausstattung.", "Zu jedem genannten Gestaltungsmittel wird gesagt, WIE es eingesetzt wird UND WELCHE WIRKUNG es erzielt (z. B. Nähe/Distanz, Spannung, Bedrohung, Identifikation).", "Handlungsaufbau untersucht: linear oder sprunghaft, ein- oder mehrsträngig, Rückblenden/Zeitebenen, Zeitlupe/Zeitraffer; Erzählperspektive (z. B. subjektive Kamera, Off-Erzähler).", "Figuren/Handlungsträger: Identifikationsangebot, eindeutig oder mehrdeutig, klischeehaft; Beziehung der Figuren im Bild (Konfiguration).", "Zielgruppe des Films benannt; Schluss: Zusammenführung der Einzelbeobachtungen zur Gesamtwirkung/Aussage, Deutung und ggf. begründete Bewertung nur, wenn ein Operator es verlangt."], "struktur": ["Einleitung (Grunddaten, Thema) – kurze Inhaltsangabe – Analyse der Gestaltungsmittel – Deutung/Gesamtwirkung – Schluss.", "Analyse nach Gestaltungsmitteln oder chronologisch nach Szenen geordnet, aber jeweils ein Aspekt pro Absatz.", "Beschreibung (was ist zu sehen/hören), Wirkung und Deutung bleiben unterscheidbar und sind mit Überleitungen verbunden.", "Die Analyse bleibt nicht bei getrennten Einzelbeobachtungen stehen, sondern wird zum Filmganzen zusammengeführt."], "sprache": ["Sachlich, Präsens (Handlung des Films im Präsens wiedergeben).", "Filmfachbegriffe korrekt: Panorama/Weit, Totale, Halbtotale, Halbnah, Amerikanisch, Nah, Groß/Close-up, Detail; Vogel-/Froschperspektive, Normalsicht; Schwenk, Fahrt, Zoom, Handkamera; Schuss-Gegenschuss; Schnitt, Blende, Parallelmontage; High-Key/Low-Key; On/Off, Voice-over.", "Belege durch genaue Szenen- oder Zeitangaben statt allgemeiner Behauptungen.", "Deutungen vorsichtig formuliert (kann wirken, deutet darauf hin, möglicherweise)."], "typische_fehler": ["Nur Nacherzählung der Handlung, keine Analyse der Gestaltungsmittel.", "Gestaltungsmittel bloß aufgezählt, ohne Wirkung oder Funktion zu erklären.", "Fachbegriffe falsch oder ungenau verwendet (z. B. Einstellungsgröße mit Perspektive verwechselt).", "Deutung ohne Beleg aus dem Film; eigene Meinung statt Analyse.", "Grunddaten (Regie, Jahr, Land) fehlen."]}, "grafikanalyse": {"name": "Grafikanalyse / Grafikbeschreibung", "gruppe": "Analysieren und Interpretieren", "umfang": "laut Aufgabenstellung; Schularbeit meist 270–330 Wörter (Hausübung auch 120–150)", "inhalt": ["Einleitung: Titel bzw. Thema der Grafik, Quelle/Herausgeber, durchführendes Institut, Erscheinungsmedium und -datum, Erhebungszeitraum, Art des Diagramms, Maßeinheit (Prozent, absolute Zahlen, Tausend …); wenn erkennbar Zielgruppe der Grafik; Überblick, worum es geht.", "Hauptteil: nur die relevanten Daten ausgewählt und ggf. zusammengefasst – nicht jede Zahl aufgezählt.", "Extremwerte (besonders hohe, niedrige, überraschende Werte), Übereinstimmungen und Unterschiede herausgearbeitet; Vergleiche (z. B. Frauen/Männer, Altersgruppen, Schultypen) und Entwicklungen/Tendenzen beschrieben.", "Zahlen korrekt aus der Grafik übernommen und richtig eingeordnet (Bezugsgröße, Einheit).", "Jeder Arbeitsauftrag erkennbar bearbeitet: wiedergeben/beschreiben, erschließen/erläutern (Unterschiede), erklären/diskutieren (mögliche Ursachen, Folgen), begründen (eigene These).", "Wo verlangt: mögliche Ursachen und Konsequenzen der Werte, Schlussfolgerungen; ggf. kritischer Blick auf die Darstellung (Was geht aus der Grafik nicht hervor? Informiert sie sachlich oder manipuliert sie?).", "Schluss: kurze Zusammenfassung der auffälligsten Ergebnisse / Fazit; persönliche Stellungnahme üblich – bei rein beschreibender Aufgabenstellung knapp halten."], "struktur": ["Einleitung (Beschreibung der Grafik) – Hauptteil (Analyse und Interpretation der Daten) – Schluss (Zusammenfassung, Fazit/Stellungnahme).", "Hauptteil vom Allgemeinen (Haupttendenz) zum Detail oder nach Kategorien/Diagrammen geordnet; bei mehreren Diagrammen klar getrennt und dann verknüpft.", "Absätze mit Leerzeilen; Überleitung von der Beschreibung zum Diskussions-/Argumentationsteil."], "sprache": ["Sachlich und informativ, Präsens.", "Formulierungen der Grafikbeschreibung: Die Grafik gibt Auskunft über …, Aus dem Diagramm geht hervor, dass …, Auffällig ist …, An erster Stelle steht …, Das Schlusslicht bildet …, ist von … auf … gestiegen/gesunken, hat sich verdoppelt, im Vergleich zu …, Als Haupttendenz lässt sich feststellen …", "Abwechslungsreiche Verben für Entwicklungen (zunehmen, zurückgehen, sich verringern …) statt immer 'ist'/'sind'.", "Vorsichtige Formulierungen bei Ursachen (Erklären lassen sich diese Zahlen möglicherweise mit …)."], "typische_fehler": ["Bloße Aufzählung aller Zahlen ohne Auswahl, Vergleich und Gewichtung.", "Quelle, Datum, Diagrammart oder Maßeinheit fehlen.", "Werte falsch abgelesen oder falsch verglichen.", "Diskutier- bzw. Begründungsauftrag nicht oder nur oberflächlich bearbeitet; Ursachen ohne Bezug zu den Daten.", "Kein Schluss/Fazit."]}, "inhaltsangabe": {"name": "Inhaltsangabe", "gruppe": "Informieren und Beschreiben", "umfang": "laut Aufgabenstellung; Schularbeit z. B. 150 Wörter (± 10 %) plus ca. 70 Wörter Kernaussage/Absicht, im Unterricht auch 200–250 Wörter", "inhalt": ["Einleitung beantwortet die W-Fragen: Textsorte, Titel, Autor/in, ggf. Erscheinungsjahr; wenn aus dem Text hervorgehend Hauptfigur(en), Ort und Zeit der Handlung; Thema/Kernaussage in EINEM Satz.", "Hauptteil: nur der zentrale Handlungsstrang, Handlungsschritte in chronologischer Reihenfolge (Rückblenden der Vorlage richtig einordnen), mit Ursachen und Folgen (warum handeln die Figuren so?).", "Nur Wesentliches – keine Beschreibungen, Ausschmückungen, Nebenhandlungen oder Details; keine Nacherzählung.", "Der Text ist ohne Kenntnis der Vorlage nachvollziehbar und inhaltlich richtig.", "Schluss (deutlich vom Hauptteil getrennt, kurz): mögliche Absicht der Autorin/des Autors, Wirkung, Bezug zu den Textsortenmerkmalen (z. B. Kurzgeschichte: offener Anfang/Schluss, Alltagssituation); eigene Meinung/Empfehlung nur, wenn die Aufgabenstellung sie zulässt.", "Bei einer 'informierenden Inhaltsangabe' keine persönlichen Wertungen und Kommentare; die Absicht der Autorin/des Autors vorsichtig formuliert (möglicherweise, vermutlich, es scheint, dass …)."], "struktur": ["Klar gegliedert in Einleitung – Hauptteil – Schluss, durch Absätze sichtbar getrennt; Schluss ist kurz.", "Logischer, zusammenhängender Handlungsverlauf, nicht sprunghaft; Sätze gehen ineinander über.", "Zeitliche Überleitungen (Zu Beginn, Bald darauf, Einige Zeit später, Schließlich …) verbinden die Handlungsschritte."], "sprache": ["Durchgehend Präsens; Vorzeitigkeit im Perfekt.", "Sachlich, knapp, informativ, in eigenen Worten (Distanz zur Vorlage); keine Umgangssprache, keine Allgemeinplätze.", "Keine wörtliche Rede und keine Zitate; wichtige Äußerungen mit eigenen Worten oder in indirekter Rede mit Konjunktiv (Er sagt, er sei glücklich) – sparsam.", "Sicht eines außenstehenden, allwissenden Erzählers (3. Person), auch wenn die Vorlage in der Ich-Form erzählt ist.", "Abwechslungsreiche Satzanfänge, keine Wortwiederholungen, treffende Verben, Sätze nicht mit 'und' beginnen und nicht mit 'und dann' aneinanderreihen."], "typische_fehler": ["Präteritum aus der Vorlage übernommen statt Präsens.", "Wörtliche Rede oder Gedanken als direktes Zitat übernommen.", "Unwichtige Details, Beschreibungen, Nebenstränge – zu lang, Nacherzählung statt Zusammenfassung.", "Einleitung unvollständig (Autor/in, Textsorte oder Kernaussage fehlt) oder Inhalt dort zu ungenau.", "Eigene Meinung/Wertung im Hauptteil oder in einer informierenden Inhaltsangabe.", "Ungeschickte Satzverbindungen, Satzanfänge mit 'und', keine klare Gliederung."]}, "innerer_monolog": {"name": "Innerer Monolog", "gruppe": "Erzählen", "umfang": "laut Aufgabenstellung", "inhalt": ["Situation und Anlass aus der Vorlage bzw. Aufgabenstellung klar erkennbar; Figur bleibt in ihrer Perspektive und ihrem Wissensstand.", "Gedanken, Gefühle, Zweifel, Erinnerungen und Wahrnehmungen der Umgebung – stimmig zur Figur und zur Vorlage.", "Innerer Konflikt bzw. Abwägen von Handlungsmöglichkeiten (Was soll ich tun? Was passiert, wenn …?).", "Entwicklung der Gedanken: vom Auslöser über die Zuspitzung zu einer Entscheidung, Erkenntnis oder offenen Frage.", "Alle Vorgaben der Aufgabenstellung (z. B. vorgegebener Anfang, bestimmter Zeitpunkt) aufgegriffen."], "struktur": ["Kein klassischer Aufbau nötig, aber erkennbarer Gedankengang (Auslöser – Zuspitzung – Ende/Entscheidung).", "Gedankensprünge sind erlaubt, der rote Faden bleibt aber nachvollziehbar."], "sprache": ["Ich-Form, Präsens; Erinnerungen und Rückblicke in der Vergangenheit.", "Gedankensprache: Ausrufe, (rhetorische) Fragen, Ellipsen und unvollständige Sätze, Auslassungspunkte, Gedankenstriche, Wiederholungen.", "Gefühlswortschatz treffend und differenziert (verzweifelt, minderwertig, erleichtert …).", "Wortwahl passt zu Alter und Milieu der Figur, Umgangs-/Jugendsprache darf als Stilmittel vorkommen.", "Kein Erzählerkommentar; Äußerungen anderer höchstens knapp, so wie die Figur sie wahrnimmt – die Gedanken bleiben im Zentrum."], "typische_fehler": ["In der 3. Person oder als Bericht erzählt.", "Zu sachlich, keine Gefühle, keine Gedankensprache.", "Figur weiß Dinge, die sie nicht wissen kann.", "Wird zur Dialogszene mit viel wörtlicher Rede statt zum Gedankenstrom.", "Zeitformen ungeordnet gewechselt."]}, "kommentar": {"name": "Kommentar", "gruppe": "Argumentieren und Stellung nehmen", "umfang": "laut Aufgabenstellung: 270–330 oder 405–495 Wörter (SRDP auch 540–660); die Wortanzahl darf nicht überschritten werden", "inhalt": ["Einleitung: Bezug zur Textbeilage (Titel, ggf. Autor/in, Medium, Datum) und KURZE, sprachlich verdichtete Darlegung des Sachverhalts bzw. der Meinung der Autorin/des Autors – nur so viel, wie für das Schreibziel nötig.", "Konkreter Anlass genannt; eigene Meinung (These) schon im Einstieg erkennbar ('verraten').", "Hauptteil: logische, leicht nachvollziehbare Argumentationskette; Argumente mit Begründung und Beispiel/Beleg (Behauptung – Begründung – Beispiel), relevant und haltbar.", "Gegenargumente (u. a. aus der Textbeilage) einbezogen und entkräftet, nicht unterschlagen; schlagkräftigstes Argument zuletzt.", "Selbstständige Fortführung der Gedanken der Textbeilage (ergänzen, erweitern, widerlegen; eigene Beobachtungen und Erfahrungen einordnen).", "Alle Arbeitsaufträge erkennbar bearbeitet (z. B. wiedergeben, einordnen, kritisch Stellung nehmen, bewerten).", "Schluss: klare, eindeutige Schlussfolgerung/Urteil, kurzes Fazit; regt zum Nachdenken an – als Appell, Verbesserungsvorschlag, Ausblick, Pointe oder Rahmen (Rückgriff auf den Einstieg).", "Keine Pauschalurteile und Verallgemeinerungen; nichts Beleidigendes."], "struktur": ["Aussagekräftiger, gern provokanter Titel (falls nicht vorgegeben).", "Einstieg (originell, macht neugierig: provokante These, Zitat, rhetorische Frage, Zukunftsbild, Sprichwort, aktueller Anlass) → Argumentation → Schlussfolgerung; Schema Hin-, Aus- und Zusammenführung.", "Sinnvolles Verhältnis der Teile (Sachverhaltsdarstellung kurz, Argumentation am längsten).", "Roter Faden ohne Gedankensprünge; Argumente als einzelne erkennbar (eigene Absätze), aber durch Überleitungen verbunden; Überleitung zur Schlussfolgerung.", "Absätze mit Leerzeilen markiert."], "sprache": ["KEINE Ich- und Wir-Formulierungen, auch 'du' möglichst vermeiden – stattdessen unpersönlich: man, es, Passiv, 'Es ist bedenklich, dass …', 'Wünschenswert wäre …'.", "Bewusst gewählte Schreibhaltung (ironisch, spöttisch, empört, gelassen, belehrend, nüchtern); ruhig frech, sarkastisch oder ironisch zugespitzt – Grenze zur Glosse beachten.", "Gezielter Einsatz rhetorischer Mittel: rhetorische Fragen, Ellipsen, Kurzsätze, Ironie, Metaphern, Übertreibung.", "Verdichtete, pointierte Sprache; einfacher Satzbau, kein Fachchinesisch, Fremdwörter sparsam.", "Präsens; Aussagen der Textbeilage in indirekter Rede (Konjunktiv) oder mit 'laut Artikel …'.", "Adressatengerechter Stil, Beispiele und Belege veranschaulichen bildhaft."], "typische_fehler": ["Ich/wir (oder durchgehend du) verwendet.", "Sachverhalt der Textbeilage zu ausführlich wiedergegeben, eigene Argumentation zu kurz.", "Titel der Textbeilage bzw. konkreter Anlass fehlt.", "Zu brav und sachlich wie eine Erörterung – keine Schreibhaltung, keine Stilmittel.", "Gegenargumente fehlen oder werden nicht entkräftet.", "Kein klarer Appell/keine eindeutige Schlussfolgerung.", "Wortanzahl überschritten."]}, "leserbrief": {"name": "Leserbrief", "gruppe": "Argumentieren und Stellung nehmen", "umfang": "270–330 Wörter (laut Aufgabenstellung)", "inhalt": ["Einleitung: genauer Bezug auf den Artikel (Textsorte, Titel, ggf. Autor/in, Medium, Erscheinungsdatum) und Schreibanlass/Schreibabsicht; eigene Meinung wird sichtbar.", "Nur KURZE Wiedergabe des Artikels (Richtwert höchstens 3–4 Sätze) – die Leser kennen ihn; besser jeweils eine kurze Aussage aufgreifen und sofort die eigene Meinung dazu.", "Aussagen über den Artikel müssen stimmen (nichts hineinlesen, was nicht drinsteht).", "Klare eigene Position aus EINER Perspektive (der eigenen); die eigene Meinung überwiegt deutlich.", "Argumente nach der 3-B-Regel (Behauptung – Begründung – Beispiel/Beleg), passend zum Thema, möglichst steigernd angeordnet; Beispiele aus der eigenen Lebenswelt und eigene Erfahrungen.", "Ein in der Einleitung angekündigter Punkt spielt im Hauptteil auch eine Rolle.", "Schluss: Wichtiges kurz zusammengefasst, Lösungsvorschlag/Kompromiss, und immer ein klarer Appell, der Leser/innen, Redaktion oder Autor/in direkt anspricht – Adressat laut Aufgabenstellung.", "Nicht beleidigend oder diskriminierend, keine falschen Anschuldigungen."], "struktur": ["Anrede (Sehr geehrte Redaktion …! / Sehr geehrte Frau …!) – Einleitung (Bezug + Anlass) – Hauptteil (Argumente) – Schluss (Appell, ggf. Dank) – Grußformel – Vor- und Nachname mit Wohnort.", "Klar und durchdacht aufgebaut, schlüssig; Teile sinnvoll verbunden (Konnektoren, passende Formulierungshilfen).", "Absätze mit Leerzeilen markiert."], "sprache": ["Ich-Form erwünscht (persönliche Meinung); Präsens, Vorzeitigkeit im Perfekt.", "Leserorientiert, höflich, präzise und pointiert; darf Emotionen wecken; Sprachebene sachlich bis emotional oder humorvoll – je nach Absicht.", "Rhetorische Mittel (rhetorische Frage, Metapher, Ironie) gezielt einsetzen.", "Keine zu langen, komplizierten Sätze; Gedanken mit Konnektoren verknüpft.", "Nach einer Anrede mit Beistrich klein weiterschreiben; Grußformel ausgeschrieben."], "typische_fehler": ["Zu viel Inhalt des Artikels zusammengefasst, eigene Meinung zu kurz.", "Appell fehlt, ist unklar oder spricht niemanden direkt an; Adressat laut Aufgabenstellung ignoriert.", "Anrede, Grußformel oder Name/Wohnort fehlt; Abkürzung 'MfG' statt Grußformel.", "Leere Floskel 'Ich freue mich auf weitere interessante Artikel' statt eines Appells (Dank/Hoffnung auf weitere Berichte ist nur als Zusatz in Ordnung).", "In der Einleitung genannter Punkt wird im Hauptteil nicht aufgegriffen.", "Behauptungen ohne Begründung und Beispiel.", "Keine Absätze, Zeitformwechsel, fehlende Beistriche."]}, "kreatives_schreiben": {"name": "Kreatives Schreiben (allgemein)", "gruppe": "Kreatives Schreiben", "umfang": "laut Aufgabenstellung (Hausübungen meist ca. 300–350 Wörter)", "inhalt": ["Alle Vorgaben des Schreibanlasses umgesetzt (vorgegebener Anfang/Schlusssatz, Lehrsatz, Perspektive, Figur, Situation, Zeitform, Umfang).", "Stimmige, logisch nachvollziehbare Handlung bzw. Gedankenführung ohne Widersprüche.", "Anschaulich: Sinneseindrücke (Bilder, Geräusche, Gerüche), Gefühle und Gedanken; nicht bloß Aufzählung von Ereignissen.", "Eigene Ideen, Originalität und eine erkennbare Wirkungsabsicht (spannend, lustig, nachdenklich …).", "Passender Titel, wenn verlangt."], "struktur": ["Erkennbarer Anfang, Mittelteil (ggf. Höhepunkt) und Schluss; der Text ist abgerundet.", "Absätze bei Orts-, Zeit- oder Perspektivenwechsel."], "sprache": ["Einheitliche Zeitform laut Vorgabe (erzählend meist Präteritum; bei Erinnerungstexten auch Präsens) – kein unbegründeter Wechsel.", "Abwechslungsreiche Satzstruktur und Satzanfänge, treffende Adjektive und Verben.", "Wörtliche Rede korrekt gekennzeichnet; Stil passt zu Textsorte und Figur."], "typische_fehler": ["Zeitform nicht durchgehalten.", "Vorgabe (Lehrsatz, Anfangs-/Schlusssatz, Perspektive) nur teilweise passend umgesetzt.", "Text wirkt wie ein ausformulierter Lebenslauf/Bericht: keine Emotionen, keine Anschaulichkeit.", "Viele Grammatik- und Beistrichfehler trotz guter Idee."]}, "fortsetzungsgeschichte": {"name": "Fortsetzungsgeschichte / Geschichte weiterschreiben", "gruppe": "Erzählen", "umfang": "laut Aufgabenstellung", "inhalt": ["Schließt nahtlos an die Vorlage an: Figuren, Situation, Ort und bisherige Ereignisse werden übernommen und nicht widersprochen.", "Entwickelt die Handlung plausibel weiter: Was tut die Figur jetzt, was denkt und fühlt sie, was geschieht als Nächstes?", "Bei vorgegebenem Schlusssatz führt die Handlung logisch genau zu diesem Satz hin.", "Abgerundeter Abschluss (wenn verlangt); Titel, wenn verlangt."], "struktur": ["Erkennbarer Handlungsbogen (Fortführung – Zuspitzung – Abschluss).", "Übergang von der Vorlage zum eigenen Text ohne Bruch."], "sprache": ["Zeitform und Erzählperspektive der Vorlage beibehalten.", "Sprache und Stil der Autorin/des Autors nachgeahmt, wenn verlangt (z. B. bei Kafka: komplexer Satzbau, distanzierter Stil).", "Anschaulich, treffende Verben und Adjektive."], "typische_fehler": ["Bruch mit der Vorlage (andere Figurennamen, Widersprüche, Wechsel der Erzählperspektive oder Zeitform).", "Stil der Vorlage nicht getroffen, obwohl verlangt.", "Handlung endet abrupt oder passt nicht zum vorgegebenen Schlusssatz."]}, "fabel": {"name": "Fabel (selbst verfassen)", "gruppe": "Erzählen", "umfang": "laut Aufgabenstellung (Hausübung ca. 300–350 Wörter)", "inhalt": ["Hauptfiguren sind handelnde und sprechende Tiere mit typischen (menschlichen) Eigenschaften, z. B. listiger Fuchs, stolzer Löwe.", "Die Handlung veranschaulicht genau den gewählten Lehrsatz – Lehrsatz und Geschichte passen eindeutig zusammen.", "Klarer Konflikt zwischen den Tieren, der zu einer Lösung oder Pointe führt.", "Moral/Lehre am Ende ausdrücklich formuliert oder deutlich erkennbar."], "struktur": ["Lehrsatz als Überschrift (wenn vorgegeben) – Ausgangssituation – Konflikt/Handlung (Rede und Gegenrede) – Lösung/Wendung – Lehre.", "Kurz und auf das Wesentliche konzentriert, Absätze."], "sprache": ["Präteritum (laut Aufgabenstellung) durchgehalten.", "Wörtliche Rede der Tiere korrekt gesetzt.", "Treffende, knappe Sprache; Vergleiche und Gegensätze zwischen den Tieren."], "typische_fehler": ["Lehrsatz passt nicht (ganz) zur erzählten Geschichte.", "Keine erkennbare Moral.", "Tiere sprechen nicht bzw. Menschen als Hauptfiguren.", "Grammatikfehler (Fälle, Satzbau) und Zeitformwechsel."]}, "autobiografisches_schreiben": {"name": "Autobiografisches Schreiben (Ort der Erinnerung, Brief der Erinnerung, Museum der Kindheit)", "gruppe": "Kreatives Schreiben", "umfang": "laut Aufgabenstellung (Kursportfolio, Beispiele ca. 300 Wörter)", "inhalt": ["Gewählter Schreibanlass erkennbar umgesetzt.", "Ort/Gegenstände/Personen lebendig beschrieben mit Sinneseindrücken (Bilder, Geräusche, Gerüche, Gefühl).", "Bezug zur eigenen Person: eigene Gefühle, Gedanken und Bedeutung der Erinnerung – nicht nur Beschreibung von außen.", "Ort der Erinnerung: neben der Beschreibung eine kleine Begebenheit/Episode, die sich dort abspielt.", "Museum der Kindheit: Erinnerungen als Rundgang geordnet (Räume, Gegenstände, Bilder) – kein ausformulierter Lebenslauf.", "Brief der Erinnerung: an ein gegenwärtiges Du, ohne typische Brief-Anrede und Floskeln, mit heutigem Wissen, aber Sinneseindrücken von damals."], "struktur": ["Einstieg in den Ort/die Erinnerung – Ausgestaltung (Beschreibung, Episode bzw. Rundgang) – abrundender Schluss.", "Absätze bei neuen Stationen bzw. Szenen."], "sprache": ["Ich-Form; Zeitform laut Vorschlag (Ort der Erinnerung: Präsens) einheitlich durchgehalten.", "Bildhaft und abwechslungsreich: viele treffende Adjektive, abwechslungsreiche Satzstruktur."], "typische_fehler": ["Zeitform nicht durchgehalten (z. B. Wechsel zwischen Präsens und Präteritum).", "Wirkt wie ein ausformulierter Lebenslauf; emotionale Eindrücke fehlen.", "Schöne Beschreibung, aber kein Bezug zu den eigenen Gefühlen.", "Eintönige Satzstruktur."]}, "medienbiografie": {"name": "Medienbiografie", "gruppe": "Kreatives Schreiben", "umfang": "laut Aufgabenstellung (Beispiele ca. 300–350 Wörter)", "inhalt": ["Chronologischer Weg durch die Lebensabschnitte (Kleinkind, Kindergarten, Volksschule, Mittelschule, heute) mit den jeweils wichtigen Medien.", "Konkrete persönliche Erinnerungen und Beispiele (Lieblingsbuch, erstes Handy …) statt allgemeiner Aussagen.", "Reflexion: Welche Medien haben geprägt, wie hat sich die Nutzung verändert, Vergleich früher – heute.", "Schluss mit persönlichem Fazit oder Ausblick."], "struktur": ["Einleitung (erste Berührung mit Medien) – chronologischer Hauptteil – reflektierender Schluss.", "Ein Absatz pro Lebensabschnitt; Zeitangaben als Überleitungen (Später, Als Volksschulkind, Schließlich …)."], "sprache": ["Ich-Form; Erzählzeit Präteritum einheitlich (Gegenwart nur für die heutige Situation und das Fazit).", "Sachlich-persönlich, abwechslungsreich formuliert."], "typische_fehler": ["Uneinheitliche Zeitform (Perfekt/Präteritum/Präsens gemischt).", "Bloße Aufzählung von Geräten ohne persönliche Erfahrungen und Reflexion.", "Beistrichfehler."]}, "perspektivenwechsel": {"name": "Aus anderer Perspektive erzählen (Perspektivenwechsel)", "gruppe": "Erzählen", "umfang": "laut Aufgabenstellung", "inhalt": ["Vorgegebene Situation korrekt aufgegriffen; nichts erfunden, was ihr widerspricht.", "Konsequent aus der Sicht der gewählten Figur – nur deren Wissen und Wahrnehmung (z. B. die Mutter weiß nichts vom Vorfall).", "Gedanken, Gefühle, Befürchtungen und Abwägungen der Figur (Was weiß die Polizei? Soll ich alles erzählen?).", "Unterschiedliche Figuren erleben dieselbe Situation erkennbar verschieden."], "struktur": ["Nachvollziehbarer Ablauf: Auslöser – Gedanken/Reaktion – Entscheidung oder offenes Ende."], "sprache": ["Ich-Form der Figur (bzw. personale Sicht); Zeitform einheitlich.", "Wortwahl und Ton passen zur Figur (Jugendliche, Mutter, Polizistin, Tier …).", "Gedankensprache wie im inneren Monolog möglich (Fragen, Ausrufe)."], "typische_fehler": ["Perspektive nicht durchgehalten (Erzähler weiß mehr als die Figur).", "Alle Figuren klingen gleich.", "Nur Nacherzählung der Situation ohne Innensicht."]}, "krimi": {"name": "Krimi / Kriminalgeschichte", "gruppe": "Erzählen", "umfang": "laut Aufgabenstellung", "inhalt": ["Verbrechen, Ermittler/in, Verdächtige, Spuren/Hinweise, Motiv und Alibi kommen vor.", "Spannung wird aufgebaut und bis zur Auflösung gehalten; die Auflösung ist logisch.", "Handlung schlüssig, keine Widersprüche."], "struktur": ["Ausgangssituation/Tat – Ermittlung mit Hinweisen und falschen Spuren – Höhepunkt – Auflösung."], "sprache": ["Präteritum; spannungserzeugende Adjektive und Verben.", "Krimi-Fachwortschatz richtig verwendet (Alibi, Motiv, Phantombild, Autopsie …); Gaunersprache nur in wörtlicher Rede der Figuren."], "typische_fehler": ["Keine Spannung, Auflösung zu früh oder unlogisch.", "Zeitformwechsel.", "Fachbegriffe falsch verwendet."]}, "sage_schreiben": {"name": "Sage (selbst verfassen oder nacherzählen)", "gruppe": "Erzählen", "umfang": "laut Aufgabenstellung", "inhalt": ["Konkreter Ort (Gasse, Fluss, Burg …) und ggf. Zeitangabe.", "Übernatürliches Wesen oder Ereignis (Basilisk, Wassermann, Drache …) und eine mutige/schuldige Figur.", "Klare Handlung mit Bedrohung – Bewährung/Strafe – Ausgang.", "Am Ende häufig Erklärung oder Erinnerungszeichen ('Seither …')."], "struktur": ["Ort/Zeit/Ausgangslage – unheimliches Ereignis – Handlung/Bewährung – Ausgang mit Erklärung."], "sprache": ["Präteritum; anschauliche, teils schaurige Adjektive und Verben."], "typische_fehler": ["Kein konkreter Ort, dadurch eher Märchen als Sage.", "Zeitformwechsel."]}, "zusammenfassung": {"name": "Zusammenfassung", "gruppe": "Informieren und Beschreiben", "umfang": "270–330 Wörter (seltener 405–495; bei Schularbeiten auch z. B. 205–255) – Wortanzahl genau einhalten; Faustregel ohne Vorgabe: höchstens ein Drittel des Ausgangstextes", "inhalt": ["Einleitung mit Basissatz: Textsorte, Titel, Autor/in, Medium/Quelle, Erscheinungsdatum und -ort, Thema (worum es geht). Fehlt eine Autorenangabe, wird das vermerkt; bei Online-Quellen genügt die gekürzte Adresse (z. B. www.derstandard.at).", "Kernaussagen sinngemäß, reduziert und inhaltsgetreu wiedergegeben – nur Wesentliches, keine Anhäufung von Details; jeder Sinnabschnitt des Originals ist berücksichtigt.", "Die in den Arbeitsaufträgen genannten Gesichtspunkte werden gezielt bearbeitet (selektives Zusammenfassen: nur die dafür relevanten Inhalte).", "KEINE eigene Meinung, keine Bewertung, kein Kommentar, keine Interpretation.", "Der Text ist ohne Kenntnis der Textbeilage verständlich (Eigenständigkeit).", "Positionen und Meinungen der Autorin/des Autors bzw. zitierter Personen sind klar als deren Aussagen gekennzeichnet.", "KEIN Schluss: Die Zusammenfassung endet mit der letzten Kernaussage des Ausgangstextes – kein Fazit, kein Resümee, keine eigene Stellungnahme. Ein fehlender Schluss ist daher kein Mangel."], "struktur": ["Einleitung (Basissatz) → Hauptteil (Kernaussagen in der Reihenfolge des Ausgangstextes; bei thematischen Sprüngen dürfen Themen zusammengezogen werden). Kein Schluss.", "Logische, nachvollziehbare Gliederung, die dem Aufbau des Ausgangstextes folgt; die Gliederung darf versprachlicht werden (‚Zu Beginn schildert die Autorin …‘, ‚Abschließend fordert er …‘).", "Absätze mit Leerzeilen markiert.", "Gedanken durch Konjunktionen und Überleitungen verknüpft (zeitlich: zunächst, schließlich; logisch: weil, folglich, obwohl; gliedernd: einerseits – andererseits)."], "sprache": ["Sachlich-neutral, Standardsprache; Präsens, für Vorzeitiges Perfekt (historische Ereignisse dürfen im Präteritum bleiben).", "Eigene Formulierungen, Distanz zum Stil der Vorlage; nur Zahlen, Fakten und Fachbegriffe dürfen übernommen werden.", "Direkte Rede wird in indirekte Rede umgewandelt; Redewiedergabe im Konjunktiv I (Konjunktiv II nur als Ersatzform, wenn Konjunktiv I mit dem Indikativ übereinstimmt).", "Verschiedene Mittel der Redewiedergabe (laut, zufolge, nach Ansicht von, die Autorin betont/kritisiert …).", "Direkte Zitate nur sparsam, kurz und in Anführungszeichen.", "Keine Ich-/Wir-Formulierungen; Ich-Texte werden in die Er-/Sie-Form übertragen; keine erzählerischen Wendungen (‚Plötzlich …‘, ‚und dann …‘)."], "typische_fehler": ["Eigene Meinung oder Wertung eingebaut (auch versteckt, z. B. ‚leider‘, ‚zum Glück‘).", "Ein Schluss, Fazit oder eigenes Resümee angehängt (die Zusammenfassung hat keinen Schluss).", "Präteritum statt Präsens oder Wechsel der Zeitform.", "Sätze aus dem Ausgangstext abgeschrieben oder nur umgestellt.", "Basissatz unvollständig (Quelle, Datum oder Textsorte fehlen).", "Indikativ und Konjunktiv bei der Redewiedergabe vermischt; Konjunktiv II (‚wäre‘, ‚hätte‘) statt Konjunktiv I (‚sei‘, ‚habe‘).", "Nebensächliche Details oder Beispiele statt der Kernaussagen; wichtige Sinnabschnitte fehlen.", "Wortanzahl über- oder unterschritten."]}, "meinungsrede": {"name": "Meinungsrede / Rede", "gruppe": "Argumentieren und Stellung nehmen", "umfang": "540–660 Wörter (seltener 405–495; bei Schularbeiten auch 270–330 oder 400–450) – nicht unterschreiten, geringe Überschreitung erlaubt", "inhalt": ["Korrekte direkte Anrede des Publikums laut Aufgabenstellung zu Beginn (z. B. ‚Sehr geehrte Frau Direktorin, liebe Mitschülerinnen und Mitschüler!‘) und wiederholte Ansprache im Text.", "Redeanlass, Situation und eigene Rolle/Betroffenheit genannt; Bezug zur Textbeilage (Titel, Medium, Datum); Inhalt der Textbeilage für Zuhörer/innen, die ihn nicht kennen, verständlich wiedergegeben, wenn verlangt.", "Klare eigene Position (auch Gegenposition oder Verstärkung einer bekannten Position).", "Argumente nach dem 3-B-Schema (Behauptung – Begründung – Beweis/Beispiel), mit konkreten Beispielen sowie überprüfbaren Daten und Fakten.", "Argumente sachlich richtig, haltbar und relevant für Redesituation, Redezweck und Redeanlass; Informieren und Erklären nur so weit, wie es die Argumentation braucht.", "Schluss: Zusammenfassung des Wichtigsten, Appell an das Publikum (konkret, ggf. an einzelne Gruppen), Dank für die Aufmerksamkeit; Schlussworte sorgfältig gewählt."], "struktur": ["Einstieg, der Interesse weckt: rhetorische Frage, Zitat, persönliches Erlebnis/Storytelling, Gemeinsamkeit mit dem Publikum, Humor/Gag, Kompliment, aktueller Anlass, provokante Mitteilung.", "Hauptteil reihend oder dialektisch und erkennbar geordnet (z. B. Steigerung; These – Antithese – Synthese; Problem – Lösung; Fünfsatz: Warum spreche ich? Was ist der Fall? Was sollte sein? Wie erreichen wir das? Was können wir tun?).", "Starke Argumente an exponierter Stelle (am Schluss, ggf. auch am Anfang); zwischendurch Auflockerung durch rhetorische Mittel.", "Schluss: Fazit – Appell – Dank.", "Nachvollziehbare Gliederung, Absätze mit Leerzeilen, Überleitungen."], "sprache": ["Rhetorische Mittel: rhetorische Fragen, Anaphern, Wiederholungen, Dreierfiguren/Klimax, Parallelismus, Metaphern, Ausrufe, direkte Ansprache.", "Ich- und Wir-Form erlaubt und erwünscht (persönliche, subjektive Textsorte).", "Anschaulich-bildhaft, Präsens, einfache und kurze Sätze (wird gehört!), Aktiv statt Passiv, Redundanzen erlaubt.", "Argumentative Verknüpfungsmittel (deshalb, denn, im Gegensatz dazu …).", "Sprache dem Publikum und der Situation angemessen (Sie/Ihr je nach Publikum einheitlich), keine Beleidigungen."], "typische_fehler": ["Publikum nicht oder falsch angesprochen; Anrede nur am Anfang, später kein Publikumsbezug.", "Liest sich wie eine Erörterung: kein Ich, keine Rhetorik, zu komplexe Schachtelsätze.", "Kein Appell am Schluss oder Appell unkonkret; Dank fehlt.", "Behauptungen ohne Begründung und Beispiel.", "Inhalt der Textbeilage fehlt, obwohl der Arbeitsauftrag die Wiedergabe für die Zuhörer/innen verlangt.", "Wortanzahl unterschritten."]}, "textanalyse": {"name": "Textanalyse", "gruppe": "Analysieren und Interpretieren", "umfang": "405–495 oder 540–660 Wörter – nicht unterschreiten, Überschreitung erlaubt", "inhalt": ["Einleitung: Eckdaten (Textsorte, Titel, Autor/in, Medium, Erscheinungsdatum), Thema/Kernthema, bei Sachtexten auch Zielgruppe und Textfunktion; nichts erfinden, was nicht angegeben ist.", "Zu Beginn des Hauptteils kurze Zusammenfassung des Inhalts (nur Wesentliches); danach die von den Operatoren verlangten Teilaspekte gezielt bearbeitet.", "Formale Analyse: Aufbau, Überschrift, Vorspann/Lead, Zwischenüberschriften, Absätze/Sinnabschnitte und ihre Funktion, nichtlineare Elemente (Grafik, Foto).", "Inhaltliche Analyse: These/Kernaussage, Argumentationsstruktur, Argumenttypen (Fakten-, Autoritäts-, Werte-, Analogie-, Plausibilitätsargument), haltbare Argumente vs. bloße Behauptungen (3-B-Schema), Rolle von Expertinnen/Experten, Umgang mit Gegenargumenten.", "Sprachliche Analyse: Sprachebene (Standard-, Umgangs-, Fach-, Jugendsprache), Wortwahl (Fremdwörter, Nominal-/Verbalstil, auffällige Wortarten, Schlüsselwörter), Satzbau (Parataxe/Hypotaxe, Ellipsen), Stilmittel, Ton (sachlich, ironisch, polemisch), Bezug Titel–Inhalt.", "Jeder Befund wird mit Textstelle belegt (Zitat oder Verweis mit Zeilenangabe) UND in seiner Funktion/Wirkung erklärt.", "Kommunikationsanalyse: Intention (informieren, überzeugen, appellieren), Wirkung auf die Zielgruppe, Zusammenhang Inhalt–Sprache–Intention; bei Reden auch Redestrategie und Appell.", "KEINE Interpretation und keine persönliche Meinung; eine Beurteilung (z. B. ob der Autor überzeugt) nur, wenn ein Operator wie ‚überprüfen‘, ‚beurteilen‘ es verlangt, und dann auf Analyseergebnisse gestützt."], "struktur": ["Einleitung – sachlogischer Hauptteil (Zusammenfassung, dann Analyse nach den Arbeitsaufträgen: Aufbau, Argumentation, Sprache) – kurzer Schluss/Resümee der Analyseergebnisse.", "Ein Absatz pro Analyseaspekt; Absätze mit Leerzeilen.", "Überleitungen zwischen den Analyseschritten (‚Neben dem Aufbau ist auch die sprachliche Gestaltung auffällig …‘).", "Befunde werden aufeinander bezogen, keine bloße Auflistung unverbundener Einzelbeobachtungen."], "sprache": ["Sachlich, abstrahierend, informativ-darlegend, neutraler Ton; Standardsprache.", "Präsens, Vorzeitigkeit im Perfekt; kein Präteritum.", "Kein ‚ich‘/‚wir‘ (außer ein Arbeitsauftrag verlangt ausdrücklich die eigene Sicht); Leser/innen nicht direkt ansprechen.", "Fachterminologie korrekt (Metapher, rhetorische Frage, Hypotaxe, Anapher, Ellipse, Faktenargument …).", "Zitierregeln beachtet (Anführungszeichen, Zeilenangabe); Positionen des Autors in indirekter Rede mit Konjunktiv; Zitate eher sparsam und in den eigenen Satz eingebaut.", "Analyseformulierungen (‚verdeutlicht‘, ‚unterstreicht‘, ‚bewirkt beim Leser‘, ‚dient der Hervorhebung von‘)."], "typische_fehler": ["Interpretiert, bewertet oder äußert eigene Meinung (‚obwohl ich ganz anderer Meinung bin‘).", "Stilmittel nur genannt, ohne Beleg und ohne Wirkung/Funktion.", "Nur Inhaltsangabe, kaum Analyse; formale oder sprachliche Analyse zu knapp.", "Eckdaten unvollständig oder erfunden; Zielgruppe/Textfunktion fehlen.", "Fachbegriffe falsch verwendet.", "Leserschaft direkt angesprochen; Präteritum.", "Längere Paraphrasen oder enge Anlehnung an den Wortlaut des Originals."]}, "textanalyse_literarisch": {"name": "Analyse eines literarischen Textes (z. B. Kurzgeschichte)", "gruppe": "Analysieren und Interpretieren", "umfang": "laut Aufgabenstellung", "inhalt": ["Einleitung: Textart/Gattung, Titel, Autor/in, Erscheinungsjahr, ggf. literaturgeschichtliche Einordnung (Epoche), Kernthema in ein bis zwei Sätzen.", "Kurze Inhaltszusammenfassung nach den W-Fragen (Wer? Wo? Was? Wann?).", "Inhaltliche Analyse: Haupt- und Nebenfiguren und ihre Beziehung (direkte/indirekte Charakterisierung), Ort (real/realistisch/irreal, symbolisch), Zeit (erzählte Zeit vs. Erzählzeit, Zeitdehnung/-raffung).", "Formale Analyse: Erzählperspektive (auktorial, personal, Ich-Erzähler, neutral), innere/äußere Handlung, Aufbau (offener Anfang/offenes Ende vs. geschlossen), Höhe- und Wendepunkt, Erzählstruktur (ein-/mehrsträngig, linear, Rückblenden), Leerstellen, Bezug Titel–Inhalt.", "Gattungsmerkmale am Text nachgewiesen (Kurzgeschichte: alltägliche Situation, unmittelbarer Einstieg, Wende-/Höhepunkt, offener Schluss, oft Außenseiter, Mehrdeutigkeit, einfache Alltagssprache).", "Sprachliche Analyse: Stil, Wortwahl/Wortarten, Satzbau, Zeitform, Stilmittel, Leitwörter – jeweils mit Textbeleg und Wirkung.", "Schluss: Aussage/Absicht des Textes auf Grundlage der Analyse, ggf. sachlich begründete eigene Meinung und Bezug zur Gegenwart."], "struktur": ["Einleitung – Hauptteil (Inhalt kurz, dann inhaltliche, formale und sprachliche Analyse) – kurzer Schluss.", "Absätze pro Analysebereich, Überleitungen; die Analysebereiche nicht willkürlich vermischen."], "sprache": ["Sachlich, Präsens; direkte Rede aus dem Text wird in indirekte Rede umgewandelt oder als gekennzeichnetes Zitat eingebaut.", "Fachbegriffe der Erzähltextanalyse korrekt (Erzählperspektive, erzählte Zeit, Zeitraffung, Wendepunkt, Leitmotiv …).", "Zitate in Anführungszeichen mit Zeilenangabe, knapp gehalten.", "Eigene Formulierungen, keine Nacherzählung im Stil der Vorlage."], "typische_fehler": ["Nacherzählung statt Analyse.", "Fachbegriffe falsch (z. B. Erzählperspektive falsch bestimmt, Epoche falsch zugeordnet).", "Beobachtungen ohne Beleg oder ohne Wirkung.", "Persönliches Geschmacksurteil statt begründeter Aussage im Schluss.", "Präteritum aus der Vorlage übernommen."]}, "textinterpretation": {"name": "Textinterpretation", "gruppe": "Analysieren und Interpretieren", "umfang": "540–660 Wörter (seltener 405–495; Schularbeit auch 350–400 oder 450–500) – nicht unterschreiten, Überschreitung erlaubt", "inhalt": ["Einleitung: Basisinformationen (Textsorte/Gattung, Titel, Autor/in, Entstehungs- oder Erscheinungsjahr), ggf. Epoche; Thema/Problematik (nicht schon die Zusammenfassung); evtl. Interpretationshypothese.", "Kurze, nachvollziehbare Zusammenfassung von Thema bzw. Handlung.", "Analyse der relevanten Elemente: Epik – Figuren, Ort, Zeit, Handlungsstruktur, Spannungsbogen, Erzählperspektive, Erzähltempo, Gattungsmerkmale; Lyrik – Strophen, Verse, Reimschema, Metrum, lyrisches Ich, Bilder; Drama – Gesprächsführung, Redeanteile, Figurenbeziehungen; jeweils Sprache (Wortwahl, Satzbau, Stilmittel).", "Jeder Analysebefund wird zur Deutung erweitert (Was bewirkt er? Welche Bedeutung hat er?) und mit Zitat bzw. Vers-/Zeilenangabe belegt.", "Interpretationshypothese entwickelt oder überprüft; Symbolgehalt, Motive und Titelbezug erklärt; Kontextwissen (Epoche, Biografie, Zeitgeschichte) nur, wenn es die Deutung stützt.", "Die in den Arbeitsaufträgen genannten Aspekte werden beurteilt bzw. begründet (z. B. warum der Text abgedruckt werden soll; Aktualität des Themas).", "Schluss: knappe Zusammenfassung der Interpretationsergebnisse, Wirkung des Textes, ggf. begründete eigene Meinung und Bezug zur Gegenwart."], "struktur": ["Einleitung – Inhalt (kurz) – Analyse und Deutung leserfreundlich verbunden – Schluss.", "Analyseelemente klar gekennzeichnet (Fachtermini); Absätze mit Leerzeilen, Überleitungen.", "Zitate sind aktiver Teil der Argumentation, keine ‚Fremdkörper‘."], "sprache": ["Sachlich, Präsens; möglichst wenig Ich-Formulierungen.", "Korrekte, einheitliche Fachtermini (Sonett, Quartett, Terzett, umarmender Reim, Alexandriner, lyrisches Ich, personaler Erzähler …).", "Eigenständiges, vom Text gelöstes Vokabular, keine Stilübernahme.", "Direkte und indirekte Zitate klar gekennzeichnet, Zitierregeln eingehalten.", "Deutungsformulierungen (‚lässt die Deutung zu‘, ‚verweist auf‘, ‚unterstreicht‘)."], "typische_fehler": ["Deutung ohne Belege aus dem Text (‚Übermut‘); bloße Spekulation über die Absicht des Autors.", "Nur Nacherzählung oder nur Analyse ohne Deutung.", "Fachbegriffe oder Epoche falsch (z. B. Versmaß falsch erklärt, falsche Stilrichtung).", "Hypothese fehlt oder wird nicht überprüft.", "Geschmacksurteil (‚zu unrealistisch‘) statt begründeter Wertung.", "Präteritum, Indikativ bei Redewiedergabe."]}, "textvergleich": {"name": "Vergleichende Textanalyse / Textvergleich", "gruppe": "Analysieren und Interpretieren", "umfang": "laut Aufgabenstellung (z. B. 540–660 Wörter)", "inhalt": ["Einleitung nennt beide Texte mit Eckdaten (Textsorte, Titel, Autor/in, Jahr, ggf. Epoche/Medium) und das gemeinsame Thema bzw. Motiv.", "Inhalt beider Texte knapp wiedergegeben.", "Vergleich nach den in der Aufgabe genannten Aspekten (z. B. Aufbau, Sprache, argumentative oder erzählerische Strategien, Motiv) – Gemeinsamkeiten UND Unterschiede.", "Jede Vergleichsaussage mit Belegen aus beiden Texten (Zitat mit Zeilen-/Versangabe).", "Unterschiede werden erklärt (z. B. Epoche, Publikationsorgan, Adressaten, Intention).", "Schluss: Ergebnis des Vergleichs; Beurteilung (z. B. des Motivs) nur, wenn ein Operator es verlangt."], "struktur": ["Aspektorientierter Aufbau (je Absatz ein Vergleichsaspekt für beide Texte) statt zwei getrennter Einzelanalysen; zumindest ein ausdrücklich vergleichender Teil.", "Beide Texte etwa gleich gewichtet; Absätze und Überleitungen."], "sprache": ["Sachlich, Präsens, Fachterminologie.", "Vergleichsformulierungen: während, im Gegensatz zu, ähnlich wie, beide, wohingegen, demgegenüber, legt man beide Texte nebeneinander.", "Zitierregeln eingehalten; eigene Formulierungen."], "typische_fehler": ["Texte nur nacheinander beschrieben, ohne echten Vergleich.", "Nur Gemeinsamkeiten oder nur Unterschiede.", "Ein Text deutlich vernachlässigt.", "Behauptete Gemeinsamkeiten ohne Belege."]}, "exzerpt": {"name": "Exzerpt", "gruppe": "Informieren und Beschreiben", "umfang": "laut Aufgabenstellung (abhängig von Vorwissen und Zweck)", "inhalt": ["Die für den Zweck/Arbeitsauftrag wichtigen Informationen, Fakten und Kernaussagen vollständig erfasst; Unwesentliches weggelassen.", "Fachausdrücke und Schlüsselwörter enthalten, unbekannte Ausdrücke geklärt.", "Stichwörter so ergänzt, dass sie später ohne Original verständlich sind.", "Vollständige Quellenangabe (Autor/in, Titel, Erscheinungsort, Verlag/Medium, Datum, Seitenzahl)."], "struktur": ["Übersichtlich gegliedert nach den Sinnabschnitten des Textes (Absätze, Zwischenüberschriften, Nummerierung, ggf. Farben).", "Reihenfolge des Ausgangstextes erkennbar."], "sprache": ["Stichworte bzw. knappe Wortgruppen statt ausformulierter Sätze.", "Keine eigene Wertung; Zitate als solche gekennzeichnet."], "typische_fehler": ["Ganze Sätze abgeschrieben statt Stichwörter.", "Quelle fehlt.", "Unübersichtlich, keine Gliederung.", "Wichtige Informationen fehlen oder zu viele Details."]}, "texttransformation": {"name": "Texttransformation (kreatives Umschreiben)", "gruppe": "Kreatives Schreiben", "umfang": "laut Aufgabenstellung", "inhalt": ["Die wesentlichen Inhalte der Vorlage sind vollständig und sinngemäß übertragen; nichts Wichtiges weggelassen, nichts Widersprüchliches dazuerfunden.", "Die Absicht laut Aufgabenstellung ist erfüllt (z. B. informieren, Freund/in überzeugen).", "Adressat und Situation der Zieltextsorte sind berücksichtigt."], "struktur": ["Die typischen Merkmale der Zieltextsorte sind vorhanden (z. B. Postkarte: Anrede, Brieftext, Grußformel; SMS: Kürze).", "Sinnvolle Reihenfolge der Inhalte."], "sprache": ["Das Zielregister wird konsequent durchgehalten (Standardsprache ohne Abkürzungen, Anglizismen und Dialekt – bzw. bewusst informell/jugendsprachlich, wenn verlangt).", "Abkürzungen und Jugendsprache der Vorlage sind bei Umwandlung in die Standardsprache vollständig aufgelöst.", "Bei bewusst informellem Zielregister sind Normabweichungen (Abkürzungen, Kleinschreibung, Emojis) Stilmittel und keine Fehler."], "typische_fehler": ["Register vermischt (Reste von Jugendsprache/Abkürzungen im Standardtext).", "Inhalte vergessen oder verfälscht.", "Merkmale der Zieltextsorte fehlen (Anrede, Grußformel)."]}}};
const KITEXTE = [{"id": "ki-zf-lehrlinge", "schwaechen": ["Angehängtes Fazit mit Wertung („Insgesamt zeigt der Bericht deutlich, dass die Lehre … attraktiver werden muss.“) – eine Zusammenfassung hat keinen Schluss. Außerdem steht diese Aussage so gar nicht im Bericht."], "textsorte": "zusammenfassung", "titel": "Zusammenfassung: Betriebe suchen händeringend Lehrlinge", "quelle": {"titel": "Betriebe suchen händeringend Lehrlinge", "info": "erfundener Übungstext – steht in der Übung Zusammenfassung → „Wesentliches erkennen“"}, "auftrag": "Fasse den Bericht so zusammen, dass man ihn ohne den Originaltext versteht. Schreib zwischen 100 und 150 Wörter.", "woerter": [100, 150], "ki_text": "In dem Bericht „Betriebe suchen händeringend Lehrlinge“ von Martin Gruber, erschienen am 14. September 2026 in der „Steirischen Rundschau“, geht es um den Mangel an Lehrlingen in Österreich.\n\nIn vielen Regionen bleiben Lehrstellen unbesetzt, vor allem in der Gastronomie, im Handwerk und im Handel. Fachleute führen das darauf zurück, dass immer mehr Jugendliche eine höhere Schule besuchen und es insgesamt weniger Jugendliche gibt. Zudem gilt die Lehre bei vielen als weniger angesehen als die Matura. Eine Berufsberaterin hält dieses Bild jedoch für veraltet, da Fachkräfte gute Aufstiegschancen hätten. Die Betriebe reagieren mit Prämien, dem Führerschein oder der Lehre mit Matura. Die Wirtschaftskammer fordert, dass Schulen früher über Lehrberufe informieren.\n\nInsgesamt zeigt der Bericht deutlich, dass die Lehre in Zukunft wieder attraktiver werden muss."}, {"id": "ki-ia-spaghetti", "schwaechen": ["Ungenau: Marcel „lädt Heinz zum Essen ein“ – in der Geschichte fragt er nur, ob sie sich am nächsten Tag wiedersehen. Heinz will dann die Spaghetti bezahlen."], "textsorte": "inhaltsangabe", "titel": "Inhaltsangabe: Spaghetti für zwei", "quelle": {"titel": "Spaghetti für zwei", "info": "Kurzgeschichte von Federica de Cesco – du bekommst sie von deiner Lehrkraft"}, "auftrag": "Schreib eine Inhaltsangabe zur Kurzgeschichte (Einleitung, Hauptteil, Schluss mit Absicht, Merkmalen der Kurzgeschichte und begründeter Meinung). Schreib zwischen 180 und 250 Wörter.", "woerter": [180, 250], "ki_text": "In der Kurzgeschichte „Spaghetti für zwei“ von Federica de Cesco hält der fast vierzehnjährige Heinz in einem Selbstbedienungsrestaurant einen jungen Afrikaner für einen Dieb, bis er erkennt, dass er selbst im Unrecht ist.\n\nHeinz isst mittags in einem Selbstbedienungsrestaurant gegenüber der Schule, weil sein Bus ungünstig fährt. Er kauft sich eine Gemüsesuppe, setzt sich und bemerkt, dass er den Löffel vergessen hat. Als er zurückkommt, sitzt ein junger Afrikaner an seinem Platz und isst die Suppe. Heinz ist empört, will aber nicht als Rassist gelten. Deshalb setzt er sich dazu und isst wortlos mit. Danach holt der Fremde einen Teller Spaghetti mit zwei Gabeln und teilt ihn mit Heinz. Als Heinz satt ist, entdeckt er auf dem Nebentisch einen Teller kalter Gemüsesuppe – seine eigene. Ihm wird klar, dass er sich an den falschen Tisch gesetzt hat. Beschämt entschuldigt er sich. Der junge Mann lacht, stellt sich als Marcel vor und lädt Heinz für den nächsten Tag zum Essen ein. Heinz verspricht, dann die Spaghetti zu bezahlen.\n\nVermutlich möchte die Autorin zeigen, wie schnell Vorurteile zu falschen Urteilen führen. Typisch für eine Kurzgeschichte sind die Alltagssituation, die wenigen Figuren, die kurze Handlungszeit und die überraschende Wende. Mir gefällt die Geschichte, weil sie ein ernstes Thema mit Humor behandelt."}, {"id": "ki-lb-hausuebungen", "schwaechen": ["Falsch wiedergegeben: Tina Hascher fordert NICHT, Hausübungen abzuschaffen. Laut Bericht will sie, dass Hausübungen besser in den Unterricht eingebunden, gezielter und öfter vorbereitend eingesetzt werden. Damit ist auch das Gegenargument im Leserbrief schief.", "Floskel ohne Beleg: „in der heutigen schnelllebigen Arbeitswelt wichtiger denn je“ – klingt gut, sagt aber nichts Überprüfbares."], "textsorte": "leserbrief", "titel": "Leserbrief: Der Zweifel am Sinn von Hausübungen", "quelle": {"titel": "Der Zweifel am Sinn von Hausübungen", "info": "Bericht von Julia Neuhauser, diepresse.com, 11. März 2012 – du bekommst ihn von deiner Lehrkraft"}, "auftrag": "Schreib einen Leserbrief zu diesem Bericht und hebe die Notwendigkeit von Hausübungen hervor: Gib die Meinung der Gesellschaft über Hausübungen wieder, untersuche den Standpunkt der Forscherin Tina Hascher und nimm kritisch Stellung. Schreib zwischen 270 und 330 Wörter.", "woerter": [270, 330], "ki_text": "Sehr geehrte Redaktion,\n\nmit großem Interesse habe ich den Bericht „Der Zweifel am Sinn von Hausübungen“ von Julia Neuhauser gelesen, der am 11. März 2012 auf diepresse.com erschienen ist. Darin wird unter Berufung auf eine Studie der TU Dresden behauptet, Hausübungen hätten kaum einen Effekt auf die Leistung. Als Schülerin einer Handelsakademie möchte ich dieser Sichtweise widersprechen.\n\nDie Gesellschaft hält Hausübungen offenbar für selbstverständlich. Laut der Erziehungswissenschaftlerin Tina Hascher von der Universität Salzburg werden sie gar nicht mehr hinterfragt, sondern als gewohnter Teil des Schulalltags hingenommen. Dass etwas Gewohnheit ist, bedeutet aber nicht, dass es sinnlos ist. Dass laut der Studie nur jeder dritte befragte Schüler an eine Verbesserung glaubt, überrascht mich nicht: Viele schreiben ab, statt selbst zu arbeiten. Das liegt jedoch nicht an den Hausübungen selbst, sondern daran, wie mit ihnen umgegangen wird.\n\nHascher fordert, Hausübungen ganz abzuschaffen und stattdessen mehr Zeit im Unterricht zu üben. Diesem Vorschlag kann ich nicht zustimmen. Hausübungen sind notwendig, weil man erst beim selbstständigen Arbeiten merkt, was man wirklich verstanden hat. Im Unterricht wirkt vieles einfach, solange die Lehrkraft es erklärt. Als ich zum Beispiel eine Buchungsaufgabe in Rechnungswesen allein lösen musste, wurde mir klar, wo meine Lücken lagen. Am nächsten Tag konnte ich gezielt nachfragen.\n\nAußerdem fördern Hausübungen Selbstständigkeit und Zeitmanagement – Fähigkeiten, die in der heutigen schnelllebigen Arbeitswelt wichtiger sind denn je. Wer gelernt hat, Aufgaben eigenständig einzuteilen und Termine einzuhalten, ist in der Ausbildung und im Beruf klar im Vorteil. Natürlich dürfen Hausübungen nicht zur reinen Pflichtübung verkommen. Sinnvoll sind Aufgaben, die im Unterricht besprochen werden und bei denen man ohne Angst vor einer schlechten Note nachfragen kann.\n\nLiebe Lehrerinnen und Lehrer, schaffen Sie Hausübungen nicht ab, sondern besprechen Sie sie regelmäßig im Unterricht! Und liebe Mitschülerinnen und Mitschüler: Nutzt Hausübungen als Chance, statt sie abzuschreiben.\n\nMit freundlichen Grüßen\nMaria Muster, Graz"}, {"id": "ki-ko-tourismus", "schwaechen": ["Ungenau: „Thailand sperrt den Maya Beach“ – laut Bericht wird nur die Zahl der Badegäste und Boote für einige Monate begrenzt.", "Dazuerfunden: „Billigflüge“ und „Handy an Handy“ kommen im Bericht nicht vor. Eigene Gedanken sind im Kommentar erlaubt – aber sie dürfen nicht so klingen, als stünden sie im Text."], "textsorte": "kommentar", "titel": "Kommentar: Grenzen des Tourismus", "quelle": {"titel": "Jetzt kommt die Obergrenze für Touristen", "info": "Bericht von Ute Müller, Die Welt (Online-Ausgabe), 28. Dezember 2017 – du bekommst ihn von deiner Lehrkraft"}, "auftrag": "Schreib für den Schreibwettbewerb einer Jugendzeitschrift einen Kommentar mit dem Titel „Grenzen des Tourismus“: Beschreib die Problematik, nenne mögliche Gründe und nimm zu den Maßnahmen Stellung. Schreib zwischen 270 und 330 Wörter.", "woerter": [270, 330], "ki_text": "Grenzen des Tourismus\n\nDicht gedrängt stehen die Menschen vor der Sagrada Família, Handy an Handy. Was nach Urlaubsidylle klingt, ist für viele Bewohnerinnen und Bewohner beliebter Reiseziele längst Alltag – und eine Belastung. Wie Ute Müller am 28. Dezember 2017 in der „Welt“ berichtet, ächzen Städte wie Barcelona oder Dubrovnik unt

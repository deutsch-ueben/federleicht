<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Federleicht – Schreibtraining Deutsch</title>
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --text:#1f2328; --muted:#5d6670; --line:#dcd7cc;
  --accent:#2f6f8f; --accent-soft:#e3eff5; --ok:#2e7d4f; --ok-soft:#e3f3e9;
  --bad:#b3412e; --bad-soft:#f8e5e1; --warn:#8a6100; --warn-soft:#fbf1d9; --star:#d79b00;
  --mark-ich:#ffe08a; --mark-ugs:#ffc7b8; --mark-dass:#bfe3ff; --mark-wdh:#e2d4ff; --mark-zeit:#c9efd2;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181b; --card:#1f2227; --text:#e8e6e1; --muted:#a3a9b0; --line:#343940;
    --accent:#7fb8d6; --accent-soft:#1d3440; --ok:#6fcf97; --ok-soft:#18321f;
    --bad:#f08b78; --bad-soft:#3a201b; --warn:#e6be5c; --warn-soft:#352b12; --star:#f0c040;
    --mark-ich:#6b5a14; --mark-ugs:#6e3125; --mark-dass:#1f4a6b; --mark-wdh:#46336e; --mark-zeit:#245236;
  }
}
:root[data-theme="dark"]{
  --bg:#16181b; --card:#1f2227; --text:#e8e6e1; --muted:#a3a9b0; --line:#343940;
  --accent:#7fb8d6; --accent-soft:#1d3440; --ok:#6fcf97; --ok-soft:#18321f;
  --bad:#f08b78; --bad-soft:#3a201b; --warn:#e6be5c; --warn-soft:#352b12; --star:#f0c040;
  --mark-ich:#6b5a14; --mark-ugs:#6e3125; --mark-dass:#1f4a6b; --mark-wdh:#46336e; --mark-zeit:#245236;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px 16px 48px}
header.kopf{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 18px}
header.kopf h1{font-size:1.35rem;margin:0}
header.kopf .sterne-gesamt{color:var(--muted);font-size:.95rem;white-space:nowrap}
h2{font-size:1.2rem;margin:0 0 10px}
h3{font-size:1.02rem;margin:18px 0 8px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.karte{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.kacheln{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.kachel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;gap:6px;min-height:130px}
.kachel:hover,.kachel:focus-visible{border-color:var(--accent);outline:none}
.kachel .sym{font-size:1.7rem;line-height:1}
.kachel b{font-size:1.05rem}
.kachel .klein{font-size:.9rem;color:var(--muted)}
.kachel .fort{margin-top:auto;font-size:.9rem;color:var(--star)}
button{font:inherit}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600}
:root[data-theme="dark"] .btn{color:#10202a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#10202a}}
.btn.zweit{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.schwach,.muster{border-radius:10px;padding:12px 14px;white-space:pre-line}
.schwach{background:var(--bad-soft);border-left:4px solid var(--bad)}
.muster{background:var(--ok-soft);border-left:4px solid var(--ok);margin-top:12px}
.etikett{display:block;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px}
.vergleich{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.vergleich{grid-template-columns:1fr}}
table.zahlen{width:100%;border-collapse:collapse;font-size:.95rem}
table.zahlen th,table.zahlen td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
table.zahlen td.z{text-align:right;font-variant-numeric:tabular-nums}
.check span,.check2 span,.hw,.opt span,.rueck,.ansicht{overflow-wrap:anywhere}
.check2 label{display:grid;grid-template-columns:28px 28px minmax(0,1fr);gap:6px;align-items:start;margin-bottom:6px;cursor:default}
.check2 .kopfzeile{display:grid;grid-template-columns:28px 28px 1fr;gap:6px;font-size:.75rem;color:var(--muted);font-weight:700}
.diagramm{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.dzeile{display:grid;grid-template-columns:minmax(90px,40%) 1fr 3.4em;gap:8px;align-items:center;margin:7px 0;font-size:.92rem}
.dbalken{display:block;height:18px;background:var(--line);border-radius:4px;overflow:hidden}
.dbalken span{display:block;height:100%;background:var(--accent)}
.dwert{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.dhinweis{font-size:.85rem;color:var(--muted);margin-top:6px}
.diff ins,.legende ins{background:var(--ok-soft);color:inherit;text-decoration:none;border-bottom:2px solid var(--ok);border-radius:3px;padding:0 2px}
.diff del,.legende del{background:var(--bad-soft);color:inherit;text-decoration:line-through;border-radius:3px;padding:0 2px}
#zutaten{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
#zutaten .karte{padding:12px}
h3.gruppe{margin:22px 0 10px;font-size:1rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.zurueck{background:none;border:0;color:var(--accent);cursor:pointer;padding:4px 0;margin:0 0 10px;font-weight:600}
.leiste{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.fortschritt{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:0 0 14px}
.fortschritt div{height:100%;background:var(--accent);transition:width .3s}
.setliste{display:flex;flex-direction:column;gap:10px}
.setzeile{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;color:inherit}
.setzeile:hover{border-color:var(--accent)}
.setwrap{display:flex;flex-direction:column;gap:2px}
.setwrap .setzeile{width:100%}
.loeslink{align-self:flex-end;background:none;border:0;color:var(--accent);cursor:pointer;font-size:.9rem;font-weight:600;padding:4px 6px}
.loesgesperrt{align-self:flex-end;font-size:.82rem;color:var(--muted);padding:4px 6px}
.loesung{border-top:1px solid var(--line);padding:12px 0}
.loesung:first-of-type{border-top:0}
.loesung .nr{font-size:.8rem;font-weight:700;color:var(--muted)}
.loesung ul{margin:6px 0 6px 20px;padding:0}
.loesung .erkl{font-size:.92rem;color:var(--muted);margin-top:4px}
.richtigtext{color:var(--ok);font-weight:600}
.sterne{color:var(--star);letter-spacing:2px;white-space:nowrap}
.sterne .leer{color:var(--line)}
.frage{font-weight:600;white-space:pre-line;margin-bottom:12px}
.optionen{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;color:inherit}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .box{flex:0 0 22px;height:22px;border:2px solid var(--muted);border-radius:6px;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:14px}
.opt.rund .box{border-radius:50%}
.opt.gewaehlt{border-color:var(--accent);background:var(--accent-soft)}
.opt.gewaehlt .box{border-color:var(--accent);background:var(--accent);color:#fff}
.opt.richtig{border-color:var(--ok);background:var(--ok-soft)}
.opt.falsch{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.zuord{display:flex;flex-direction:column;gap:10px}
.zrow{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card)}
.zrow.richtig{border-color:var(--ok);background:var(--ok-soft)}
.zrow.falsch{border-color:var(--bad);background:var(--bad-soft)}
.zrow .ztext{margin-bottom:8px}
.zknoepfe{display:flex;flex-wrap:wrap;gap:6px}
.zk{border:1.5px solid var(--line);background:transparent;color:inherit;border-radius:999px;padding:4px 12px;cursor:pointer;font-size:.92rem}
.zk.an{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .zk.an{color:#10202a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .zk.an{color:#10202a}}
.zk:disabled{cursor:default}
.zhinweis{font-size:.9rem;margin-top:6px;color:var(--bad)}
.lsatz{line-height:2.2}
.lsatz input{font:inherit;width:9em;max-width:60vw;padding:3px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:inherit}
.lsatz input.richtig{border-color:var(--ok);background:var(--ok-soft)}
.lsatz input.falsch{border-color:var(--bad);background:var(--bad-soft)}
.lsg{font-size:.9rem;color:var(--ok);font-weight:600;margin-left:4px}
.reihe{display:flex;flex-direction:column;gap:8px}
.rrow{display:flex;gap:8px;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card)}
.rrow.richtig{border-color:var(--ok);background:var(--ok-soft)}
.rrow.falsch{border-color:var(--bad);background:var(--bad-soft)}
.rrow .nr{font-weight:700;color:var(--muted);min-width:1.4em}
.rrow .rt{flex:1}
.rrow .pf{display:flex;flex-direction:column;gap:4px}
.pfeil{border:1px solid var(--line);background:transparent;color:inherit;border-radius:6px;width:34px;height:28px;cursor:pointer}
.pfeil:disabled{opacity:.3;cursor:default}
.rueck{border-radius:10px;padding:12px 14px;margin-top:14px}
.rueck.gut{background:var(--ok-soft);border:1px solid var(--ok)}
.rueck.schlecht{background:var(--bad-soft);border:1px solid var(--bad)}
.rueck b{display:block;margin-bottom:4px}
.beilage{border-left:4px solid var(--accent);padding:10px 14px;background:var(--accent-soft);border-radius:0 10px 10px 0;margin-bottom:14px}
.beilage h3{margin:0 0 2px}
.beilage .binfo{font-size:.88rem;color:var(--muted);margin-bottom:8px}
.beilage p{margin:0 0 8px}
.beilage .nr{font-size:.8rem;color:var(--muted);font-weight:700;margin-right:6px}
.beilage p.verse{margin:0 0 14px;line-height:1.7}
.beilage p.verse .vz{display:block;padding-left:2.4em;text-indent:-2.4em}
.beilage p.verse .nr{display:inline-block;width:1.7em;text-indent:0;text-align:right;margin-right:.7em}
details>summary{cursor:pointer;color:var(--accent);font-weight:600;margin-bottom:8px}
.info{background:var(--warn-soft);border:1px solid var(--warn);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:.95rem}
.ergebnis{text-align:center;padding:24px 16px}
.ergebnis .gross{font-size:2.6rem;color:var(--star);letter-spacing:6px}
.ergebnis .zahl{font-size:1.3rem;font-weight:700;margin:6px 0}
label.feld{display:block;font-weight:600;margin:10px 0 4px}
select,textarea,input.zahl{font:inherit;color:inherit;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px}
select{width:100%}
textarea{width:100%;min-height:300px;resize:vertical;line-height:1.55}
input.zahl{width:6em}
.zaehler{font-size:.9rem;color:var(--muted);margin-top:4px}
.hinweise{display:flex;flex-direction:column;gap:8px}
.hw{border-radius:10px;padding:10px 12px;border:1px solid var(--line);background:var(--card)}
.hw.ok{border-color:var(--ok);background:var(--ok-soft)}
.hw.achtung{border-color:var(--warn);background:var(--warn-soft)}
.hw b{display:block}
.hw .bsp{font-size:.9rem;color:var(--muted);margin-top:4px}
.basis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 12px;margin-top:6px;font-size:.95rem}
.ansicht{white-space:pre-wrap;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--card);line-height:1.7}
.ansicht mark{border-radius:3px;padding:0 1px;color:inherit}
mark.m-ich{background:var(--mark-ich)} mark.m-ugs{background:var(--mark-ugs)} mark.m-dass{background:var(--mark-dass)}
mark.m-wdh{background:var(--mark-wdh)} mark.m-zeit{background:var(--mark-zeit)}
.legende{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;margin:8px 0}
.legende mark{padding:0 6px}
.check{display:flex;flex-direction:column;gap:6px}
.check label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{margin-top:5px;width:18px;height:18px;flex:0 0 18px;accent-color:var(--accent)}
footer{margin-top:28px;font-size:.85rem;color:var(--muted);text-align:center}
.versteckt{display:none}
@media (max-width:480px){
  body{font-size:16px}
  .kacheln{grid-template-columns:1fr}
  .kachel{min-height:0}
}
@media print{
  .zurueck,.leiste,footer,header.kopf .sterne-gesamt{display:none}
  body{background:#fff}
}

/* ===================== Design für Jugendliche (Farben, Schrift, Bewegung) =====================
   Nur Schriften, die auf den Geräten schon vorhanden sind – nichts wird aus dem Internet geladen. */
:root{
  --bg:#f6f4ff; --card:#ffffff; --text:#1e1b2e; --muted:#5f5a75; --line:#e4dff5;
  --accent:#7c3aed; --accent2:#db2777; --accent3:#f97316; --accent-soft:#efe9ff;
  --ok:#16a34a; --ok-soft:#e7f8ed; --bad:#e11d48; --bad-soft:#fde8ee; --warn:#b45309; --warn-soft:#fff4dc; --star:#f59e0b;
  --schatten:0 6px 18px rgba(76,29,149,.10); --schatten-hoch:0 12px 26px rgba(76,29,149,.18);
  --titel:"Bahnschrift","Segoe UI Variable Display","Trebuchet MS",system-ui,-apple-system,"Roboto",sans-serif;
  --text-font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Roboto","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13111c; --card:#1d1a2a; --text:#ece9f8; --muted:#a9a3c4; --line:#322d48;
    --accent:#a78bfa; --accent2:#f472b6; --accent3:#fb923c; --accent-soft:#2a2245;
    --ok:#4ade80; --ok-soft:#163222; --bad:#fb7185; --bad-soft:#3a1822; --warn:#fbbf24; --warn-soft:#3a2d10;
    --schatten:0 6px 18px rgba(0,0,0,.35); --schatten-hoch:0 12px 26px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#13111c; --card:#1d1a2a; --text:#ece9f8; --muted:#a9a3c4; --line:#322d48;
  --accent:#a78bfa; --accent2:#f472b6; --accent3:#fb923c; --accent-soft:#2a2245;
  --ok:#4ade80; --ok-soft:#163222; --bad:#fb7185; --bad-soft:#3a1822; --warn:#fbbf24; --warn-soft:#3a2d10;
  --schatten:0 6px 18px rgba(0,0,0,.35); --schatten-hoch:0 12px 26px rgba(0,0,0,.5);
}
body{font-family:var(--text-font);background:var(--bg);
  background-image:radial-gradient(circle at 10% -10%, rgba(124,58,237,.10), transparent 40%),radial-gradient(circle at 100% 0%, rgba(249,115,22,.08), transparent 35%);
  background-attachment:fixed}
h1,h2,h3,.kachel b,.btn,.zahl,.frage,summary{font-family:var(--titel)}
h2{font-size:1.35rem;font-weight:700;letter-spacing:.01em}

/* Kopfzeile als Farbverlauf-Banner */
header.kopf{background:linear-gradient(120deg,#7c3aed 0%,#db2777 55%,#f97316 100%);color:#fff;border-radius:22px;padding:16px 20px;box-shadow:var(--schatten-hoch);margin-bottom:20px}
header.kopf h1{color:#fff;font-size:1.6rem;font-weight:700;letter-spacing:.02em;line-height:1.15}
header.kopf h1 small{display:block;font-size:.72rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;opacity:.88;margin-top:3px}
header.kopf .sterne-gesamt{color:#fff;background:rgba(255,255,255,.22);border-radius:999px;padding:5px 12px;font-weight:700;font-family:var(--titel)}

/* Karten und Kacheln */
.karte{border:0;border-radius:20px;box-shadow:var(--schatten)}
.kacheln{gap:14px}
.kachel{border:0;border-radius:20px;box-shadow:var(--schatten);border-top:6px solid var(--g,var(--accent));transition:transform .15s ease, box-shadow .15s ease}
.kachel:hover,.kachel:focus-visible{transform:translateY(-4px);box-shadow:var(--schatten-hoch)}
.kachel .sym{font-size:2.1rem;width:52px;height:52px;display:flex;align-items:center;justify-content:center;border-radius:16px;background:color-mix(in srgb, var(--g,var(--accent)) 14%, transparent)}
.kachel b{font-size:1.1rem}
.kachel .fort{color:var(--g,var(--accent));font-weight:700;font-family:var(--titel)}
h3.gruppe{display:inline-block;color:#fff;background:var(--g,var(--accent));border-radius:999px;padding:4px 14px;font-size:.85rem;letter-spacing:.06em;margin:26px 0 12px}
.setzeile{border:0;border-radius:16px;box-shadow:var(--schatten);border-left:6px solid var(--g,var(--accent));transition:transform .15s ease}
.setzeile:hover{transform:translateX(3px)}
.loeslink{color:var(--g,var(--accent))}

/* Knöpfe */
.btn{border-radius:999px;padding:11px 20px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 12px rgba(124,58,237,.28);transition:transform .12s ease, box-shadow .12s ease}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 18px rgba(124,58,237,.35)}
.btn.zweit{background:var(--card);color:var(--accent);border:2px solid var(--accent);box-shadow:none}
:root[data-theme="dark"] .btn{color:#160f26}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#160f26}}
:root[data-theme="dark"] .btn.zweit{color:var(--accent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.zweit{color:var(--accent)}}
.zurueck{color:var(--g,var(--accent));font-family:var(--titel)}

/* Fortschritt und Aufgaben */
.fortschritt{height:10px;border-radius:999px;background:var(--line)}
.fortschritt div{background:linear-gradient(90deg,var(--g,var(--accent)),var(--accent2));border-radius:999px}
.frage{font-size:1.08rem;font-weight:600;line-height:1.45}
.opt,.zrow,.rrow{border-radius:14px;border-width:2px}
.opt:hover:not(:disabled){border-color:var(--g,var(--accent));transform:translateX(2px)}
.opt{transition:transform .12s ease, border-color .12s ease, background .12s ease}
.opt.gewaehlt{border-color:var(--g,var(--accent))}
.opt.gewaehlt .box{background:var(--g,var(--accent));border-color:var(--g,var(--accent))}
.zk{border-width:2px;font-weight:600}
.zk.an{background:var(--g,var(--accent));border-color:var(--g,var(--accent))}
.beilage{border-left-color:var(--g,var(--accent));border-radius:0 16px 16px 0}
.info{border-radius:14px}
.rueck{border-radius:16px}
.opt.richtig,.zrow.richtig,.rrow.richtig,.rueck.gut,.lsatz input.richtig{animation:pop .35s ease}
.opt.falsch,.zrow.falsch,.rrow.falsch,.lsatz input.falsch{animation:wackeln .4s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes wackeln{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

/* Ergebnis mit Konfetti */
.ergebnis .gross{font-size:3rem;animation:pop .6s ease}
.ergebnis .zahl{font-size:1.5rem}
.konfetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.konfetti span{position:absolute;top:-40px;font-size:1.6rem;animation:fallen 2.6s ease-in forwards}
@keyframes fallen{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
  .konfetti{display:none}
}
@media (max-width:480px){
  header.kopf{padding:12px 14px;border-radius:18px}
  header.kopf h1{font-size:1.2rem}
}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<footer>Alle Beispieltexte, Namen und Medien sind erfunden. Nichts wird ins Internet geschickt – dein Fortschritt und dein Text bleiben nur in diesem Browser.</footer>
<script>
const UEBUNGEN = {"module": [{"id": "zf", "gruppe": "Informieren und Beschreiben", "titel": "Zusammenfassung", "symbol": "📄", "kurz": "Basissatz, Wesentliches erkennen, sachlich bleiben – und kein Schluss.", "sets": [{"id": "zf1", "titel": "Der Basissatz", "aufgaben": [{"typ": "mehrfach", "frage": "Was gehört in den Basissatz einer Zusammenfassung? Wähle alles Passende.", "optionen": ["Textsorte", "Titel", "Autor/in", "Medium bzw. Quelle", "Erscheinungsdatum", "Thema des Textes", "deine eigene Meinung", "ein spannender Aufhänger", "ein wörtliches Zitat"], "richtig": [0, 1, 2, 3, 4, 5], "erklaerung": "Der Basissatz nennt Textsorte, Titel, Autor/in, Medium, Datum und Thema. Meinung, Aufhänger und Zitate gehören nicht hinein – die Zusammenfassung informiert sachlich."}, {"typ": "wahl", "frage": "Welcher Basissatz ist vollständig und sachlich?", "optionen": ["In dem Kommentar „Schluss mit dem Handyverbot!“ von Lena Berger, erschienen am 3. Oktober 2026 in der Zeitung „Tagesblatt Mitte“, geht es um die Frage, ob Smartphones im Unterricht erlaubt sein sollen.", "In dem lesenswerten Kommentar „Schluss mit dem Handyverbot!“ von Lena Berger, erschienen in der Zeitung „Tagesblatt Mitte“, geht es um die Frage, ob Smartphones im Unterricht endlich erlaubt sein sollen.", "In dem Kommentar „Schluss mit dem Handyverbot!“, erschienen am 3. Oktober 2026 in der Zeitung „Tagesblatt Mitte“, geht es um die Frage, ob ich mein Smartphone im Unterricht verwenden darf.", "Lena Berger zeigt in ihrem Kommentar „Schluss mit dem Handyverbot!“, erschienen am 3. Oktober 2026 in der Zeitung „Tagesblatt Mitte“, völlig zu Recht, dass Smartphones im Unterricht erlaubt sein sollen."], "richtig": 0, "erklaerung": "Vollständig und sachlich ist nur der Basissatz mit Textsorte, Titel, Autorin, Medium, Datum und Thema, ganz ohne Wertung. Bei den anderen fehlt das Datum oder die Autorin, sie werten („lesenswert“, „endlich“, „völlig zu Recht“) oder rutschen in die Ich-Form."}, {"typ": "mehrfach", "frage": "Basissatz: Im Artikel „Mehr Lehrlinge gesucht“ aus der „Steirischen Rundschau“ geht es darum, dass viele Betriebe keine Lehrlinge finden.\n\nWas fehlt in diesem Basissatz?", "optionen": ["Textsorte", "Titel", "Autor/in", "Medium", "Erscheinungsdatum", "Thema"], "richtig": [2, 4], "erklaerung": "Textsorte (Artikel), Titel, Medium und Thema sind da. Es fehlen der Name der Autorin bzw. des Autors und das Erscheinungsdatum."}, {"typ": "wahl", "frage": "Welches Wort passt? „Der Autor ___ sich mit der Frage, ob Hausübungen sinnvoll sind.“", "optionen": ["befasst", "handelt", "geht", "informiert"], "richtig": 0, "erklaerung": "Richtig ist „sich befassen mit“. Achte auf die festen Verbindungen: Der Text handelt VON …, Im Text geht es UM …, Der Text informiert ÜBER …"}, {"typ": "wahl", "frage": "Bei deinem Artikel steht kein Autor und keine Autorin. Was machst du im Basissatz?", "optionen": ["Ich vermerke, dass es keine Autorenangabe gibt (z. B. „In dem Artikel ohne Autorenangabe …“).", "Ich erfinde einen passenden Namen, damit der Basissatz trotzdem vollständig ist (z. B. „von M. Huber“).", "Ich gebe den Namen der Zeitung als Autor an (z. B. „In dem Artikel von der ‚Steirischen Rundschau‘ …“).", "Ich lasse den Basissatz weg und beginne gleich mit der ersten Kernaussage des Artikels."], "richtig": 0, "erklaerung": "Nichts erfinden und die Zeitung nicht zur Autorin machen! Fehlt eine Angabe, wird das kurz vermerkt. Der Basissatz bleibt trotzdem."}, {"typ": "reihenfolge", "frage": "Bring die Teile des Basissatzes in die richtige Reihenfolge.", "elemente": ["In dem Kommentar", "„Weniger ist mehr“", "von Jakob Weiß,", "erschienen am 12. Mai 2026 in der Zeitschrift „Konsum heute“,", "geht es darum, warum junge Menschen weniger Kleidung kaufen sollten."], "erklaerung": "Üblich ist: Textsorte – Titel – Autor/in – Erscheinungsangaben (Datum, Medium) – Thema. Die Erscheinungsangaben stehen zwischen Beistrichen."}]}, {"id": "zf2", "titel": "Wesentliches erkennen", "beilage": {"titel": "Betriebe suchen händeringend Lehrlinge", "info": "Bericht von Martin Gruber, erschienen am 14. September 2026 in der „Steirischen Rundschau“ (erfundener Übungstext)", "absaetze": ["In vielen Regionen Österreichs bleiben Lehrstellen unbesetzt. Besonders betroffen sind die Gastronomie, das Handwerk und der Handel. Ein Bäckermeister aus Leoben sucht seit zwei Jahren vergeblich einen Lehrling. Seine Backstube ist übrigens über hundert Jahre alt.", "Als wichtigsten Grund nennen Fachleute, dass immer mehr Jugendliche nach der Pflichtschule eine höhere Schule besuchen. Außerdem gibt es heute weniger Jugendliche als noch vor zwanzig Jahren.", "Viele junge Menschen halten eine Lehre zudem für weniger angesehen als die Matura. Eine Berufsberaterin hält dieses Bild für veraltet: Gut ausgebildete Fachkräfte hätten sehr gute Aufstiegschancen und würden dringend gebraucht.", "Die Betriebe reagieren unterschiedlich. Manche zahlen Prämien, finanzieren den Führerschein oder ermöglichen eine Lehre mit Matura. Ein Installateur in Graz lädt Schulklassen zu Schnuppertagen ein, bei denen es immer Pizza gibt.", "Die Wirtschaftskammer fordert, dass die Schulen früher und genauer über Lehrberufe informieren. Nur so könne der Fachkräftemangel langfristig gebremst werden."]}, "aufgaben": [{"typ": "wahl", "frage": "Lies zuerst den Text oben. Welcher Basissatz passt zu diesem Text?", "optionen": ["In dem Bericht „Betriebe suchen händeringend Lehrlinge“ von Martin Gruber, erschienen am 14. September 2026 in der „Steirischen Rundschau“, geht es darum, warum viele Lehrstellen unbesetzt bleiben und wie Betriebe darauf reagieren.", "In dem Bericht „Betriebe suchen händeringend Lehrlinge“ von Martin Gruber, erschienen am 14. September 2026 in der „Steirischen Rundschau“, geht es darum, wie ein Installateur in Graz Schulklassen zu Schnuppertagen einlädt.", "In dem Bericht „Betriebe suchen händeringend Lehrlinge“ von Martin Gruber, erschienen am 14. September 2026 in der „Steirischen Rundschau“, geht es leider darum, dass heute niemand mehr eine Lehre machen will.", "In dem Kommentar „Betriebe suchen händeringend Lehrlinge“ von Martin Gruber, erschienen am 14. September 2026 in der „Steirischen Rundschau“, ging es darum, warum viele Lehrstellen unbesetzt blieben und wie Betriebe darauf reagierten."], "richtig": 0, "erklaerung": "Passend ist der Basissatz, der das Thema des ganzen Textes nennt. Die Schnuppertage in Graz sind nur ein Detail, „leider“ ist eine Wertung und „niemand“ übertreibt. Der Satz mit „ging“ steht im Präteritum und macht aus dem Bericht einen Kommentar."}, {"typ": "mehrfach", "frage": "Welche Informationen gehören in eine Zusammenfassung dieses Textes? Wähle alle Kernaussagen.", "optionen": ["Viele Lehrstellen bleiben unbesetzt, vor allem in Gastronomie, Handwerk und Handel.", "Die Backstube des Bäckermeisters ist über hundert Jahre alt.", "Immer mehr Jugendliche besuchen eine höhere Schule, außerdem gibt es weniger Jugendliche.", "Die Lehre gilt bei vielen als weniger angesehen – laut einer Berufsberaterin zu Unrecht.", "Bei den Schnuppertagen gibt es immer Pizza.", "Betriebe locken mit Prämien, dem Führerschein oder einer Lehre mit Matura.", "Die Wirtschaftskammer fordert, dass Schulen besser über Lehrberufe informieren."], "richtig": [0, 2, 3, 5, 6], "erklaerung": "Kernaussagen beantworten: Was ist das Problem? Warum? Was tun die Betriebe? Was wird gefordert? Das Alter der Backstube und die Pizza sind nette Details, aber für das Verständnis unwichtig."}, {"typ": "wahl", "frage": "Welcher Satz gibt Absatz 3 am besten in eigenen Worten wieder?", "optionen": ["Viele junge Menschen halten eine Lehre zudem für weniger angesehen als die Matura, eine Berufsberaterin hält dieses Bild für veraltet.", "Viele Jugendliche sehen die Lehre als zweite Wahl; eine Berufsberaterin hält das für überholt, da Fachkräfte gute Aufstiegschancen hätten.", "Viele Jugendliche sehen die Lehre als zweite Wahl, was ich unfair finde, weil Fachkräfte in Wahrheit gute Aufstiegschancen haben.", "Viele Jugendliche sehen die Lehre als zweite Wahl; eine Berufsberaterin bestätigt das, da Fachkräfte kaum Aufstiegschancen hätten."], "richtig": 1, "erklaerung": "Die richtige Antwort formuliert eigenständig und gibt die Meinung der Berufsberaterin im Konjunktiv wieder. Der Satz mit „dieses Bild für veraltet“ ist fast wörtlich abgeschrieben, der mit „was ich unfair finde“ enthält eine eigene Meinung, und laut dem Satz mit „bestätigt“ stimmt die Berufsberaterin zu – im Text widerspricht sie."}, {"typ": "zuordnen", "frage": "Passt der Satz in eine Zusammenfassung?", "kategorien": ["passt", "passt nicht"], "elemente": [{"text": "Zunächst beschreibt der Autor, dass viele Lehrstellen unbesetzt bleiben.", "kat": 0}, {"text": "Ich finde es schlimm, dass niemand mehr Bäcker werden will.", "kat": 1}, {"text": "Fachleuten zufolge besuchen immer mehr Jugendliche eine höhere Schule.", "kat": 0}, {"text": "Die Betriebe zahlten Prämien.", "kat": 1}, {"text": "Zusammenfassend kann man sagen, dass die Lehre eine Chance verdient.", "kat": 1}, {"text": "Abschließend fordert die Wirtschaftskammer, dass Schulen früher über Lehrberufe informieren.", "kat": 0}, {"text": "Leider finden viele Betriebe keine Lehrlinge.", "kat": 1}], "erklaerung": "Nicht in die Zusammenfassung: eigene Meinung und Ich-Form, Präteritum („zahlten“ → „zahlen“), ein angehängtes Fazit („Zusammenfassend kann man sagen …“) und Wertungen wie „leider“. Erlaubt ist, den Aufbau des Textes zu benennen („Zunächst beschreibt …“, „Abschließend fordert …“) – das ist kein Fazit, sondern die letzte Kernaussage."}, {"typ": "reihenfolge", "frage": "Ordne die Kernaussagen so, wie sie im Text vorkommen.", "elemente": ["Viele Lehrstellen bleiben unbesetzt, vor allem in Gastronomie, Handwerk und Handel.", "Als Gründe gelten der Trend zu höheren Schulen und die geringere Zahl an Jugendlichen.", "Die Lehre hat ein schlechteres Ansehen als die Matura, was eine Berufsberaterin für unberechtigt hält.", "Betriebe locken mit Prämien, dem Führerschein oder einer Lehre mit Matura.", "Die Wirtschaftskammer fordert mehr Information über Lehrberufe an den Schulen."], "erklaerung": "Die Zusammenfassung folgt dem Aufbau des Ausgangstextes – Absatz für Absatz."}, {"typ": "wahl", "frage": "Wie endet deine Zusammenfassung?", "optionen": ["Mit der letzten Kernaussage des Textes.", "Mit einem Fazit („Zusammenfassend lässt sich sagen …“).", "Mit meiner eigenen Meinung zum Thema.", "Mit einer Frage an die Leserinnen und Leser."], "richtig": 0, "erklaerung": "Die Zusammenfassung hat keinen Schluss. Sie endet mit der letzten Kernaussage des Ausgangstextes – ohne Fazit, ohne Meinung, ohne Frage."}]}, {"id": "zfv", "titel": "✏️ Schwache Beispiele verbessern", "aufgaben": [{"typ": "verbessern", "frage": "So beginnt eine Zusammenfassung des Kommentars „Schluss mit dem Handyverbot!“ von Lena Berger (Tagesblatt Mitte, 3. Oktober 2026).", "beispiel": "In dem Text geht es um Handys, der Text ist sehr interessant und ich finde ihn gut.", "maengel": ["Textsorte, Titel, Autorin, Medium und Datum fehlen.", "Er enthält eine eigene Wertung und die Ich-Form.", "Das Thema ist zu ungenau.", "Er ist viel zu lang.", "Er steht im Präsens."], "richtig": [0, 1, 2], "erklaerung": "Der Basissatz nennt alle Eckdaten und das Thema – sachlich, ohne Ich und ohne Wertung. Präsens ist richtig.", "tipps": ["Textsorte, Titel, Autorin, Medium und Datum genannt", "Thema genau benannt", "keine Wertung, keine Ich-Form"], "muster": "In dem Kommentar „Schluss mit dem Handyverbot!“ von Lena Berger, erschienen am 3. Oktober 2026 in der Zeitung „Tagesblatt Mitte“, geht es um die Frage, ob Smartphones im Unterricht erlaubt sein sollen."}, {"typ": "verbessern", "frage": "So endet eine Zusammenfassung des Berichts „Betriebe suchen händeringend Lehrlinge“ (Übungstext aus „Wesentliches erkennen“).", "beispiel": "Zusammenfassend kann man sagen, dass der Artikel sehr wichtig ist und alle Jugendlichen ihn lesen sollten.", "maengel": ["Die Zusammenfassung hat keinen Schluss – ein angehängtes Fazit ist ein Fehler.", "Der Satz enthält eine eigene Wertung und eine Aufforderung.", "Der Satz steht im falschen Fall.", "Es fehlt ein wörtliches Zitat."], "richtig": [0, 1], "erklaerung": "Die Zusammenfassung endet mit der letzten Kernaussage des Ausgangstextes – ohne Fazit, Wertung oder Appell.", "tipps": ["endet mit der letzten Kernaussage des Textes", "keine Wertung, kein Fazit", "Redewiedergabe im Konjunktiv"], "muster": "Abschließend fordert die Wirtschaftskammer, dass die Schulen früher und genauer über Lehrberufe informieren, da nur so der Fachkräftemangel langfristig gebremst werden könne."}, {"typ": "verbessern", "frage": "Dieser Satz aus einer Zusammenfassung gibt die Aussage einer Berufsberaterin wieder.", "beispiel": "Die Berufsberaterin sagte: „Dieses Bild ist veraltet.“ Sie meint, dass Fachkräfte gute Chancen hätten, und das finde ich auch.", "maengel": ["wörtliche Rede statt indirekter Rede", "Präteritum („sagte“) statt Präsens", "eigene Meinung („das finde ich auch“)", "Der Konjunktiv „hätten“ ist falsch.", "Es gibt zu viele Fachbegriffe."], "richtig": [0, 1, 2], "erklaerung": "„hätten“ ist hier richtig – als Ersatzform, weil „sie haben“ wie der Indikativ klingt. Fehler sind die wörtliche Rede, das Präteritum und die eigene Meinung.", "tipps": ["indirekte Rede mit Konjunktiv", "Präsens", "keine eigene Meinung"], "muster": "Eine Berufsberaterin hält dieses Bild für veraltet, da gut ausgebildete Fachkräfte sehr gute Aufstiegschancen hätten und dringend gebraucht würden."}]}]}, {"id": "ir", "gruppe": "Grundlagen", "titel": "Indirekte Rede", "symbol": "💬", "kurz": "Konjunktiv I bilden, Ersatzformen und Redeeinleitungen.", "sets": [{"id": "ir1", "titel": "Konjunktiv I bilden", "info": "Den Konjunktiv I bildest du vom Wortstamm + Endung: er geh-e, sie hab-e, er könn-e. Ausnahme: er/sie sei.", "aufgaben": [{"typ": "luecke", "frage": "Setze den Konjunktiv I ein.", "satz": "Der Direktor sagt, die Schule {{}} (sein) gut ausgestattet.", "loesungen": [["sei"]], "erklaerung": "sein → er/sie/es sei."}, {"typ": "luecke", "frage": "Setze den Konjunktiv I ein.", "satz": "Die Autorin meint, jeder Mensch {{}} (haben) ein Recht auf Bildung.", "loesungen": [["habe"]], "erklaerung": "haben → er/sie/es habe (nicht „hat“ und nicht „hätte“)."}, {"typ": "luecke", "frage": "Setze den Konjunktiv I ein.", "satz": "Der Bericht hält fest, man {{}} (können) die Kosten deutlich senken.", "loesungen": [["könne"]], "erklaerung": "können → man könne."}, {"typ": "luecke", "frage": "Setze den Konjunktiv I ein.", "satz": "Er betont, das Projekt {{}} (müssen) bis Juni fertig sein.", "loesungen": [["müsse"]], "erklaerung": "müssen → es müsse."}, {"typ": "luecke", "frage": "Setze den Konjunktiv I ein.", "satz": "Die Expertin warnt, der Verkehr {{}} (werden) weiter zunehmen.", "loesungen": [["werde"]], "erklaerung": "werden → er werde."}, {"typ": "luecke", "frage": "Setze den Konjunktiv I ein.", "satz": "Der Schüler erklärt, er {{}} (wissen) die Antwort nicht.", "loesungen": [["wisse"]], "erklaerung": "wissen → er wisse."}, {"typ": "luecke", "frage": "Setze den Konjunktiv I ein.", "satz": "Die Firma gibt an, sie {{}} (dürfen) keine Auskunft geben.", "loesungen": [["dürfe"]], "erklaerung": "dürfen → sie dürfe."}, {"typ": "luecke", "frage": "Setze den Konjunktiv I ein.", "satz": "Der Trainer sagt, die Mannschaft {{}} (spielen) am Samstag in Linz.", "loesungen": [["spiele"]], "erklaerung": "spielen → sie spiele."}]}, {"id": "ir2", "titel": "Ersatzform: Konjunktiv II", "info": "Klingt der Konjunktiv I gleich wie der Indikativ (sie haben – sie haben), nimmst du den Konjunktiv II (sie hätten). Klingt auch der gleich, nimmst du die würde-Form.", "aufgaben": [{"typ": "luecke", "frage": "Setze die richtige Form ein.", "satz": "Die Eltern sagen, sie {{}} (haben) zu wenig Zeit.", "loesungen": [["hätten"]], "erklaerung": "Konjunktiv I „sie haben“ = Indikativ → Ersatzform Konjunktiv II: sie hätten."}, {"typ": "luecke", "frage": "Setze die richtige Form ein.", "satz": "Die Schüler meinen, sie {{}} (können) sich schlecht konzentrieren.", "loesungen": [["könnten"]], "erklaerung": "„sie können“ ist mehrdeutig → Konjunktiv II: sie könnten."}, {"typ": "luecke", "frage": "Achtung, Falle! Setze die richtige Form ein.", "satz": "Die Forscher erklären, sie {{}} (sein) überrascht.", "loesungen": [["seien"]], "erklaerung": "„seien“ ist eindeutig Konjunktiv I – hier brauchst du keine Ersatzform („wären“)."}, {"typ": "luecke", "frage": "Setze die richtige Form ein.", "satz": "Die Gemeinden betonen, sie {{}} (müssen) sparen.", "loesungen": [["müssten"]], "erklaerung": "„sie müssen“ = Indikativ → Konjunktiv II: sie müssten."}, {"typ": "luecke", "frage": "Hier brauchst du die würde-Form. Fülle beide Lücken.", "satz": "Die Lehrlinge berichten, sie {{}} gern im Team {{}} (arbeiten).", "loesungen": [["würden"], ["arbeiten"]], "erklaerung": "Konjunktiv I „sie arbeiten“ und Konjunktiv II „sie arbeiteten“ klingen wie der Indikativ → würde-Form: sie würden arbeiten."}, {"typ": "wahl", "frage": "„Ich habe keine Zeit“, sagt Anna. – Wie lautet die indirekte Rede?", "optionen": ["Anna sagt, sie habe keine Zeit.", "Anna sagt, sie hat keine Zeit.", "Anna sagt, sie hätte keine Zeit.", "Anna sagt, ich habe keine Zeit."], "richtig": 0, "erklaerung": "Das Pronomen wechselt (ich → sie). „sie habe“ ist eindeutig Konjunktiv I, also brauchst du kein „hätte“."}]}, {"id": "ir3", "titel": "Von der direkten zur indirekten Rede", "aufgaben": [{"typ": "wahl", "frage": "„Die Stadt braucht mehr Radwege“, sagt die Bürgermeisterin.", "optionen": ["Die Bürgermeisterin sagt, die Stadt brauche mehr Radwege.", "Die Bürgermeisterin sagt, die Stadt braucht mehr Radwege.", "Die Bürgermeisterin sagt, die Stadt bräuchte mehr Radwege.", "Die Bürgermeisterin sagte, die Stadt brauche mehr Radwege."], "richtig": 0, "erklaerung": "Konjunktiv I „brauche“ ist eindeutig. „braucht“ ist Indikativ, „bräuchte“ ist nur als Ersatzform nötig, und „sagte“ steht im Präteritum – in der Zusammenfassung schreibst du im Präsens."}, {"typ": "wahl", "frage": "„Wie lange dauert die Ausbildung?“, fragt ein Schüler.", "optionen": ["Ein Schüler fragt, wie lange die Ausbildung dauere.", "Ein Schüler fragt, wie lange dauert die Ausbildung.", "Ein Schüler fragt, ob die Ausbildung lange dauere.", "Ein Schüler fragt, dass die Ausbildung lange dauere."], "richtig": 0, "erklaerung": "Bei W-Fragen bleibt das Fragewort (wie lange), das Verb rückt ans Ende und steht im Konjunktiv I. „ob“ verändert den Sinn, „dass“ passt nicht zu einer Frage."}, {"typ": "wahl", "frage": "„Gibt es Förderungen?“, fragt die Unternehmerin.", "optionen": ["Die Unternehmerin fragt, ob es Förderungen gebe.", "Die Unternehmerin fragt, gibt es Förderungen.", "Die Unternehmerin fragt, dass es Förderungen gebe.", "Die Unternehmerin fragt, ob es Förderungen gibt."], "richtig": 0, "erklaerung": "Ja/Nein-Fragen werden mit „ob“ eingeleitet; das Verb steht im Konjunktiv I (gebe). „ob es Förderungen gibt“ hört man im Alltag, in der Zusammenfassung verwendest du aber den Konjunktiv."}, {"typ": "wahl", "frage": "„Meldet euch bis Freitag an!“, sagt die Lehrerin zu den Schülern.", "optionen": ["Die Lehrerin sagt den Schülern, sie sollten sich bis Freitag anmelden.", "Die Lehrerin sagt den Schülern, meldet euch bis Freitag an.", "Die Lehrerin sagt den Schülern, sie melden sich bis Freitag an.", "Die Lehrerin sagt den Schülern, ihr sollt euch bis Freitag anmelden."], "richtig": 0, "erklaerung": "Aufforderungen gibst du mit „sollen“ wieder. „sie sollen“ klingt wie der Indikativ, daher „sie sollten“. Auch möglich: „Die Lehrerin fordert die Schüler auf, sich bis Freitag anzumelden.“"}, {"typ": "wahl", "frage": "„Ich habe meinen Lehrplatz über ein Praktikum gefunden“, erzählt Jonas.", "optionen": ["Jonas erzählt, er habe seinen Lehrplatz über ein Praktikum gefunden.", "Jonas erzählt, ich habe meinen Lehrplatz über ein Praktikum gefunden.", "Jonas erzählt, er hat seinen Lehrplatz über ein Praktikum gefunden.", "Jonas erzählt, er hätte seinen Lehrplatz über ein Praktikum gefunden."], "richtig": 0, "erklaerung": "Pronomen anpassen (ich → er, meinen → seinen) und Konjunktiv I (er habe … gefunden)."}, {"typ": "wahl", "frage": "„Die Messe war ein großer Erfolg“, sagt der Veranstalter.", "optionen": ["Der Veranstalter sagt, die Messe sei ein großer Erfolg gewesen.", "Der Veranstalter sagt, die Messe wäre ein großer Erfolg.", "Der Veranstalter sagt, die Messe war ein großer Erfolg.", "Der Veranstalter sagt, die Messe sei ein großer Erfolg."], "richtig": 0, "erklaerung": "Vergangenes gibst du mit „sei/habe + Partizip“ wieder: sei … gewesen. „sei ein großer Erfolg“ würde die Zeit verändern."}, {"typ": "mehrfach", "frage": "Welche Verben eignen sich in einer Zusammenfassung als Redeeinleitung statt „sagt“?", "optionen": ["betont", "kritisiert", "fordert", "erklärt", "labert", "quatscht", "weist darauf hin"], "richtig": [0, 1, 2, 3, 6], "erklaerung": "„labert“ und „quatscht“ sind umgangssprachlich. Achte darauf, dass das Verb zum Inhalt passt: „kritisiert“ nur, wenn wirklich Kritik geäußert wird."}, {"typ": "wahl", "frage": "Welche Redeeinleitung passt? „Die Autorin ___, dass Handys im Unterricht verboten werden sollten.“", "optionen": ["fordert", "lobt", "fragt", "bezweifelt"], "richtig": 0, "erklaerung": "Die Autorin will ein Verbot – also „fordert“. „lobt“ passt inhaltlich nicht, nach „fragt“ käme „ob“ statt „dass“, und „bezweifelt“ dreht die Aussage um."}]}]}, {"id": "ar", "gruppe": "Grundlagen", "titel": "Argumente (3-B)", "symbol": "🧱", "kurz": "Behauptung, Begründung, Beispiel – für Erörterung, Leserbrief, Kommentar.", "sets": [{"id": "ar1", "titel": "Die drei B erkennen", "info": "Ein vollständiges Argument hat drei Teile: Behauptung (Was meine ich?), Begründung (Warum?), Beispiel oder Beleg (Woran sieht man das?).", "aufgaben": [{"typ": "zuordnen", "frage": "Thema Smartphone im Unterricht: Ordne jeden Satz zu.", "kategorien": ["Behauptung", "Begründung", "Beispiel"], "elemente": [{"text": "Smartphones können den Unterricht bereichern.", "kat": 0}, {"text": "Mit ihnen lassen sich Informationen schnell recherchieren und Lernapps gezielt einsetzen.", "kat": 1}, {"text": "So können Schülerinnen und Schüler in Betriebswirtschaft aktuelle Börsenkurse abrufen und gleich besprechen.", "kat": 2}], "erklaerung": "Behauptung = die These. Begründung = warum das so ist. Beispiel = ein konkreter Fall („So können …“)."}, {"typ": "zuordnen", "frage": "Thema Ferialpraktikum: Ordne jeden Satz zu.", "kategorien": ["Behauptung", "Begründung", "Beispiel"], "elemente": [{"text": "Ein Ferialpraktikum erleichtert die Berufswahl.", "kat": 0}, {"text": "Wer einen Betrieb von innen kennenlernt, erkennt früh, ob ein Beruf wirklich zu einem passt.", "kat": 1}, {"text": "Meine Schwester etwa merkte erst bei ihrem Praktikum in einer Bank, dass sie lieber mit Menschen als mit Zahlen arbeitet.", "kat": 2}], "erklaerung": "Das Beispiel stammt hier aus dem eigenen Umfeld – das ist in Erörterung und Leserbrief erlaubt (Erfahrungsbeispiel)."}, {"typ": "zuordnen", "frage": "Thema Fast Fashion: Ordne jeden Satz zu.", "kategorien": ["Behauptung", "Begründung", "Beleg"], "elemente": [{"text": "Billige Mode schadet der Umwelt.", "kat": 0}, {"text": "Für die Herstellung werden große Mengen Wasser und Energie verbraucht, und viele Kleidungsstücke landen nach kurzer Zeit im Müll.", "kat": 1}, {"text": "Laut Umweltorganisationen braucht man für ein einziges Baumwoll-T-Shirt mehrere Tausend Liter Wasser.", "kat": 2}], "erklaerung": "Ein Beleg stützt das Argument mit Fakten, Zahlen oder Expertenaussagen – mit Quellenangabe („Laut …“)."}, {"typ": "zuordnen", "frage": "Thema Gratis-Öffis für Schüler: Ordne jeden Satz zu.", "kategorien": ["Behauptung", "Begründung", "Beispiel"], "elemente": [{"text": "Öffentliche Verkehrsmittel sollten für Schülerinnen und Schüler kostenlos sein.", "kat": 0}, {"text": "Dadurch würden Familien finanziell entlastet und weniger Jugendliche müssten mit dem Auto gebracht werden.", "kat": 1}, {"text": "Mein Cousin zum Beispiel fährt seit der Einführung eines günstigen Jugendtickets täglich mit dem Zug, statt von seinen Eltern gebracht zu werden.", "kat": 2}], "erklaerung": "Signalwörter helfen: „Dadurch“ leitet eine Begründung ein, „zum Beispiel“ ein Beispiel."}]}, {"id": "ar2", "titel": "Argumente verbessern", "aufgaben": [{"typ": "wahl", "frage": "Welche Aussage ist nur eine Behauptung – ohne Begründung?", "optionen": ["Hausübungen sind sinnlos.", "Hausübungen sind sinnvoll, weil man den Stoff dadurch selbstständig wiederholt.", "Hausübungen können schaden, da sie bei manchen Schülern Stress auslösen.", "Hausübungen festigen den Stoff, denn Üben hilft dem Gedächtnis."], "richtig": 0, "erklaerung": "Eine bloße Behauptung zählt noch nicht als Argument. Erst mit „weil“, „da“ oder „denn“ kommt die Begründung dazu."}, {"typ": "wahl", "frage": "Behauptung: „Lesen erweitert den Wortschatz.“ – Welcher Satz ist ein passendes BEISPIEL?", "optionen": ["So bin ich beim Lesen eines Krimis auf das Wort „Indiz“ gestoßen und verwende es seither selbst.", "Wer regelmäßig liest, begegnet ständig neuen Wörtern und lernt sie im Zusammenhang kennen.", "So kosten viele Taschenbücher heute schon mehr als zehn Euro, weshalb Jugendliche seltener selbst welche kaufen.", "Laut einer Umfrage lesen immer weniger Jugendliche in ihrer Freizeit regelmäßig ein Buch oder eine Zeitung."], "richtig": 0, "erklaerung": "Das Beispiel zeigt einen konkreten Fall, in dem der Wortschatz wächst. Der Satz „Wer regelmäßig liest …“ ist eine Begründung (er erklärt, WARUM). Die Sätze über Buchpreise und über die Umfrage zum Leseverhalten passen nicht zur Behauptung."}, {"typ": "wahl", "frage": "Behauptung: „Schulen sollten ein Fach Finanzbildung anbieten.“ – Welche Begründung überzeugt am meisten?", "optionen": ["… weil viele Jugendliche Handyverträge oder Ratenkäufe abschließen, ohne die Kosten wirklich zu verstehen.", "… weil Geld im Leben jedes Menschen eine wichtige Rolle spielt und man ohne Geld nicht weit kommt.", "… weil ich Mathematik nicht besonders mag und mir ein Fach mit weniger Rechnen viel lieber wäre.", "… weil es ein solches Fach an einigen anderen Schulen in Österreich angeblich schon seit Jahren gibt."], "richtig": 0, "erklaerung": "Eine gute Begründung ist konkret und bezieht sich direkt auf die Behauptung. „Geld spielt eine wichtige Rolle“ ist zu allgemein, die Abneigung gegen Mathematik ist rein persönlich, und dass es das Fach anderswo gibt, ist kein Grund."}, {"typ": "reihenfolge", "frage": "Bring das Argument in die richtige Reihenfolge.", "elemente": ["Außerdem stärkt ein Sportverein den Zusammenhalt.", "Wer regelmäßig mit anderen trainiert, lernt, sich auf ein Team zu verlassen und Rücksicht zu nehmen.", "In meinem Fußballverein helfen etwa die älteren Spielerinnen den neuen bei den Hausübungen.", "Deshalb sollten Schulen enger mit Vereinen zusammenarbeiten."], "erklaerung": "Behauptung – Begründung – Beispiel – Folgerung. Die Folgerung („Deshalb …“) rundet das Argument ab."}, {"typ": "wahl", "frage": "Du hast ein Pro-Argument geschrieben und willst jetzt ein Kontra-Argument bringen. Welche Überleitung passt?", "optionen": ["Allerdings muss man auch bedenken, dass …", "Darüber hinaus sollte man auch bedenken, dass …", "Deshalb muss man auch bedenken, dass …", "Ein gutes Beispiel dafür ist auch, dass …"], "richtig": 0, "erklaerung": "„Allerdings“ zeigt einen Gegensatz. „Darüber hinaus“ ergänzt in dieselbe Richtung, „Deshalb“ leitet eine Folge ein, „Ein gutes Beispiel dafür …“ ein Beispiel."}, {"typ": "zuordnen", "frage": "Was drückt das Bindewort aus?", "kategorien": ["Grund", "Folge", "Gegensatz", "Einräumung"], "elemente": [{"text": "weil", "kat": 0}, {"text": "denn", "kat": 0}, {"text": "sodass", "kat": 1}, {"text": "folglich", "kat": 1}, {"text": "jedoch", "kat": 2}, {"text": "aber", "kat": 2}, {"text": "obwohl", "kat": 3}, {"text": "zwar … aber", "kat": 3}], "erklaerung": "Grund = kausal, Folge = konsekutiv, Gegensatz = adversativ, Einräumung = konzessiv („Obwohl es regnet, gehen wir spazieren.“)."}, {"typ": "wahl", "frage": "In welcher Reihenfolge ordnest du deine Argumente?", "optionen": ["Steigernd: vom schwächsten zum stärksten Argument.", "Das stärkste Argument zuerst, dann die schwächeren.", "In beliebiger Reihenfolge.", "Das kürzeste Argument zuerst."], "richtig": 0, "erklaerung": "Steigernd anordnen: Das stärkste Argument kommt zuletzt und bleibt den Leserinnen und Lesern am besten in Erinnerung."}, {"typ": "wahl", "frage": "Wo steht in einer dialektischen Erörterung (Pro und Kontra) deine eigene Meinung?", "optionen": ["Im Schluss.", "Schon in der Einleitung.", "Im ersten Argument.", "Gar nicht."], "richtig": 0, "erklaerung": "Einleitung und Hauptteil bleiben sachlich und ausgewogen. Im Schluss beziehst du begründet Stellung – mit Bezug auf deine Argumente."}]}]}, {"id": "textanalyse", "gruppe": "Analysieren und Interpretieren", "titel": "Textanalyse (Sachtexte)", "symbol": "🔬", "kurz": "Stilmittel, Argumenttypen – und immer: Beleg und Wirkung.", "sets": [{"id": "ta1", "titel": "Stilmittel erkennen", "aufgaben": [{"typ": "zuordnen", "frage": "Welches Stilmittel ist das?", "kategorien": ["rhetorische Frage", "Metapher", "Anapher", "Antithese"], "elemente": [{"text": "Wollen wir wirklich so weitermachen?", "kat": 0}, {"text": "Wer kann da noch ruhig bleiben?", "kat": 0}, {"text": "Das Internet ist ein Dschungel.", "kat": 1}, {"text": "Sie schwimmen in einem Meer aus Nachrichten.", "kat": 1}, {"text": "Wir müssen handeln. Wir müssen reden. Wir müssen zuhören.", "kat": 2}, {"text": "Die einen haben zu viel, die anderen zu wenig.", "kat": 3}], "erklaerung": "Rhetorische Frage: Frage ohne echte Antwort. Metapher: bildhafter Ausdruck ohne „wie“. Anapher: Wiederholung am Satzanfang. Antithese: Gegenüberstellung von Gegensätzen."}, {"typ": "zuordnen", "frage": "Und diese?", "kategorien": ["Vergleich", "Personifikation", "Hyperbel", "Ironie"], "elemente": [{"text": "Er ist stark wie ein Bär.", "kat": 0}, {"text": "Die Nachricht verbreitete sich wie ein Lauffeuer.", "kat": 0}, {"text": "Die Stadt schläft.", "kat": 1}, {"text": "Die Sonne lachte vom Himmel.", "kat": 1}, {"text": "Ich habe dir das schon tausendmal gesagt.", "kat": 2}, {"text": "Na toll, schon wieder Stau – genau das hat mir heute noch gefehlt.", "kat": 3}], "erklaerung": "Vergleich: mit „wie“ oder „als“. Personifikation: Dinge handeln wie Menschen. Hyperbel: Übertreibung. Ironie: Man meint das Gegenteil von dem, was man sagt."}, {"typ": "wahl", "frage": "Welche Wirkung hat eine rhetorische Frage meistens?", "optionen": ["Sie bezieht die Leserinnen und Leser ein und regt zum Nachdenken an – die Antwort scheint selbstverständlich.", "Sie zeigt, dass die Autorin selbst unsicher ist und die Antwort von ihren Leserinnen und Lesern erfahren will.", "Sie macht den Text sachlicher, weil sie eine offene Frage stellt, statt eine Meinung zu behaupten.", "Sie fordert die Leserinnen und Leser auf, ihre Antwort in einem Leserbrief an die Zeitung zu schicken."], "richtig": 0, "erklaerung": "Die rhetorische Frage lenkt die Leser auf die gewünschte Antwort – ein typisches Mittel des Überzeugens. Eine echte Antwort wird nicht erwartet, und sachlicher wird der Text dadurch nicht."}, {"typ": "wahl", "frage": "Welche Wirkung hat eine Anapher (z. B. „Wir müssen … Wir müssen … Wir müssen …“)?", "optionen": ["Die Wiederholung hebt den Gedanken hervor und wirkt eindringlich.", "Die Wiederholung zeigt, dass dem Autor keine anderen Wörter eingefallen sind.", "Die Wiederholung macht den Text sachlicher und neutraler im Ton.", "Die Wiederholung ersetzt die Begründung, darum braucht es keine Argumente."], "richtig": 0, "erklaerung": "Wiederholungen prägen sich ein und verstärken die Aussage – darum sind sie in Reden und Kommentaren beliebt. Sie sind bewusst gesetzt, kein Zeichen von Wortarmut, und ersetzen keine Begründung."}, {"typ": "wahl", "frage": "Was ist eine Hypotaxe?", "optionen": ["Ein Satzgefüge aus Haupt- und Nebensätzen.", "Eine Folge kurzer, aneinandergereihter Hauptsätze.", "Ein unvollständiger Satz, dem ein Satzglied fehlt.", "Eine Übertreibung, die eine Aussage verstärkt."], "richtig": 0, "erklaerung": "Hypotaxe = Satzgefüge (oft sachlich, komplex). Parataxe = aneinandergereihte Hauptsätze (oft einfach, eindringlich). Ellipse = unvollständiger Satz. Hyperbel = Übertreibung."}]}, {"id": "ta2", "titel": "Aufbau und Formulierungen", "aufgaben": [{"typ": "reihenfolge", "frage": "Bring den Aufbau einer Textanalyse in die richtige Reihenfolge.", "elemente": ["Einleitung: Eckdaten, Thema, Zielgruppe und Textfunktion", "kurze Zusammenfassung des Inhalts", "Analyse: Aufbau, Argumentation, Sprache – je ein Absatz", "kurzer Schluss: Ergebnis der Analyse"], "erklaerung": "Die Zusammenfassung bleibt kurz – der Schwerpunkt liegt auf der Analyse."}, {"typ": "wahl", "frage": "Welcher Satz analysiert vollständig (Stilmittel – Beleg – Wirkung)?", "optionen": ["Mit der rhetorischen Frage, warum so viele Menschen schweigen (Z. 12), bezieht die Autorin die Leser ein und regt sie an, über ihr eigenes Verhalten nachzudenken.", "In Zeile 12 verwendet die Autorin eine rhetorische Frage, nämlich die Frage, warum so viele Menschen schweigen, und danach beginnt ein neuer Absatz.", "Die Autorin verwendet im Text immer wieder rhetorische Fragen, die die Leser einbeziehen und sie dazu anregen, über ihr eigenes Verhalten nachzudenken.", "Mit der rhetorischen Frage, warum so viele Menschen schweigen (Z. 12), hat mich die Autorin persönlich sehr berührt, und ich finde die Stelle besonders gelungen."], "richtig": 0, "erklaerung": "Ein Stilmittel nur zu nennen, reicht nicht: Beleg (Zitat oder Zeilenangabe) und Wirkung gehören immer dazu. Die Wirkung wird sachlich beschrieben – ein Ich, die eigene Ergriffenheit oder ein „gelungen“ ist keine Analyse."}, {"typ": "zuordnen", "frage": "Welcher Argumenttyp ist das?", "kategorien": ["Faktenargument", "Autoritätsargument", "Plausibilitätsargument", "Wertargument"], "elemente": [{"text": "Laut einer OECD-Studie liegt Österreich beim Mobbing an der Spitze.", "kat": 0}, {"text": "Eine Psychologin, die seit Jahren an Schulen arbeitet, warnt davor.", "kat": 1}, {"text": "Jeder kennt das Gefühl, in einer Gruppe lieber zu schweigen.", "kat": 2}, {"text": "Niemand darf wegsehen, wenn ein Mensch gedemütigt wird.", "kat": 3}], "erklaerung": "Fakten (Zahlen, Studien), Autorität (Fachleute), Plausibilität (allgemeine Erfahrung), Werte (moralische Grundsätze)."}, {"typ": "wahl", "frage": "Darfst du in der Textanalyse „ich“ schreiben und deine Meinung sagen?", "optionen": ["Nein – die Analyse ist sachlich, ohne Ich und ohne Meinung (außer ein Arbeitsauftrag verlangt ausdrücklich eine Beurteilung).", "Ja – in der Einleitung und im Schluss sage ich, ob mir der Text gefällt und ob ich der Autorin zustimme.", "Ja, aber nur im Hauptteil – nämlich dann, wenn ich ein Stilmittel besonders gelungen finde und das mit einem Zitat belege.", "Nein – „ich“ ist tabu, aber die eigene Meinung darf überall stehen, wenn man „man“ statt „ich“ schreibt."], "richtig": 0, "erklaerung": "Eine Beurteilung nur, wenn ein Operator wie „beurteilen“ sie verlangt – und dann gestützt auf die Analyse. Auch mit „man“ statt „ich“ bleibt eine Meinung eine Meinung."}, {"typ": "mehrfach", "frage": "Welche Formulierungen passen zur Textanalyse?", "optionen": ["… verdeutlicht …", "… unterstreicht …", "… dient der Hervorhebung von …", "… bewirkt beim Leser, dass …", "Ich finde die Metapher schön.", "Der Text ist voll gut geschrieben."], "richtig": [0, 1, 2, 3], "erklaerung": "Analyseformulierungen beschreiben die Funktion – nicht den eigenen Geschmack."}]}, {"id": "ta3", "titel": "Originaltext: Zivilcourage", "originaltext": {"titel": "Warum wir Angst haben, Zivilcourage zu zeigen", "info": "Kommentar von Petra Sansone, derStandard.at, 28. November 2016", "situation": "Analysiere die sprachliche Gestaltung des Kommentars."}, "aufgaben": [{"typ": "wahl", "frage": "Welche Textsorte und welche Absicht hat der Text?", "optionen": ["Kommentar – die Autorin will zum Nachdenken anregen und die Leser bewegen, aus der Angst herauszukommen und sich einzusetzen.", "Bericht – die Autorin informiert neutral und ohne eigene Wertung über eine OECD-Studie zum Mobbing an Schulen.", "Reportage – die Autorin schildert anschaulich, was sie beim Unterrichten von Schulleitern und Lehrern vor Ort erlebt hat.", "Leserbrief – die Autorin antwortet als Leserin auf einen Artikel und kritisiert die Berichterstattung der Zeitung."], "richtig": 0, "erklaerung": "Der Text ist meinungsbetont, persönlich und endet mit einem Appell – typisch für einen Kommentar. Die OECD-Studie und die Arbeit mit Lehrkräften dienen nur als Stützen; neutral berichtet oder anschaulich geschildert wird nicht, und auf einen bestimmten Artikel antwortet die Autorin auch nicht."}, {"typ": "zuordnen", "frage": "Welches Stilmittel steckt in der beschriebenen Stelle?", "kategorien": ["Anapher", "Ironie", "Antithese", "rhetorische Frage", "Metapher"], "elemente": [{"text": "Gleich am Anfang wiederholt die Autorin die Zeitangabe „Seit Wochen“.", "kat": 0}, {"text": "Sie nennt Österreich beim Mobbing „Sieger“ – und ergänzt in Klammern, eigentlich sei es ein Verlierer.", "kat": 1}, {"text": "Am Schluss stellt sie die Wahl zwischen „gegeneinander“ und „miteinander“.", "kat": 2}, {"text": "Sie fragt, woher die Angst komme, die eigene Meinung zu äußern.", "kat": 3}, {"text": "Sie schreibt, viele ruhten sich auf ihrem kleinen Wohlstandspolster aus.", "kat": 4}], "erklaerung": "Such die Stellen im Originaltext und notier die Zeilen – in deiner Analyse brauchst du sie als Beleg."}, {"typ": "mehrfach", "frage": "Womit stützt die Autorin ihre Aussagen?", "optionen": ["mit Fakten: einer OECD-Studie zum Mobbing", "mit Fachwissen: Modellen aus Psychologie und Kommunikationswissenschaft (Gruppendynamik, Schweigespirale)", "mit persönlicher Erfahrung: Postings und ihrer Arbeit mit Lehrkräften", "mit einer Umfrage unter ihren Leserinnen und Lesern", "mit einer Statistik zu Wahlergebnissen"], "richtig": [0, 1, 2], "erklaerung": "Faktenargument, Autoritäts- bzw. Fachargument und Erfahrung – eine Leserumfrage oder Wahlstatistik kommt nicht vor."}, {"typ": "wahl", "frage": "Wie lässt sich die Sprache des Kommentars beschreiben?", "optionen": ["Persönlich und emotional, mit Ich-Form – passend zum meinungsbetonten Kommentar.", "Streng sachlich und neutral, ohne Ich-Form – passend zu einem informierenden Bericht.", "Umgangssprachlich wie in einem Chat, mit vielen Abkürzungen und Jugendwörtern.", "Fachsprachlich wie eine Studie: Fachbegriffe ersetzen jede persönliche Wertung."], "richtig": 0, "erklaerung": "Die Autorin spricht von eigenen Gefühlen (z. B. Fassungslosigkeit, Angst) – sie will betroffen machen, nicht nur informieren. Fachbegriffe aus der Psychologie kommen zwar vor, verdrängen die persönliche Sicht aber nicht."}, {"typ": "verbessern", "frage": "Dieser Satz stammt aus einer Analyse des Kommentars.", "beispiel": "Die Autorin verwendet eine Metapher. Das ist schön.", "maengel": ["kein Beleg (welche Metapher, wo?)", "keine Wirkung bzw. Funktion", "Geschmacksurteil statt Analyse", "Präteritum statt Präsens"], "richtig": [0, 1, 2], "erklaerung": "Stilmittel – Beleg – Wirkung. Und statt „schön“: Was bewirkt das Mittel?", "tipps": ["Stilmittel benannt", "Beleg (Zitat oder Zeilenangabe)", "Wirkung bzw. Funktion erklärt", "keine Ich-Form, kein Geschmacksurteil"], "muster": "Mit der Metapher vom „Wohlstandspölsterchen“ kritisiert die Autorin die Bequemlichkeit vieler Menschen; die Verkleinerungsform wirkt dabei spöttisch."}]}]}, {"id": "textanalyse_literarisch", "gruppe": "Analysieren und Interpretieren", "titel": "Literarische Texte", "symbol": "📜", "kurz": "Erzählperspektive, Zeit, Gedichte – und vom Befund zur Deutung.", "sets": [{"id": "li1", "titel": "Fachbegriffe der Erzähltextanalyse", "aufgaben": [{"typ": "zuordnen", "frage": "Welche Erzählperspektive liegt vor?", "kategorien": ["Ich-Erzähler", "personaler Erzähler", "auktorialer Erzähler"], "elemente": [{"text": "Ich stand am Bahnsteig und wusste nicht, ob ich einsteigen sollte.", "kat": 0}, {"text": "Lisa starrte auf ihr Handy. Warum schrieb er nicht zurück?", "kat": 1}, {"text": "Lisa ahnte nicht, dass dieser Tag ihr Leben verändern würde – und auch ihr Bruder wusste nichts davon.", "kat": 2}, {"text": "Was keiner der drei wusste: Der Zug hatte längst Verspätung.", "kat": 2}], "erklaerung": "Ich-Erzähler: erzählt selbst. Personal: Er-/Sie-Form, aber aus der Sicht einer Figur. Auktorial: allwissend, weiß mehr als die Figuren, kommentiert oder deutet voraus."}, {"typ": "zuordnen", "frage": "Wie wird mit der Zeit umgegangen?", "kategorien": ["Zeitraffung", "Zeitdehnung", "Rückblende"], "elemente": [{"text": "Drei Jahre vergingen.", "kat": 0}, {"text": "Die wenigen Sekunden vor dem Elfmeter werden über eine halbe Seite beschrieben.", "kat": 1}, {"text": "Sie erinnerte sich an ihren ersten Schultag vor zehn Jahren.", "kat": 2}], "erklaerung": "Zeitraffung: Die erzählte Zeit ist viel länger als die Lesezeit. Zeitdehnung: umgekehrt. Rückblende: ein Sprung in die Vergangenheit."}, {"typ": "wahl", "frage": "Was ist eine Leerstelle?", "optionen": ["Eine Stelle, die der Text bewusst offenlässt und die die Leser selbst füllen müssen.", "Eine leere Zeile zwischen zwei Absätzen, die einen neuen Sinnabschnitt im Text markiert.", "Eine Stelle, an der der Autor vergessen hat, eine wichtige Information zu erklären.", "Eine Stelle, an der der Erzähler die Leser direkt anspricht und ihnen eine Frage stellt."], "richtig": 0, "erklaerung": "Leerstellen sind bewusst gesetzt – kein Versehen und keine Leerzeile. Sie regen zum Nachdenken und Deuten an, typisch für Kurzgeschichten."}, {"typ": "wahl", "frage": "Was unterscheidet Analyse und Interpretation?", "optionen": ["Die Analyse beschreibt, wie der Text gemacht ist; die Interpretation deutet, was er bedeutet – gestützt auf die Analyse.", "Die Analyse gibt den Inhalt mit eigenen Worten wieder; die Interpretation sagt, wie einem der Text gefallen hat.", "Die Analyse deutet, was der Text bedeutet; die Interpretation beschreibt danach, wie der Text gemacht ist.", "Die Interpretation ist die eigene Meinung zum Thema des Textes – Belege braucht sie im Unterschied zur Analyse nicht."], "richtig": 0, "erklaerung": "Jeder Befund wird zur Deutung erweitert: Was bewirkt er, was bedeutet er? Die Analyse ist keine Nacherzählung, und die Interpretation ist kein Geschmacksurteil – auch sie stützt sich auf Belege aus dem Text."}, {"typ": "wahl", "frage": "Was ist eine Interpretationshypothese?", "optionen": ["Eine begründete Vermutung über die Aussage des Textes, die du beim Analysieren überprüfst.", "Eine kurze Zusammenfassung der Handlung, die am Anfang der Interpretation steht.", "Eine Aussage über den Text, die schon feststeht und im Hauptteil nicht mehr geprüft wird.", "Eine Vermutung darüber, wie die Geschichte nach dem offenen Ende weitergehen könnte."], "richtig": 0, "erklaerung": "Die Hypothese steht oft schon in der Einleitung und wird im Hauptteil am Text bestätigt, eingeschränkt oder verworfen. Sie ist weder eine Inhaltsangabe noch eine Vermutung über die Fortsetzung."}]}, {"id": "li2", "titel": "Originaltext: Spaghetti für zwei", "originaltext": {"titel": "Spaghetti für zwei", "info": "Kurzgeschichte von Federica de Cesco", "situation": "Analysiere und interpretiere die Kurzgeschichte."}, "aufgaben": [{"typ": "wahl", "frage": "Aus welcher Perspektive wird die Geschichte überwiegend erzählt?", "optionen": ["Personal: Er-Form, wir erfahren fast nur Heinz’ Gedanken und Gefühle.", "Auktorial: Ein allwissender Erzähler kennt die Gedanken von Heinz und Marcel.", "Ich-Erzähler: Heinz erzählt selbst, seine Gedanken stehen in Anführungszeichen.", "Personal aus Marcels Sicht: Wir erfahren vor allem, was Marcel denkt und fühlt."], "richtig": 0, "erklaerung": "Weil wir Heinz’ Gedanken kennen, Marcels aber nicht, teilen wir lange Heinz’ Sicht – und seinen Irrtum. Ein allwissender Erzähler würde auch Marcels Gedanken verraten, und erzählt wird in der Er-Form, nicht in der Ich-Form."}, {"typ": "zuordnen", "frage": "Beschreibt der Satz (Analyse) – oder deutet er (Interpretation)?", "kategorien": ["Analyse", "Deutung"], "elemente": [{"text": "Die Geschichte ist überwiegend in der Er-Form aus Heinz’ Sicht erzählt.", "kat": 0}, {"text": "Heinz’ Gedanken stehen in Anführungszeichen.", "kat": 0}, {"text": "Weil wir nur Heinz’ Sicht kennen, teilen wir seinen Irrtum und erleben die Wende genauso überrascht wie er.", "kat": 1}, {"text": "Marcels Schweigen lässt offen, was er denkt; so wird Heinz’ Unsicherheit für die Leser spürbar.", "kat": 1}], "erklaerung": "Gute Interpretationen verbinden beides: Befund (Analyse) und Bedeutung (Deutung)."}, {"typ": "wahl", "frage": "Was bedeutet der Titel „Spaghetti für zwei“?", "optionen": ["Das gemeinsame Essen steht für die Annäherung der beiden – aus dem vermeintlichen Diebstahl wird Gemeinschaft.", "Der Titel beschreibt nur, was die beiden zu Mittag essen, und hat darüber hinaus keine tiefere Bedeutung.", "Der Titel zeigt, dass Heinz am Ende großzügig ist und Marcel aus Mitleid die Spaghetti bezahlt hat.", "Der Titel verrät schon zu Beginn den Wendepunkt: dass Heinz die ganze Zeit an einem fremden Tisch sitzt."], "richtig": 0, "erklaerung": "Der Titelbezug gehört in jede Interpretation: Was sagt der Titel über die Aussage des Textes? Er verweist auf das Teilen, das die beiden verbindet. Die Spaghetti bezahlt Marcel, und den Irrtum verrät der Titel nicht."}, {"typ": "wahl", "frage": "Welche Deutung lässt sich am Text belegen?", "optionen": ["Vorurteile verzerren das Urteil, Begegnung kann sie überwinden – belegt durch Heinz’ falschen Verdacht und das gemeinsame Lachen am Ende.", "Die Geschichte zeigt, dass man Fremden im Restaurant grundsätzlich misstrauen sollte – belegt dadurch, dass Marcel ungefragt von Heinz’ Suppe isst.", "Marcel will Heinz für seine Vorurteile bloßstellen – belegt dadurch, dass er am Ende wortlos aufsteht und Heinz allein am Tisch zurücklässt.", "Die Geschichte beweist, dass alle Jugendlichen voller Vorurteile sind – belegt durch Heinz, der seine Meinung bis zum Schluss nicht ändert."], "richtig": 0, "erklaerung": "Eine Deutung muss sich am Text belegen lassen – keine Spekulation, keine Verallgemeinerung. Prüf auch den Beleg: Marcel isst seine eigene Suppe, er verabredet sich am Ende mit Heinz, und Heinz erkennt seinen Irrtum."}, {"typ": "wahl", "frage": "Welche Leerstelle lässt die Geschichte offen?", "optionen": ["Was Marcel die ganze Zeit über denkt.", "Wer die Spaghetti an der Kasse bezahlt.", "Welche Suppe sich Heinz ausgesucht hat.", "Ob sich Heinz am Ende bei Marcel entschuldigt."], "richtig": 0, "erklaerung": "Marcels Gedanken bleiben verborgen – die Leser müssen sie aus seinem Verhalten erschließen. Wer zahlt, welche Suppe es ist und ob Heinz sich entschuldigt, steht dagegen im Text."}, {"typ": "verbessern", "frage": "Dieser Satz stammt aus dem Schluss einer Interpretation.", "beispiel": "Ich finde die Geschichte unrealistisch, weil so etwas nie passieren würde.", "maengel": ["Geschmacksurteil statt begründeter Deutung", "kein Bezug zum Text, kein Beleg", "pauschale Behauptung („nie“)", "falsche Zeitform"], "richtig": [0, 1, 2], "erklaerung": "Auch die eigene Meinung im Schluss wird am Text begründet.", "tipps": ["Bezug auf eine konkrete Stelle", "Wirkung oder Aussage erklärt", "begründet statt pauschal"], "muster": "Die Geschichte wirkt bewusst zugespitzt: Gerade weil Heinz’ Verdacht so überzeugt geschildert wird, trifft die Wende mit der kalten Suppe auf dem Nebentisch die Leser umso stärker – und zeigt, wie schnell ein Vorurteil die Wahrnehmung lenkt."}]}, {"id": "li3", "titel": "Gedichte: Fachbegriffe", "aufgaben": [{"typ": "wahl", "frage": "Was ist ein Vers, was eine Strophe?", "optionen": ["Ein Vers ist eine Zeile, eine Strophe ist eine Gruppe von Versen.", "Eine Strophe ist eine Zeile, ein Vers ist eine Gruppe von Strophen.", "Ein Vers ist ein Reimpaar, eine Strophe ist das ganze Gedicht.", "Ein Vers ist ein ganzer Satz, egal wie viele Zeilen er im Gedicht umfasst."], "richtig": 0, "erklaerung": "Ein Vers ist eine Zeile – unabhängig davon, wo der Satz endet oder ob sie sich reimt. Belege gibst du bei Gedichten mit Versangabe an, z. B. (V. 3)."}, {"typ": "zuordnen", "frage": "Welches Reimschema hat das (erfundene) Gedicht?", "kategorien": ["Paarreim (aabb)", "Kreuzreim (abab)", "umarmender Reim (abba)"], "elemente": [{"text": "Im Garten blüht der erste Mohn, / die Bienen summen lange schon. / Der Wind trägt Duft von Gras und Heu, / und jeder Tag beginnt ganz neu.", "kat": 0}, {"text": "Der Regen fällt aufs graue Dach, / die Straße glänzt im Licht, / ich liege lange noch wach / und schlafe einfach nicht.", "kat": 1}, {"text": "Am Morgen steht die Stadt noch still, / kein Auto fährt, kein Mensch ist wach, / nur eine Taube auf dem Dach – / und ich, der nichts mehr sagen will.", "kat": 2}], "erklaerung": "Markiere die Reimwörter am Versende mit Buchstaben: gleicher Reim, gleicher Buchstabe."}, {"typ": "wahl", "frage": "Wer ist das „lyrische Ich“?", "optionen": ["Die Stimme, die im Gedicht spricht – nicht automatisch die Dichterin oder der Dichter.", "Immer die Dichterin oder der Dichter selbst – das Gedicht erzählt von eigenen Erlebnissen.", "Die Leserin oder der Leser, weil man sich beim Lesen in das Gedicht hineinversetzt.", "Die Person, über die das Gedicht berichtet – meistens in der Er- oder Sie-Form."], "richtig": 0, "erklaerung": "Darum schreibst du in der Interpretation „das lyrische Ich“ – nicht „der Dichter fühlt …“. Das lyrische Ich spricht selbst; es ist weder die Leserin noch eine Person, über die berichtet wird."}]}]}, {"id": "textinterpretation", "nach": "textanalyse_literarisch", "gruppe": "Analysieren und Interpretieren", "titel": "Textinterpretation", "symbol": "💭", "kurz": "Vom Befund zur Deutung: zusammenfassen, analysieren, beurteilen, deuten – mit Kafka und einem Barockgedicht.", "sets": [{"id": "ti1", "titel": "Vom Befund zur Deutung", "info": "Eine Interpretation geht einen Schritt weiter als die Analyse: Du zeigst nicht nur, WIE ein Text gemacht ist, sondern auch, WAS das bedeutet und WELCHE Wirkung es hat – immer mit Beleg aus dem Text.", "aufgaben": [{"typ": "mehrfach", "frage": "Welche vier Teile gehören in jede Textinterpretation?", "optionen": ["den Text kurz zusammenfassen", "den Text analysieren (Inhalt, Aufbau, Sprache)", "die im Arbeitsauftrag genannten Aspekte beurteilen", "den Text deuten und die Deutung belegen", "die Handlung spannend nacherzählen und ausschmücken", "den Lebenslauf der Autorin oder des Autors ausführlich darstellen", "eine eigene Fortsetzung der Geschichte schreiben"], "richtig": [0, 1, 2, 3], "erklaerung": "Zusammenfassen – analysieren – beurteilen – deuten. Hintergrundwissen zum Autor ist nur dann sinnvoll, wenn es die Deutung stützt."}, {"typ": "reihenfolge", "frage": "Bring die Teile einer Textinterpretation in die richtige Reihenfolge.", "elemente": ["Einleitung: Textsorte, Titel, Autor/in, Entstehungszeit, ggf. Epoche und das Thema (keine Zusammenfassung)", "kurze Zusammenfassung des Inhalts", "Analyse von Inhalt, Aufbau und Sprache – jeder Befund mit Beleg und Deutung", "Beurteilung der Aspekte aus dem Arbeitsauftrag", "Schluss: Ergebnis kurz bündeln, Wirkung auf die Leser, begründete Meinung"], "erklaerung": "Der Schluss bleibt kurz. Was im Arbeitsauftrag verlangt wird, hat Vorrang – lies die Angabe deshalb zuerst genau."}, {"typ": "zuordnen", "frage": "Ist das eine Nacherzählung, ein Analysebefund oder schon eine Deutung?", "kategorien": ["Nacherzählung", "Befund (Analyse)", "Deutung"], "elemente": [{"text": "Die Maus läuft immer weiter und sieht schließlich rechts und links Mauern.", "kat": 0}, {"text": "Die Katze rät der Maus, die Laufrichtung zu ändern, und frisst sie dann.", "kat": 0}, {"text": "Die Maus spricht in einem einzigen, sehr langen Satz.", "kat": 1}, {"text": "Das Gedicht besteht aus zwei Quartetten und zwei Terzetten.", "kat": 1}, {"text": "Der atemlose lange Satz spiegelt die wachsende Panik der Maus.", "kat": 2}, {"text": "Die vielen Gegensätze zeigen, dass nichts auf der Welt Bestand hat.", "kat": 2}], "erklaerung": "Eine Nacherzählung gibt nur den Inhalt wieder. Ein Befund beschreibt, wie der Text gemacht ist. Erst die Deutung erklärt, was das bewirkt oder bedeutet – und genau die macht eine Interpretation aus."}, {"typ": "wahl", "frage": "Wie machst du aus einem Analysebefund eine Interpretation?", "optionen": ["Ich nenne den Befund, belege ihn mit einem Zitat samt Zeilenangabe und erkläre, was er bewirkt oder bedeutet.", "Ich nenne möglichst viele Befunde hintereinander, damit die Lehrkraft sieht, wie viele Fachbegriffe ich kenne.", "Ich schreibe nach dem Befund, ob mir die Stelle gefallen hat oder nicht – das ist bereits die Deutung.", "Ich erkläre, was der Autor beim Schreiben wohl gefühlt hat – Belege aus dem Text braucht es dafür nicht."], "richtig": 0, "erklaerung": "Befund – Beleg – Deutung: Diese drei gehören zusammen. Aufzählen ohne Deutung ist nur Analyse, und Vermutungen über die Gefühle des Autors ohne Beleg sind Spekulation."}, {"typ": "zuordnen", "frage": "Sachliche Deutung, Spekulation oder bloßes Geschmacksurteil?", "kategorien": ["sachliche Deutungsformulierung", "Spekulation über den Autor", "Geschmacksurteil"], "elemente": [{"text": "Diese Stelle lässt die Deutung zu, dass Sicherheit trügerisch sein kann.", "kat": 0}, {"text": "Das Bild der Wiese verweist auf die Zerstörung durch den Krieg.", "kat": 0}, {"text": "Der knappe Satzbau unterstreicht die Ausweglosigkeit.", "kat": 0}, {"text": "Kafka wollte damit ganz sicher seinen strengen Vater kritisieren.", "kat": 1}, {"text": "Der Dichter war beim Schreiben bestimmt sehr traurig und einsam.", "kat": 1}, {"text": "Die Geschichte ist zu unrealistisch, weil Mäuse nicht sprechen können.", "kat": 2}, {"text": "Das Gedicht ist langweilig und viel zu altmodisch.", "kat": 2}], "erklaerung": "Formulierungen wie „lässt die Deutung zu“, „verweist auf“, „unterstreicht“ zeigen, dass du am Text deutest. Mit Aussagen über die Absicht oder die Gefühle des Autors gehst du sparsam um – und ein Urteil braucht immer eine Begründung."}, {"typ": "wahl", "frage": "Wann verwendest du Hintergrundwissen (Epoche, Biografie, Zeitgeschichte)?", "optionen": ["Nur wenn es die Deutung stützt – etwa den Dreißigjährigen Krieg, um die Vergänglichkeit in einem Barockgedicht zu erklären.", "Immer und möglichst ausführlich, denn ein langer Lebenslauf des Autors zeigt, dass ich mich gut vorbereitet habe.", "Nie, denn in einer Interpretation darf man ausschließlich mit dem Text selbst und mit Zitaten daraus arbeiten.", "Statt der Zitate aus dem Text, weil Hintergrundwissen verlässlicher ist als die eigene Lektüre des Textes."], "richtig": 0, "erklaerung": "Kontextwissen ist ein Werkzeug für die Deutung, kein Selbstzweck. Die Belege aus dem Text ersetzt es nie."}, {"typ": "wahl", "frage": "In welchem Satz ist das Zitat ein aktiver Teil der Interpretation?", "optionen": ["Mit dem Vergleich „wie ein Traum“ (V. 9) betont Gryphius, wie flüchtig selbst großer Ruhm ist.", "„wie ein Traum“ (V. 9). Das ist ein Vergleich. Vergleiche kommen in Gedichten häufig vor.", "Gryphius schreibt irgendwo im Gedicht etwas von einem Traum, das ist wohl ein Vergleich.", "Gryphius vergleicht den Ruhm mit „einem schönen Traum“ (V. 9), was romantisch wirkt."], "richtig": 0, "erklaerung": "Das Zitat ist richtig wiedergegeben, mit Versangabe belegt und in den eigenen Satz eingebaut – und es folgt eine Deutung. Ein Zitat ohne Deutung bleibt ein Fremdkörper, ein Zitat ohne Stellenangabe ist kein Beleg, und ein verändertes Zitat ist falsch."}]}, {"id": "ti2", "titel": "Kafka: Kleine Fabel", "info": "Franz Kafka ist 1924 gestorben, sein Text ist deshalb frei verwendbar und hier vollständig abgedruckt – in der alten Rechtschreibung („daß“, „mußt“).", "beilage": {"titel": "Kleine Fabel", "info": "Franz Kafka, entstanden 1920, erst nach seinem Tod veröffentlicht", "absaetze": ["„Ach“, sagte die Maus, „die Welt wird enger mit jedem Tag. Zuerst war sie so breit, daß ich Angst hatte, ich lief weiter und war glücklich, daß ich endlich rechts und links in der Ferne Mauern sah, aber diese langen Mauern eilen so schnell aufeinander zu, daß ich schon im letzten Zimmer bin, und dort im Winkel steht die Falle, in die ich laufe.“ – „Du mußt nur die Laufrichtung ändern“, sagte die Katze und fraß sie."]}, "aufgaben": [{"typ": "wahl", "frage": "Welcher Satz ist eine gelungene Einleitung?", "optionen": ["Kafkas „Kleine Fabel“, entstanden 1920, handelt von der Erfahrung, dass ein scheinbar freier Weg in die Ausweglosigkeit führt.", "Kafkas „Kleine Fabel“ handelt von einer Maus, die Angst hat, Mauern sieht, in die Falle läuft und gefressen wird.", "Kafkas „Kleine Fabel“ aus dem Jahr 1920 ist ein typisches Werk des Surrealismus und spielt in einem großen Haus.", "Kafkas spannende und sehr traurige „Kleine Fabel“ hat mir beim ersten Lesen sofort richtig gut gefallen."], "richtig": 0, "erklaerung": "Die Einleitung nennt Textsorte, Titel, Autor und Entstehungszeit – und das Thema, nicht schon den Inhalt. Der Surrealismus entsteht erst Jahre später in Frankreich, und ein Haus wird im Text nicht genannt. Die Meinung gehört in den Schluss."}, {"typ": "mehrfach", "frage": "Welche Merkmale einer Fabel findest du in diesem Text?", "optionen": ["Tiere sprechen und handeln wie Menschen.", "Die Handlung ist sehr kurz und endet mit einer Pointe.", "Ein schwaches Tier steht einem starken gegenüber.", "Am Ende steht eine ausdrücklich formulierte Moral.", "Die Geschichte geht für das schwache Tier gut aus."], "richtig": [0, 1, 2], "erklaerung": "Eine ausdrückliche Lehre fehlt – Kafka überlässt die Deutung den Leserinnen und Lesern. Gerade das macht den Text rätselhaft und parabelhaft: Die Maus steht für mehr als nur eine Maus."}, {"typ": "zuordnen", "frage": "Welche Deutung passt zu welcher Textstelle?", "kategorien": ["Weite macht Angst", "Grenzen geben Halt", "Die Enge wird bedrohlich", "Der Rat ist eine Falle"], "elemente": [{"text": "„Zuerst war sie so breit, daß ich Angst hatte“", "kat": 0}, {"text": "„war glücklich, daß ich endlich rechts und links in der Ferne Mauern sah“", "kat": 1}, {"text": "„diese langen Mauern eilen so schnell aufeinander zu“", "kat": 2}, {"text": "„dort im Winkel steht die Falle, in die ich laufe“", "kat": 2}, {"text": "„Du mußt nur die Laufrichtung ändern“", "kat": 3}], "erklaerung": "Der Text hat einen Bogen: Angst vor der Weite – Erleichterung über Grenzen – immer schnellere Enge – Falle. Der Rat der Katze klingt hilfreich, führt aber direkt in ihr Maul: Umkehren wäre ebenfalls tödlich."}, {"typ": "wahl", "frage": "Die Maus spricht in einem einzigen, sehr langen Satz. Was bewirkt das?", "optionen": ["Der Satz wirkt atemlos und gehetzt – wie die Maus, die immer schneller auf die Falle zuläuft.", "Der Satz zeigt, dass die Maus sehr gebildet ist und gerne lange, schöne Reden über die Welt hält.", "Der lange Satz soll den Text strecken, weil eine Fabel eine bestimmte Mindestlänge braucht.", "Der Satz wirkt ruhig und gelassen, weil die Maus ihre Lage gut überblickt und keine Angst hat."], "richtig": 0, "erklaerung": "Die Sätze werden durch „daß“ und „und“ immer weiter verlängert, ohne Punkt zum Atemholen. Die Form spiegelt den Inhalt: Die Maus hetzt durch ihr Leben in die Enge."}, {"typ": "wahl", "frage": "Welche Wirkung hat das Ende „sagte die Katze und fraß sie“?", "optionen": ["Nach der langen Rede wirkt das knappe Ende schockierend und nimmt jede Hoffnung auf einen Ausweg.", "Das Ende wirkt beruhigend, weil sich die Lage der Maus endlich klärt und alles gut ausgeht.", "Das Ende ist eine ausführliche Moral, die erklärt, was die Leserinnen und Leser lernen sollen.", "Das Ende ist lustig gemeint, weil

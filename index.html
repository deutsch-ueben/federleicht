er immer neuen Besucherrekorden.\n\nDie Gründe liegen auf der Hand: Der weltweite Tourismus wächst seit Jahren, doch die Zahl der Reiseziele bleibt gleich. Vor allem aus China reisen immer mehr Menschen, und Billigflüge sowie Vermietplattformen wie Airbnb machen kurze Städtetrips so einfach wie nie. Hinzu kommt, dass sich der Ansturm sehr ungleich verteilt: Laut dem Bericht entfallen 60 Prozent des Wachstums auf nur zwanzig Länder. Die Folgen: Altstadtbewohner werden verdrängt, Sehenswürdigkeiten und Natur leiden.\n\nEinige Orte ziehen nun die Notbremse. Dubrovnik will höchstens 8000 Besucher pro Tag in die Altstadt lassen, Thailand sperrt den Maya Beach für Touristen, und Barcelona stoppt den Bau neuer Hotels. Auch die Unternehmensberatung McKinsey hat inzwischen eine Grenze berechnet, ab der das Gedränge für Bewohner und Gäste unzumutbar wird. Diese Maßnahmen sind richtig, denn ohne Grenzen zerstört der Tourismus genau das, was Reisende eigentlich sehen wollen.\n\nDie Präsidentin des World Travel & Tourism Council, Gloria Guevara, betont zwar, zum Tourismus gebe es keine Alternative, und Kritiker wenden ein, dass Obergrenzen der Wirtschaft schaden, schließlich sichert der Tourismus unzählige Arbeitsplätze. Doch dieses Argument greift zu kurz: Eine Stadt, die nur noch Kulisse ist, verliert auf Dauer auch ihre Gäste. Klug wären zusätzlich Reservierungssysteme und eine längere Saison, damit sich die Besuche besser verteilen.\n\nReisen bildet – aber nur, wenn noch etwas zu entdecken bleibt. Statt Rekorde zu feiern, sollten Städte und Reisende endlich auf Qualität statt Masse setzen."}];
const SCHREIBAUFGABEN = [{"id": "sa_textanalyse", "ts": "textanalyse", "aufgabentitel": "Textanalyse: Kommentar „Rettet die Langeweile!“", "titel": "Rettet die Langeweile!", "quelle": "kommentar", "autor": "Miriam Eder", "medium": "Talblick Zeitung", "datum": "9. Oktober 2026", "thema": "die Frage, warum Langeweile wertvoll ist und warum man nicht jede freie Minute mit dem Handy füllen sollte", "text": "Sonntagnachmittag, Bushaltestelle, sieben Minuten bis zum nächsten Bus. Was tun wir? Starren wir in den Himmel? Beobachten wir die Leute? Denken wir über das Leben nach? Natürlich nicht. Wir zücken das Handy, noch bevor wir uns richtig hingesetzt haben. Sieben Minuten Leerlauf – das hält heute kaum jemand mehr aus.\n\nDie Langeweile ist zum Staatsfeind Nummer eins geworden. Wir bekämpfen sie mit Kurzvideos, mit Spielen, mit Nachrichten, die niemand wirklich lesen will. Kein Wartezimmer ohne Bildschirm, keine Autofahrt ohne Tablet auf der Rückbank, kein Spaziergang ohne Kopfhörer. Wer sich heute noch langweilt, so scheint es, hat einfach den Akku nicht geladen.\n\nNun könnte man einwenden: Was ist so schlimm daran? Niemand vermisst die endlosen Nachmittage, an denen der Regen gegen die Fensterscheibe trommelte und im Fernsehen nur Wiederholungen liefen. Das stimmt. Langeweile fühlt sich unangenehm an, und kein vernünftiger Mensch sucht sie freiwillig.\n\nDoch genau darin liegt ihr Wert. Langeweile ist kein leerer Raum, sondern eine Werkstatt. Wenn von außen nichts kommt, beginnt das Gehirn, selbst etwas herzustellen: Ideen, Pläne, Tagträume. Eine Befragung des Instituts für Freizeitforschung Hügelland unter 800 Jugendlichen hat ergeben, dass zwei Drittel ihre besten Einfälle „beim Nichtstun“ haben – im Bus, unter der Dusche, kurz vor dem Einschlafen. Ausgerechnet dort also, wo das Handy am schnellsten griffbereit ist.\n\nWer jede freie Minute füllt, nimmt sich diese Chance. Er lebt im Dauerempfang und wundert sich, warum ihm nichts Eigenes mehr einfällt. Er konsumiert fremde Geschichten und vergisst, seine eigene zu erzählen. Er lacht über Videos, deren Inhalt er eine Stunde später nicht mehr kennt. Ein toller Tausch, wirklich: Kreativität gegen Katzenvideos.\n\nDabei verlangt niemand, das Handy in den nächsten Teich zu werfen. Es reicht, die kleinen Lücken im Alltag wieder als Lücken zu akzeptieren. Sieben Minuten an der Bushaltestelle sind kein Notfall. Sie sind ein Geschenk – vielleicht das einzige an diesem Tag, das nicht um unsere Aufmerksamkeit bettelt.\n\nAlso: Lasst das Handy beim nächsten Warten in der Tasche. Schaut aus dem Fenster. Haltet die Stille aus. Wer weiß, vielleicht fällt euch dabei etwas ein, das euch kein Algorithmus der Welt vorschlagen kann.", "anlass": "", "aufgabe": "Im Rahmen eines Medienprojekts untersucht deine Klasse, wie Kommentare ihre Leserinnen und Leser überzeugen wollen.\n\nLies den Kommentar „Rettet die Langeweile!“ von Miriam Eder, erschienen in der Talblick Zeitung am 9. Oktober 2026.\n\nVerfasse eine Textanalyse. Bearbeite dabei folgende Arbeitsaufträge:\n– Fasse den Inhalt des Kommentars kurz zusammen.\n– Analysiere den Aufbau und die Argumentationsstrategie der Autorin.\n– Untersuche die sprachlichen Mittel und erläutere ihre Wirkung auf die Leserschaft.\n\nSchreib zwischen 405 und 495 Wörter.", "wmin": 405, "wmax": 495, "erfunden": true}, {"id": "sa_textinterpretation", "ts": "textinterpretation", "aufgabentitel": "Textinterpretation: Franz Kafka, „Gibs auf!“", "titel": "Gibs auf!", "quelle": "parabel", "autor": "Franz Kafka", "medium": "", "datum": "1936", "thema": "einen Mann, der in einer fremden Stadt den Weg zum Bahnhof sucht und von einem Schutzmann keine Hilfe bekommt", "text": "Es war sehr früh am Morgen, die Straßen rein und leer, ich ging zum Bahnhof. Als ich eine Turmuhr mit meiner Uhr verglich, sah ich, daß es schon viel später war, als ich geglaubt hatte, ich mußte mich sehr beeilen, der Schrecken über diese Entdeckung ließ mich im Weg unsicher werden, ich kannte mich in dieser Stadt noch nicht sehr gut aus, glücklicherweise war ein Schutzmann in der Nähe, ich lief zu ihm und fragte ihn atemlos nach dem Weg. Er lächelte und sagte: „Von mir willst du den Weg erfahren?“ „Ja“, sagte ich, „da ich ihn selbst nicht finden kann.“ „Gibs auf, gibs auf“, sagte er und wandte sich mit einem großen Schwunge ab, so wie Leute, die mit ihrem Lachen allein sein wollen.", "anlass": "", "aufgabe": "Eure Schülerzeitung startet die Reihe „Kurz, aber rätselhaft“, in der sehr kurze literarische Texte vorgestellt und gedeutet werden. Du übernimmst den ersten Beitrag.\n\nLies die Parabel „Gibs auf!“ von Franz Kafka. Der Text ist in der ursprünglichen Rechtschreibung abgedruckt („daß“, „mußte“).\n\nVerfasse eine Textinterpretation. Bearbeite dabei folgende Arbeitsaufträge:\n– Fasse den Inhalt der Parabel kurz zusammen.\n– Analysiere die Erzählperspektive, den Satzbau und das Verhalten des Schutzmanns und deute ihre Wirkung.\n– Entwickle eine Interpretationshypothese und beurteile, ob die Aussage des Textes heute noch aktuell ist.\n\nSchreib zwischen 405 und 495 Wörter.", "wmin": 405, "wmax": 495, "erfunden": false}, {"id": "sa_grafikanalyse", "ts": "grafikanalyse", "aufgabentitel": "Grafikanalyse: Wofür Jugendliche ihr Geld ausgeben", "titel": "Wofür Jugendliche ihr Geld ausgeben", "quelle": "", "autor": "", "medium": "Jugendbarometer Alpenland", "datum": "15. Oktober 2026", "thema": "die Frage, wofür Jugendliche in Österreich ihr Geld ausgeben", "text": "Das erfundene Institut „Jugendbarometer Alpenland“ hat im September 2026 insgesamt 1.200 Jugendliche zwischen 14 und 18 Jahren in ganz Österreich online befragt. Die Frage lautete: „Wofür gibst du dein Taschengeld oder dein selbst verdientes Geld hauptsächlich aus?“ Die Ergebnisse wurden am 15. Oktober 2026 veröffentlicht.", "anlass": "", "aufgabe": "Die Schülerzeitung deiner Schule plant eine Ausgabe zum Thema „Geld und Konsum“. Du sollst dafür eine aktuelle Umfrage auswerten.\n\nSieh dir die Grafik „Wofür Jugendliche ihr Geld ausgeben“ genau an und lies die Angaben zur Umfrage.\n\nVerfasse eine Grafikanalyse. Bearbeite dabei folgende Arbeitsaufträge:\n– Beschreibe die Grafik und gib die wichtigsten Ergebnisse wieder.\n– Vergleiche auffällige Werte miteinander und erläutere, was dabei besonders hervorsticht.\n– Erkläre mögliche Ursachen für die Ergebnisse und nimm Stellung zur Frage, ob Jugendliche mit ihrem Geld vernünftig umgehen.\n\nSchreib zwischen 270 und 330 Wörter.", "wmin": 270, "wmax": 330, "erfunden": true, "diagramm": {"einheit": " %", "werte": [["Essen und Getränke unterwegs", 64], ["Kleidung und Schuhe", 52], ["Handy, Apps und Spiele", 41], ["Ausgehen, Kino und Konzerte", 33], ["Sparen für größere Wünsche", 29], ["Fahrten und Mobilität", 18], ["Bücher und Zeitschriften", 8]], "hinweis": "Angaben in Prozent der Befragten, Mehrfachnennungen möglich"}}, {"id": "sa_textanalyse_literarisch", "ts": "textanalyse_literarisch", "aufgabentitel": "Analyse einer Kurzgeschichte: „Haltegriff“", "titel": "Haltegriff", "quelle": "kurzgeschichte", "autor": "Clemens Wallner", "medium": "Kurz vor Schluss. Geschichten aus dem Alltag", "datum": "2025", "thema": "eine Übungsfahrt, bei der sich das Verhältnis zwischen einer Jugendlichen und ihrem Vater verändert", "text": "Ihr Vater hielt sich am Griff über der Beifahrertür fest, als würde der Wagen gleich abheben. Dabei fuhr Jana gerade einmal dreißig.\n\n„Kupplung“, sagte er.\n\n„Weiß ich.“\n\n„Dann tritt sie auch.“\n\nSie trat die Kupplung, schaltete in den zweiten Gang, und der Motor hörte auf, wie ein beleidigter Hund zu knurren. Ihr Vater sagte nichts. Er sagte nie etwas, wenn etwas gelang. Er sagte nur etwas, wenn etwas schiefging, und dann sagte er es zweimal.\n\nSeit drei Monaten machten sie jeden Samstag dieselbe Übungsfahrt: aus der Siedlung hinaus, an der Tankstelle vorbei, die lange Gerade entlang bis zum Kreisverkehr und wieder zurück. Achthundert Kilometer fehlten ihr noch bis zur Prüfung. Achthundert Kilometer neben einem Mann, der in den Fußraum bremste, obwohl dort kein Pedal war.\n\n„Blinker“, sagte er.\n\n„Hab ich schon gesetzt.“\n\n„Zu spät.“\n\nJana biss die Zähne zusammen. Im Rückspiegel sah sie den Kindersitz, der noch immer auf der Rückbank festgeschnallt war, obwohl ihr kleiner Bruder längst keinen mehr brauchte. Niemand hatte ihn ausgebaut. In dieser Familie baute niemand etwas aus. Man ließ die Dinge einfach, wo sie waren.\n\nDie Ampel bei der Volksschule sprang auf Grün. Jana fuhr an, langsam, ordentlich, genau so, wie er es ihr hundertmal erklärt hatte. Da schoss von rechts ein Radfahrer aus der Seitengasse, ohne Licht, ohne Helm, die Kapuze tief im Gesicht.\n\nSie trat auf die Bremse. Der Gurt schnitt ihr in die Schulter. Die Wasserflasche rollte unter den Sitz. Der Radfahrer schlingerte, fing sich und drehte sich nicht einmal um. Dann war er weg, und es war still im Auto, so still, dass Jana ihren eigenen Atem hörte.\n\nSie wartete darauf, dass er „Siehst du?“ sagte. Sie wartete auf sein „Ich hab’s dir ja gesagt“, zweimal, wie immer. Es kam nicht.\n\nAls sie zur Seite sah, hatte ihr Vater den Haltegriff losgelassen. Seine Hand lag auf seinem Knie, und sie zitterte. Nicht stark, nur ein wenig, so wie Opas Hände gezittert hatten, im letzten Winter, als er die Zeitung nicht mehr halten konnte.\n\n„Papa?“\n\nEr räusperte sich. Er sah geradeaus, durch die Windschutzscheibe, auf die leere Kreuzung.\n\n„Gut gebremst“, sagte er leise.\n\nHinter ihnen hupte jemand. Jana wollte den Motor abstellen, aussteigen und den Platz tauschen, so wie sonst, wenn etwas schiefgegangen war. Sie griff schon nach dem Gurtschloss.\n\n„Nein“, sagte ihr Vater. „Fahr weiter.“\n\nSie legte den ersten Gang ein. Die Kupplung kam ruhig, der Wagen rollte über die Kreuzung. Ihr Vater hielt sich nicht mehr fest. Er hatte die Hände in den Schoß gelegt und sah aus dem Seitenfenster, als gäbe es draußen etwas, das er sich genau merken müsste.\n\nBis zum Kreisverkehr sagte er kein Wort. Jana setzte den Blinker rechtzeitig. Sie wusste nicht, ob er es bemerkte.", "anlass": "", "aufgabe": "Für die Literaturseite der Schülerzeitung sollst du eine aktuelle Kurzgeschichte analysieren.\n\nLies die Kurzgeschichte „Haltegriff“ von Clemens Wallner aus der Anthologie „Kurz vor Schluss. Geschichten aus dem Alltag“ (2025).\n\nVerfasse eine Analyse der Kurzgeschichte. Bearbeite dabei folgende Arbeitsaufträge:\n– Fasse den Inhalt kurz zusammen und weise nach, dass es sich um eine Kurzgeschichte handelt.\n– Analysiere die Erzählperspektive, die Figuren und die Zeitgestaltung.\n– Untersuche die sprachliche Gestaltung und erläutere, welche Bedeutung der Titel für die Aussage des Textes hat.\n\nSchreib zwischen 405 und 495 Wörter.", "wmin": 405, "wmax": 495, "erfunden": true}, {"id": "sa_textvergleich", "ts": "textvergleich", "aufgabentitel": "Textvergleich: Pflicht-Sozialjahr für alle?", "titel": "Ein Jahr für die anderen", "quelle": "kommentar", "autor": "Herbert Lindner", "medium": "Tagesecho Musterstadt", "datum": "3. Oktober 2026", "thema": "die Frage, ob ein verpflichtendes Sozialjahr für alle jungen Menschen eingeführt werden soll", "text": "Österreich diskutiert wieder einmal über ein verpflichtendes Sozialjahr für alle jungen Menschen – und wieder einmal droht die Debatte im Sand zu verlaufen. Das wäre ein Fehler. Ein solches Jahr würde nicht nur Pflegeheimen und Rettungsdiensten helfen, sondern vor allem den Jugendlichen selbst.\n\nZunächst zu den Fakten: Laut einer Erhebung des Sozialforschungsinstituts Donautal fehlen in Pflege und Betreuung schon jetzt Tausende Arbeitskräfte, und der Bedarf wird in den nächsten zehn Jahren weiter steigen. Ein Sozialjahr kann diese Lücke nicht schließen, aber es kann sie verkleinern. Außerdem bringt es junge Menschen in Berufe, an die viele sonst nie gedacht hätten.\n\nWichtiger noch ist ein zweites Argument. Wer zwölf Monate lang alten Menschen vorliest, Kinder betreut oder im Rettungswagen mitfährt, lernt etwas, das kein Lehrplan vermitteln kann: Verantwortung für andere. Zivildiener berichten seit Jahrzehnten, dass diese Zeit sie geprägt habe. Warum sollte diese Erfahrung nur jungen Männern vorbehalten sein?\n\nNatürlich lässt sich einwenden, dass Pflicht und Freiwilligkeit schlecht zusammenpassen. Doch auch die Schulpflicht fragt nicht, ob jemand Lust auf Mathematik hat, und niemand würde sie deshalb abschaffen. Entscheidend ist, dass das Sozialjahr fair bezahlt wird, dass es Wahlmöglichkeiten gibt und dass es für Ausbildung oder Studium angerechnet wird.\n\nEine Gesellschaft, die immer älter wird, braucht Menschen, die anpacken. Ein gemeinsames Jahr für alle wäre ein Signal: Zusammenhalt ist keine Privatsache. Die Politik sollte den Mut haben, dieses Signal zu senden.\n\nTEXT 2: Zwangsbeglückung mit Ansage (Selina Moser, Jugendmagazin „Funkenflug“, 10. Oktober 2026)\n\nGute Nachrichten, liebe Generation Z: Man hat endlich eine Aufgabe für euch gefunden! Nach Matura oder Lehrabschluss sollt ihr ein Jahr lang Betten machen, Essen austeilen und Rollstühle schieben. Pflichtprogramm. Für alle. Natürlich nur zu eurem Besten.\n\nDie Idee klingt edel. Sie stammt allerdings meist von Leuten, deren eigene Jugend längst hinter ihnen liegt. Dieselben Erwachsenen, die uns vorwerfen, wir seien faul, wollen uns jetzt zum Helfen verpflichten. Spannend. Wer Engagement erzwingt, bekommt keine Begeisterung, sondern Dienst nach Vorschrift.\n\nUnd was ist mit den Pflegekräften, die heute schon am Limit arbeiten? Sollen sie nebenbei auch noch Hunderte ungelernte Neulinge einschulen? Pflege ist ein anspruchsvoller Beruf, kein Ferialjob für Unentschlossene. Wer die Personalnot wirklich lösen will, muss die Löhne erhöhen und die Arbeitsbedingungen verbessern. Das kostet Geld. Ein Pflichtjahr für Jugendliche ist billiger – und darum geht es wohl.\n\nDabei engagieren sich schon jetzt viele junge Menschen freiwillig: bei der Feuerwehr, im Sportverein, in der Nachhilfe, beim Rettungsdienst. Laut einer Umfrage des Jugendforums Alpenland ist fast ein Drittel der Jugendlichen ehrenamtlich tätig. Niemand hat sie dazu gezwungen. Vielleicht sollte man genau diese Menschen fördern, statt allen anderen ein Jahr ihres Lebens wegzunehmen.\n\nAlso, liebe Politik: Danke für das Angebot. Wir helfen gern. Aber wir lassen uns nicht abkommandieren.", "anlass": "", "aufgabe": "In deiner Klasse wird über ein verpflichtendes Sozialjahr für alle jungen Menschen diskutiert. Zur Vorbereitung sollst du zwei Meinungstexte zu diesem Thema vergleichen.\n\nLies den Kommentar „Ein Jahr für die anderen“ von Herbert Lindner (Tagesecho Musterstadt, 3. Oktober 2026) und die Glosse „Zwangsbeglückung mit Ansage“ von Selina Moser (Jugendmagazin „Funkenflug“, 10. Oktober 2026).\n\nVerfasse einen Textvergleich. Bearbeite dabei folgende Arbeitsaufträge:\n– Gib die Positionen der beiden Texte kurz wieder.\n– Vergleiche die Argumentation und die sprachliche Gestaltung der beiden Texte.\n– Erläutere, wie die Unterschiede mit Medium und Zielgruppe zusammenhängen, und beurteile, welcher Text seine Leserschaft eher überzeugen kann.\n\nSchreib zwischen 540 und 660 Wörter.", "wmin": 540, "wmax": 660, "erfunden": true}, {"id": "sa_filmanalyse", "ts": "filmanalyse", "aufgabentitel": "Filmanalyse: Eine Schlüsselszene unter der Lupe", "titel": "", "quelle": "", "autor": "", "medium": "", "datum": "", "thema": "eine selbst gewählte Schlüsselszene aus einem Spielfilm und ihre filmische Gestaltung", "text": "", "anlass": "", "aufgabe": "Für den Filmblog deiner Schule sollst du zeigen, wie ein Film mit filmischen Mitteln Spannung, Gefühle oder Bedeutung erzeugt.\n\nWähle eine Schlüsselszene (etwa zwei bis fünf Minuten) aus einem Spielfilm, den ihr im Unterricht gesehen habt, oder aus einem Spielfilm deiner Wahl. Sieh dir die Szene mehrmals genau an und mach dir Notizen mit Zeitangaben.\n\nVerfasse eine Filmanalyse. Bearbeite dabei folgende Arbeitsaufträge:\n– Stelle den Film mit seinen Grunddaten vor und fasse die Handlung der gewählten Szene kurz zusammen.\n– Analysiere die Einstellungsgrößen, die Kameraperspektive, Ton und Musik sowie den Schnitt und erläutere ihre Wirkung.\n– Erkläre, welche Bedeutung die Szene für den gesamten Film hat, und beurteile, ob die filmische Gestaltung gelungen ist.\n\nSchreib zwischen 405 und 495 Wörter.", "wmin": 405, "wmax": 495, "erfunden": true}, {"id": "sa_eroerterung", "ts": "eroerterung", "aufgabentitel": "Erörterung: Vier-Tage-Schulwoche", "titel": "Freitag frei: Wird die Schulwoche kürzer?", "quelle": "artikel", "autor": "Miriam Stadlober", "medium": "Rundschau Hügelland", "datum": "3. Februar 2026", "thema": "die Frage, ob an Schulen eine Vier-Tage-Woche eingeführt werden soll", "text": "Montag bis Donnerstag lernen, am Freitag frei haben: Was nach dem Traum vieler Jugendlicher klingt, könnte bald Wirklichkeit werden. Mehrere Schülervertretungen der Region haben vorgeschlagen, an einigen Oberstufen einen Schulversuch mit einer Vier-Tage-Woche zu starten. Die Zahl der Unterrichtsstunden soll dabei gleich bleiben, sie würde nur auf vier längere Schultage verteilt. Seit der Vorschlag bekannt ist, wird in Klassenzimmern, Elternvereinen und am Küchentisch heftig diskutiert.\n\nDie Befürworterinnen und Befürworter verweisen vor allem auf die Belastung der Jugendlichen. Laut einer Online-Umfrage des Instituts für Jugendfragen Hügelland unter 600 Schülerinnen und Schülern zwischen 15 und 18 Jahren fühlen sich 64 Prozent am Ende einer Schulwoche „völlig ausgelaugt“. „Mit einem freien Tag könnte ich den Stoff in Ruhe wiederholen, statt am Sonntagabend alles in mich hineinzustopfen“, sagt Schulsprecherin Johanna Pichler (17). Außerdem bliebe mehr Zeit für Praktika, Vereine, ehrenamtliches Engagement oder einen Nebenjob, mit dem man erste Berufserfahrung sammeln kann.\n\nAuch der Bildungsforscher Gernot Lechner sieht Chancen. Er verweist auf Schulen im Ausland, die das Modell bereits erprobt haben. Dort sei die Zahl der Fehlstunden gesunken, und viele Lehrkräfte hätten berichtet, dass sie ausgeruhter in die neue Woche starten. Gemeinden und Schulerhalter rechnen zudem mit Einsparungen: Ein Schultag weniger bedeutet weniger Heizkosten, weniger Strom und weniger Fahrten mit dem Schulbus.\n\nDie Kritikerinnen und Kritiker halten dagegen, dass vier lange Tage die Jugendlichen eher zusätzlich belasten würden. Wer bis 17 Uhr in der Schule sitzt, hat am Abend kaum noch Kraft zum Lernen. „Wer in der neunten oder zehnten Stunde noch Mathematik hat, nimmt kaum noch etwas auf“, warnt die Lernpsychologin Karin Wallner. Sie befürchtet, dass am Ende nicht weniger Stress entsteht, sondern nur ein anderer.\n\nSkeptisch zeigen sich auch viele Eltern. Gerade in ländlichen Gegenden fahren die Busse am späten Nachmittag seltener, manche Jugendliche wären erst gegen 18 Uhr zu Hause. Martin Huber, Personalvertreter der Lehrerinnen und Lehrer, gibt außerdem zu bedenken, dass sich Schularbeiten, Tests und Sprechstunden auf weniger Tage drängen würden. Und die Umfrage enthält einen Wert, der den Befürwortern weniger gefallen dürfte: 41 Prozent der Befragten gaben an, den freien Freitag vor allem zum Ausschlafen nutzen zu wollen, nur 23 Prozent zum Lernen.\n\nDie Bildungsdirektion will sich noch nicht festlegen. Man prüfe den Vorschlag sorgfältig, heißt es auf Anfrage, eine Entscheidung über einen Schulversuch solle bis zum Herbst fallen. Schulsprecherin Pichler gibt sich jedenfalls kämpferisch: „Wir wollen nicht weniger Schule, sondern eine bessere Woche.“", "anlass": "", "aufgabe": "An deiner Schule wird darüber diskutiert, ob man sich für einen Schulversuch mit einer Vier-Tage-Woche bewerben soll. Für die Schülerzeitung sollst du das Für und Wider sachlich abwägen.\nLies den Artikel „Freitag frei: Wird die Schulwoche kürzer?“ von Miriam Stadlober, erschienen am 3. Februar 2026 in der Rundschau Hügelland.\nVerfasse nun eine textgebundene Erörterung. Bearbeite dabei folgende Arbeitsaufträge:\n– Gib die Argumente für und gegen eine Vier-Tage-Schulwoche wieder, die im Artikel genannt werden.\n– Erörtere diese Argumente und ergänze sie durch eigene Argumente und Beispiele.\n– Beurteile abschließend, ob eine Vier-Tage-Woche für Schülerinnen und Schüler der Oberstufe sinnvoll wäre.\nSchreib zwischen 405 und 495 Wörter.", "wmin": 405, "wmax": 495, "erfunden": true}, {"id": "sa_kommentar", "ts": "kommentar", "aufgabentitel": "Kommentar: Smartwatch-Verbot bei Schularbeiten", "titel": "Smartwatches müssen bei Schularbeiten draußen bleiben", "quelle": "bericht", "autor": "Tobias Reisinger", "medium": "Stadtbote Seewalden", "datum": "22. September 2026", "thema": "das Verbot von Smartwatches bei Schularbeiten", "text": "Wer an den drei höheren Schulen in Seewalden eine Schularbeit schreibt, muss seit Beginn des Schuljahres nicht nur das Handy, sondern auch die Smartwatch abgeben. Uhren und Fitnessarmbänder kommen vor der Prüfung in eine beschriftete Box am Lehrertisch und werden erst nach der Abgabe wieder ausgehändigt. Die drei Direktionen haben die Regel gemeinsam beschlossen.\n\nAuslöser war ein Vorfall im vergangenen Juni. Bei einer Englischschularbeit fiel einer Lehrerin auf, dass mehrere Schüler ungewöhnlich oft auf ihr Handgelenk blickten. Auf den Uhren waren Vokabellisten und fertige Textbausteine gespeichert, eine Uhr hatte sogar eine App, die Fragen an eine künstliche Intelligenz weiterleitet. „Wer schummelt, nimmt den Ehrlichen etwas weg“, sagt Direktorin Elisabeth Moser. „Faire Prüfungen sind wir allen schuldig, die ehrlich lernen.“\n\nDass es sich nicht um Einzelfälle handelt, zeigt eine Umfrage der Schülervertretung unter 300 Jugendlichen der drei Schulen: 38 Prozent gaben an, jemanden zu kennen, der schon einmal mit einer Smartwatch geschummelt hat. Viele Lehrkräfte begrüßen die neue Regelung deshalb. Es sei kaum möglich, während einer Schularbeit 25 Handgelenke gleichzeitig im Blick zu behalten, heißt es aus dem Lehrerzimmer.\n\nGanz so einfach ist die Sache allerdings nicht. Schulsprecher David Novak (17) hält die Regel für übertrieben: „Wir werden behandelt, als wären wir alle Betrüger. Die meisten tragen die Uhr einfach, weil sie wissen wollen, wie viel Zeit ihnen noch bleibt.“ Tatsächlich hängt in vielen Klassen keine Wanduhr. Einige Eltern sorgen sich außerdem um die teuren Geräte: Wer haftet, wenn eine Uhr aus der Box verschwindet oder zu Boden fällt?\n\nHeikel ist auch die Frage der Ausnahmen. Manche Jugendliche mit Diabetes lesen ihre Blutzuckerwerte über die Uhr ab, andere überwachen damit ihren Puls. Für sie gelten nach Vorlage eines ärztlichen Attests Sonderregeln. Kritiker befürchten jedoch, dass so neue Schlupflöcher entstehen.\n\nEin Mathematiklehrer, der namentlich nicht genannt werden möchte, schlägt einen anderen Weg vor: „Statt immer neue Geräte zu verbieten, sollten wir Aufgaben stellen, bei denen man mit abgeschriebenen Lösungen nicht weiterkommt.“ Die Direktionen wollen die Regel nach dem ersten Semester überprüfen. Bis dahin gilt: Die Uhr bleibt in der Box.", "anlass": "", "aufgabe": "Die Schülerzeitung deiner Schule hat eine Rubrik mit dem Namen „Klartext“, in der Kommentare zu aktuellen Schulthemen erscheinen. Auch an deiner Schule wird überlegt, Smartwatches bei Schularbeiten zu verbieten.\nLies den Bericht „Smartwatches müssen bei Schularbeiten draußen bleiben“ von Tobias Reisinger, erschienen am 22. September 2026 in der Zeitung „Stadtbote Seewalden“.\nVerfasse nun einen Kommentar mit einem aussagekräftigen Titel für die Rubrik „Klartext“. Bearbeite dabei folgende Arbeitsaufträge:\n– Gib die neue Regelung und die Gründe dafür kurz wieder.\n– Setze dich mit den Einwänden der Kritikerinnen und Kritiker auseinander.\n– Bewerte, ob ein Smartwatch-Verbot der richtige Weg zu fairen Schularbeiten ist.\nSchreib zwischen 270 und 330 Wörter.", "wmin": 270, "wmax": 330, "erfunden": true}, {"id": "sa_leserbrief", "ts": "leserbrief", "aufgabentitel": "Leserbrief: Essen im Müll der Schulmensa", "titel": "Volle Teller, volle Tonnen", "quelle": "bericht", "autor": "Sabine Kronberger", "medium": "Tagblatt Lärchental", "datum": "8. Oktober 2026", "thema": "die Lebensmittelverschwendung in einer Schulmensa und Vorschläge, wie man sie verringern könnte", "text": "Schnitzel mit Reis, Gemüselaibchen, Kaiserschmarren: Das Essen in der Mensa des Schulzentrums Lärchental ist abwechslungsreich. Trotzdem landet ein großer Teil davon im Müll. Das hat eine Umweltgruppe der Schule herausgefunden, die zwei Wochen lang jeden Tag die Essensreste abgewogen hat. Das Ergebnis: Im Durchschnitt wurden täglich 35 Kilogramm Lebensmittel weggeworfen. Aufs ganze Schuljahr gerechnet sind das mehr als sechs Tonnen.\n\nDie Gründe dafür sind vielfältig. Alle Portionen sind gleich groß, egal, ob jemand großen Hunger hat oder nur eine Kleinigkeit essen möchte. Außerdem muss man sich eine Woche im Voraus anmelden. Wer krank ist oder an einem Wandertag teilnimmt und vergisst, sich abzumelden, lässt eine fertige Portion zurück. In einer Befragung der Umweltgruppe gaben 52 Prozent der 420 befragten Schülerinnen und Schüler an, mindestens einmal pro Woche mehr als die Hälfte ihres Essens übrig zu lassen. Der häufigste Grund: „Es hat mir nicht geschmeckt.“\n\nDie Jugendlichen haben deshalb Vorschläge ausgearbeitet. Es soll eine kleine und eine große Portion zur Auswahl geben, Nachschlag soll kostenlos sein. Abmelden soll man sich bis 8 Uhr am selben Tag per App können. Ein Mensa-Rat aus Schülerinnen und Schülern soll beim Speiseplan mitreden. Unberührte Speisen könnten an einen Sozialmarkt gehen. „Wir wollen niemandem etwas wegnehmen, sondern einfach weniger wegwerfen“, erklärt Lea Hörmann (16) von der Umweltgruppe.\n\nNicht alle sind begeistert. Der Pächter der Mensa, Herbert Fuchs, gibt zu bedenken, dass zwei Portionsgrößen und kurzfristige Abmeldungen mehr Personal und mehr Planung erfordern. „Dann wird das Essen teurer, und darüber beschweren sich dann wieder die Eltern“, sagt er. Derzeit kostet ein Mittagessen 5,20 Euro. Auch die Weitergabe an einen Sozialmarkt sei schwierig, weil strenge Hygienevorschriften gelten.\n\nEin Teil des Elternvereins fordert eine andere Lösung: Wer sein Essen nicht abholt, soll eine Gebühr von einem Euro zahlen. Andere Eltern halten das für unfair. Wenn das Essen nicht schmecke, liege das Problem nicht bei den Kindern, sondern in der Küche, meint eine Mutter.\n\nDie Schulleitung will die Vorschläge im November mit allen Beteiligten besprechen. Bis dahin wiegt die Umweltgruppe weiter – und hängt die Zahlen jede Woche im Eingangsbereich aus.", "anlass": "", "aufgabe": "Im Tagblatt Lärchental ist ein Bericht über weggeworfenes Essen in einer Schulmensa erschienen. Auch an deiner Schule bleibt beim Mittagessen oft viel übrig.\nLies den Bericht „Volle Teller, volle Tonnen“ von Sabine Kronberger, erschienen am 8. Oktober 2026 im Tagblatt Lärchental.\nVerfasse nun einen Leserbrief an die Redaktion des Tagblatts Lärchental. Bearbeite dabei folgende Arbeitsaufträge:\n– Gib die Ursachen der Lebensmittelverschwendung, die im Bericht genannt werden, kurz wieder.\n– Beurteile die Vorschläge der Umweltgruppe und die Einwände dagegen.\n– Appelliere an die Leserinnen und Leser, sich für weniger Lebensmittelverschwendung an Schulen einzusetzen.\nSchreib zwischen 270 und 330 Wörter.", "wmin": 270, "wmax": 330, "erfunden": true}, {"id": "sa_meinungsrede", "ts": "meinungsrede", "aufgabentitel": "Meinungsrede: Schulbeginn um 9 Uhr?", "titel": "Später Schulbeginn – endlich ausgeschlafen?", "quelle": "interview", "autor": "Nina Aigner", "medium": "Jugendmagazin Querblick", "datum": "5. März 2026", "thema": "die Frage, ob der Unterricht an Oberstufen erst um 9 Uhr beginnen soll", "text": "Der Wecker läutet um sechs, der Bus fährt um halb sieben, um 7.45 Uhr beginnt die erste Stunde: Für viele Jugendliche ist das ganz normaler Alltag. Nun schlagen mehrere Schülervertretungen vor, den Unterricht an Oberstufen erst um 9 Uhr beginnen zu lassen. Querblick hat darüber mit der Schlafforscherin Verena Lindner und mit Thomas Eder, dem Direktor einer Oberstufenschule, gesprochen.\n\nQuerblick: Frau Lindner, warum sollen Jugendliche später mit der Schule beginnen?\n\nLindner: Weil sich ihre innere Uhr in der Pubertät verschiebt. Jugendliche werden am Abend später müde, brauchen aber trotzdem etwa acht bis neun Stunden Schlaf. Wer um elf einschläft und um sechs aufsteht, ist auf Dauer übermüdet. Das hat nichts mit Faulheit zu tun, das ist Biologie.\n\nQuerblick: Herr Eder, Sie sind skeptisch. Warum?\n\nEder: Ich verstehe das Anliegen. Aber wenn der Unterricht eine Stunde später beginnt, endet er auch eine Stunde später. Wer Nachmittagsunterricht hat, wäre dann bis halb sechs in der Schule. Für Sport, Musik oder einen Nebenjob bliebe weniger Zeit. Und ich fürchte, dass viele am Abend einfach noch länger aufbleiben würden.\n\nQuerblick: Laut einer Befragung des Forschungsbüros Schlafwerk unter 800 Jugendlichen schlafen 16- bis 18-Jährige an Schultagen im Durchschnitt nur sechs Stunden und 40 Minuten. 71 Prozent gaben an, in der ersten Stunde oft unkonzentriert zu sein.\n\nLindner: Diese Zahlen decken sich mit meiner Erfahrung. Müdigkeit wirkt sich auf die Noten, auf die Laune und sogar auf die Sicherheit im Straßenverkehr aus. An Schulen im Ausland, die umgestellt haben, waren die Jugendlichen danach aufmerksamer, und es gab weniger Verspätungen. Dass sie einfach später schlafen gehen, hat sich dort nur zum Teil bestätigt.\n\nQuerblick: Was spricht aus Sicht der Schulen sonst noch dagegen?\n\nEder: Vor allem die Organisation. Auf dem Land sind die Schulbusse auf den bisherigen Beginn abgestimmt, und dieselben Busse bringen auch die Volksschulkinder. Viele Eltern beginnen früh zu arbeiten und möchten, dass ihre Kinder gemeinsam mit ihnen das Haus verlassen. Außerdem teilen sich Schulen ihre Turnsäle oft mit Vereinen, die am Abend trainieren.\n\nQuerblick: Gibt es einen Kompromiss?\n\nLindner: Man könnte klein anfangen. Die erste Stunde könnte zum Beispiel um 8.30 Uhr beginnen, oder es gibt eine Gleitzeit: Wer möchte, kommt früher und lernt in einem ruhigen Raum, der Unterricht beginnt später.\n\nEder: Mit einer Gleitzeit kann ich mich anfreunden. Wichtig ist, dass man das zuerst an einigen Schulen ausprobiert und genau auswertet, bevor man alles umstellt.\n\nQuerblick: Ein Schlusswort?\n\nEder: Ausgeschlafene Schülerinnen und Schüler wünschen wir uns alle. Aber eine spätere Uhrzeit allein macht noch keinen besseren Unterricht.\n\nLindner: Wer ausgeschlafen ist, lernt besser. So einfach ist das – und so schwierig umzusetzen.", "anlass": "", "aufgabe": "Am Tag der politischen Bildung findet an deiner Schule in der Aula eine Diskussionsveranstaltung zum Thema „Unterricht erst ab 9 Uhr?“ statt. Im Publikum sitzen deine Mitschülerinnen und Mitschüler, eure Lehrerinnen und Lehrer, die Direktorin und eine Abgeordnete zum Landtag. Du hältst als Vertreterin bzw. Vertreter deiner Klasse eine Rede.\nLies das Interview „Später Schulbeginn – endlich ausgeschlafen?“ von Nina Aigner, erschienen am 5. März 2026 im Jugendmagazin Querblick.\nVerfasse nun deine Meinungsrede. Bearbeite dabei folgende Arbeitsaufträge:\n– Gib den Vorschlag und die wichtigsten Argumente aus dem Interview für dein Publikum kurz wieder.\n– Nimm Stellung, ob der Unterricht an Oberstufen erst um 9 Uhr beginnen soll, und entkräfte dabei mindestens ein Gegenargument.\n– Appelliere an dein Publikum und schlag konkrete Schritte vor, wie es deine Position unterstützen kann.\nSchreib zwischen 405 und 495 Wörter.", "wmin": 405, "wmax": 495, "erfunden": true}, {"id": "sa_stellungnahme", "ts": "stellungnahme", "aufgabentitel": "Stellungnahme: Einheitliche Schulkleidung", "titel": "Ein Pulli für alle: Wie eine Schule mit einheitlicher Kleidung lebt", "quelle": "artikel", "autor": "Katharina Leitgeb", "medium": "Ahornstettner Wochenpost", "datum": "12. Mai 2026", "thema": "die Erfahrungen einer Schule mit einheitlicher Schulkleidung", "text": "Dunkelblauer Kapuzenpullover oder weißes Polo-Shirt, jeweils mit dem Schullogo: Seit einem Jahr tragen die rund 600 Schülerinnen und Schüler des Gymnasiums Ahornstetten einheitliche Schulkleidung. Hose oder Rock dürfen sie selbst wählen. Eingeführt wurde die Regel auf Wunsch des Elternvereins, nach einer Abstimmung im Schulgemeinschaftsausschuss. Nun zieht die Schule eine erste Bilanz.\n\nDirektor Andreas Pölzl ist zufrieden: „Früher gab es in den Pausen ständig Bemerkungen darüber, wer welche Marke trägt. Das ist deutlich weniger geworden.“ Eine Befragung der Schule unter 450 Jugendlichen scheint ihm recht zu geben: 46 Prozent gaben an, sich seit der Einführung weniger unter Druck zu fühlen, was ihr Aussehen betrifft. Auch das Gemeinschaftsgefühl sei gestiegen, etwa bei Sportfesten oder Ausflügen, bei denen man die eigene Gruppe sofort erkenne.\n\nFür viele Familien spielt außerdem das Geld eine Rolle. Ein Set aus zwei Polo-Shirts und einem Pullover kostet 85 Euro. „Das ist weniger, als mein Sohn früher für einen einzigen Markenpulli wollte“, erzählt eine Mutter. Manche Jugendliche schätzen auch die Zeitersparnis am Morgen: Die Frage, was man anziehen soll, stellt sich kaum noch.\n\nDoch es gibt auch Kritik. Für Familien mit drei oder vier Kindern ist die Anschaffung keine Kleinigkeit, zumal Kinder schnell wachsen. Der Elternverein hat daher einen Fonds eingerichtet, aus dem Familien mit wenig Geld unterstützt werden. Selina Rauscher (16) ärgert sich über etwas anderes: „Kleidung ist ein Teil meiner Persönlichkeit. Ich bin doch nicht mein Pulli.“ Sie fühlt sich in ihrer Freiheit eingeschränkt.\n\nAuch der Druck durch Marken ist nicht ganz verschwunden, sagen manche. Er habe sich nur verlagert – auf Schuhe, Jacken, Rucksäcke und Handys. Bei der Befragung gaben 39 Prozent an, dass sich für sie nichts verändert habe. 15 Prozent fühlen sich sogar schlechter, weil sie sich in der Schulkleidung nicht wohlfühlen.\n\nDie Schülervertretung kritisiert vor allem, wie die Regel zustande gekommen ist. „Wir wurden erst gefragt, als die Pullis schon bestellt waren“, sagt Schulsprecher Jonas Weber. Er fordert, dass die Regel nach zwei Jahren erneut zur Abstimmung kommt und dass die Jugendlichen dann gleichberechtigt mitentscheiden dürfen. Direktor Pölzl zeigt sich gesprächsbereit.", "anlass": "", "aufgabe": "Der Elternverein deiner Schule schlägt vor, ab dem nächsten Schuljahr einheitliche Schulkleidung einzuführen. Bevor der Schulgemeinschaftsausschuss darüber entscheidet, bittet die Schulleitung alle Klassen um schriftliche Stellungnahmen.\nLies den Artikel „Ein Pulli für alle: Wie eine Schule mit einheitlicher Kleidung lebt“ von Katharina Leitgeb, erschienen am 12. Mai 2026 in der Ahornstettner Wochenpost.\nVerfasse nun eine Stellungnahme mit einer passenden Überschrift an den Schulgemeinschaftsausschuss deiner Schule. Bearbeite dabei folgende Arbeitsaufträge:\n– Beschreibe kurz, welche Erfahrungen die Schule im Artikel mit einheitlicher Schulkleidung gemacht hat.\n– Nimm Stellung zum Vorschlag des Elternvereins und begründe deine Meinung mit mindestens drei Argumenten.\n– Empfiehl dem Schulgemeinschaftsausschuss, wie er entscheiden soll, und schlag vor, wie die Schülerinnen und Schüler in die Entscheidung einbezogen werden können.\nSchreib zwischen 270 und 330 Wörter.", "wmin": 270, "wmax": 330, "erfunden": true}, {"id": "sa_erlebniserzaehlung", "ts": "erlebniserzaehlung", "aufgabentitel": "Erlebniserzählung: Das hätte ich mir nie zugetraut", "titel": "", "quelle": "", "autor": "", "medium": "", "datum": "", "thema": "", "text": "", "anlass": "Jede und jeder kennt diesen Moment: Man steht vor etwas, das man sich eigentlich nicht zutraut – und dann tut man es doch. Das kann der Sprung vom Dreimeterbrett im Freibad sein, der erste Auftritt mit der Band, ein Telefonat auf Englisch im Ferienjob, die erste Nacht allein im Zelt oder der Augenblick, in dem du vor vielen Leuten etwas Wichtiges gesagt hast.\nReizwörter (du kannst sie verwenden, musst aber nicht): zitternde Knie – plötzliche Stille – ein Ruf von hinten – das Herz bis zum Hals – erleichtert", "aufgabe": "Die Schülerzeitung sammelt für ihre nächste Ausgabe Geschichten zum Thema „Das hätte ich mir nie zugetraut“. Die besten Beiträge werden abgedruckt.\nVerfasse eine Erlebniserzählung über ein einziges Erlebnis, bei dem du über dich hinausgewachsen bist. Bearbeite dabei folgende Arbeitsaufträge:\n– Beschreibe in der Einleitung knapp, wer beteiligt ist, wo und wann das Erlebnis stattfindet und warum du dir die Sache zunächst nicht zutraust.\n– Gestalte den Höhepunkt ausführlich und anschaulich, indem du die äußere Handlung mit deinen Gedanken, Gefühlen und Sinneseindrücken verknüpfst.\n– Stelle im Schluss knapp dar, wie du dich danach gefühlt hast und was dir das Erlebnis bedeutet.\nFinde eine kurze, treffende Überschrift und erzähle im Präteritum.\nSchreib zwischen 350 und 450 Wörter.", "wmin": 350, "wmax": 450, "erfunden": true}, {"id": "sa_fantasieerzaehlung", "ts": "fantasieerzaehlung", "aufgabentitel": "Fantasieerzählung: Linie 0 – Richtung Gestern", "titel": "", "quelle": "", "autor": "", "medium": "", "datum": "", "thema": "", "text": "", "anlass": "Ausgangssituation: Du wartest an einem grauen Novemberabend auf den letzten Bus nach Hause. Plötzlich erscheint auf der Anzeigetafel eine Linie, die es nicht gibt: „Linie 0 – Richtung Gestern“. Ein alter, dunkelgrüner Bus hält vor dir, die Tür öffnet sich mit einem Zischen, und der Fahrer nickt dir zu, als hätte er schon lange auf dich gewartet.\nReizwörter: ein Fahrschein aus Messing – dichter Nebel – eine vertraute Stimme – eine Uhr, die rückwärtsläuft – die letzte Station", "aufgabe": "Die Gemeindebücherei veranstaltet einen Schreibwettbewerb zum Motto „Zwischen den Welten“ und sucht dafür fantastische Geschichten.\nVerfasse eine Fantasieerzählung, die mit der beschriebenen Ausgangssituation beginnt. Bearbeite dabei folgende Arbeitsaufträge:\n– Gestalte den Übergang von der realistischen Ausgangssituation in die fantastische Welt fließend und nachvollziehbar.\n– Beschreibe die fantastische Welt und ihre Regeln so anschaulich, dass sich die Leserin bzw. der Leser darin auskennt, und steigere die Spannung bis zu einem Höhepunkt.\n– Gestalte eine Auflösung, die dich wieder an die Haltestelle zurückführt und erkennen lässt, was sich durch die Fahrt verändert hat.\nVerwende mindestens zwei der Reizwörter, gib deiner Geschichte eine Überschrift, die neugierig macht, und erzähle im Präteritum.\nSchreib zwischen 350 und 450 Wörter.", "wmin": 350, "wmax": 450, "erfunden": true}, {"id": "sa_nacherzaehlung", "ts": "nacherzaehlung", "aufgabentitel": "Nacherzählung: Der Duft des Bratens", "titel": "Der Duft des Bratens", "quelle": "erzaehlung", "autor": "Theresa Lindmayr", "medium": "Alte Geschichten neu erzählt", "datum": "2025", "thema": "einen armen Wanderer, der für den Duft eines Bratens bezahlen soll, und einen klugen Richter", "text": "In einem kleinen Marktflecken lebte vor langer Zeit ein Wirt, der im ganzen Tal für seinen Geiz bekannt war. Wer bei ihm einkehrte, bekam dünne Suppe und hartes Brot, musste aber zahlen wie in einem vornehmen Gasthof. Nur an Markttagen drehte sich in seiner Küche ein großer Schweinsbraten am Spieß, denn dann kamen die reichen Viehhändler.\n\nAn einem solchen Markttag setzte sich ein armer Wanderer auf die Bank vor dem Wirtshaus. Er hatte nichts als ein Stück trockenes Brot in der Tasche. Weil aus dem Küchenfenster der herrliche Duft des Bratens strömte, hielt er sein Brot in den Dampf, bis es warm und würzig roch. Dann aß er es langsam und zufrieden auf.\n\nDer Wirt hatte ihn vom Fenster aus beobachtet. Kaum war der letzte Bissen verschwunden, stürzte er hinaus und packte den Mann am Ärmel. „Du hast meinen Braten gerochen“, rief er, „und den Duft hast du mit deinem Brot gegessen. Dafür zahlst du mir drei Groschen!“ Der Wanderer erschrak, denn er besaß nur wenige Münzen. Als er sich weigerte zu zahlen, schleppte ihn der Wirt zum Richter, der an diesem Tag auf dem Marktplatz Gericht hielt.\n\nDer Richter hörte sich beide geduldig an. Dann fragte er den Wanderer, wie viel Geld er bei sich habe. Zögernd holte der Mann einen kleinen Lederbeutel hervor, in dem einige Kupfermünzen lagen. Der Richter nahm den Beutel, hielt ihn dicht an das Ohr des Wirtes und schüttelte ihn kräftig, sodass die Münzen hell klimperten.\n\n„Hast du das gehört?“, fragte er den Wirt. Dieser nickte verwirrt. „Gut“, sagte der Richter und gab dem Wanderer den Beutel zurück. „Dieser Mann hat den Duft deines Bratens genossen, und du hast den Klang seines Geldes genossen. Damit ist die Schuld beglichen.“\n\nDie Leute auf dem Marktplatz lachten laut. Der Wirt schlich mit hochrotem Kopf zurück in seine Küche, und der Wanderer setzte fröhlich seinen Weg fort.", "anlass": "", "aufgabe": "Bei einem Vorlesenachmittag in der Gemeindebücherei sollen Jugendliche Kindern alte Geschichten frei erzählen. Du übernimmst den Schwank „Der Duft des Bratens“.\nLies den Text „Der Duft des Bratens“ von Theresa Lindmayr.\nVerfasse eine Nacherzählung. Bearbeite dabei folgende Arbeitsaufträge:\n– Gib die Handlung vollständig und in der richtigen Reihenfolge mit allen wichtigen Personen, Orten und Ereignissen in eigenen Worten wieder.\n– Gestalte die Szene vor dem Richter lebendig, indem du wörtliche Rede einsetzt.\n– Gib den Ausgang so wieder, dass die Pointe für die Zuhörerinnen und Zuhörer verständlich wird.\nErzähle im Präteritum, schreib nicht ab und erfinde nichts dazu.\nSchreib zwischen 220 und 300 Wörter.", "wmin": 220, "wmax": 300, "erfunden": true}, {"id": "sa_bildgeschichte", "ts": "bildgeschichte", "aufgabentitel": "Bildgeschichte: Die Krähe im Park", "titel": "", "quelle": "", "autor": "", "medium": "", "datum": "", "thema": "", "text": "", "anlass": "Bild 1: Ein Park im Herbst. Ein Jugendlicher im Kapuzenpullover sitzt auf einer Bank und isst eine Wurstsemmel. Neben ihm liegt sein Handy. Auf einem Ast über ihm sitzt eine Krähe und schaut aufmerksam herunter.\nBild 2: Der Jugendliche wirft ein Stück Semmel auf den Weg. Die Krähe fliegt herab – aber nicht zur Semmel: Sie packt das Handy mit dem Schnabel.\nBild 3: Der Jugendliche rennt mit erschrockenem Gesicht hinter der Krähe her, die mit dem Handy davonfliegt. Im Hintergrund sucht eine ältere Dame neben einem Springbrunnen gebückt den Boden ab.\nBild 4: Die Krähe landet auf einem niedrigen Baum. In einer Astgabel liegt ein Nest voller glänzender Dinge: Kronkorken, ein Stück Alufolie, ein Schlüsselbund – und ein goldener Ring. Die Krähe legt das Handy dazu.\nBild 5: Der Jugendliche ist auf den Baum geklettert. Er steckt das Handy ein und hält erstaunt den Ring in der Hand. Die Krähe sitzt auf einem Ast daneben und krächzt.\nBild 6: Beim Springbrunnen: Die ältere Dame strahlt und drückt den Ring an ihre Brust. Sie und der Jugendliche sitzen nebeneinander auf der Bank und essen ein Eis. Die Krähe hockt auf der Lehne und pickt an einem Stück Waffel.", "aufgabe": "Ein Verlag sucht für ein Lesebuch Geschichten zu Bildfolgen ohne Text. Die Geschichten sollen auch für Leserinnen und Leser verständlich sein, die die Bilder nicht sehen.\nLies die Beschreibung der sechs Bilder genau.\nVerfasse eine Bildgeschichte. Bearbeite dabei folgende Arbeitsaufträge:\n– Gestalte eine Einleitung, in der du die Figuren mit Namen einführst und Ort und Zeit nennst.\n– Stelle dar, was zwischen den Bildern geschieht und was die Figuren denken, fühlen und sagen, sodass man die Geschichte auch ohne Bilder versteht.\n– Gestalte den Höhepunkt ausführlich und arbeite am Schluss die Pointe der Bildfolge heraus.\nVerwende mindestens zweimal wörtliche Rede, finde eine Überschrift, die neugierig macht, aber nicht zu viel verrät, und erzähle durchgehend im Präsens.\nSchreib zwischen 300 und 400 Wörter.", "wmin": 300, "wmax": 400, "erfunden": true}, {"id": "sa_fortsetzungsgeschichte", "ts": "fortsetzungsgeschichte", "aufgabentitel": "Fortsetzungsgeschichte: Nach Dienstschluss", "titel": "Nach Dienstschluss", "quelle": "erzaehlung", "autor": "Jakob Seidlhofer", "medium": "Nachtgeschichten. Eine Anthologie", "datum": "2025", "thema": "eine Jugendliche, die nach einem Klassenausflug versehentlich allein in einem Museum eingeschlossen wird", "text": "Als ich vom Waschraum zurückkam, war die Ausstellungshalle leer. Eben hatte unser Museumsführer noch vor dem riesigen Mammutskelett gestanden und von der letzten Eiszeit erzählt, jetzt hörte ich nur noch das Summen der Lüftung.\n\n„Hallo?“, rief ich. Meine Stimme hallte von der hohen Decke zurück. Niemand antwortete.\n\nIch zog mein Handy aus der Jackentasche. Der Akku zeigte zwei Prozent, und noch während ich die Nummer meiner Freundin Selin suchte, wurde der Bildschirm schwarz. Na großartig. Ich lief durch den Gang mit den ausgestopften Vögeln zum Haupteingang. Die schwere Glastür war verschlossen. Draußen auf dem Vorplatz brannten schon die Straßenlaternen, und der Parkplatz, auf dem vorhin noch unser Bus gestanden war, lag leer und nass im Regen.\n\nIch rüttelte an der Tür, klopfte gegen das Glas und schrie. Ein Auto fuhr vorbei, ohne zu bremsen. Über mir klickte etwas, dann gingen nacheinander die Deckenlampen aus, bis nur noch die grünen Schilder der Notausgänge leuchteten.\n\nNotausgang, dachte ich. Natürlich. Ich folgte den grünen Pfeilen zurück durch die Halle. Das Mammut warf einen gewaltigen Schatten an die Wand, und in den Vitrinen glänzten die Glasaugen der Tiere, als würden sie mich beobachten. Ich versuchte, nicht hinzusehen.\n\nDie Tür zum Notausgang lag am Ende eines schmalen Ganges. Ich hatte die Hand schon auf der Klinke, als ich es hörte: Schritte. Langsame, schlurfende Schritte, irgendwo hinter mir in der Halle. Dann ein leises Quietschen, wie von kleinen Rädern, die über den Steinboden rollten.\n\nIch hielt den Atem an. Ein Lichtkegel wanderte über die Wand, tastete sich an den Vitrinen entlang und kam näher.\n\n„Ist da jemand?“, fragte eine tiefe Stimme. Und dann, nach einer Pause, die mir endlos vorkam: „Lena? Bist du das?“", "anlass": "", "aufgabe": "In einer Anthologie für Jugendliche ist der folgende Geschichtenanfang erschienen. Die Leserinnen und Leser sind eingeladen, die Geschichte weiterzuschreiben.\nLies den Anfang der Erzählung „Nach Dienstschluss“ von Jakob Seidlhofer.\nVerfasse eine Fortsetzung der Geschichte. Bearbeite dabei folgende Arbeitsaufträge:\n– Gestalte die Fortsetzung so, dass sie nahtlos an die letzte Szene anschließt und den Figuren, dem Ort und den bisherigen Ereignissen nicht widerspricht.\n– Stelle dar, was die Ich-Erzählerin denkt und fühlt und wie sie auf die fremde Stimme reagiert.\n– Entwickle die Handlung mit einer Zuspitzung weiter und führe sie zu einem schlüssigen, abgerundeten Ende.\nBehalte die Ich-Form und das Präteritum der Vorlage bei.\nSchreib zwischen 300 und 400 Wörter.", "wmin": 300, "wmax": 400, "erfunden": true}, {"id": "sa_fabel", "ts": "fabel", "aufgabentitel": "Fabel: Ein Lehrsatz wird zur Geschichte", "titel": "", "quelle": "", "autor": "", "medium": "", "datum": "", "thema": "", "text": "", "anlass": "Wähle einen der folgenden Lehrsätze:\n1. Hochmut kommt vor dem Fall.\n2. Wer anderen eine Grube gräbt, fällt selbst hinein.\n3. Gemeinsam erreicht man mehr als allein.\nMögliche Tiere: der eitle Pfau, der fleißige Biber, die diebische Elster, der träge Dachs, die kluge Eule, der prahlerische Hahn, die flinke Eidechse – du kannst auch andere Tiere wählen.", "aufgabe": "Die Stadtbücherei veranstaltet einen Fabelwettbewerb: Gesucht sind neue Fabeln, die einen bekannten Lehrsatz veranschaulichen.\nVerfasse eine Fabel zu einem der drei Lehrsätze. Bearbeite dabei folgende Arbeitsaufträge:\n– Gestalte eine Ausgangssituation mit zwei oder drei Tieren, die typische menschliche Eigenschaften verkörpern.\n– Stelle einen Konflikt zwischen den Tieren mit Rede und Gegenrede dar, der zu einer überraschenden Wendung führt.\n– Gestalte den Schluss so, dass die Handlung genau den gewählten Lehrsatz veranschaulicht, und formuliere die Lehre am Ende ausdrücklich.\nVerwende den gewählten Lehrsatz als Überschrift und erzähle im Präteritum.\nSchreib zwischen 300 und 350 Wörter.", "wmin": 300, "wmax": 350, "erfunden": true}, {"id": "sa_sage_schreiben", "ts": "sage_schreiben", "aufgabentitel": "Sage: Eine Tafel für den Sagenweg", "titel": "", "quelle": "", "autor": "", "medium": "", "datum": "", "thema": "", "text": "", "anlass": "Fast jede Gegend hat ihre Sagen: Sie erzählen, warum ein Felsen eine seltsame Form hat, warum eine Glocke nicht mehr läutet oder woher eine Gasse ihren Namen hat.\nWähle einen der folgenden (erfundenen) Orte:\n1. Der Krähenstein: ein schwarzer Felsen mitten im Wald, der aussieht wie ein Vogel mit ausgebreiteten Flügeln.\n2. Die Stille Brücke: eine alte Steinbrücke über einen Bach, auf der man angeblich kein Wort sprechen darf.\n3. Der Laternenweiher: ein kleiner Teich am Waldrand, über dem in Nebelnächten Lichter tanzen sollen.", "aufgabe": "Eine Gemeinde legt einen Sagenwanderweg an. An jeder Station soll eine Tafel mit einer Sage über diesen Ort stehen.\nVerfasse eine Sage zu einem der drei Orte. Bearbeite dabei folgende Arbeitsaufträge:\n– Beschreibe zu Beginn den Ort genau und nenne ungefähr die Zeit, in der die Sage spielt.\n– Gestalte eine Handlung, in der eine Figur einem übernatürlichen Wesen oder Ereignis begegnet und sich bewähren muss oder für ein Vergehen bestraft wird.\n– Erkläre am Schluss, was seither an diesem Ort zu sehen ist oder beachtet wird („Seither …“).\nErzähle im Präteritum und verwende anschauliche, auch schaurige Adjektive und Verben.\nSchreib zwischen 300 und 400 Wörter.", "wmin": 300, "wmax": 400, "erfunden": true}, {"id": "sa_krimi", "ts": "krimi", "aufgabentitel": "Kriminalgeschichte: Die verschwundene Flohmarktkassa", "titel": "", "quelle": "", "autor": "", "medium": "", "datum": "", "thema": "", "text": "", "anlass": "Ausgangslage: Im Jugendzentrum „Bahnhof 7“ findet am Samstag ein Flohmarkt statt. Die Einnahmen – rund 480 Euro – sollen dem Tierheim gespendet werden. Um 16 Uhr ist die Geldkassette verschwunden, die im Büro hinter der Theke stand. Die Bürotür war nur angelehnt.\nVerdächtige:\n– Marco (19) hilft an der Theke. Vor Kurzem hat er erzählt, dass er dringend Geld für den Führerschein braucht.\n– Frau Berger, die Leiterin des Jugendzentrums, hat als Einzige einen Schlüssel zur Kassette. Um halb vier war sie kurz weg, „um Wechselgeld zu holen“.\n– Ein unbekannter Mann mit grüner Kappe hat den ganzen Nachmittag alte Schallplatten durchgesehen, aber nichts gekauft.\nSpuren: Kuchenbrösel auf dem Bürotisch – ein abgerissener Kassenzettel – nasse Schuhabdrücke, obwohl es seit Mittag nicht mehr regnet – ein offenes Fenster zum Hinterhof\nErmittelt wird von einer bzw. einem 16-Jährigen, die bzw. der am Kuchenstand mithilft. Gib der Figur einen Namen.", "aufgabe": "Eine Jugendzeitschrift plant eine Krimi-Ausgabe und sucht dafür kurze Kriminalgeschichten von Jugendlichen.\nVerfasse eine Kriminalgeschichte mit der beschriebenen Ausgangslage. Bearbeite dabei folgende Arbeitsaufträge:\n– Gestalte die Ausgangssituation und die Entdeckung der Tat so, dass von Anfang an Spannung entsteht.\n– Stelle die Ermittlung dar: Deine Ermittlerin bzw. dein Ermittler befragt Verdächtige, überprüft Motive und Alibis und folgt mindestens einer falschen Spur.\n– Gestalte einen Höhepunkt und eine logische Auflösung, die sich aus den Spuren ergibt und keine Fragen offenlässt.\nVerwende mindestens drei der vorgegebenen Spuren, setze passende Fachbegriffe (z. B. Alibi, Motiv, Indiz) richtig ein und erzähle im Präteritum.\nSchreib zwischen 400 und 500 Wörter.", "wmin": 400, "wmax": 500, "erfunden": true}, {"id": "sa_perspektivenwechsel", "ts": "perspektivenwechsel", "aufgabentitel": "Perspektivenwechsel: Der Abend aus der Sicht des Vaters", "titel": "Abpfiff", "quelle": "kurzgeschichte", "autor": "Miriam Achleitner", "medium": "Kurz und gut. Geschichten aus dem Alltag", "datum": "2024", "thema": "einen Jugendlichen, der seiner Familie beim Abendessen mitteilt, dass er mit dem Fußball aufhört, und die Reaktion seines Vaters", "text": "Tobias wartete, bis seine Mutter die Schüssel mit den Erdäpfeln auf den Tisch gestellt hatte. Er hatte sich den Satz den ganzen Nachmittag lang vorgesagt, im Bus, unter der Dusche, vor dem Spiegel. Jetzt klebte er ihm am Gaumen.\n\n„Ich hör mit dem Fußball auf“, sagte er.\n\nSeine kleine Schwester Mia ließ die Gabel sinken. Die Mutter warf dem Vater einen schnellen Blick zu. Der Vater schnitt weiter an seinem Fleisch, ruhig und gleichmäßig, als hätte er nichts gehört.\n\n„Nach der Saison“, fügte Tobias hinzu. „Ich hab’s dem Trainer schon gesagt.“\n\nDas Messer blieb stehen. „Dem Trainer“, wiederholte der Vater. „Bevor du es uns sagst.“\n\nTobias spürte, wie ihm heiß wurde. Zehn Jahre lang war er jeden Dienstag und Donnerstag am Platz gestanden, im Regen, im Schnee, in der Hitze. Sein Vater hatte ihn mit sechs zum ersten Training gebracht, hatte später die Mannschaft der Zehnjährigen betreut und war bei jedem Auswärtsspiel am Spielfeldrand gestanden. Er hatte seinen Namen immer lauter gerufen als alle anderen Eltern. Im Vorzimmer hing noch das Foto vom Bezirksmeistertitel, auf dem sie beide in die Kamera grinsten, der Vater mit der Trillerpfeife um den Hals.\n\n„Ich will mehr Zeit für die Theatergruppe“, sagte Tobias. „Wir spielen im Frühling ein ganzes Stück. Ich hab eine Hauptrolle.“\n\n„Theater“, sagte der Vater. Nur dieses eine Wort.\n\nDann stand er auf, stellte seinen halb vollen Teller in die Abwasch und ging hinaus. Kurz darauf fiel die Tür zur Garage ins Schloss.\n\nNiemand sagte etwas. Mia schob eine Erbse von einer Seite des Tellers zur anderen. Die Mutter legte Tobias kurz die Hand auf den Arm. „Gib ihm ein bisschen Zeit“, sagte sie leise.\n\nTobias aß nichts mehr. In seinem Zimmer setzte er sich aufs Bett und starrte auf die Fußballschuhe neben dem Kasten, an deren Stollen noch der getrocknete Schlamm vom Sonntag klebte. Er hatte geahnt, dass es wehtun würde. Er hatte nicht gewusst, dass es sich anfühlen würde, als hätte er etwas kaputt gemacht, das gar nicht ihm gehörte.\n\nGegen zehn ging er hinunter, um sich ein Glas Wasser zu holen. Unter der Garagentür schimmerte ein Lichtstreifen. Tobias zögerte, dann öffnete er die Tür einen Spalt.\n\nSein Vater saß auf der Werkbank. Vor ihm lag ein alter, abgewetzter Lederball, den Tobias noch nie gesehen hatte. Der Vater drehte ihn langsam in den Händen.\n\n„Den hab ich mit sechzehn bekommen“, sagte er, ohne aufzusehen. „Von meinem Vater. Und dann ist er jeden Sonntag am Spielfeldrand gestanden und hat geschrien.“\n\nTobias blieb in der Tür stehen. Er wusste nicht, ob er hineingehen sollte.\n\n„Wann ist die Premiere?“, fragte der Vater.", "anlass": "", "aufgabe": "Eine Literaturzeitschrift für Jugendliche lädt dazu ein, Geschichten aus einem neuen Blickwinkel zu erzählen.\nLies die Kurzgeschichte „Abpfiff“ von Miriam Achleitner.\nVerfasse eine Erzählung aus der Sicht des Vaters. Bearbeite dabei folgende Arbeitsaufträge:\n– Gestalte den Abend in der Ich-Form aus der Sicht des Vaters, von Tobias’ Satz „Ich hör mit dem Fußball auf“ bis zu seiner eigenen Frage nach der Premiere.\n– Beschreibe, was der Vater in den einzelnen Momenten denkt und fühlt, auch während er allein in der Garage sitzt, und verwende dabei nur, was er selbst wissen und wahrnehmen kann.\n– Stelle dar, wie der Vater zu seiner Frage nach der Premiere findet.\nBleib bei den Ereignissen der Kurzgeschichte und erzähle durchgehend im Präteritum.\nSchreib zwischen 300 und 400 Wörter.", "wmin": 300, "wmax": 400, "erfunden": true}, {"id": "sa_innerer_monolog", "ts": "innerer_monolog", "aufgabentitel": "Innerer Monolog: Ein Foto in der Klassengruppe", "titel": "Andere Angabe", "quelle": "kurzgeschichte", "autor": "Florian Rabensteiner", "medium": "Kurz und gut. Geschichten aus dem Alltag", "datum": "2024", "thema": "einen Schüler, der am Abend vor einer Mathematikschularbeit ein Foto mit den angeblichen Lösungen zugeschickt bekommt", "text": "Um 21.47 Uhr vibrierte das Handy. Ben lag auf dem Bett, das Mathebuch aufgeschlagen auf dem Bauch, und starrte seit einer halben Stunde auf dieselbe Aufgabe, ohne zu verstehen, warum bei ihm etwas anderes herauskam als im Lösungsteil.\n\nDie Nachricht kam aus der Klassengruppe. Ein Foto, darunter drei Wörter von Kevin: „Morgen. Ihr wisst schon.“ Das Vorschaubild war verschwommen, aber man konnte das Logo der Schule erkennen und darunter eine Tabelle voller Zahlen.\n\nBen setzte sich auf. Das Mathebuch rutschte auf den Boden.\n\nIn der Gruppe ging es sofort los. Daumen nach oben, Flammen, ein „Ehrenmann“, dann von Hannah: „Lösch das sofort, bist du narrisch?“ Dann wieder Daumen. Ben scrollte hinauf und hinunter. Das Foto war noch da. Er musste es nur antippen.\n\nEr dachte an die letzte Schularbeit, an das Genügend mit dem roten Kreis darum. An den Sprechtag, an dem seine Mutter die ganze Zeit genickt und auf dem Heimweg kein Wort gesagt hatte. An die Nachhilfestunden, die sie bezahlte, obwohl sie selbst jeden Euro zweimal umdrehte.\n\nUm 22.10 Uhr schrieb ihm Can privat: „Hast du’s schon angeschaut?“\n\nBen antwortete nicht. Er legte das Handy mit dem Display nach unten auf den Schreibtisch, hob das Mathebuch auf und rechnete die Aufgabe noch einmal. Wieder falsch. Er drehte das Handy um. Drehte es wieder zurück.\n\nUm halb zwölf machte er das Licht aus. Er schlief schlecht.\n\nAm nächsten Morgen war es in der Klasse auffallend still. Die Mathematiklehrerin stellte ihre Tasche auf das Pult, sah lange in die Runde und legte dann einen Stapel Blätter vor sich hin.\n\n„Ich habe gehört, dass gestern Abend etwas herumgeschickt worden ist“, sagte sie. „Darum habe ich heute in der Früh eine neue Angabe geschrieben.“\n\nIrgendwo hinten stöhnte jemand. Kevin starrte auf seine Hände. Hannah lächelte nicht, aber sie sah erleichtert aus.\n\nDie Lehrerin ging durch die Reihen und teilte die Blätter aus. Bei Ben blieb sie kurz stehen, als wollte sie etwas sagen. Dann legte sie das Blatt mit der Schrift nach unten vor ihn hin und ging weiter.\n\nBen legte die Hand flach auf das Papier. Er spürte seinen Herzschlag bis in die Fingerspitzen.\n\n„Ihr könnt umdrehen“, sagte die Lehrerin.", "anlass": "", "aufgabe": "Für eine Lesung zum Thema „Entscheidungen“ sollen Jugendliche Kurzgeschichten um einen inneren Monolog ergänzen.\nLies die Kurzgeschichte „Andere Angabe“ von Florian Rabensteiner.\nVerfasse einen inneren Monolog von Ben. Er setzt um 22.10 Uhr ein, als Cans Nachricht kommt, und endet in dem Moment, in dem Ben das Licht ausmacht. Bearbeite dabei folgende Arbeitsaufträge:\n– Gestalte Bens Gedanken und Gefühle, ausgehend von Cans Nachricht und dem umgedrehten Handy auf dem Schreibtisch.\n– Stelle Bens inneren Konflikt dar, indem er abwägt, ob er das Foto öffnen soll, und sich dabei an die letzte Schularbeit und an seine Mutter erinnert.\n– Entwickle den Gedankengang bis zu einer Entscheidung, die zum weiteren Verlauf der Geschichte passt.\nVerwende die Ich-Form und das Präsens sowie typische Mittel der Gedankensprache (Fragen, Ausrufe, unvollständige Sätze). Ben weiß noch nicht, was am nächsten Morgen geschieht.\nSchreib zwischen 270 und 330 Wörter.", "wmin": 270, "wmax": 330, "erfunden": true}, {"id": "sa_kreatives_schreiben", "ts": "kreatives_schreiben", "aufgabentitel": "Kreatives Schreiben: Die Postkarte mit dem Leuchtturm", "titel": "", "quelle": "", "autor": "", "medium": "", "datum": "", "thema": "", "text": "", "anlass": "Anfangssatz: „Die Postkarte war fast vierzig Jahre unterwegs gewesen, und sie trug unsere Adresse.“\nSchlusssatz: „Seitdem schaue ich jeden Tag zweimal in den Postkasten.“\nDie Karte: Auf der Vorderseite ist ein verblasster Leuchtturm zu sehen. Auf der Rückseite stehen ein Datum aus dem Sommer 1987, ein Name, den in deiner Familie niemand kennt, und nur ein einziger Satz: „Ich komme zurück, wenn der Kirschbaum blüht.“", "aufgabe": "Die Jugendseite einer Regionalzeitung veranstaltet einen Schreibwettbewerb: Alle Geschichten beginnen mit demselben Satz und enden mit demselben Satz.\nVerfasse eine Geschichte mit dem vorgegebenen Anfangs- und Schlusssatz. Bearbeite dabei folgende Arbeitsaufträge:\n– Gestalte eine stimmige Handlung, die vom Anfangssatz ausgeht, die Postkarte und ihren rätselhaften Satz einbezieht und logisch zum Schlusssatz hinführt.\n– Beschreibe Orte, Figuren und Stimmungen anschaulich mit Sinneseindrücken, Gedanken und Gefühlen.\n– Entwirf eine eigene, originelle Erklärung, wer die Karte geschrieben hat und was es mit ihr auf sich hat.\nGib der Geschichte einen passenden Titel und erzähle in der Ich-Form im Präteritum; nur der vorgegebene Schlusssatz steht im Präsens.\nSchreib zwischen 300 und 350 Wörter.", "wmin": 300, "wmax": 350, "erfunden": true}, {"id": "sa_texttransformation", "ts": "texttransformation", "aufgabentitel": "Texttransformation: Von der Zeitungsmeldung zum Tagebucheintrag", "titel": "Erschöpfte Brieftaube landet mitten in der Turnstunde", "quelle": "bericht", "autor": "Paul Wimmleitner", "medium": "Tagesecho Musterstadt", "datum": "17. September 2026", "thema": "eine erschöpfte Brieftaube, die auf einem Sportplatz gelandet ist und von Jugendlichen versorgt wurde", "text": "Musterstadt. Eine ungewöhnliche Turnstunde erlebten am Dienstag die Schülerinnen und Schüler einer vierten Klasse einer Musterstädter Mittelschule. Mitten in einem Staffellauf landete eine völlig erschöpfte Taube auf der Laufbahn des Sportplatzes und blieb dort regungslos sitzen.\n\nDie 14-jährige Jana P. bemerkte als Erste, dass der Vogel einen kleinen blauen Ring am Bein trug. „Zuerst haben wir geglaubt, die Taube ist verletzt. Sie hat sich überhaupt nicht bewegt, auch als wir ganz nah bei ihr waren“, erzählte die Schülerin. Gemeinsam mit ihrem Sportlehrer setzte sie das Tier vorsichtig in einen Schuhkarton und stellte ihn in den Schatten. Ein Mitschüler holte eine Schale Wasser aus der Schulküche. An einen Staffellauf war danach nicht mehr zu denken: Die ganze Klasse saß im Kreis um den Karton und beobachtete gespannt, wie die Taube nach einer Weile zu trinken begann.\n\nÜber die Nummer auf dem Ring konnte der örtliche Brieftaubenverein den Besitzer ausfindig machen: einen Züchter aus Norddeutschland. Die Taube war am Sonntag bei einem Wettflug gestartet und hatte wegen eines Unwetters offenbar die Orientierung verloren. Bis Musterstadt hatte sie rund 700 Kilometer zurückgelegt. Noch am selben Nachmittag holte ein Vereinsmitglied den Vogel beim Sportplatz ab.\n\n„Das kommt bei schlechtem Wetter immer wieder vor“, erklärte der Obmann des Vereins. „Die Tiere brauchen dann vor allem Ruhe, Wasser und Körner. Nach ein, zwei Tagen sind sie meistens wieder fit.“\n\nDie Taube, die von den Jugendlichen den Namen „Turbo“ bekam, durfte sich bis Donnerstag im Taubenschlag des Vereins erholen. Danach trat sie in einem Transportkorb die Heimreise an – mit einem Brief der Klasse im Gepäck. Der Züchter hat bereits angekündigt, sich mit einem Foto von Turbo aus dem heimischen Taubenschlag zu bedanken.", "anlass": "", "aufgabe": "Stell dir vor, du bist Jana P. aus der Zeitungsmeldung. Am Donnerstagabend, nachdem Turbo die Heimreise angetreten hat, schreibst du in dein Tagebuch, was in diesen Tagen geschehen ist.\nLies die Meldung „Erschöpfte Brieftaube landet mitten in der Turnstunde“ von Paul Wimmleitner, erschienen am 17. September 2026 im „Tagesecho Musterstadt“.\nVerfasse einen Tagebucheintrag (Zieltextsorte). Bearbeite dabei folgende Arbeitsaufträge:\n– Gib alle wesentlichen Ereignisse der Meldung aus Janas Sicht in einer sinnvollen Reihenfolge wieder, ohne etwas zu erfinden, was der Meldung widerspricht.\n– Beschreibe Janas Gefühle und Gedanken beim Fund der Taube, bei der Nachricht über den Besitzer und beim Abschied von Turbo.\n– Gestalte die typischen Merkmale eines Tagebucheintrags: Datum, Ich-Form, persönlicher, vertrauter Ton, eventuell eine Anrede an das Tagebuch.\nBleib in der Standardsprache und verwende keine Abkürzungen und Emojis.\nSchreib zwischen 250 und 330 Wörter.", "wmin": 250, "wmax": 330, "erfunden": true}, {"id": "sa_autobiografisches_schreiben", "ts": "autobiografisches_schreiben", "aufgabentitel": "Autobiografisches Schreiben: Ein Ort meiner Kindheit", "titel": "", "quelle": "", "autor": "", "medium": "", "datum": "", "thema": "", "text": "", "anlass": "Denk an einen Ort, der in deiner Kindheit wichtig für dich war: die Küche deiner Großeltern, ein Baumhaus, das Freibad, der Hof vor dem Wohnhaus, ein Platz am Bach, der Rücksitz im Auto auf der langen Fahrt in den Urlaub … Schließ kurz die Augen: Was siehst, hörst, riechst und spürst du dort?\nImpulsfragen: Wie sieht der Ort genau aus? Wer ist dort? Was ist dort einmal geschehen? Warum ist er dir bis heute wichtig – oder was ist von ihm geblieben?", "aufgabe": "Ein Literaturhaus plant eine Ausstellung zum Thema „Orte, die bleiben“ und sammelt dafür kurze Texte von Jugendlichen über einen Ort ihrer Kindheit.\nVerfasse einen autobiografischen Text über einen Ort deiner Erinnerung. Bearbeite dabei folgende Arbeitsaufträge:\n– Beschreibe den Ort mit allen Sinnen so lebendig, dass man ihn vor sich sieht, hört und riecht.\n– Gestalte eine kleine Begebenheit, die sich an diesem Ort abgespielt hat.\n– Stelle dar, welche Gefühle und Gedanken der Ort heute in dir weckt und warum er dir wichtig ist.\nVerwende die Ich-Form und bleib durchgehend im Präsens.\nSchreib zwischen 300 und 350 Wörter.", "wmin": 300, "wmax": 350, "erfunden": true}, {"id": "sa_medienbiografie", "ts": "medienbiografie", "aufgabentitel": "Medienbiografie: Mit Medien aufwachsen", "titel": "", "quelle": "", "autor": "", "medium": "", "datum": "", "thema": "", "text": "", "anlass": "Erinnere dich an deinen Weg mit Medien: das erste Bilderbuch oder Hörspiel, die Lieblingssendung im Kinderprogramm, das erste Videospiel, das erste eigene Handy, die App, die du ständig benutzt hast, die Serie, die du an einem Wochenende durchgeschaut hast …\nLebensabschnitte als Hilfe: Kleinkind – Kindergarten – Volksschule – Mittelschule bzw. Unterstufe – heute", "aufgabe": "Die Bücherei deines Ortes gestaltet eine Ausstellung zum Thema „Mit Medien aufwachsen“ und sammelt dafür Medienbiografien von Jugendlichen.\nVerfasse deine Medienbiografie. Bearbeite dabei folgende Arbeitsaufträge:\n– Stelle in zeitlicher Reihenfolge dar, welche Medien in den einzelnen Lebensabschnitten für dich wichtig waren.\n– Beschreibe zu jedem Abschnitt mindestens eine konkrete persönliche Erinnerung.\n– Vergleiche deine Mediennutzung früher und heute und beurteile in einem persönlichen Fazit, welche Medien dich am meisten geprägt haben.\nErzähle in der Ich-Form im Präteritum; nur für die heutige Situation und das Fazit verwendest du das Präsens.\nSchreib zwischen 300 und 350 Wörter.", "wmin": 300, "wmax": 350, "erfunden": true}, {"id": "sa_zusammenfassung", "ts": "zusammenfassung", "aufgabentitel": "Zusammenfassung: Repair-Cafés", "titel": "Schraubenzieher statt Mistkübel", "quelle": "bericht", "autor": "Lena Hofbauer", "medium": "Tagesecho Musterstadt", "datum": "3. Oktober 2026", "thema": "die wachsende Beliebtheit eines Repair-Cafés, in dem Freiwillige gemeinsam mit den Besitzerinnen und Besitzern kaputte Gegenstände reparieren", "text": "Samstagvormittag im Pfarrsaal von Musterstadt: An sechs Tischen beugen sich Menschen über aufgeschraubte Toaster, Stehlampen und Kopfhörer. Es riecht nach Lötzinn und Kaffee. Seit dem Frühjahr öffnet hier einmal im Monat das Repair-Café „Zweite Chance“, und der Andrang wird von Mal zu Mal größer. Beim letzten Termin brachten die Besucherinnen und Besucher 74 defekte Gegenstände mit – so viele wie nie zuvor.\n\nGanz neu ist die Idee nicht. Das erste Repair-Café eröffnete 2009 in den Niederlanden, inzwischen gibt es solche Treffpunkte in vielen Ländern Europas. In Musterstadt brachte eine Gruppe von Pensionistinnen und Pensionisten den Stein ins Rollen: Sie wollten nicht länger zusehen, wie funktionstüchtige Dinge wegen einer Kleinigkeit im Sperrmüll landen. Die Pfarre stellte den Saal zur Verfügung, ein Elektrohändler spendete das erste Werkzeug.\n\nDas Prinzip ist einfach: Wer etwas Kaputtes besitzt, bringt es vorbei und repariert es gemeinsam mit einer der ehrenamtlichen Helferinnen oder einem der Helfer. Die Reparatur selbst ist gratis, Ersatzteile müssen bezahlt werden, über eine Spende für neues Werkzeug freut sich das Team. „Wir reparieren nicht für die Leute, sondern mit ihnen“, betont Organisatorin Martina Eder, die hauptberuflich als Elektrotechnikerin arbeitet. Wer einmal zusehe und mithelfe, traue sich beim nächsten Mal oft selbst etwas zu.\n\nLaut der Statistik, die das Team seit der Eröffnung führt, lassen sich rund sechs von zehn Gegenständen wieder in Gang bringen. Seit März habe man so knapp 300 Dinge vor dem Mistkübel bewahrt, rechnet Eder vor. Am häufigsten landen Kaffeemaschinen, Staubsauger und Handys auf den Tischen, aber auch Hosen mit gerissenen Nähten und Fahrräder mit quietschenden Bremsen. Scheitern die Freiwilligen, liegt das meistens an fehlenden Ersatzteilen oder an Geräten, die so verklebt sind, dass man sie nicht öffnen kann, ohne sie zu zerstören.\n\nDie Gründe für einen Besuch sind unterschiedlich. Eine Umfrage, die das Team im Sommer unter 120 Gästen durchgeführt hat, zeigt: Fast die Hälfte will vor allem Geld sparen, ein Drittel möchte weniger Müll verursachen. Viele hängen aber auch einfach an ihren Dingen. Der 81-jährige Karl Wimmer etwa kam mit dem Radio, das er zur Hochzeit geschenkt bekommen hatte. „Ein neues hätte ich mir leisten können, aber das wäre nicht dasselbe gewesen“, sagt er.\n\nAuffällig ist, dass immer mehr junge Menschen kommen – als Gäste und als Helfende. Der 17-jährige Jonas Reiter ist seit drei Monaten dabei und kümmert sich um Smartphones und Spielkonsolen. Das meiste habe er sich mit Videos im Internet selbst beigebracht, erzählt er. Im Repair-Café lerne er nun, auch schwierige Fehler Schritt für Schritt einzugrenzen. Seine Freundinnen und Freunde hätten sich anfangs gewundert, inzwischen brächten sie ihm ihre kaputten Geräte selbst vorbei.\n\nKritik üben die Freiwilligen an manchen Herstellern. Akkus seien oft fest eingebaut, Schrauben hätten ungewöhnliche Formen und Ersatzteile würden nur an Fachwerkstätten verkauft, beklagt Eder. Reparaturen würden so absichtlich erschwert. Das Team fordert deshalb, dass Geräte leichter zu öffnen sind und Ersatzteile mindestens zehn Jahre lang erhältlich bleiben.\n\nDer Erfolg bringt das Repair-Café allerdings an seine Grenzen. Zuletzt mussten manche Gäste bis zu zwei Stunden warten, einige gingen unverrichteter Dinge wieder nach Hause. Ab Jänner soll „Zweite Chance“ deshalb zweimal im Monat öffnen. Dafür sucht das Team weitere Freiwillige – vor allem Menschen, die nähen können oder sich mit Fahrrädern auskennen.", "anlass": "", "aufgabe": "Für die Nachhaltigkeitswoche an deiner Schule sammelt deine Klasse Informationen über Initiativen gegen die Wegwerfgesellschaft.\nLies den Bericht „Schraubenzieher statt Mistkübel“ von Lena Hofbauer, erschienen am 3. Oktober 2026 im Tagesecho Musterstadt.\nVerfasse nun eine Zusammenfassung. Bearbeite dabei folgende Arbeitsaufträge:\n– Gib wieder, wie das Repair-Café funktioniert und wie erfolgreich die Reparaturen sind.\n– Beschreibe, aus welchen Gründen Menschen das Repair-Café besuchen bzw. dort mithelfen.\n– Fasse zusammen, welche Probleme die Freiwilligen ansprechen und welche Pläne sie haben.\nSchreib zwischen 270 und 330 Wörter.", "wmin": 270, "wmax": 330, "erfunden": true}, {"id": "sa_inhaltsangabe", "ts": "inhaltsangabe", "aufgabentitel": "Inhaltsangabe: Kurzgeschichte „Kassa drei“", "titel": "Kassa drei", "quelle": "kurzgeschichte", "autor": "Paul Lindner", "medium": "Zwischen zwei Haltestellen", "datum": "2025", "thema": "eine Ferialpraktikantin an einer Supermarktkassa, deren vorschnelles Urteil über einen ungeduldigen Kunden durch dessen unerwartete Hilfsbereitschaft ins Wanken gerät", "text": "Der Mann mit der Lederjacke stellte seinen Korb so heftig auf das Förderband, dass die Bananen beinahe hinunterfielen. Ich sah nicht auf. Es war mein dritter Tag als Ferialpraktikantin, seit sieben Uhr früh saß ich an Kassa drei, und inzwischen hatte ich gelernt, dass man Leuten mit schlechter Laune besser nicht in die Augen schaut.\n\nVor ihm stand eine alte Frau in einem grauen Mantel. Sie legte ihre Sachen langsam auf das Band: ein Packerl Butter, Milch, Semmeln, eine Dose Katzenfutter, ein kleines Stück Bergkäse. Jedes Teil drehte sie so, dass der Strichcode nach oben zeigte, als wollte sie mir die Arbeit erleichtern.\n\n„Zwölf Euro neunzig“, sagte ich.\n\nSie öffnete ihre Geldbörse und begann zu zählen. Zuerst die Scheine, dann die Münzen, eine nach der anderen. Bei neun Euro vierzig hörte sie auf und zählte noch einmal. Hinter ihr seufzte der Mann mit der Lederjacke so laut, dass man es bestimmt auch an Kassa vier hörte.\n\n„Dann lasse ich den Käse da“, sagte die Frau leise.\n\nIch stornierte den Käse. Zehn Euro achtzig. Noch immer zu viel. Die Frau schob das Katzenfutter zur Seite und betrachtete es, als müsste sie sich von ihm verabschieden.\n\nMein Gesicht wurde heiß. In der Einschulung hatte man uns erklärt, wie man Falschgeld erkennt und dass man Zigaretten nur gegen Ausweis verkaufen darf. Was man tut, wenn jemandem das Geld für das Katzenfutter fehlt, hatte niemand gesagt. Ich dachte an den Zwanziger in meiner Jacke im Spind. Der Spind war im Keller, und die Schlange reichte schon bis zu den Kaugummis.\n\n„Geht das heute noch?“, fragte der Mann.\n\nIch hätte ihm gern etwas geantwortet. Etwas Scharfes, das ich mir am Abend noch oft vorsagen würde. Stattdessen sagte ich: „Einen Moment, bitte“, und hasste mich ein bisschen dafür.\n\nDa beugte er sich vor. Ich rechnete mit einer Beschwerde, mit dem Satz, den wir alle fürchteten: Ich möchte den Filialleiter sprechen. Doch er legte zwei Zwei-Euro-Münzen auf das Band, genau neben das Katzenfutter.\n\n„Der Kater kann ja nichts dafür“, sagte er. „Und der Käse auch nicht.“\n\nDie alte Frau sah ihn an, dann die Münzen, dann mich. „Das kann ich nicht annehmen.“\n\n„Doch“, sagte er. „Ich hab’s eilig. Das ist die schnellste Lösung.“\n\nIch scannte den Käse noch einmal. Der Scanner piepste, als wäre nichts gewesen. Die Frau packte alles in ihr Stoffsackerl, langsam und ordentlich, und bedankte sich zweimal. Der Mann nickte nur und sah auf sein Handy.\n\nAls er an der Reihe war, legte er eine Flasche Mineralwasser und eine Packung Taschentücher vor mich hin. Erst jetzt fiel mir auf, dass seine Augen gerötet waren.\n\n„Zwei Euro zehn“, sagte ich.\n\nEr zahlte passend und ging. An der Tür blieb er kurz stehen, als hätte er etwas vergessen. Dann verschwand er auf dem Parkplatz.\n\nDer nächste Kunde stellte seinen Korb auf das Band. Diesmal sah ich auf.", "anlass": "", "aufgabe": "Die Schulbibliothek stellt in einer Leseaktion Kurzgeschichten vor. Für die Infotafel neben dem Bücherregal sollst du eine davon vorstellen.\nLies die Kurzgeschichte „Kassa drei“ von Paul Lindner (2025).\nVerfasse eine Inhaltsangabe. Bearbeite dabei folgende Arbeitsaufträge:\n– Gib die Handlung in chronologischer Reihenfolge wieder und berücksichtige dabei, warum die Figuren so handeln.\n– Erläutere im Schluss die vermutliche Schreibabsicht des Autors und weise anhand der Textsortenmerkmale nach, dass es sich um eine Kurzgeschichte handelt.\n– Nimm im Schluss begründet Stellung, wie dir die Kurzgeschichte gefällt.\nSchreib zwischen 200 und 250 Wörter.", "wmin": 200, "wmax": 250, "erfunden": true}, {"id": "sa_exzerpt", "ts": "exzerpt", "aufgabentitel": "Exzerpt: Schlaf und Lernen", "titel": "Warum Jugendliche abends nicht müde werden", "quelle": "sachtext", "autor": "Miriam Kofler", "medium": "Wissensmagazin Hügelland", "datum": "April 2026", "thema": "die Frage, warum Jugendliche abends spät müde werden, welche Folgen Schlafmangel hat und was dagegen hilft", "text": "Es ist kurz nach Mitternacht, morgen steht eine Mathematikschularbeit an, und trotzdem ist an Schlaf nicht zu denken. Was viele Eltern für Faulheit oder Handysucht halten, hat zu einem großen Teil biologische Ursachen. Wer verstehen will, warum Jugendliche abends hellwach und morgens kaum ansprechbar sind, muss einen Blick auf die innere Uhr werfen.\n\nJeder Mensch besitzt einen sogenannten zirkadianen Rhythmus: eine innere Uhr, die in einem Takt von ungefähr 24 Stunden Körpertemperatur, Hormone und Müdigkeit steuert. Eine wichtige Rolle spielt dabei das Hormon Melatonin. Der Körper schüttet es aus, wenn es dunkel wird, und signalisiert damit, dass es Zeit zum Schlafen ist. In der Pubertät verschiebt sich dieser Rhythmus: Melatonin wird um ein bis zwei Stunden später freigesetzt als bei Kindern oder Erwachsenen. Viele Jugendliche werden deshalb erst gegen 23 Uhr oder noch später müde.\n\nGleichzeitig brauchen Jugendliche viel Schlaf – Fachleute empfehlen acht bis zehn Stunden pro Nacht. Tatsächlich erreichen das die wenigsten. Laut einer Befragung des Instituts für Jugendgesundheit Hügelland unter 900 Schülerinnen und Schülern zwischen 14 und 18 Jahren schlafen diese an Schultagen im Durchschnitt nur sechs Stunden und 50 Minuten. Am Wochenende holen sie Schlaf nach und stehen im Schnitt zweieinhalb Stunden später auf. Dieses ständige Hin und Her nennen Schlafforscherinnen und Schlafforscher „sozialen Jetlag“: Der Körper fühlt sich am Montag so, als wäre er übers Wochenende in eine andere Zeitzone gereist.\n\nVerstärkt wird das Problem durch Bildschirme. Das helle, bläuliche Licht von Handys, Tablets und Laptops kann die Ausschüttung von Melatonin bremsen. Noch stärker wirkt vermutlich der Inhalt: Spannende Serien, Spiele oder Chats halten das Gehirn auf Trab. In der Befragung gaben 61 Prozent der Jugendlichen an, das Handy noch im Bett zu benutzen; fast ein Viertel wird nachts zumindest gelegentlich von Benachrichtigungen geweckt.\n\nDie Folgen des Schlafmangels sind vielfältig. Wer zu wenig schläft, kann sich schlechter ko

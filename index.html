nzentrieren und reagiert langsamer – im Straßenverkehr kann das gefährlich werden. Außerdem leidet das Lernen: Im Schlaf verarbeitet das Gehirn, was es tagsüber aufgenommen hat, und überträgt es ins Langzeitgedächtnis. Fachleute sprechen von Gedächtniskonsolidierung. Fehlt dieser Schlaf, wird Gelerntes schneller wieder vergessen. Auch die Stimmung leidet: Übermüdete Jugendliche sind häufiger gereizt und anfälliger für Infekte.\n\nWas also tun? Schlafforschende raten zu regelmäßigen Schlafenszeiten, auch am Wochenende; ideal ist eine Abweichung von höchstens einer Stunde. Das Handy sollte etwa eine Stunde vor dem Schlafengehen weggelegt werden, am besten außerhalb des Schlafzimmers. Tageslicht am Morgen, etwa auf dem Schulweg, hilft der inneren Uhr, sich früher einzustellen. Manche Schulen haben außerdem den Unterrichtsbeginn nach hinten verschoben. Sie berichten von ausgeschlafeneren und aufmerksameren Schülerinnen und Schülern.", "anlass": "", "aufgabe": "Du bereitest ein Kurzreferat zur Frage „Warum schlafen Jugendliche so wenig – und was hilft dagegen?“ vor. Als Grundlage dient dir ein Sachtext aus einem Wissensmagazin.\nLies den Sachtext „Warum Jugendliche abends nicht müde werden“ von Miriam Kofler, erschienen im April 2026 im Wissensmagazin Hügelland (Heft 4/2026, S. 22–23).\nVerfasse ein Exzerpt, mit dem du dein Referat auch ohne den Originaltext vorbereiten kannst. Bearbeite dabei folgende Arbeitsaufträge:\n– Halte in Stichworten fest, welche biologischen und äußeren Ursachen der Text für den Schlafmangel Jugendlicher nennt.\n– Gib die Folgen von Schlafmangel stichwortartig wieder und erkläre die Fachbegriffe zirkadianer Rhythmus, Melatonin, sozialer Jetlag und Gedächtniskonsolidierung knapp.\n– Notiere die Empfehlungen gegen Schlafmangel, gliedere dein Exzerpt nach den Sinnabschnitten des Textes und gib die Quelle vollständig an.\nSchreib zwischen 120 und 180 Wörter.", "wmin": 120, "wmax": 180, "erfunden": true}, {"id": "sa_bericht", "ts": "bericht", "aufgabentitel": "Zeitungsbericht: Stillstand im Sessellift", "titel": "Notizen und Aussagen zum Stillstand der Moosalmbahn", "quelle": "", "autor": "", "medium": "", "datum": "7. Februar 2026", "thema": "einen Stromausfall, durch den 23 Wintersportlerinnen und Wintersportler mehrere Stunden in einem Sessellift festsaßen", "text": "Notizen der Lokalredaktion – Telefonat mit der Bergrettung und Gespräche vor Ort\n\nZeit und Ort: Samstag, 7. Februar 2026; Doppelsessellift „Moosalmbahn“ im Skigebiet Moosalm, Gemeinde Lärchenau\n\n10.42 Uhr: Stromausfall im ganzen Ortsteil Moosalm. Ursache laut Netzbetreiber: Nach starkem Schneefall in der Nacht ist ein Baum auf eine Stromleitung gestürzt.\n\nDer Lift bleibt stehen. Das Notstromaggregat springt nicht an – laut Betriebsleiter wegen eines Defekts an der Startbatterie.\n\n23 Personen sitzen in den Sesseln fest, der höchste Sessel hängt etwa 14 Meter über dem Boden; minus 9 Grad, leichter Wind.\n\n10.55 Uhr: Das Liftpersonal alarmiert die Bergrettung Lärchenau, später hilft die Bergrettung Tannberg mit; insgesamt 31 Einsatzkräfte.\n\nAb 11.40 Uhr: Bergung mit Seilen, jede Person wird einzeln aus ihrem Sessel abgeseilt. Um 14.15 Uhr ist die letzte Person am Boden.\n\nVerletzte: keine. Ein achtjähriges Mädchen und ein 67-jähriger Mann sind leicht unterkühlt und werden vom Rettungsdienst versorgt; der Mann wird zur Kontrolle ins Krankenhaus Hügelstadt gebracht.\n\nSophie K. (16), saß mit ihrer Freundin im Sessel: „Zuerst haben wir gelacht, wir dachten, das dauert zwei Minuten. Nach einer halben Stunde waren meine Zehen wie Eiszapfen, voll arg! Ich hab meiner Mama dann ein Selfie geschickt. Die Bergretter waren aber mega nett, einer hat uns sogar einen Witz erzählt, während er uns angeseilt hat.“\n\nBetriebsleiter Herbert Strasser (54): „Das Aggregat wird jede Woche getestet, zuletzt am Montag, da hat es einwandfrei funktioniert. Wir lassen jetzt die ganze Anlage von einem Sachverständigen überprüfen.“\n\nEinsatzleiter Andreas Pichler (41), Bergrettung Lärchenau: „So eine Bergung üben wir zweimal im Jahr. Die Leute haben super mitgearbeitet, niemand ist in Panik geraten.“\n\nEin Skilehrer, der seinen Namen nicht nennen will: „Der Lift ist eh schon die ganze Woche komisch gelaufen, das hat jeder gemerkt.“ Strasser bestreitet das: Es habe in dieser Woche keine Störungen gegeben.\n\nGerücht unter Gästen an der Schirmbar: Der Liftwart sei beim Stromausfall nicht an seinem Platz gewesen. Nicht bestätigt; Strasser dazu: „Unsinn.“\n\nStand am Nachmittag: Die übrigen Lifte fahren ab 15 Uhr wieder, die Moosalmbahn bleibt bis zur Prüfung gesperrt. Die Liftgesellschaft erstattet allen Betroffenen den Preis der Tageskarte (52 Euro). Die Polizei hat Erhebungen zur Ursache des Aggregatausfalls aufgenommen.", "anlass": "", "aufgabe": "Du arbeitest in den Ferien in der Lokalredaktion des Wochenblatts Hügelland. Die Redakteurin gibt dir ihre Notizen zu einem Zwischenfall im Skigebiet Moosalm und bittet dich um einen Bericht für die nächste Ausgabe.\nLies die Notizen und Aussagen zum Stillstand der Moosalmbahn.\nVerfasse einen Zeitungsbericht. Bearbeite dabei folgende Arbeitsaufträge:\n– Formuliere eine treffende Schlagzeile und fasse im Lead die wichtigsten Informationen (Wer? Was? Wo? Wann?) zusammen.\n– Stelle den Hergang in der richtigen zeitlichen Reihenfolge dar und gib die Aussagen der Beteiligten sachlich in indirekter Rede wieder.\n– Informiere abschließend über die Folgen und den Stand der Untersuchungen.\nSchreib zwischen 200 und 260 Wörter.", "wmin": 200, "wmax": 260, "erfunden": true}, {"id": "sa_reportage", "ts": "reportage", "aufgabentitel": "Reportage: Nachtschicht in der Backstube", "titel": "Beobachtungsnotizen, Zitate und Fakten aus der Bäckerei Brandl", "quelle": "", "autor": "", "medium": "", "datum": "23. Oktober 2026", "thema": "die nächtliche Arbeit in einer kleinen Familienbäckerei", "text": "Ort und Zeit: Bäckerei Brandl am Hauptplatz von Grünau an der Ache, Familienbetrieb in dritter Generation, gegründet 1958. Besuch in der Nacht von Donnerstag, 22., auf Freitag, 23. Oktober 2026, von 1 bis 6 Uhr.\n\nBeobachtungen:\n\n1.00 Uhr: Auf dem Hauptplatz ist es dunkel und still, nur aus dem Kellerfenster der Bäckerei fällt gelbes Licht. Schon auf der Straße riecht es nach Hefe.\n\nDie Backstube: etwa 40 Quadratmeter, weiß gefliest, 28 Grad warm. Mehlstaub hängt in der Luft und glitzert im Licht der Lampen. Der große Ofen brummt, die Teigmaschine rumpelt, ein Teigschaber kratzt über den Holztisch, im Radio läuft leise Schlagermusik.\n\nDie Bäckermeisterin formt zwei Semmeln gleichzeitig, eine in jeder Hand, ohne hinzusehen. Ihre Unterarme sind bis zu den Ellbogen voller Mehl.\n\n3.30 Uhr: Die ersten Bleche kommen aus dem Ofen. Beim Abkühlen knistert die Kruste leise.\n\n5.15 Uhr: Der Lieferwagen wird beladen, durch die offene Tür strömt kalte Luft herein.\n\n5.45 Uhr: Die erste Kundin klopft an die Tür, eine Briefträgerin.\n\nPersonen und Zitate:\n\nEva Brandl (52), Bäckermeisterin, führt den Betrieb seit 2004: „Wenn alle anderen schlafen, gehört der Ort uns. Das ist ein eigenes Gefühl, das würde ich nicht hergeben.“ – „Mein Wecker läutet um halb eins, seit zwanzig Jahren. Man gewöhnt sich nie ganz daran, aber man arrangiert sich.“ – über die knisternden Semmeln: „Hören Sie? Die Semmeln singen.“\n\nDominik Rauch (19), Bäcker, seit zwei Jahren im Betrieb: „Meine Freunde gehen am Freitag fort, ich geh um neun ins Bett. Dafür hab ich am Nachmittag frei, wenn die anderen noch arbeiten.“\n\nRenate Holzer, Briefträgerin, kauft jeden Tag zwei Mohnflesserl: „Ohne mein Flesserl fang ich den Tag nicht an.“\n\nFakten:\n\nTäglich etwa 1.800 Semmeln und 250 Brote, dazu Kipferl, Flesserl und Plundergebäck.\n\nDer Sauerteig für das Bauernbrot wird seit Jahrzehnten weitergeführt. Brandl: „Der ist älter als ich.“\n\nSechs Mitarbeitende, drei in der Backstube, drei im Verkauf.\n\nLaut Brandl gab es im Bezirk vor 30 Jahren noch 14 Bäckereien, heute sind es fünf. Konkurrenz “\n\nIm Trainingsspiel stand Selin in der Verteidigung. Einmal verlor sie den Ball, und die Stürmerin lief allein auf das Tor zu. Romana warf sich ihr entgegen, hielt den Schuss und blieb einen Moment auf dem nassen Kunstrasen liegen. Dann stand sie auf und schrie: „Wo warst du? Zurücklaufen! Immer!“ Selin spürte, wie ihre Ohren heiß wurden. Am liebsten wäre sie nach Hause gegangen.\n\nNach dem Training duschten die anderen schnell und verschwanden. Selin hatte ihre Trinkflasche am Spielfeldrand vergessen und kam als Letzte zur Kabine zurück. Die Tür war angelehnt. Drinnen saß Romana auf der Bank, noch in den verschwitzten Sachen, das Handy am Ohr.\n\n„Ja, Mama. Nein, ich hab nicht vergessen, dass ich Jakob abhole … Ja, ich koch dann was. Nudeln, ja. Leg dich hin, ich mach das schon.“ Ihre Stimme war leise, ganz anders als auf dem Platz. „Nein, mir geht’s gut. Wirklich. Ich räum nur noch schnell die Bälle weg.“\n\nSelin blieb im Gang stehen. Sie wusste nicht, ob sie hineingehen oder umdrehen sollte. Da sah Romana auf. Einen Moment lang schauten sie sich nur an.\n\n„Hast du das gehört?“, fragte Romana.\n\nSelin nickte.\n\nRomana steckte das Handy weg und begann, ihre Tasche zu packen. „Meine Mutter ist seit dem Sommer krank“, sagte sie, ohne aufzusehen. „Ich hol meinen kleinen Bruder vom Hort ab, dreimal in der Woche. Die anderen müssen das nicht wissen.“\n\n„Ich erzähl’s niemandem“, sagte Selin.\n\nRomana zog den Reißverschluss zu. Dann griff sie noch einmal in die Seitentasche, holte ein zusammengefaltetes Blatt heraus und hielt es Selin hin. Darauf waren mit Kugelschreiber kleine Kreise und Pfeile gezeichnet, darunter stand in ordentlicher Schrift: Laufwege Verteidigung – für Selin.\n\n„Hab ich gestern gemacht“, sagte Romana. „Du bist schnell. Du schaust nur zu viel auf den Ball.“\n\nSelin starrte auf das Blatt. „Warum schreist du dann so?“\n\nRomana zuckte mit den Schultern. „Auf dem Platz hört man sonst nichts.“ Sie warf sich die Tasche über die Schulter und ging zur Tür. Dort blieb sie kurz stehen. „Donnerstag. Halb sechs. Nicht 17.31.“\n\nDann war sie weg. Selin setzte sich auf die Bank und faltete das Blatt auseinander. Draußen warf jemand die Bälle in den Netzsack, einen nach dem anderen.", "anlass": "", "aufgabe": "In einem Leseprojekt stellt deine Klasse Figuren aus Kurzgeschichten vor, die man auf den ersten Blick leicht falsch einschätzt.\nLies die Kurzgeschichte „Halb sechs“ von Johanna Reisinger (2024).\nVerfasse eine Charakteristik der Figur Romana. Bearbeite dabei folgende Arbeitsaufträge:\n– Beschreibe Romanas äußeres Erscheinungsbild und ihr Verhalten gegenüber der Mannschaft.\n– Erläutere ihre Charaktereigenschaften und belege sie mit passenden Textstellen (direkt oder indirekt zitiert).\n– Beurteile Romana abschließend in einem begründeten Gesamturteil, in dem du ihre positiven und negativen Seiten abwägst.\nSchreib zwischen 270 und 330 Wörter.", "wmin": 270, "wmax": 330, "erfunden": true}];

  }

}

// Rhetorische Figur selbst einsetzen: eigene Version schreiben, automatische Prüfung (wo möglich), dann Lösungsvorschlag
function figurPruefen(art, t){
  const text = t.trim();
  if (art === "frage") return { ok: /\?/.test(text), hinweis: "Eine rhetorische Frage endet mit einem Fragezeichen." };
  if (art === "vergleich") return { ok: /(^|[^\p{L}])(wie|als)(?![\p{L}])/iu.test(text), hinweis: "Ein Vergleich braucht ein Vergleichswort: „wie“ oder „als“." };
  if (art === "anapher"){
    const teile = text.split(/[.!?;]+|\s[–—-]\s/).map(s=>s.trim()).filter(s=>woerter(s).length>=2);
    const anf = teile.map(s=>woerter(s).slice(0,1).join(" ").toLowerCase());
    const zaehl = {}; anf.forEach(w=>zaehl[w]=(zaehl[w]||0)+1);
    return { ok: Object.values(zaehl).some(n=>n>=2), hinweis: "Bei einer Anapher beginnen mindestens zwei Sätze oder Satzteile mit demselben Wort." };
  }
  if (art === "alliteration"){
    const z = {}; woerter(text).filter(w=>w.length>=2).forEach(w=>{ const b=w[0].toLowerCase(); z[b]=(z[b]||0)+1; });
    return { ok: Object.values(z).some(n=>n>=3), hinweis: "Für eine Alliteration brauchst du mindestens drei Wörter mit demselben Anfangslaut." };
  }
  if (art === "dreier"){
    const teile = text.split(/,|;|\s(?:und|dann|schließlich|zuletzt|danach)\s/i).map(s=>s.trim()).filter(s=>woerter(s).length>=1);
    return { ok: teile.length >= 3, hinweis: "Eine Klimax hat mindestens drei Stufen – z. B. durch Beistriche oder „erst … dann … schließlich“ getrennt." };
  }
  return { ok: woerter(text).length >= 5, hinweis: "Schreib mindestens einen ganzen Satz.", selbst: true };
}
function aufgEinsetzen(a, box){
  const schluessel = L.set.id + "#" + L.idx;
  const alt = (DB.verbesserungen||{})[schluessel];
  box.appendChild(el('<div class="beilage" style="border-radius:0 14px 14px 0"><span class="etikett">Ausgangssatz</span><div>'+esc(a.beispiel)+'</div></div>'));
  box.appendChild(el('<p style="font-weight:600;margin:12px 0 6px">Deine Version mit '+esc(a.figur)+':</p>'));
  const ta = el('<textarea class="verb" rows="4" style="min-height:110px" placeholder="Schreib hier deine Version …"></textarea>');
  if (alt) ta.value = alt.text;
  box.appendChild(ta);
  if (a.tipps && a.tipps.length) box.appendChild(el('<div class="check" style="margin-top:8px">'+a.tipps.map(t=>'<label><input type="checkbox"><span>'+esc(t)+'</span></label>').join("")+'</div>'));
  const vorschlag = el('<div></div>'); box.appendChild(vorschlag);
  const knopf = ()=>{ const b=document.getElementById("eprue"); if (b) b.disabled = woerter(ta.value).length < 3; };
  ta.addEventListener("input", knopf);
  leiste([{t:"Prüfen", id:"eprue", aus: woerter(ta.value).length < 3, f:()=>{
    const r = figurPruefen(a.pruefung, ta.value);
    const p = r.ok ? 1 : 0; L.punkte += p; L.max += 1;
    ta.disabled = true;
    DB.verbesserungen = DB.verbesserungen || {};
    DB.verbesserungen[schluessel] = {art:"einsetzen", bereich:L.mo.titel, uebung:L.set.titel, aufgabe:a.frage, beispiel:a.beispiel, text:ta.value.trim(), datum:jetzt()};
    speichern(DB);

function analysiere(key, text, wmin, wmax, teil){
  teil = teil || "ganz";   // "ganz" | "einleitung" | "hauptteil" | "schluss" (Teilvergleich)
  const ganz = teil === "ganz";
  const k = KRITERIEN.textsorten[key];
  const H = [];   // {art:'ok'|'achtung', titel, text, bsp:[]}
  const M = [];   // Markierungen {s,e,cls,title}
  const hat = l => PROFIL[l].includes(key);
  const erzaehlend = PROFIL.erzaehlend.includes(k.gruppe);
  const ps = textAbsaetze(text);
  const ws = woerter(text);
  const lower = text.toLowerCase();
  let tz = ohneZitate(text);   // ohne Zitate für Ich-Form usw.
  // Inhaltsangabe: Im Schluss sind Meinung und Ich-Form erlaubt (Vorgabe der Lehrerin) – dort nicht prüfen
  const schlussFrei = key==="inhaltsangabe" && ((ganz && ps.length>=3) || teil==="schluss");
  if (schlussFrei){ const ab = teil==="schluss" ? 0 : text.lastIndexOf(ps[ps.length-1]); if (ab>=0) tz = tz.slice(0,ab) + " ".repeat(tz.length-ab); }

  // 1. Umfang
  if (!isNaN(wmin) || !isNaN(wmax)){
    const n = ws.length;
    if (!isNaN(wmin) && n < wmin) H.push({art:"achtung", titel:"Zu kurz: "+n+" Wörter", text:"Verlangt sind mindestens "+wmin+" Wörter. Zu wenige Wörter sind immer ein Mangel."});
    else if (!isNaN(wmax) && n > wmax){
      const erlaubt = ["eroerterung","textanalyse","textinterpretation","textanalyse_literarisch","textvergleich"].includes(key);
      H.push({art: erlaubt?"ok":"achtung", titel:"Länger als vorgegeben: "+n+" Wörter", text: erlaubt ? "Bei dieser Textsorte ist eine Überschreitung erlaubt." : "Bei dieser Textsorte musst du den Rahmen ("+(isNaN(wmin)?"":wmin+"–")+wmax+" Wörter) einhalten. Kürze auf das Wesentliche."});
    } else H.push({art:"ok", titel:"Wortanzahl passt: "+n+" Wörter", text:""});
  }
  // 2. Absätze
  if (!ganz) {}   // bei Teilen keine Absatzzählung
  else if (ws.length>120 && ps.length<3) H.push({art:"achtung", titel:"Wenige Absätze ("+ps.length+")", text:"Gliedere deinen Text in Absätze (Einleitung – Hauptteil – Schluss bzw. Basissatz – Kernaussagen). Trenne sie mit einer Leerzeile."});
  else if (ps.length>=3) H.push({art:"ok", titel:ps.length+" Absätze", text:"Dein Text ist gegliedert."});

  // 3. Basissatz

    const b = ps[0] || "";
    const bl = b.toLowerCase();

      ["Textsorte", /\b(artikel|zeitungsartikel|bericht|zeitungsbericht|kommentar|interview|reportage|glosse|kolumne|leserbrief|essay|beitrag|sachtext|rede|erzählung|kurzgeschichte|roman|gedicht|studie|blogeintrag|blogbeitrag|meldung|leitartikel|analyse|text|parabel|ballade|novelle|drama|podcast|video|film)\b/i.test(b)],
      ["Titel (in Anführungszeichen)", titelQ>=1],
      ["Autor/in", /\bvon\s+[A-ZÄÖÜ][\p{L}-]+/u.test(b) || /(autor|autorin|verfasser|verfasst|ohne autorenangabe|unbekannt)/i.test(b)],
      ["Medium/Quelle", titelQ>=2 || /(erschien|erschienen|veröffentlicht|zeitung|zeitschrift|magazin|online|www\.|\.at\b|\.com\b|\.de\b|homepage|website|webseite|plattform|ausgabe)/i.test(b)],
      ["Datum", /\b\d{1,2}\.\s*(jänner|januar|februar|feber|märz|april|mai|juni|juli|august|september|oktober|november|dezember)\b/i.test(b) || /\b\d{1,2}\.\s?\d{1,2}\.\s?\d{2,4}\b/.test(b) || /\b(19|20)\d{2}\b/.test(b)],
      ["Thema", /(geht es um|geht es darum|handelt von|befasst sich|beschäftigt sich|thematisiert|behandelt|setzt sich|informiert über|dreht sich um|thema)/i.test(bl)]
    ];
    // Literarische Texte: Medium und Datum sind nicht verlangt
    // Literarische Texte: Medium und Datum sind nicht verlangt; die Kernaussage lässt sich nicht verlässlich erkennen
    const literarisch = ["inhaltsangabe","textanalyse_literarisch","textinterpretation"].includes(key);
    if (literarisch) teile.splice(3);
    const fehlt = teile.filter(t=>!t[1]).map(t=>t[0]);
    const zusatz = literarisch ? " Prüfe selbst: Steht die Kernaussage (Hauptfigur, Ort/Zeit, worum es geht) in einem Satz in der Einleitung?" : "";
    H.push({art: fehlt.length? "achtung":"ok", titel: fehlt.length ? (literarisch?"Einleitung":"Basissatz")+": prüfe, ob etwas fehlt" : (literarisch?"Einleitung":"Basissatz")+" wirkt vollständig",
      html: '<div class="basis">'+teile.map(t=>'<span>'+(t[1]?"✅":"❔")+' '+esc(t[0])+'</span>').join("")+'</div>',
      text: (fehlt.length ? "Im ersten Absatz nicht erkannt: "+fehlt.join(", ")+". Fehlt eine Angabe in der Vorlage, vermerke das kurz." : "") + zusatz});
  }

  // 4. Ich-Form
  if (hat("keinIch") || hat("ichNurRand")){
    const treffer=[]; let mm; const re = new RegExp(WORT.source,"gu");
    while((mm=re.exec(tz))){ if (W.ich.has(mm[0].toLowerCase())) treffer.push(mm); }
    if (hat("keinIch") && treffer.length){
      treffer.forEach(t=>M.push({s:t.index,e:t.index+t[0].length,cls:"m-ich",title:"Ich-/Wir-Form"}));
      H.push({art:"achtung", titel:"Ich-/Wir-Form ("+treffer.length+"×)", text: key==="kommentar" ? "Im Kommentar verwendest du keine Ich-Form." : schlussFrei ? "In Einleitung und Hauptteil schreibst du sachlich in der Er-/Sie-Form. Nur im Schluss darfst du deine Meinung in der Ich-Form sagen." : "In dieser Textsorte schreibst du sachlich in der Er-/Sie-Form – außer in wörtlichen Zitaten.", marker:"m-ich"});
    } else if (hat("ichNurRand") && ((ganz && ps.length>=3) || teil==="hauptteil")){
      const mitte = ps.slice(1,-1).join("\n");
      const n = (ohneZitate(mitte).match(WORT)||[]).filter(w=>W.ich.has(w.toLowerCase())).length;
      if (n>2) H.push({art:"achtung", titel:"Ich-Form im Hauptteil ("+n+"×)", text:"In der Erörterung verwendest du „ich“ nur in Einleitung, Schluss oder in einem persönlichen Beispiel. Formuliere die Argumente sachlich."});
    }
  }

  // 5. Schluss/Fazit + Wertungen
  if (hat("keinSchluss") && (ganz || teil==="schluss")){
    const gef = W.fazit.filter(f=>lower.includes(f));
    gef.forEach(f=>{ let i=lower.indexOf(f); while(i>=0){ M.push({s:i,e:i+f.length,cls:"m-ugs",title:"Fazit/Meinung"}); i=lower.indexOf(f,i+1);} });
    if (gef.length) H.push({art:"achtung", titel:"Fazit oder eigene Meinung?", text:"Gefunden: „"+gef.join("“, „")+"“. Die Zusammenfassung hat keinen Schluss: Sie endet mit der letzten Kernaussage – ohne Fazit, Resümee oder Meinung.", marker:"m-ugs"});
    else H.push({art:"ok", titel:"Kein angehängtes Fazit erkannt", text:"Gut: Die Zusammenfassung endet mit der letzten Kernaussage."});
  }
  if (hat("keineWertung")){
    const gef = W.wertung.filter(f=>new RegExp("(^|[^\\p{L}])"+f+"(?![\\p{L}])","iu").test(tz));
    gef.forEach(f=>{ const re=new RegExp("(^|[^\\p{L}])("+f+")(?![\\p{L}])","giu"); let mm; while((mm=re.exec(tz))){ const s=mm.index+mm[1].length; M.push({s,e:s+mm[2].length,cls:"m-ugs",title:"Wertung"}); } });
    if (gef.length) H.push({art:"achtung", titel:"Wertende Wörter", text:"Gefunden: „"+gef.join("“, „")+"“. Bleib sachlich – keine eigene Bewertung"+(schlussFrei?" (deine Meinung gehört nur in den Schluss).":".")});
  }

  // 6. Zeitform
  if (hat("praesens")){
    const treffer=[]; let mm; const re=new RegExp(WORT.source,"gu");
    while((mm=re.exec(tz))){ if (W.praet.has(mm[0].toLowerCase())) treffer.push(mm); }
    if (treffer.length>=1){
      treffer.forEach(t=>M.push({s:t.index,e:t.index+t[0].length,cls:"m-zeit",title:"Präteritum?"}));
      H.push({art:"achtung", titel:"Präteritum? ("+treffer.length+"×)", text:"Diese Textsorte schreibst du im Präsens, Vorzeitiges im Perfekt. Präteritum nur bei historischen Ereignissen. Gefunden: "+[...new Set(treffer.map(t=>t[0]))].slice(0,8).join(", "), marker:"m-zeit"});
    }
  }

  // 7. Direkte Rede
  if (hat("keineDirekteRede")){
    const dr = text.match(/:\s*[„"»]/g) || [];
    const lang = (text.match(/„[^“]{60,}“|"[^"]{60,}"/g)||[]).length;
    if (dr.length || lang) H.push({art:"achtung", titel:"Wörtliche Rede / lange Zitate", text:"Wandle direkte Rede in indirekte Rede um (Konjunktiv I). Zitate nur kurz und sparsam."});
  }
  // 8. Redewiedergabe
  if (hat("redewiedergabe")){
    const ss = saetze(tz);
    const ind = ss.filter(s=>W.redeverb.test(s) && W.indikativNachDass.test(s));
    const konj = ss.filter(s=>W.konjI.test(s) && W.redeverb.test(s) && !/\b(ich|wir)\b/i.test(s)).length;
    if (ind.length) H.push({art:"achtung", titel:"Redewiedergabe: Konjunktiv prüfen", text:"In diesen Sätzen gibst du vermutlich jemandes Aussage wieder, das Verb steht aber im Indikativ. Prüfe: sei, habe, könne, müsse, werde …", bsp: ind.slice(0,4)});
    else if (konj && ["zusammenfassung","inhaltsangabe","bericht"].includes(key)) H.push({art:"ok", titel:"Konjunktiv I verwendet", text:"Du gibst Aussagen in indirekter Rede wieder."});
    const k2 = ss.filter(s=>W.redeverb.test(s) && W.konjIIsg.test(s));
    if (k2.length && ["zusammenfassung","inhaltsangabe","bericht"].includes(key)) H.push({art:"achtung", titel:"„wäre“/„hätte“ statt „sei“/„habe“?", text:"In der Einzahl ist der Konjunktiv I eindeutig: er sei, sie habe. „wäre“ und „hätte“ brauchst du nur als Ersatzform.", bsp:k2.slice(0,3)});
  }

  // 9. Argumente (3-B)
  if (hat("argumente") && ((ganz && ps.length>=3) || teil==="hauptteil")){
    // Brief: kurze Anrede-Zeile vorne und Grußformel/Name hinten nicht mitzählen; beim Teil „Hauptteil“ zählen alle Absätze
    const start = !ganz ? 0 : (hat("brief") && ps[0].length<60) ? 2 : 1;
    let ende = !ganz ? ps.length : ps.length-1;
    if (ganz && hat("brief")) while (ende>start && (ps[ende].length<60 || /^(mit freundlichen|freundliche|beste|liebe grüße|hochachtungsvoll)/i.test(ps[ende]))) ende--;
    const mitte = ps.slice(start, Math.max(start+1, ende));
    let zeilen = "", luecken = 0;
    mitte.forEach((p,i)=>{
      const b = W.begruendung.test(p), x = W.beispiel.test(p);
      if (!b || !x) luecken++;
      zeilen += '<span>Absatz '+(i+start+1)+': '+(b?"✅":"❔")+' Begründung · '+(x?"✅":"❔")+' Beispiel/Beleg</span>';
    });
    H.push({art: luecken? "achtung":"ok", titel:"Argumente nach dem 3-B-Schema", text: luecken ? "„❔“ heißt: Kein Signalwort erkannt (weil, denn, daher … / zum Beispiel, laut, Zahlen …). Prüfe, ob jedes Argument Behauptung, Begründung und Beispiel hat." : "In jedem Hauptteil-Absatz gibt es Hinweise auf Begründung und Beispiel.", html:'<div class="basis" style="grid-template-columns:1fr">'+zeilen+'</div>'});
    const ohneUeb = mitte.slice(1).filter(p=>!W.ueberleitung.test(p.trim())).length;
    if (mitte.length>=2 && ohneUeb===mitte.length-1) H.push({art:"achtung", titel:"Überleitungen", text:"Deine Argument-Absätze beginnen ohne Überleitung. Verbinde sie, z. B. mit „Darüber hinaus …“, „Ein weiteres Argument ist …“, „Allerdings muss man bedenken …“."});
  }
  // 10. Brief
  if (hat("brief")){
    const anf = ps[0]||"";
    if (teil==="hauptteil") {}
    else if (teil==="schluss") {}
    else if (/^hallo/i.test(anf)) H.push({art:"achtung", titel:"Anrede", text:"„Hallo“ ist zu umgangssprachlich. Besser: „Sehr geehrte Redaktion,“ oder „Sehr geehrte Frau …,“."});
    else if (!/^(sehr geehrte|liebe|lieber|geschätzte|werte)/i.test(anf)) H.push({art:"achtung", titel:"Anrede fehlt?", text:"Beginne mit einer Anrede, z. B. „Sehr geehrte Redaktion,“. Danach schreibst du klein weiter."});
    else H.push({art:"ok", titel:"Anrede vorhanden", text:""});
    if (teil==="einleitung" || teil==="hauptteil") {}
    else if (/\bmfg\b/i.test(text)) H.push({art:"achtung", titel:"„MfG“", text:"Schreib die Grußformel aus: „Mit freundlichen Grüßen“."});
    else if (!/(mit freundlichen grüßen|freundliche grüße|beste grüße|hochachtungsvoll|liebe grüße)/i.test(text)) H.push({art:"achtung", titel:"Grußformel fehlt?", text:"Am Ende stehen Grußformel und Name (beim Leserbrief auch der Wohnort)."});
    const schluss = ps.slice(-3).join(" ");
    if (teil==="einleitung" || teil==="hauptteil") {}
    else if (!/!|\b(fordere|appelliere|bitte|rufe|setzen sie|lassen sie|helfen sie|denken sie|unterstützen sie|sorgen sie|überlegen sie|handeln sie|setzt euch|macht mit)\b/i.test(schluss)) H.push({art:"achtung", titel:"Appell?", text:"Im Schluss steht ein klarer Appell, der jemanden direkt anspricht (Leser/innen, Redaktion, Verantwortliche)."});
  }

  // 11. dass ohne Beistrich
  { const re=/([\p{L}]+)(\s+)dass\b/giu; let mm; const ausn=new Set(["so","ohne","als","statt","anstatt","außer","nur","bis","kaum","sodass"]); const bsp=[];
    while((mm=re.exec(text))){ if(ausn.has(mm[1].toLowerCase())) continue; const s=mm.index+mm[1].length+mm[2].length; M.push({s,e:s+4,cls:"m-dass",title:"Beistrich vor „dass“?"}); bsp.push(ausschnitt(text,s,4)); }
    if (bsp.length) H.push({art:"achtung", titel:"Beistrich vor „dass“? ("+bsp.length+"×)", text:"Vor einem dass-Satz steht ein Beistrich (z. B. „Sie meint, dass …“).", bsp:bsp.slice(0,4), marker:"m-dass"});
    const das = (text.match(/,\s+das\b/gi)||[]).length;
    { const r2=/,(\s+)(das)\b/gi; let m2; while((m2=r2.exec(text))){ const s=m2.index+1+m2[1].length; M.push({s,e:s+3,cls:"m-dass",title:"das oder dass?"}); } }
    if (das) H.push({art:"achtung", titel:"„das“ oder „dass“? ("+das+"× „, das“)", text:"Probe: Kannst du „das“ durch „welches“ oder „dieses“ ersetzen? Dann bleibt es „das“. Wenn nicht, schreibst du „dass“."});
  }
  // 12. Umgangssprache
  if (!erzaehlend){
    const re=new RegExp(WORT.source,"gu"); let mm; const gef=[];
    while((mm=re.exec(tz))){ const w=mm[0].toLowerCase(); if(W.ugs.has(w) && mm[0][0]===mm[0][0].toLowerCase()){ gef.push(mm[0]); M.push({s:mm.index,e:mm.index+mm[0].length,cls:"m-ugs",title:"Umgangssprache?"}); } }
    if (gef.length) H.push({art:"achtung", titel:"Umgangssprache? ("+gef.length+"×)", text:"Prüfe, ob diese Wörter umgangssprachlich verwendet sind: "+[...new Set(gef)].join(", ")+". Schreib in der Standardsprache.", marker:"m-ugs"});
  }
  // 13. Satzanfänge
  { const ss=saetze(text); const anf={}; let und=0;
    ss.forEach(s=>{ const w=(s.replace(/^[„"»(]+/,"").match(WORT)||[""])[0].toLowerCase(); if(!w) return; if(w==="und") und++; if(["der","die","das","ein","eine","dem","den","des","einer","einem","einen"].includes(w)) return; anf[w]=(anf[w]||0)+1; });
    const viel = Object.entries(anf).filter(([w,n])=>n>=3).sort((a,b)=>b[1]-a[1]);
    if (viel.length) H.push({art:"achtung", titel:"Gleiche Satzanfänge", text:"Mehrere Sätze beginnen gleich: "+viel.map(([w,n])=>"„"+w[0].toUpperCase()+w.slice(1)+"“ ("+n+"×)").join(", ")+". Wechsle die Satzanfänge ab."});
    if (und) H.push({art:"achtung", titel:"Satzanfang „Und“ ("+und+"×)", text:"Beginne Sätze nicht mit „Und“. Verwende andere Verknüpfungen (außerdem, zudem, deshalb …)."});
  }
  // 14. Wortwiederholungen
  { const z={}; let mm; const re=new RegExp(WORT.source,"gu");
    while((mm=re.exec(tz))){ const w=mm[0].toLowerCase(); if(w.length<5||W.stopp.has(w)) continue; (z[w]=z[w]||[]).push(mm.index); }
    const grenze = ws.length>350 ? 5 : 4;
    const viel = Object.entries(z).filter(([w,a])=>a.length>=grenze).sort((a,b)=>b[1].length-a[1].length).slice(0,6);
    if (viel.length){
      viel.forEach(([w,a])=>a.forEach(i=>M.push({s:i,e:i+w.length,cls:"m-wdh",title:"Wortwiederholung"})));
      H.push({art:"achtung", titel:"Wortwiederholungen", text:"Häufig: "+viel.map(([w,a])=>"„"+w+"“ ("+a.length+"×)").join(", ")+". Fachbegriffe des Themas dürfen vorkommen – sonst such Synonyme.", marker:"m-wdh"});
    }
  }

  const achtung = H.filter(x=>x.art==="achtung"), gut = H.filter(x=>x.art==="ok");
  return {H, M, ws, ps, k, achtung, gut};
}
function hinweiseHtml(A){
  let h = '<div class="hinweise">';
  A.achtung.concat(A.gut).forEach(x=>{
    h += '<div class="hw '+(x.art==="ok"?"ok":"achtung")+'"><b>'+(x.art==="ok"?"✅ ":"👀 ")+esc(x.titel)+'</b>'+(x.text?esc(x.text):"")+(x.html||"");
    if (x.bsp && x.bsp.length) h += x.bsp.map(b=>'<div class="bsp">„'+esc(b)+'“</div>').join("");
    h += '</div>';
  });
  return h + '</div>';
}
function markierungHtml(text, M, ueberschrift){
  if (!M.length) return "";
  let h = '<h3>'+esc(ueberschrift)+'</h3><div class="legende">';
  const leg = {"m-ich":"Ich-/Wir-Form","m-ugs":"Umgangssprache / Wertung / Fazit","m-dass":"das/dass und Beistrich","m-zeit":"Präteritum?","m-wdh":"Wiederholung"};
  [...new Set(M.map(m=>m.cls))].forEach(c=>h+='<span><mark class="'+c+'">&nbsp;</mark> '+leg[c]+'</span>');
  return h + '</div><div class="ansicht">'+markiere(text,M.slice())+'</div>';
}
function hinweiseAlsText(A){
  let t = "";
  A.achtung.concat(A.gut).forEach(x=>{ t += "\n" + (x.art==="ok"?"[passt] ":"[ansehen] ") + x.titel + (x.text?"\n   "+x.text:"") + (x.bsp&&x.bsp.length?"\n   z. B.: " + x.bsp.join(" | "):"") + "\n"; });
  return t;
}
function pruefeText(key, text, wmin, wmax){
  const out = document.getElementById("ergebnis");
  if (!text.trim()){ out.innerHTML = '<div class="karte"><p>Schreib zuerst deinen Text in das Feld.</p></div>'; return; }
  const A = analysiere(key, text, wmin, wmax);
  const {M, ws, ps, k, achtung, gut} = A;
  let h = '<div class="karte"><h2>Hinweise zu deinem Text</h2><p class="muted">'+achtung.length+' Stellen zum Nachsehen · '+gut.length+' Punkte passen schon.</p>';
  h += hinweiseHtml(A) + markierungHtml(text, M, "Dein Text mit Markierungen") + '</div>';

  // Checkliste aus den Kriterien
  h += '<div class="karte"><h2>Checkliste: '+esc(k.name)+'</h2><p class="muted">Geh die Punkte durch und hak ab, was dein Text erfüllt.</p>';
  [["inhalt","Inhalt"],["struktur","Aufbau"],["sprache","Sprache"]].forEach(([f,t])=>{
    if (!k[f] || !k[f].length) return;
    h += '<h3>'+t+'</h3><div class="check">'+k[f].map((p,i)=>'<label><input type="checkbox"><span>'+esc(p)+'</span></label>').join("")+'</div>';
  });
  if (k.typische_fehler && k.typische_fehler.length) h += '<h3>Typische Fehler – hast du sie vermieden?</h3><div class="check">'+k.typische_fehler.map(p=>'<label><input type="checkbox"><span>'+esc(p)+'</span></label>').join("")+'</div>';
  h += '</div>';
  h += '<div class="leiste"><button class="btn" id="txtspeichern">📤 Text mit Hinweisen speichern</button><span class="muted" style="font-size:.9rem">z. B. zum Abgeben in Teams</span></div>';
  out.innerHTML = h;
  document.getElementById("txtspeichern").onclick = ()=>{
    let t = "FEDERLEICHT · SCHREIBTRAINING DEUTSCH –EIGENER TEXT\nGespeichert am " + jetzt() + (PRUEF_AUFGABE ? "\nAufgabe: " + (PRUEF_AUFGABE.aufgabentitel || PRUEF_AUFGABE.titel) : "") + "\nTextsorte: " + k.name + "\nWörter: " + ws.length + " · Absätze: " + ps.length + "\n\n";
    t += "===== MEIN TEXT =====\n\n" + text.trim() + "\n\n===== AUTOMATISCHE HINWEISE (ohne Gewähr) =====\n" + hinweiseAlsText(A);
    dateiSpeichern("Schreibtraining_Text_"+datumKurz()+".txt", t);
  };
  out.scrollIntoView({behavior:"smooth", block:"start"});
}

};

const WUERFEL_TIPPS = ["Spannungsbogen: Einleitung – Steigerung – Höhepunkt – kurzer Schluss", "Zeigen statt sagen: Gefühle durch Körper, Handlungen und Sinneseindrücke zeigen", "Abwechslungsreiche Satzanfänge – kein „Dann … Dann …“", "Treffende Verben und Redebegleitverben statt „gehen“ und „sagen“", "Zeitform durchhalten (meist Präteritum, beim inneren Monolog Präsens)"];
function wuerfle(feld){ const l = WUERFEL[feld].liste; let w; do { w = l[Math.floor(Math.random()*l.length)]; } while (l.length>1 && w === (DB.wuerfel||{})[feld]); return w; }

  h += '<details style="margin-top:10px"><summary>💡 Tipps zum Schreiben</summary><ul style="margin:6px 0 0 20px;padding:0">'+WUERFEL_TIPPS.map(t=>'<li>'+esc(t)+'</li>').join("")+'</ul></details>';
  h += '<label class="feld" for="wtext">Deine Geschichte <span class="muted" style="font-weight:400">(Absätze mit Leerzeile trennen)</span></label><textarea id="wtext" placeholder="Es war …">'+esc(d.text||"")+'</textarea><div class="zaehler" id="wzaehler"></div>';
  h += '<div class="leiste"><button class="btn" id="wpruefen">Geschichte prüfen</button><button class="btn zweit" id="wspeichern">📤 Geschichte speichern</button></div></div><div id="wergebnis"></div>';
  app.innerHTML = h;
  app.querySelector(".zurueck").onclick = zeigeStart;
  const ta = document.getElementById("wtext");
  const zaehle = ()=>{ document.getElementById("wzaehler").textContent = woerter(ta.value).length + " Wörter · " + textAbsaetze(ta.value).length + " Absätze"; };
  ta.oninput = ()=>{ d.text = ta.value; speichern(DB); zaehle(); };

const FB_TS = ["zusammenfassung","inhaltsangabe","bericht","eroerterung","kommentar","leserbrief","meinungsrede","stellungnahme","textanalyse","charakteristik","erlebniserzaehlung"];
function feedbackAuftrag(d){
  const k = KRITERIEN.textsorten[d.ts];

    + "Nenne mir genau drei konkrete Schwächen – je eine zu Inhalt, Aufbau und Sprache. Zitiere jeweils kurz die betroffene Stelle und gib mir einen Tipp, wie ich sie selbst verbessern kann. Österreichisches Standarddeutsch ist richtig.\n"
    + "Achte besonders auf diese typischen Fehler:\n" + (k.typische_fehler || []).slice(0,4).map(f=>"- " + f).join("\n") + "\n\n"

function wortDiff(a, b){
  const tok = s => s.replace(/\n\s*\n/g, " ¶ ").split(/\s+/).filter(Boolean);
  const A = tok(a), B = tok(b), n = A.length, m = B.length;
  if (n * m > 600000) return null;
  const dp = Array.from({length:n+1}, ()=>new Uint16Array(m+1));
  for (let i=n-1;i>=0;i--) for (let j=m-1;j>=0;j--) dp[i][j] = A[i]===B[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const out = []; let i=0, j=0;
  while (i<n && j<m){ if (A[i]===B[j]){ out.push(["=",A[i]]); i++; j++; } else if (dp[i+1][j] >= dp[i][j+1]) out.push(["-",A[i++]]); else out.push(["+",B[j++]]); }
  while (i<n) out.push(["-",A[i++]]); while (j<m) out.push(["+",B[j++]]);
  return out;
}
function diffHtml(d){
  let h = "", typ = null, puffer = [];
  const raus = ()=>{ if (!puffer.length) return; const t = puffer.map(w=>w==="¶" ? "\n\n" : w).join(" ").replace(/ ?\n\n ?/g, "\n\n"); h += typ==="=" ? esc(t)+" " : (typ==="+" ? '<ins>'+esc(t)+'</ins> ' : '<del>'+esc(t)+'</del> '); puffer = []; };
  d.forEach(([t,w])=>{ if (t!==typ){ raus(); typ = t; } puffer.push(w); }); raus();
  return h;
}

];
const TEILE = {ganz:"Ganzer Text", einleitung:"Nur die Einleitung", hauptteil:"Nur der Hauptteil", schluss:"Nur der Schluss"};
const TEIL_STICH = {

};
function vglDaten(id){

// Teil eines Textes: Titel/Anrede gehören zur Einleitung, Grußformel/Name zum Schluss
function teilText(text, teil){
  if (teil === "ganz") return text.trim();
  const ps = textAbsaetze(text);
  let a = 0, e = ps.length;
  const ohneSatzende = p => !/[.!?…]["“»)]?$/.test(p.trim());
  while (a < e-1 && ps[a].length < 120 && (ohneSatzende(ps[a]) || /^(sehr geehrte|liebe|lieber|geschätzte|werte)/i.test(ps[a]))) a++;
  while (e > a+1 && ps[e-1].length < 80 && (ohneSatzende(ps[e-1]) || /^(mit freundlichen|freundliche grüße|beste grüße|hochachtungsvoll|liebe grüße)/i.test(ps[e-1]))) e--;
  if (e - a <= 1) return text.trim();                       // nur ein Absatz geschrieben: das ist der Teil
  if (teil === "einleitung") return ps.slice(0, a+1).join("\n\n");
  if (teil === "schluss") return ps.slice(e-1).join("\n\n");
  return ps.slice(a+1, e-1).join("\n\n");
}
// Word- (.docx) und Textdateien direkt im Browser lesen – ohne Internet
async function dateiAlsText(file){
  const name = file.name.toLowerCase();
  if (name.endsWith(".txt")) return (await file.text()).trim();
  if (name.endsWith(".docx")) return docxText(await file.arrayBuffer());
  if (name.endsWith(".pdf")) throw new Error("PDF-Dateien kann das Programm nicht lesen. Öffne die PDF, markiere den Text (Strg+A), kopiere ihn (Strg+C) und füge ihn hier ein (Strg+V).");
  if (name.endsWith(".doc")) throw new Error("Alte Word-Dateien (.doc) gehen nicht. Speichere die Datei in Word als .docx oder kopiere den Text hier hinein.");
  throw new Error("Diese Dateiart geht nicht. Möglich sind Word (.docx) und Textdateien (.txt).");
}
async function docxText(buf){
  const dv = new DataView(buf), bytes = new Uint8Array(buf);
  let eocd = -1;
  for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  if (eocd < 0) throw new Error("Die Word-Datei ließ sich nicht lesen.");
  let p = dv.getUint32(eocd + 16, true);
  const n = dv.getUint16(eocd + 10, true);
  for (let i = 0; i < n; i++){
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const methode = dv.getUint16(p + 10, true), groesse = dv.getUint32(p + 20, true);
    const nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), kl = dv.getUint16(p + 32, true);
    const lokal = dv.getUint32(p + 42, true);
    const dname = new TextDecoder().decode(bytes.subarray(p + 46, p + 46 + nl));
    if (dname === "word/document.xml"){
      const start = lokal + 30 + dv.getUint16(lokal + 26, true) + dv.getUint16(lokal + 28, true);
      const roh = bytes.subarray(start, start + groesse);
      let xmlBytes;
      if (methode === 0) xmlBytes = roh;
      else if (methode === 8){
        if (typeof DecompressionStream === "undefined") throw new Error("Dein Browser ist zu alt zum Lesen von Word-Dateien. Kopiere den Text bitte hinein.");
        xmlBytes = new Uint8Array(await new Response(new Blob([roh]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
      } else throw new Error("Die Word-Datei ist ungewöhnlich gespeichert. Kopiere den Text bitte hinein.");
      const doc = new DOMParser().parseFromString(new TextDecoder().decode(xmlBytes), "application/xml");
      const W = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
      const absaetze = [];
      for (const par of doc.getElementsByTagNameNS(W, "p")){
        let t = "";
        par.querySelectorAll("*").forEach(x=>{ if (x.namespaceURI !== W) return; if (x.localName === "t") t += x.textContent; else if (x.localName === "tab") t += "\t"; else if (x.localName === "br") t += "\n"; });
        if (t.trim()) absaetze.push(t.trim());
      }
      return absaetze.join("\n\n");
    }
    p += 46 + nl + xl + kl;
  }
  throw new Error("In der Datei wurde kein Word-Text gefunden.");
}

    + "Achte auf diese Merkmale der Textsorte:\n" + merkmale + "\n"

function markiere(text, M){
  M.sort((a,b)=>a.s-b.s || b.e-a.e);
  let h="", pos=0;
  M.forEach(m=>{ if (m.s<pos) return; h += esc(text.slice(pos,m.s)) + '<mark class="'+m.cls+'" title="'+esc(m.title)+'">'+esc(text.slice(m.s,m.e))+'</mark>'; pos=m.e; });
  return h + esc(text.slice(pos));
}

// Basissatz aus den Angaben der Lehrkraft – daraus entstehen Übungen, ohne dass die App den Text verstehen muss
function basissatzTeile(p){
  const q = LK_QUELLE[p.quelle];
  if (!q || !(p.titel || "").trim() || !(p.autor || "").trim() || !(p.thema || "").trim()) return null;
  const t = ["In " + q[0] + " " + q[1], "„" + p.titel.trim() + "“", "von " + p.autor.trim() + ","];
  const dat = (p.datum || "").trim(), med = (p.medium || "").trim();
  const am = /^\d{4}$/.test(dat) ? dat : (/^\d/.test(dat) ? "am " + dat : "im " + dat);   // 2025 · am 3. Mai 2026 · im April 2026
  if (dat && med) t.push("erschienen " + am + " in „" + med + "“,"); else if (med) t.push("erschienen in „" + med + "“,"); else if (dat) t.push("erschienen " + am + ",");
  t.push("geht es um " + p.thema.trim().replace(/^geht es um\s+/i, "").replace(/[.!]$/, "") + ".");
  return t;
}
function autoAufgaben(p){
  const t = basissatzTeile(p);
  if (!t) return [];
  const satz = x=>x.join(" ").replace(/,\s*$/, "");
  const erkl = "So ist der Basissatz aufgebaut: Textsorte – Titel – Autor/in" + (t.length > 4 ? " – Erscheinungsangaben" : "") + " – Thema. Die Erscheinungsangaben stehen zwischen Beistrichen.";
  const auf = [{typ:"reihenfolge", frage:"Bring die Teile des Basissatzes zu deinem Text in die richtige Reihenfolge.", elemente:t, erklaerung:erkl, _auto:true}];
  const ohneAutor = [t[0], t[1] + (t.length > 4 ? "," : "")].concat(t.slice(3));
  auf.push({typ:"wahl", frage:"Welche Angabe fehlt in diesem Basissatz? – " + satz(ohneAutor),optionen:["die Autorin bzw. der Autor", "der Titel des Textes", "das Thema des Textes", "die Textsorte des Textes"], richtig:0, erklaerung:"Vollständig heißt er: " + satz(t), _auto:true});
  if (t.length > 4){
    const ohneErsch = t.filter((x,i)=>i !== 3).map((x,i,a)=>i === 2 ? x.replace(/,$/, "") : x);
    auf.push({typ:"wahl", frage:"Welche Angabe fehlt in diesem Basissatz? – " + satz(ohneErsch), optionen:["die Erscheinungsangaben (Datum, Medium)", "die Autorin bzw. der Autor", "das Thema des Textes", "die Textsorte des Textes"], richtig:0, erklaerung:"Vollständig heißt er: " + satz(t), _auto:true});
  }
  const lsatz = t[0] + " „{{}}“ von {{}}" + (t.length > 4 ? ", " : " ") + t.slice(3).join(" ");
  auf.push({typ:"luecke", frage:"Ergänze Titel und Autor/in im Basissatz.", satz:lsatz, loesungen:[[p.titel.trim(), "„" + p.titel.trim() + "“"], [p.autor.trim()]], erklaerung:"Titel unter Anführungszeichen, danach die Autorin bzw. der Autor.", _auto:true});
  return auf;
}
// Bei den eingebauten Schreibaufgaben nur dort Basissatz-Übungen, wo die Textsorte einen Basissatz verlangt
const BASISSATZ_TS = ["zusammenfassung","inhaltsangabe","exzerpt","charakteristik","eroerterung","kommentar","leserbrief","meinungsrede","stellungnahme","textanalyse","textanalyse_literarisch","textinterpretation","textvergleich"];
function paketSet(p){
  const auto = (!p.eingebaut || BASISSATZ_TS.includes(p.ts)) ? autoAufgaben(p) : [];
  return {id:"lk_" + p.id, titel:p.titel, _paket:p.id,
    beilage:{titel:p.titel, info:paketInfo(p) || "Text von deiner Lehrkraft", absaetze:paketAbsaetze(p.text)},
    aufgaben:auto.concat((p.uebungen || []).map(u=>Object.assign({}, u)))};
}
function paketeEinbauen(){
  UEBUNGEN.module = UEBUNGEN.module.filter(m=>m.id !== "lehrkraft" && m.id !== "schreibaufgaben");
  const sets = Object.values(pakete()).filter(p=>(p.text || "").trim()).map(paketSet).filter(s=>s.aufgaben.length);
  if (sets.length) UEBUNGEN.module.unshift({id:"lehrkraft", gruppe:LK_GRUPPE, titel:"Übungen zu Texten meiner Lehrkraft", symbol:"📥", kurz:"Übungen zu den Texten, die deine Lehrkraft dir bereitgestellt hat.", sets});
  const saSets = SA.filter(p=>(p.text || "").trim()).map(paketSet).filter(s=>s.aufgaben.length);
  if (saSets.length) UEBUNGEN.module.push({id:"schreibaufgaben", gruppe:"Schreibaufgaben", titel:"Basissatz-Übungen zu den Schreibaufgaben", symbol:"📝", kurz:"Zu jedem Ausgangstext der Schreibaufgaben: den Basissatz richtig bauen.", sets:saSets});
}
// Datei prüfen und bereinigen – auch fremde oder kaputte Dateien dürfen nichts kaputtmachen
function paketBereinigen(roh){
  const s = x=>typeof x === "string" ? x : "";
  const p = {art:LK_KENNUNG, v:1, id:s(roh.id).replace(/[^a-z0-9]/gi, "").slice(0, 30) || neueId(), titel:s(roh.titel).trim(), quelle:s(roh.quelle), autor:s(roh.autor), medium:s(roh.medium), datum:s(roh.datum), thema:s(roh.thema),
    aufgabe:s(roh.aufgabe), text:s(roh.text), ts:KRITERIEN.textsorten[roh.ts] ? roh.ts : "", wmin:s(String(roh.wmin || "")).replace(/\D/g, ""), wmax:s(String(roh.wmax || "")).replace(/\D/g, ""), zu:s(roh.zu), uebungen:[]};
  const fehler = [];
  (Array.isArray(roh.uebungen) ? roh.uebungen : []).forEach((u, n)=>{
    const nr = "Frage " + (n + 1) + ": ";
    const frage = s(u.frage).trim(), erklaerung = s(u.erklaerung).trim();
    if (u.typ === "zuordnen"){
      const el = (u.elemente || []).filter(e=>s(e.text).trim()).map(e=>({text:s(e.text).trim(), kat:Math.min(2, Math.max(0, +e.kat || 0))}));
      if (el.length < 2) return fehler.push(nr + "Der Faktencheck braucht mindestens 2 Aussagen.");
      p.uebungen.push({typ:"zuordnen", frage:frage || "Prüf die Aussagen am Text: Stimmen sie?", kategorien:FK_KAT.slice(), elemente:el, erklaerung});
    } else if (u.typ === "wahl" || u.typ === "mehrfach"){
      const opts = (u.optionen || []).map((o,i)=>({t:s(o).trim(), i})).filter(o=>o.t);
      const soll = u.typ === "wahl" ? [+u.richtig] : (Array.isArray(u.richtig) ? u.richtig.map(Number) : []);
      const richtig = opts.map((o,j)=>soll.includes(o.i) ? j : -1).filter(j=>j >= 0);
      if (!frage) return fehler.push(nr + "Die Frage fehlt.");
      if (opts.length < 2) return fehler.push(nr + "Es braucht mindestens 2 Antworten.");
      if (!richtig.length) return fehler.push(nr + "Kreuz an, welche Antwort richtig ist.");
      if (new Set(opts.map(o=>o.t)).size !== opts.length) return fehler.push(nr + "Zwei Antworten sind gleich.");
      p.uebungen.push({typ:u.typ, frage, optionen:opts.map(o=>o.t), richtig:u.typ === "wahl" ? richtig[0] : richtig, erklaerung});
    }
  });
  if (!p.titel) fehler.unshift("Der Titel des Textes fehlt.");
  if (!p.text.trim()) fehler.unshift("Der Ausgangstext fehlt.");
  return {p, fehler};
}
async function paketAusDatei(file){
  if (/\.(txt|json)$/i.test(file.name)){
    const roh = await file.text();
    if (roh.includes(LK_KENNUNG) && roh.includes("{")){
      let daten; try { daten = JSON.parse(roh.slice(roh.indexOf("{"))); } catch(e){ throw new Error("Die Aufgabendatei ist beschädigt. Bitte lade sie noch einmal aus Teams herunter."); }
      return paketBereinigen(daten).p;
    }
  }
  const text = await dateiAlsText(file);   // gewöhnlicher Text oder Word-Datei: als Text ohne Fragen übernehmen
  if (!text.trim()) throw new Error("In der Datei steht kein Text.");
  return paketBereinigen({titel:file.name.replace(/\.[^.]+$/, "").replace(/[_]+/g, " ").trim(), text}).p;
}
function paketDateiname(p){ return "Federleicht_Aufgabe_" + (p.titel.normalize("NFC").replace(/[^\p{L}\p{N}]+/gu, "_").replace(/^_|_$/g, "").slice(0, 40) || "Text") + ".txt"; }
function paketDateiInhalt(p){ return LK_KENNUNG + " – Diese Datei in Federleicht öffnen: „📂 Aufgabe meiner Lehrkraft öffnen“. Nur in Teams mit der Klasse teilen, nicht öffentlich.\n" + JSON.stringify(p); }
function paketWahl(id, label, nurMitText){

  return '<label class="feld" for="'+id+'">'+label+'</label><select id="'+id+'"><option value="">– auswählen –</option>'
    + (ps.length ? '<optgroup label="📥 Von meiner Lehrkraft">'+ps.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.titel)+'</option>').join("")+'</optgroup>' : '')
    + '<optgroup label="📝 Schreibaufgaben aus Federleicht">'+sa.map(p=>'<option value="'+p.id+'">'+esc(p.aufgabentitel)+'</option>').join("")+'</optgroup></select>';
}
function paketWahlBinden(id, f){ const e = document.getElementById(id); if (e) e.onchange = ()=>{ const p = aufgabeById(e.value); if (p) f(p); }; }
function paketSetStarten(pid){
  for (let mi=0; mi<UEBUNGEN.module.length; mi++){

  const $ = x=>document.getElementById(x);
  $("lkquelle").value = d.quelle || "bericht"; $("lkts").value = d.ts || ""; $("lkzu").value = d.zu || "";
  [["lktitel","titel"],["lkquelle","quelle"],["lkautor","autor"],["lkmedium","medium"],["lkdatum","datum"],["lkthema","thema"],["lktext","text"],["lkaufgabe","aufgabe"],["lkts","ts"],["lkwmin","wmin"],["lkwmax","wmax"],["lkzu","zu"]].forEach(([id,f])=>binde(id, d, f));
  const laden = (inp, ziel, f)=>{ $(inp).onchange = async e=>{ const datei = e.target.files[0]; if (!datei) return;
    try { const t = await dateiAlsText(datei); d[f] = t; $(ziel).value = t; speichern(DB); $("lkdateimeldung").textContent = "✅ „" + datei.name + "“ eingelesen (" + woerter(t).length + " Wörter). Bitte kurz kontrollieren."; }
    catch(err){ $("lkdateimeldung").textContent = "⚠️ " + err.message; }
    e.target.value = ""; }; };
  laden("lktextdatei", "lktext", "text"); laden("lkaufgdatei", "lkaufgabe", "aufgabe");
  lkFragenZeichnen(d);
  app.querySelectorAll("[data-neu]").forEach(b=>b.onclick = ()=>{
    const t = b.dataset.neu;
    d.uebungen.push(t === "zuordnen" ? {typ:t, frage:"Prüf die Aussagen am Text: Stimmen sie?", elemente:[{text:"",kat:0},{text:"",kat:0},{text:"",kat:0}], erklaerung:""}
      : {typ:t, frage:"", optionen:t === "wahl" ? ["","","",""] : ["","","","","",""], richtig:t === "wahl" ? 0 : [], erklaerung:""});
    speichern(DB); lkFragenZeichnen(d);
    const k = $("lkfragen").lastElementChild; if (k) k.scrollIntoView({behavior:"smooth", block:"center"});
  });
  const fertig = ()=>{ const r = paketBereinigen(d); if (r.fehler.length){ zeigeLehrkraft("⚠️ Bitte noch ergänzen:\n• " + r.fehler.join("\n• ")); return null; } pakete()[r.p.id] = r.p; speichern(DB); paketeEinbauen(); return r.p; };
  $("lkspeichern").onclick = ()=>{ const p = fertig(); if (!p) return; dateiSpeichern(paketDateiname(p), paketDateiInhalt(p)); zeigeLehrkraft("✅ Gespeichert als „" + paketDateiname(p) + "“ (im Download-Ordner). Jetzt in Teams bereitstellen.\nDie Aufgabe ist auch in diesem Browser unter „📂 Aufgabe meiner Lehrkraft öffnen“ zu sehen."); };
  $("lkvorschau").onclick = ()=>{ const p = fertig(); if (p) zeigePakete("👀 Vorschau: So sehen die Schüler Ihre Aufgabe."); };
  $("lkoeffnen").onchange = async e=>{ const f = e.target.files[0]; if (!f) return;
    try { const p = await paketAusDatei(f); DB.lkEntwurf = JSON.parse(JSON.stringify(p)); speichern(DB); zeigeLehrkraft("✅ „" + esc(p.titel) + "“ zum Bearbeiten geöffnet."); }
    catch(err){ zeigeLehrkraft("⚠️ " + err.message); } };
  $("lkneu").onclick = ()=>{ if (!confirm("Neue Aufgabe beginnen? Die Felder werden geleert. (Bereits gespeicherte Dateien bleiben erhalten.)")) return; DB.lkEntwurf = null; speichern(DB); zeigeLehrkraft(); };
  oben();
}
function lkFragenZeichnen(d){
  const box = document.getElementById("lkfragen");
  const NAME = {zuordnen:"Faktencheck", wahl:"Auswahlfrage (eine Antwort richtig)", mehrfach:"Mehrfachauswahl (mehrere richtig)"};
  box.innerHTML = d.uebungen.map((u, n)=>{
    let h = '<div class="zrow" style="margin-bottom:12px" data-fn="'+n+'"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span class="etikett">Frage '+(n+1)+' · '+NAME[u.typ]+'</span><button class="btn zweit" data-weg="'+n+'" style="padding:4px 12px">✕ löschen</button></div>'
      + '<label class="feld">Frage bzw. Arbeitsauftrag</label><input class="zahl" style="width:100%" data-f="frage" value="'+esc(u.frage || "")+'">';
    if (u.typ === "zuordnen"){
      h += '<p class="muted" style="font-size:.88rem;margin:6px 0">Aussagen über den Text – die Schüler entscheiden je Aussage: '+FK_KAT.map(k=>'„'+k+'“').join(", ")+'.</p>';
      u.elemente.forEach((e, i)=>{ h += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px"><input class="zahl" style="flex:1 1 220px" data-el="'+i+'" value="'+esc(e.text)+'" placeholder="Aussage '+(i+1)+'"><select data-kat="'+i+'">'+FK_KAT.map((k,j)=>'<option value="'+j+'"'+(e.kat == j ? ' selected' : '')+'>'+k+'</option>').join("")+'</select></div>'; });
      h += '<button class="btn zweit" data-plus="'+n+'" style="padding:4px 12px">＋ Aussage</button>';
    } else {
      const multi = u.typ === "mehrfach";
      h += '<p class="muted" style="font-size:.88rem;margin:6px 0">Antworten eintragen und die richtige'+(multi ? 'n' : '')+' anhaken. Leere Felder werden weggelassen. Tipp: Die Antworten etwa gleich lang machen, sonst ist die richtige leicht zu erraten.</p>';
      u.optionen.forEach((o, i)=>{ const an = multi ? (u.richtig || []).includes(i) : u.richtig === i;
        h += '<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><input type="'+(multi ? 'checkbox' : 'radio')+'" name="r'+n+'" data-ri="'+i+'"'+(an ? ' checked' : '')+' aria-label="richtig"><input class="zahl" style="flex:1" data-op="'+i+'" value="'+esc(o)+'" placeholder="Antwort '+(i+1)+'"></div>'; });
    }
    h += '<label class="feld">Erklärung für die Lösung <span class="muted" style="font-weight:400">(optional)</span></label><input class="zahl" style="width:100%" data-f="erklaerung" value="'+esc(u.erklaerung || "")+'"></div>';
    return h;
  }).join("") || '<p class="muted" style="font-size:.9rem">Noch keine eigenen Fragen.</p>';
  box.querySelectorAll("[data-fn]").forEach(k=>{
    const u = d.uebungen[+k.dataset.fn];
    k.querySelectorAll("[data-f]").forEach(e=>e.oninput = ()=>{ u[e.dataset.f] = e.value; speichern(DB); });
    k.querySelectorAll("[data-el]").forEach(e=>e.oninput = ()=>{ u.elemente[+e.dataset.el].text = e.value; speichern(DB); });
    k.querySelectorAll("[data-kat]").forEach(e=>e.onchange = ()=>{ u.elemente[+e.dataset.kat].kat = +e.value; speichern(DB); });
    k.querySelectorAll("[data-op]").forEach(e=>e.oninput = ()=>{ u.optionen[+e.dataset.op] = e.value; speichern(DB); });
    k.querySelectorAll("[data-ri]").forEach(e=>e.onchange = ()=>{ const i = +e.dataset.ri;
      if (u.typ === "wahl") u.richtig = i; else { const r = new Set(u.richtig || []); e.checked ? r.add(i) : r.delete(i); u.richtig = [...r].sort(); }
      speichern(DB); });
  });
  box.querySelectorAll("[data-weg]").forEach(b=>b.onclick = ()=>{ if (!confirm("Frage " + (+b.dataset.weg + 1) + " löschen?")) return; d.uebungen.splice(+b.dataset.weg, 1); speichern(DB); lkFragenZeichnen(d); });
  box.querySelectorAll("[data-plus]").forEach(b=>b.onclick = ()=>{ d.uebungen[+b.dataset.plus].elemente.push({text:"", kat:0}); speichern(DB); lkFragenZeichnen(d); });
}

paketeEinbauen();
zeigeStart();
</script>
</body>
</html>
